[package]
name = "ledge-overlay"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.6 is the first release with `Monitor::work_area`.
# `tray-icon`: the notification-area icon (version, quit).
tauri = { version = "2.6", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# Launch at login: the HKCU Run key on Windows, no administrator rights.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
