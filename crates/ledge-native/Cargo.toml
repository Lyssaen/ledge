[package]
name = "ledge-native"
version = "0.41.0"
edition = "2021"
description = "Win32 helpers shared by the Ledge island and Ledge Desktop"

[dependencies]
portable-pty = "0.9"
serde_json = "1"
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
