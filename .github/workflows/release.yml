# Builds the Windows installer (Ledge Desktop, which carries the notch, with its manifest latest-desktop.json) and publishes it on the GitHub release of a `v*` tag.
# The tag is annotated: its subject is the release title, its body the release notes. The install block and the
# SHA-256 of the installer are appended, with the phone app's fingerprint (its build.json is a release asset too). Re-running on an existing release replaces the asset and the notes.
# The tag (vMAJOR.MINOR.PATCH) is the version: it is stamped into the build, whatever the repository says.
name: Release

on:
  push:
    tags: ['v*']
  # Builds everything without publishing: checks the Rust (no toolchain on the dev machine) before a real tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp, e.g. 0.3.0 (nothing is published)'
        required: true

permissions:
  contents: write
  id-token: write

env:
  PUBLISH: ${{ github.event_name == 'push' }}
  VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  # The daemon goes to npm first: the installer's notes and Ledge Desktop's daemon update both point at that version.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: sudo apt-get install -y tmux
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        run: node scripts/set-version.mjs "$VERSION_TAG"
      - run: pnpm --filter @ledge/protocol test
      # The launch tests attach to real tmux sessions: tmux refuses to attach without a TERM, which the runner leaves unset.
      - run: pnpm --filter @paradow/ledge test
        env:
          TERM: xterm
      - run: pnpm --filter @paradow/ledge build
      # The phone app is built here, on Linux: the Windows checkout's autocrlf would change the bytes, hence the fingerprint.
      # Only its build.json travels on, to the release.
      - run: pnpm --filter @ledge/mobile build
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: apps/mobile/dist/build.json
          if-no-files-found: error
      # Trusted Publishing: npm accepts the workflow's OIDC identity (id-token: write) instead of a token. It needs
      # npm 11.5.1 or later, newer than the one Node 22 ships.
      - name: Publish to npm
        if: env.PUBLISH == 'true'
        working-directory: packages/ledge
        run: |
          npm install -g npm@11
          npm --version
          v="${VERSION_TAG#v}"
          # A re-run of the same tag must not fail on a version npm already has.
          if npm view "@paradow/ledge@$v" version >/dev/null 2>&1; then echo "@paradow/ledge@$v already published"; exit 0; fi
          npm publish --access public --provenance
      - name: Check the package without publishing
        if: env.PUBLISH != 'true'
        working-directory: packages/ledge
        run: npm pack --dry-run

  windows-installer:
    needs: npm
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: pwa-build
          path: pwa-build
      # The tag is the version: written into the Tauri config (tray line, exe file version, installer name), the crate
      # and the package before anything is built, so the release never ships the version left in the repository.
      - name: Stamp the version from the tag
        run: node scripts/set-version.mjs $env:VERSION_TAG
      # Ledge Desktop's build also builds the notch's web app (apps/overlay) into its dist/notch/.
      - name: Typecheck the notch and Ledge Desktop
        run: |
          pnpm --filter overlay typecheck
          pnpm --filter desktop typecheck
      - name: Build Ledge Desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
        working-directory: apps/desktop
      - name: Rust tests
        run: cargo test --workspace
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.VERSION_TAG }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $desktopSrc = Get-ChildItem "target/release/bundle/nsis/Ledge Desktop_$($version)_*-setup.exe" | Select-Object -First 1
          if (-not $desktopSrc) { throw "No Desktop installer for $version under bundle/nsis" }
          if (-not (Test-Path "$($desktopSrc.FullName).sig")) { throw "No updater signature next to $($desktopSrc.Name)" }
          # GitHub turns the space of an uploaded asset name into a dot: name the file as the asset so the manifest url matches.
          $desktopName = "Ledge.Desktop_$($version)_x64-setup.exe"
          $desktopExe = Join-Path $desktopSrc.DirectoryName $desktopName
          Copy-Item $desktopSrc.FullName $desktopExe -Force
          Copy-Item "$($desktopSrc.FullName).sig" "$desktopExe.sig" -Force
          $desktopSha = (Get-FileHash $desktopExe -Algorithm SHA256).Hash.ToLower()
          # actions/checkout leaves a lightweight tag on the commit: fetch the annotated one back before reading it.
          git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
          $title = (git tag -l --format='%(contents:subject)' $env:TAG).Trim()
          if (-not $title) { $title = "Ledge $env:TAG" }
          $body = (git tag -l --format='%(contents:body)' $env:TAG).Trim()
          $install = @'

          **Install**
          1. In WSL: `npm i -g @paradow/ledge@__VERSION__` (or let Ledge Desktop do it: Settings > About offers the daemon update).
          2. Quit Ledge Desktop from the tray, then run `__DESKTOP_EXE__` over the previous install. It carries the notch: an older « Ledge » app, if installed, is stopped and uninstalled first.

          The installer is not code-signed: Windows SmartScreen may warn on first launch ("More info" > "Run anyway").

          SHA-256: `__DESKTOP_SHA__`
          '@
          # The phone app's block goes into the release page only, not into the updater's notes below.
          Copy-Item pwa-build/build.json ledge-mobile-build.json -Force
          $phone = (node scripts/pwa-notes.mjs ledge-mobile-build.json) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "pwa-notes failed on build.json" }
          $notes = $body + "`n`n" + $phone + "`n" + ($install -replace '__VERSION__', $version -replace '__DESKTOP_EXE__', $desktopName -replace '__DESKTOP_SHA__', $desktopSha)
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          # The updater manifest carries the tag's own notes, without the install block.
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          node scripts/latest-json.mjs $env:TAG $desktopExe release-notes.md | Set-Content -Path latest-desktop.json -Encoding utf8
          $assets = @($desktopExe, "$desktopExe.sig", 'latest-desktop.json', 'ledge-mobile-build.json')
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
            gh release edit $env:TAG --title $title --notes-file notes.md
          } else {
            gh release create $env:TAG @assets --title $title --notes-file notes.md
          }
      - name: Show the updater manifest
        if: env.PUBLISH != 'true'
        run: |
          $version = $env:VERSION_TAG -replace '^v', ''
          $desktopSrc = Get-ChildItem "target/release/bundle/nsis/Ledge Desktop_$($version)_*-setup.exe" | Select-Object -First 1
          if (-not $desktopSrc) { throw "No Desktop installer for $version under bundle/nsis" }
          if (-not (Test-Path "$($desktopSrc.FullName).sig")) { throw "No updater signature next to $($desktopSrc.Name)" }
          $desktopExe = Join-Path $desktopSrc.DirectoryName "Ledge.Desktop_$($version)_x64-setup.exe"
          Copy-Item $desktopSrc.FullName $desktopExe -Force
          Copy-Item "$($desktopSrc.FullName).sig" "$desktopExe.sig" -Force
          Set-Content -Path release-notes.md -Value "Dry run for $env:VERSION_TAG" -Encoding utf8
          node scripts/latest-json.mjs $env:VERSION_TAG $desktopExe release-notes.md | Set-Content -Path latest-desktop.json -Encoding utf8
          Get-Content latest-desktop.json
          # The phone app block the release notes will carry.
          node scripts/pwa-notes.mjs pwa-build/build.json
          if ($LASTEXITCODE -ne 0) { throw "pwa-notes failed on build.json" }
