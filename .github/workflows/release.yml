# Builds the Windows installer and publishes it on the GitHub release of a `v*` tag.
# The tag is annotated: its subject is the release title, its body the release notes. The install block and the
# SHA-256 of the installer are appended. Re-running on an existing release replaces the asset and the notes.
# The tag (vMAJOR.MINOR.PATCH) is the version: it is stamped into the build, whatever the repository says.
name: Release

on:
  push:
    tags: ['v*']
  # Builds everything without publishing: checks the Rust (no toolchain on the dev machine) before a real tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp, e.g. 0.3.0 (nothing is published)'
        required: true

permissions:
  contents: write
  id-token: write

env:
  PUBLISH: ${{ github.event_name == 'push' }}
  VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  # The daemon goes to npm first: the installer's notes and the island's update both point at that version.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: sudo apt-get install -y tmux
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        run: node apps/overlay/scripts/set-version.mjs "$VERSION_TAG"
      - run: pnpm --filter @ledge/protocol test
      # The launch tests attach to real tmux sessions: tmux refuses to attach without a TERM, which the runner leaves unset.
      - run: pnpm --filter @paradow/ledge test
        env:
          TERM: xterm
      - run: pnpm --filter @paradow/ledge build
      # Trusted Publishing: npm accepts the workflow's OIDC identity (id-token: write) instead of a token. It needs
      # npm 11.5.1 or later, newer than the one Node 22 ships.
      - name: Publish to npm
        if: env.PUBLISH == 'true'
        working-directory: packages/ledge
        run: |
          npm install -g npm@11
          npm --version
          v="${VERSION_TAG#v}"
          # A re-run of the same tag must not fail on a version npm already has.
          if npm view "@paradow/ledge@$v" version >/dev/null 2>&1; then echo "@paradow/ledge@$v already published"; exit 0; fi
          npm publish --access public --provenance
      - name: Check the package without publishing
        if: env.PUBLISH != 'true'
        working-directory: packages/ledge
        run: npm pack --dry-run

  windows-installer:
    needs: npm
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: pnpm install --frozen-lockfile
      # The tag is the version: written into the Tauri config (tray line, exe file version, installer name), the crate
      # and the package before anything is built, so the release never ships the version left in the repository.
      - name: Stamp the version from the tag
        run: node scripts/set-version.mjs $env:VERSION_TAG
        working-directory: apps/overlay
      - name: Typecheck the overlay
        run: pnpm --filter overlay typecheck
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
        working-directory: apps/overlay
      - name: Rust tests
        run: cargo test --workspace
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.VERSION_TAG }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $exe = Get-ChildItem "target/release/bundle/nsis/*_$($version)_*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No installer for $version under bundle/nsis" }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          # actions/checkout leaves a lightweight tag on the commit: fetch the annotated one back before reading it.
          git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
          $title = (git tag -l --format='%(contents:subject)' $env:TAG).Trim()
          if (-not $title) { $title = "Ledge $env:TAG" }
          $body = (git tag -l --format='%(contents:body)' $env:TAG).Trim()
          $install = @'

          **Install**
          1. In WSL: `npm i -g @paradow/ledge@__VERSION__` (or let Ledge do it: the island offers the update).
          2. Quit Ledge from the tray, then run `__EXE__` over the previous install.

          The installer is not code-signed: Windows SmartScreen may warn on first launch ("More info" > "Run anyway").

          SHA-256: `__SHA__`
          '@
          $notes = $body + ($install -replace '__VERSION__', $version -replace '__EXE__', $exe.Name -replace '__SHA__', $sha)
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "No updater signature next to $($exe.Name)" }
          # The updater manifest carries the tag's own notes, without the install block.
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          node apps/overlay/scripts/latest-json.mjs $env:TAG $exe.FullName release-notes.md | Set-Content -Path latest.json -Encoding utf8
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $exe.FullName latest.json --clobber
            gh release edit $env:TAG --title $title --notes-file notes.md
          } else {
            gh release create $env:TAG $exe.FullName latest.json --title $title --notes-file notes.md
          }
      - name: Show the updater manifest
        if: env.PUBLISH != 'true'
        run: |
          $version = $env:VERSION_TAG -replace '^v', ''
          $exe = Get-ChildItem "target/release/bundle/nsis/*_$($version)_*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No installer for $version under bundle/nsis" }
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "No updater signature next to $($exe.Name)" }
          Set-Content -Path release-notes.md -Value "Dry run for $env:VERSION_TAG" -Encoding utf8
          node apps/overlay/scripts/latest-json.mjs $env:VERSION_TAG $exe.FullName release-notes.md | Set-Content -Path latest.json -Encoding utf8
          Get-Content latest.json
