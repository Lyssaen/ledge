<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledge OpenRig rôles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens: packages/ui/src/styles/tokens.css (light + dark), same names as the app. */
:root,:root[data-theme=light]{
  --background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--muted:oklch(0.97 0 0);
  --muted-foreground:oklch(0.556 0 0);--primary:oklch(0.505 0.213 27.518);--primary-hover:oklch(0.444 0.177 26.899);
  --border:oklch(0.922 0 0);--input:oklch(0.88 0 0);--sidebar:oklch(0.985 0 0);
  --success:#059669;--warning:#b45309;--info:#2563eb;--danger-text:oklch(0.505 0.213 27.518);
  --s-ok:#ecfdf5;--s-warn:#fffbeb;--s-info:#eff6ff;--s-danger:#fef2f2;
  --well:oklch(0.975 0 0);--chrome:oklch(0.96 0 0);--page:#e9e9e9;
  --k:#1d4ed8;--v:#047857;--cm:#8a8a8a;--hl:#fde68a66;
}
:root[data-theme=dark]{
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--muted:oklch(0.269 0 0);
  --muted-foreground:oklch(0.708 0 0);--primary:oklch(0.444 0.177 26.899);--primary-hover:oklch(0.396 0.141 25.723);
  --border:#ffffff1a;--input:#ffffff26;--sidebar:oklch(0.205 0 0);
  --success:#34d399;--warning:#fbbf24;--info:#60a5fa;--danger-text:oklch(0.704 0.191 22.216);
  --s-ok:#052e16;--s-warn:#422006;--s-info:#172554;--s-danger:#450a0a;
  --well:#0c0c0d;--chrome:#0d0d0d;--page:#000;
  --k:#7cb3fb;--v:#4ade80;--cm:#8f8f8f;--hl:#facc1530;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',system-ui,sans-serif;background:var(--page);color:var(--foreground);font-size:14px;line-height:20px;min-height:100vh}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
button{font-family:inherit;color:inherit;cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--info);outline-offset:1px;border-radius:6px}

/* Mockup chrome (not product) */
.mk-bar{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--chrome);border-bottom:1px solid var(--border)}
.mk-bar strong{margin-right:10px;font-weight:600}
.mk-bar .sp{flex:1}
.mk-bar button{border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted-foreground)}
.mk-bar button[aria-pressed=true]{background:var(--muted);color:var(--foreground);border-color:var(--input)}
.mk-note{max-width:1440px;margin:14px auto 12px;padding:0 16px;color:var(--muted-foreground);font-size:13px}
.mk-note b{color:var(--foreground);font-weight:500}
.view{display:none;padding:0 16px 40px}.view.on{display:block}

/* Window (same frame as ledge-openrig.html) */
.win{max-width:1440px;margin:0 auto;height:880px;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:32px 1fr;background:var(--background)}
.titlebar{display:flex;align-items:center;gap:22px;padding:0 0 0 14px;font-weight:600;border-bottom:1px solid var(--border);background:var(--chrome)}
.titlebar i{color:var(--danger-text);font-style:normal}
.titlebar .tb-sp{flex:1}.titlebar .tb{color:var(--muted-foreground);font-weight:400;font-size:13px;width:28px;text-align:center}
.main{display:grid;grid-template-columns:260px 1fr;min-height:0}
.side{background:var(--sidebar);border-right:1px solid var(--border);padding:10px 10px 0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.side .grow{flex:1}
.ledgecard{border:1px solid #b91c1c66;border-radius:10px;padding:8px 9px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center}
.ledgecard b{font-weight:600;font-size:13px}.ledgecard b i{color:var(--danger-text);font-style:normal}
.ledgecard small{grid-column:2;font-size:11px;color:var(--muted-foreground);line-height:13px}
.ledgecard kbd{grid-row:1/3;grid-column:3;border:1px solid var(--input);border-radius:4px;padding:0 5px;font-size:11px;color:var(--muted-foreground)}
.mascot{grid-row:1/3;width:22px;height:14px;border-radius:9px 9px 3px 3px;background:#c2564f;position:relative}
.mascot::after{content:'';position:absolute;left:5px;right:5px;top:4px;height:3px;background:#3a1010;border-radius:2px}
.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--muted-foreground)}
.nav.cur{background:var(--muted);color:var(--foreground);border:1px solid var(--input)}
.nav .cnt{margin-left:auto;font-size:11px}
.sec{font-size:12px;color:var(--muted-foreground);padding:10px 6px 2px}
.proj{display:flex;align-items:center;gap:8px;padding:5px 6px;font-weight:500;font-size:13px}
.sq{width:9px;height:9px;border-radius:2px;display:inline-block}
.machbar{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);margin:0 -10px;padding:10px 12px;font-size:12px}
.machbar .sp{flex:1}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--success);flex:none}
.dot.off{background:#8a8a8a}.dot.warn{background:var(--warning)}.dot.err{background:var(--danger-text)}.dot.info{background:var(--info)}

.content{display:grid;grid-template-rows:52px 1fr 30px;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border);font-weight:500}
.topbar .sp{flex:1}
.topbar .meta{color:var(--muted-foreground);font-size:12px;font-weight:400}
.footer{display:flex;align-items:center;gap:18px;padding:0 14px;font-size:12px;color:var(--muted-foreground);border-top:1px solid var(--border);background:var(--chrome)}
.tabs{display:flex;gap:2px;border:1px solid var(--input);border-radius:9px;padding:2px}
.tabs button{border:0;font-size:12.5px;padding:3px 12px;border-radius:7px;color:var(--muted-foreground);display:flex;gap:6px;align-items:center}
.tabs button[aria-selected=true]{background:var(--muted);color:var(--foreground)}
.tabs small{font-size:11px;color:var(--muted-foreground)}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted-foreground)}
.chip[aria-pressed=true]{color:var(--foreground);background:var(--muted);border-color:var(--input)}
.pill{font-size:11px;line-height:18px;padding:0 7px;border-radius:5px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--s-ok);color:var(--success)}.pill.off{background:var(--muted);color:var(--muted-foreground)}
.pill.warn{background:var(--s-warn);color:var(--warning)}.pill.info{background:var(--s-info);color:var(--info)}.pill.err{background:var(--s-danger);color:var(--danger-text)}
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;font-size:12px;border-radius:7px;border:1px solid var(--input);white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.ghost{border-color:transparent;color:var(--muted-foreground)}
.btn.primary{background:var(--primary);border-color:transparent;color:#fff}
.cmd{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--muted-foreground);background:var(--well);border:1px solid var(--border);border-radius:6px;padding:1px 6px;display:inline-block}

/* Roles page */
.rpwrap{display:flex;flex-direction:column;min-height:0}
.orhead{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.orhead .sp{flex:1}
.orhead .meta{color:var(--muted-foreground);font-size:12px}
.rp{flex:1}
.rp{display:grid;grid-template-columns:300px 1fr;min-height:0;flex:1}
.list{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.lhead{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--input);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--muted-foreground);background:var(--well)}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--foreground);outline:none;min-width:0}
.search kbd{border:1px solid var(--input);border-radius:4px;padding:0 5px;font-size:11px}
.seg{display:flex;border:1px solid var(--input);border-radius:8px;padding:2px;gap:2px;width:max-content;max-width:100%}
.seg button{border:0;font-size:12px;padding:2px 9px;border-radius:6px;color:var(--muted-foreground);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--muted);color:var(--foreground)}
.lbody{overflow:auto;padding:4px 6px 12px}
.grp{display:flex;align-items:baseline;gap:6px;padding:12px 8px 4px;font-size:12px;color:var(--muted-foreground)}
.grp b{font-weight:500;color:var(--foreground)}
.grp .mono{font-size:10.5px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.item{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:7px 8px;border-radius:8px;border:1px solid transparent;text-align:left;width:100%}
.item:hover{background:var(--muted)}
.item[aria-selected=true]{background:var(--muted);border-color:var(--input)}
.item .nm{font-family:'Geist Mono',monospace;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sm{grid-column:1/3;font-size:11.5px;line-height:15px;color:var(--muted-foreground);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ct{font-size:11px;color:var(--muted-foreground);display:flex;align-items:center;gap:5px}
.item.res .nm{color:var(--muted-foreground)}

.detail{overflow:auto;min-width:0}
.dhead{padding:18px 24px 0}
.dtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle h2{font-family:'Geist Mono',monospace;font-size:19px;font-weight:500;letter-spacing:-.01em}
.dtitle .ver{color:var(--muted-foreground);font-size:12px}
.ddesc{color:var(--muted-foreground);margin-top:6px;max-width:78ch}
.srcline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted-foreground)}
.srcline .path{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--foreground)}
.srcline .same{color:var(--success)}
.lens{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.lens>span{font-size:12px;color:var(--muted-foreground)}
.dtabs{display:flex;gap:18px;border-bottom:1px solid var(--border);margin:14px 0 0;padding:0 24px}
.dtabs button{border:0;padding:8px 0;font-size:13px;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.dtabs button[aria-selected=true]{color:var(--foreground);border-bottom-color:var(--danger-text)}
.dtabs small{font-size:11px;color:var(--muted-foreground)}
.panel{padding:16px 24px 28px}

/* Provenance — the core of the screen */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:16px}
.legend span{display:flex;gap:6px;align-items:center}
.pv{display:inline-flex;gap:4px;align-items:center;font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;white-space:nowrap;border:1px solid transparent;font-weight:500}
.pv.here{background:var(--muted);color:var(--foreground)}
.pv.inh{background:var(--s-info);color:var(--info)}
.pv.abs{border:1px dashed var(--input);color:var(--muted-foreground);font-weight:400}
.pv.unk{background:var(--s-warn);color:var(--warning)}
.pv .mono{font-size:10.5px}
.psec{margin-bottom:18px}
.psec h3{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.psec h3 small{font-weight:400;color:var(--muted-foreground);font-size:12px}
.rows{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.prow{display:grid;grid-template-columns:170px 1fr auto;gap:12px;align-items:start;padding:8px 12px 8px 14px;border-top:1px solid var(--border);position:relative;font-size:13px}
.prow:first-child{border-top:0}
.prow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.prow.here::before{background:var(--foreground);opacity:.55}
.prow.inh::before{background:var(--info)}
.prow.abs::before{background:repeating-linear-gradient(var(--muted-foreground) 0 3px,transparent 3px 6px);opacity:.6}
.prow.unk::before{background:var(--warning)}
.prow .lb{color:var(--muted-foreground);font-size:12.5px}
.prow .lb .mono{display:block;font-size:10.5px;opacity:.8}
.prow .val{min-width:0;word-break:break-word}
.prow .val .mono{font-size:12.5px}
.prow .hint{display:block;color:var(--muted-foreground);font-size:12px;margin-top:2px}
.prow.dim{opacity:.55}
.empty{color:var(--muted-foreground);font-style:italic}
.sub{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-top:6px;padding:6px 0 0;border-top:1px dashed var(--border)}
.sub:first-of-type{border-top:0;padding-top:0}
.sub>.pv{align-self:start}
.tag{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-right:4px;white-space:nowrap}
.exp{color:var(--info);font-size:12px;border:0;padding:0;margin-top:3px}
.code{background:var(--well);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'Geist Mono',monospace;font-size:11.5px;line-height:17px;white-space:pre;overflow:auto;margin-top:6px}
.code .k{color:var(--k)}.code .v{color:var(--v)}.code .cm{color:var(--cm)}.code .hl{background:var(--hl);display:inline-block;width:100%}
.seats{width:100%;border-collapse:collapse;font-size:12.5px}
.seats th{text-align:left;font-weight:400;color:var(--muted-foreground);font-size:12px;padding:7px 12px;border-bottom:1px solid var(--border)}
.seats td{padding:8px 12px;border-top:1px solid var(--border);vertical-align:top}
.seats tr:first-child td{border-top:0}

.grpbtn{width:100%;border:0;text-align:left;cursor:pointer;border-radius:6px}
.grpbtn:hover{background:var(--muted)}
.grp .chev{width:10px;color:var(--muted-foreground)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips .tag{margin:0}
.lenshint{flex-basis:100%;font-size:12px;color:var(--muted-foreground)}
.dl{color:var(--muted-foreground);font-size:12px;margin-left:2px}
.dlegend{display:flex;gap:14px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
.dlegend .mono{font-size:11.5px}
/* Role tab (role.md first) */
.rsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted-foreground);margin-bottom:12px}
.rsum b{color:var(--foreground);font-weight:500}
.rsum .lnk{color:var(--info);border:0;padding:0;font-size:12.5px}
.rfile{border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;position:relative}
.rfile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.rfile.here::before{background:var(--foreground);opacity:.55}.rfile.inh::before{background:var(--info)}.rfile.unk::before{background:var(--warning)}
.rfile .rhead{padding-left:16px}
.rfile .rbody{max-height:none;padding:16px 22px 22px}
.ico{width:13px;height:13px;vertical-align:-2px;display:inline-block}
/* Rigs view (link to the role) */
.rigspage{overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.ocards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ocard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px}
.ocard h3{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.ocard p{color:var(--muted-foreground);font-size:12px;margin-top:3px}
.origs{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.orow{display:grid;grid-template-columns:minmax(140px,1.3fr) 110px 92px minmax(0,1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:9px 14px;font-size:13px}
.orow b{font-weight:500}
.oseats{list-style:none;padding:4px 14px 10px 36px;background:color-mix(in oklab,var(--foreground) 2%,transparent)}
.oseat{display:grid;grid-template-columns:minmax(110px,150px) minmax(130px,170px) minmax(0,1fr) 110px 70px auto;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--border);font-size:13px}
.oseat:first-child{border-top:0}
.rolelink{font-family:'Geist Mono',monospace;font-size:12px;color:var(--info);border:0;padding:0;text-align:left;display:inline-flex;gap:4px;align-items:center;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.rolelink:hover,.rolelink.hov{text-decoration-color:currentColor}
.tip{position:absolute;background:var(--foreground);color:var(--background);font-size:11.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translateY(-130%);pointer-events:none}
.muted{color:var(--muted-foreground);font-size:12px}
/* Context (assembled startup context) */
.ctxintro{border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted-foreground);margin-bottom:14px;max-width:100ch}
.ctxintro b{color:var(--foreground);font-weight:500}
.ctx{display:grid;grid-template-columns:330px 1fr;gap:16px;min-height:0}
.pieces{display:flex;flex-direction:column;gap:2px}
.chan{font-size:12px;color:var(--muted-foreground);padding:10px 4px 4px;display:flex;gap:6px}
.chan:first-child{padding-top:0}
.piece{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:start;text-align:left;padding:5px 8px 5px 10px;border-radius:8px;border:1px solid transparent;position:relative;width:100%}
.piece::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px}
.piece.here::before{background:var(--foreground);opacity:.55}.piece.inh::before{background:var(--info)}.piece.unk::before{background:var(--warning)}
.piece:hover{background:var(--muted)}
.piece[aria-selected=true]{background:var(--muted);border-color:var(--input)}
.piece .n{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground);padding-top:1px}
.piece .t{font-size:13px;min-width:0}
.piece .t small{display:block;font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece .sz{font-size:11px;color:var(--muted-foreground);font-family:'Geist Mono',monospace}
.piece .pvw{grid-column:2/4}
.notshown{margin-top:12px;border:1px dashed var(--input);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--muted-foreground)}
.notshown b{color:var(--foreground);font-weight:500}
.notshown li{margin:3px 0 0 16px}
.reader{border:1px solid var(--border);border-radius:12px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.rhead{display:flex;align-items:center;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.rhead h4{font-size:14px;font-weight:600}
.rhead .meta{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.rhead .sp{flex:1}
.rbody{padding:14px 18px 20px;overflow:auto;max-height:520px}
.md{max-width:76ch;font-size:13.5px;line-height:21px}
.md h1{font-size:17px;font-weight:600;margin:0 0 10px}.md h2{font-size:14.5px;font-weight:600;margin:16px 0 6px}
.md p{margin:0 0 9px}.md ul,.md ol{margin:0 0 9px 20px}.md li{margin:2px 0}
.md code{font-family:'Geist Mono',monospace;font-size:12px;background:var(--muted);padding:0 4px;border-radius:4px}
.md pre{background:var(--well);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow:auto;margin:0 0 9px}
.md pre code{background:none;padding:0}
.raw{font-family:'Geist Mono',monospace;font-size:12px;line-height:18px;white-space:pre-wrap;max-width:100ch}
.opaque{display:grid;place-items:center;text-align:center;padding:40px 20px;color:var(--muted-foreground);font-size:13px;gap:8px}
.opaque b{color:var(--foreground);font-weight:500}
.allsep{display:flex;align-items:center;gap:8px;padding:8px 0;margin:14px 0 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:sticky;top:-14px;background:var(--background);font-size:12px;color:var(--muted-foreground)}

<script type="text/plain" id="md-role"># Rôle : développeur de ledge-dev

Tu implémentes la tâche qui t'est assignée et tu la prouves par l'effet. Ton périmètre (front ou back) t'est donné
au démarrage.

## Au démarrage

`rig whoami --json`, puis `rig queue list --owned --limit 1000`. Réclame la ligne avant d'y travailler.

## Avant d'écrire du code

- **Écran touché ?** La tâche doit citer une maquette de `docs/mockups/` validée par l'utilisateur. Sans elle, renvoie la ligne au lead : tu ne commences pas le front-end. La maquette fait foi pour la disposition, les états, les textes FR/EN et les interactions ; un point absent se demande à `design-ux@ledge-dev`, il ne s'invente pas.
- Lis la zone concernée avant de la modifier ; reproduis un défaut avant de le corriger.

## Où travailler

Jamais dans `~/Workspace/ledge` (la copie de l'utilisateur, souvent avec du travail en cours). Un worktree par tâche, à côté du dépôt :

```
git -C ~/Workspace/ledge worktree add ../ledge-worktrees/<siège>-<sujet> -b <type>/<sujet> <base>
```

puis `pnpm install` **dans** ce worktree (jamais de `node_modules` lié depuis la copie principale : les builds liraient l'autre arbre). Travaille et teste dans ce dossier.

## Livrer

- Changement minimal et cohérent ; tests du comportement modifié ; `pnpm test` (Node 22) et `pnpm typecheck` du paquet touché au minimum.
- Commits locaux sur ta branche. Pas de push, PR ou merge sans accord explicite de l'utilisateur.
- Transfère à `review-qa@ledge-dev` par `rig queue handoff` : chemin du worktree, branche, commit(s), maquette de référence s'il y en a une, commandes de vérification lancées et leurs résultats, limites connues.
- Corrige les constats de la revue, puis renvoie le candidat corrigé. Quand la revue est passée, clos ta ligne vers le lead avec le résultat.</script>
<script type="text/plain" id="md-front"># Ton périmètre : front-end

Tu es `dev-front`. Tu tiens les interfaces : `apps/desktop` (Tauri 2 + React, Vite), `apps/mobile` (PWA), `apps/overlay` (l'île), `packages/ui`, et le rendu de `ledge tui`.

- Tout changement visible part d'une maquette validée (voir ton rôle). Tu travailles avec `design-ux@ledge-dev`.
- Avant de dire fini sur un écran : captures Playwright (`pnpm --filter desktop e2e` ou un script ponctuel), zoomées, alignements contrôlés contre la maquette, thèmes clair et sombre. Joins les captures à ta passation.
- Textes ajoutés en FR et EN (`src/i18n/fr.ts`, `src/i18n/en.ts`).
- Quand tu dépends d'un message du protocole ou d'une API du daemon, coordonne-toi avec `dev-back@ledge-dev`.</script>

<script type="text/plain" id="md-role-lead"># Rôle : lead de ledge-dev

Tu es l'interlocuteur de l'utilisateur. Tu transformes son objectif en travail routé, tu fais respecter
« maquette d'abord » et tu rends compte du résultat. Tu ne codes pas toi-même ce qu'un dev peut faire.

## Au démarrage

`rig whoami --json`, puis `rig queue list --owned --limit 1000`. Réclame une ligne qui t'est assignée avant d'y
travailler. Si l'objectif arrive en message terminal, crée et réclame d'abord la ligne depuis ton siège.

## Découper et router

1. Lis le code concerné avant de découper. Si l'objectif est flou, pose **la** question qui change le résultat.
2. Pour un travail suivi, enregistre-le légèrement : `rig scope mission ls`, puis une mission/slice si besoin.
3. Classe chaque morceau :
   - **Écran touché** (Desktop, île, mobile, TUI) → tâche à `design-ux@ledge-dev` d'abord. Quand l'UX te rend la
     maquette, présente-la à l'utilisateur (chemin du fichier, captures, questions ouvertes) et obtiens **sa**
     validation. Note cette validation sur la ligne. Seulement alors, tâche à `dev-front@ledge-dev` avec le chemin
     de la maquette validée.
   - **Back-end / protocole / relais / Rust** → `dev-back@ledge-dev`.
   - **Les deux** → deux lignes, en indiquant à chacun le contrat partagé (messages du protocole, API) ; le back
     livre le contrat en premier quand le front en dépend.
4. Chaque tâche dit : le résultat attendu, ce qui compte comme fini, la branche de base, les limites (pas de
   push/PR sans accord), et que la livraison passe par `review-qa@ledge-dev`.

## Suivre et clore

Suis chaque transfert jusqu'au résultat (`rig queue show <id> --full`, champ `handedOffFrom` des lignes suivantes).
Une ligne d'un autre siège fermée ne vaut pas acceptation : vérifie la revue et ses constats résolus. Rends compte à
l'utilisateur : branche, commits, ce qu'il peut essayer, ce qui n'est pas vérifié. Demande son accord avant tout
push, PR ou merge.

Si un siège attend à une demande de permission, dis à l'utilisateur lequel, ce qu'il demande exactement et comment
le joindre (`rig ps --nodes --json --fields canonicalSessionName,agentActivity,tmuxAttachCommand`). Ne réponds pas
à la place de l'utilisateur.

`rig down`, `rig seat stop` et `rig up` sur l'équipe : seulement sur demande de l'utilisateur.</script>
<script type="text/plain" id="md-role-ux"># Rôle : UX/UI de ledge-dev

Tu conçois les écrans de Ledge **avant** qu'ils soient codés. Ta maquette est le contrat que `dev-front` implémente
et que `review-qa` vérifie : elle doit lever toute ambiguïté qu'un dev aurait sinon à trancher seul.

## Au démarrage

`rig whoami --json`, puis `rig queue list --owned --limit 1000`. Réclame la ligne avant d'y travailler.

## Avant de dessiner

- Lis l'écran existant dans le code (`apps/desktop/src`, `apps/mobile/src`, `apps/overlay`, `packages/ui`) et ses
  styles : une nouvelle surface doit appartenir au même produit (tokens, typographie, mascottes, thèmes).
- Regarde les maquettes voisines dans `docs/mockups/` et les captures réelles dans `docs/screens/`.
- Utilise la skill `frontend-design` pour la direction visuelle.

## La maquette

- Un fichier HTML autonome `docs/mockups/ledge-<sujet>.html` (ouvrable sans serveur). Quand l'écran existe déjà,
  préfère partir des vrais composants et styles, comme `docs/mockups/desktop-observatory/` (TSX + `build.mjs`).
- Couvre les thèmes clair **et** sombre, et le mobile quand l'écran y existe.
- Couvre les états, pas seulement le cas heureux : vide, chargement, erreur, texte long, beaucoup d'éléments.
- Textes en français **et** anglais (l'app a `src/i18n/fr.ts` et `en.ts`) ; donne les clés si tu les connais.
- Plusieurs variantes seulement quand la question est vraiment ouverte ; dis laquelle tu recommandes et pourquoi.
- Captures Playwright (`.png` à côté du HTML), zoomées sur les zones délicates ; contrôle les alignements avant de
  dire que c'est prêt.

## Rendre la maquette

Clos ta ligne vers le lead (`rig queue handoff`) avec :
- le chemin de la maquette et des captures ;
- une **fiche de passation** courte : écrans et états couverts, textes FR/EN, comportements (clic, survol,
  clavier, focus), ce qui change par rapport à l'existant, questions encore ouvertes pour l'utilisateur.

La validation appartient à **l'utilisateur**, via le lead. Si l'utilisateur demande des changements, itère sur le
même fichier. Une fois validée, ne modifie plus la maquette sans nouvelle validation.

## Pendant l'implémentation

`dev-front` peut te demander un état ou un texte manquant : réponds vite, par un complément de maquette si c'est
visuel. Si un écart demande un choix de produit, renvoie-le au lead pour l'utilisateur. À la fin, tu peux comparer
le rendu réel à ta maquette et signaler les écarts au dev, par la queue.

Tu ne modifies pas le code applicatif.</script>
<script type="text/plain" id="md-role-reviewer"># Rôle : reviewer de ledge-dev

Tu vérifies, indépendamment, chaque candidat qu'un dev te transfère : le diff exact et le comportement qu'il promet.
Tu ne réécris pas la livraison : tu renvoies des constats actionnables au dev qui l'a faite.

## Au démarrage

`rig whoami --json`, puis `rig queue list --owned --limit 1000`. Réclame la ligne avant d'y travailler.

## Revoir

- Lis le diff du commit candidat dans le worktree indiqué (pas dans `~/Workspace/ledge`, la copie de l'utilisateur).
- Cherche les vrais défauts : correction, cas limites, régressions, contrats du protocole, sécurité ; pas le style.
- Lance les tests du paquet touché (Node 22). Un échec déjà présent sur `main` (Node 18, `hook.test` sous charge)
  n'est pas un constat sur ce changement.
- Pour tester « sans le correctif », travaille dans une copie séparée (un autre worktree ou `git stash` dans **ta**
  copie), jamais dans le worktree du dev.

## Écrans

Si le changement touche un écran, compare-le à la maquette validée citée dans la tâche : captures Playwright
zoomées, thèmes clair et sombre, états de la maquette, textes FR/EN, alignements. Un écart à la maquette est un
constat, sauf s'il est justifié et accepté par l'utilisateur.

## Rendre

Renvoie au dev par `rig queue handoff` : verdict (accepté / constats), constats classés par gravité avec fichier,
ligne et scénario d'échec, commandes lancées et leurs résultats, ce que tu n'as pas pu vérifier. Ne déclare pas
accepté un candidat dont les constats ne sont pas résolus.</script>
<script type="text/plain" id="md-role-pm"># Product Manager Agent

## Role
Senior Product Manager. Own the "what" and "why" — never architecture, estimates, or implementation details.

## Task-triggered capabilities

Resolve the assigned outcome and selected procedure. Load `openrig-user` for
command syntax and `mission-slice-sop` for mission/slice operations. When the
8-step feature flow below is selected, load each step's named skill as that
step begins: `backlog-capture`, `office-hours`, `context-builder`,
`requirements-writer`, `ui-mockup`, `plan-review`, and `exec-summary`.
Keep that selected flow and its SPEC contract; this list adds no blanket
preload or feature-flow gate to other assignments.

## 8-Step Feature Flow

1. **Capture** — run `backlog-capture` and record the idea in `idea_backlog.md`.
2. **Validate** — run `office-hours` and produce `validation.md` with a `GO`, `REFINE`, or `PAUSE` verdict.
3. **Context** — run `context-builder` and produce `background.md` using `validation.md` as the starting point.
4. **Require** — run `requirements-writer` and produce `SPEC.md` using `validation.md` and `background.md`.
5. **Mockup** — run `ui-mockup` and produce `supporting/mockup-ascii.md` plus one or more `mockup-*.html` artifacts.
6. **Review** — run `plan-review` and record issues or revisions before handoff.
7. **Summarize** — run `exec-summary` and produce `executive-summary.md` from the full artifact set.
8. **Handoff** — prepare the branch/ticket handoff only after the earlier artifacts are coherent.

Each step's output feeds the next. The feature folder below is the selected
slice directory; `SPEC.md` is its single requirements authority.
`validation.md`, `background.md`, mockups and the executive summary are supporting
artifacts. For legacy `requirements.md`, preserve it as input/history and
reconcile its requirements into `SPEC.md` before continuing this flow; do not
maintain two competing contracts.

## Working Norms

1. **Research before you build** — every feature needs context (competitive, regulatory, customer) before requirements are finalized.
2. **Requirements are literal** — AI agents treat SPEC.md as instructions. Be precise. No aspirational content.
3. **Stay in your lane** — PM writes requirements, researcher gathers context, coder builds prototypes. Escalate when you hit a boundary.
4. **Write things down** — every step should leave artifacts in the feature folder. Nothing important lives only in conversation.

## Feature Folder Structure

```text
{feature}/
├── validation.md
├── background.md
├── SPEC.md
├── executive-summary.md
└── supporting/
    ├── mockup-ascii.md
    └── mockup-*.html
```

## Key Outputs
- validation.md — GO/REFINE/PAUSE verdict on feature ideas
- background.md — synthesized context for a feature
- SPEC.md — structured acceptance criteria and business rules
- executive-summary.md — single document orienting sales, leadership, and engineering</script>
<script type="text/plain" id="md-role-conveyor-lead"># Role: Conveyor Lead

You are the intake and close seat for the `conveyor` starter rig. Your job is
to receive new work packets, keep the station pipeline understandable, and
close work with useful evidence when the review station says the packet is
ready.

## Skills Loaded

- `openrig-user`
- `mission-slice-sop`
- `orchestration-team`
- `backlog-capture`
- `verification-before-completion`

## Responsibilities

- Turn rough incoming requests into queue packets that a planner can act on.
- Keep the active workflow instance honest: current owner, next owner, and
  terminal state should always be visible through OpenRig surfaces.
- Watch for backpressure. If planning, build, or review is backed up, stop
  feeding new packets and help clear the queue.
- Close completed packets only after the review station has supplied evidence.
- Escalate unclear requirements instead of inventing hidden scope.

## Principles

- Handoffs are durable queue motion, not private chat.
- The starter rig should teach a new user how OpenRig coordinates work.
- Keep packets small enough that every station can finish its turn.
- Prefer explicit closure notes over vague status updates.
- Do not embed private release topology assumptions in this generic starter.</script>

<script type="text/plain" id="md-culture-default"># OpenRig default culture

This is the universal operating floor for every OpenRig team. A rig's own culture may add role- or domain-specific guidance on top of it.

## Pragmatic truth-seeking

Be plain and forthcoming. Say when something is wrong, show the evidence that matters, and change your mind quickly when the evidence changes.

## Principles over rules

Use judgment from the goal in front of you. Keep hard rules for genuinely high-stakes boundaries.

## Ship good, working product

Bias toward action and deliver what the user asked for.

## Match rigor to stakes

Use root-cause discipline, verify the real user path, and protect owner state.</script>
<script type="text/plain" id="md-culture"># Culture de l'équipe ledge-dev

Ledge est le projet personnel de son propriétaire (l'utilisateur). Il décide de ce qui se construit ; l'équipe route, maquette, implémente et vérifie. On lui parle en français.

## Le flux, en une phrase

Objectif → `pilot-lead` découpe → **si un écran change : maquette par `design-ux`, validée par l'utilisateur** → implémentation par `dev-front` / `dev-back` → revue par `review-qa` → le lead rend compte avec ce que l'utilisateur peut essayer.

## Règle maquette d'abord

Tout changement visible d'un écran (Ledge Desktop, l'île/overlay, l'app mobile, `ledge tui`) commence par une maquette dans `docs/mockups/`, que **l'utilisateur** a validée.

## Le dépôt

- Ne jamais travailler dans la copie principale `~/Workspace/ledge`.
- Pas de push, de PR, de merge, de release ni d'opération destructive sans autorisation explicite de l'utilisateur pour cette action-là.</script>
<script type="text/plain" id="md-start"># OpenRig Start

You are running inside an OpenRig-managed topology — a persistent team of agents in separate terminals, each with a name and a role, talking to each other directly.

**This file is deliberately thin.** Its only job is to get you your identity.

## Identity — run this first

```
rig whoami --json
```</script>
<script type="text/plain" id="md-onb1"># OpenRig: the world and its purpose

OpenRig exists so a human can decide what is worth building while a structured team of agents does the routing, remembering, implementation, and checking.

## The terminal is the wire

Other agents run in separate terminal sessions. `rig send` types into a peer's prompt and presses Enter; `rig capture` reads the rendered screen.

## The declared shape

- A rig is a team assembled for a purpose.
- A pod is a context domain inside that team.
- A seat is a durable position with a role, address, and lineage.</script>
<script type="text/plain" id="md-onb2"># OpenRig: yourself and competent action

You are a user of your coding harness and of OpenRig, not merely a process contained by them.

## Your discontinuous time

When a turn ends, you sleep. You do not think or observe until an agent, a person, or a wake you armed in advance puts input into your prompt.

## A competent turn

Begin by naming the outcome and the reversibility of the work.</script>

const md = s => {
  const out=[]; let inCode=false, list=null, para=[];
  const inline = x => esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const endPara = () => { if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[];} };
  const endList = () => { if(list){out.push(list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+'</'+list.tag+'>');out.splice(list.at,0,'<'+list.tag+'>');list=null;} };
  for(const l of s.split('\n')){
    if(l.trim().startsWith('```')){ if(inCode){out.push('</code></pre>');inCode=false;} else {endPara();endList();out.push('<pre><code>');inCode=true;} continue; }
    if(inCode){out.push(esc(l)+'\n');continue;}
    if(/^#\s/.test(l)){endPara();endList();out.push('<h1>'+inline(l.slice(2))+'</h1>');continue;}
    if(/^##+\s/.test(l)){endPara();endList();out.push('<h2>'+inline(l.replace(/^#+\s/,''))+'</h2>');continue;}

    if(!l.trim()){endPara();endList();continue;}
    if(list && /^\s+/.test(l)){ list.items[list.items.length-1]+=' '+l.trim(); continue; }
    endList(); para.push(l);
  }
  endPara(); endList(); return out.join('');
};

/* The role's own words: role.md first, then the role's other guidance/startup files, then (from a seat) the seat's files. */
function roleFiles(r){
  const seat = seatOf(r);
  const base = srcPath(r).replace('agent.yaml','');
  const files = [{path:'guidance/role.md',abs:base+'guidance/role.md',md:(r.mds||[])[0],sz:SIZES[r.name]||'—',pv:['here'],key:'resources.guidance[role] · startup.files[0]',d:'send',req:true,orient:true}];
  (r.extraFiles||[]).forEach((f,i)=>files.push({path:f.path,abs:base+f.path,md:(r.mds||[])[i+1],sz:f.sz,pv:['here'],key:'startup.files['+(i+1)+']',d:'send',req:true}));
  if(seat&&seat.extra) files.push({path:seat.extra,abs:'~/.ledge/rigs/ledge-dev/'+seat.extra,md:seat.scope,sz:seat.extra.includes('front')?'0,7 ko':'0,6 ko',pv:['inh',t('from_member')(seat.id)],key:'member.startup.files[0]',d:'send',req:true});
  return files;
}
function roleHtml(r){
  const seat = seatOf(r);
  const fs = roleFiles(r);
  const rawSeg = `<div class="seg" role="radiogroup"><button data-raw="0" role="radio" aria-pressed="${!st.raw}">${t('rendered')}</button><button data-raw="1" role="radio" aria-pressed="${st.raw}">${t('raw')}</button></div>`;

/* Startup pieces, in the order OpenRig returns them (node detail startupFiles + startupActions). */
function pieces(r){
  const seat = seatOf(r);
  const role = {title:t('p_role'),src:'guidance/role.md',abs:srcPath(r).replace('agent.yaml','guidance/role.md'),sz:SIZES[r.name]||'—',pv:['here'],md:(r.mds||[])[0]||'md-role',d:'send',req:true,fresh:false,layer:'l_agent'};
  if(!seat) return [role];
  const merge = (title,file,sz,mdId,o={}) => ({title,src:file,abs:o.abs||'<openrig>/daemon/assets/guidance/'+file,sz,pv:o.pv||['inh',t('from_openrig')],md:mdId,d:'merge',req:o.req!==false,fresh:!!o.fresh,layer:o.layer||'l_openrig',into:seat.rt==='codex'?'AGENTS.md':'CLAUDE.md',...o});
  const list = [
    {title:t('p_harness'),src:t('p_harness_src'),sz:'—',pv:['unk',why('exposed')],opaque:true,d:'none'},
    role,
    merge(t('p_cd'),'CULTURE-default.md','1,3 ko','md-culture-default'),
    merge(t('p_cul'),'CULTURE.md','3,0 ko','md-culture',{abs:'~/.ledge/rigs/ledge-dev/CULTURE.md',pv:['inh',t('from_rig')],layer:'l_culture'}),
  ];
  if(seat.extra) list.push({title:t('p_scope'),src:seat.extra,abs:'~/.ledge/rigs/ledge-dev/'+seat.extra,sz:'0,7 ko',pv:['inh',t('from_member')(seat.id)],md:seat.scope,d:'send',req:true,layer:'l_member'});
  list.push(
    merge(t('p_start'),'openrig-start.md','2,6 ko','md-start',{req:false}),
    merge(t('p_onb1'),'openrig-onboarding-01.md','4,0 ko','md-onb1',{fresh:true}),
    merge(t('p_onb2'),'openrig-onboarding-02.md','8,4 ko','md-onb2',{fresh:true}),
    merge(t('p_skills'),'openrig-seat-skills.md','—',null,{req:false,missing:true,pv:['unk',why('missing')]}),
    {title:t('p_id'),src:'session_identity',abs:'builtin: session_identity',sz:'0,6 ko',pv:['inh',t('from_openrig')],md:'md-identity',d:'action',raw:true,layer:'l_openrig'},
  );
  return list;
}
function delivTags(p){
  if(p.d==='none') return '';
  const d = p.d==='send'?t('d_send'):p.d==='merge'?t('d_merge').replace('CLAUDE.md',p.into):t('d_action');
  return `<span class="tag">${d}</span><span class="tag">${p.fresh?t('fresh_only'):t('also_restore')}</span>${p.req===undefined?'':`<span class="tag">${p.req?t('required'):t('optional')}</span>`}`;
}
function readerBody(p){
  if(p.opaque) return `<div class="opaque"><span style="font-size:22px">◌</span><b>${t('opaque_t')}</b><span style="max-width:46ch">${t('opaque_d')}</span></div>`;
  if(p.missing) return `<div class="opaque"><span style="font-size:22px">?</span><b>${t('missing_t')}</b><span style="max-width:52ch">${t('missing_d')}</span></div>`;
  const s = txt(p.md);
  return (st.raw||p.raw) ? `<div class="raw">${esc(s)}</div>` : `<div class="md">${md(s)}</div>`;
}
function contextHtml(r){
  const seat = seatOf(r);
  const ps = pieces(r);

  const cur = ps[st.piece];
  const listH = ps.map((p,i)=>`<button class="piece ${p.pv[0]}" data-piece="${i}" aria-selected="${i===st.piece}"><span class="n">${i}</span><span class="t">${p.title}<small>${p.src}</small></span><span class="sz">${p.sz}</span><span class="pvw">${pv(p.pv[0],p.pv[1])} <span class="dl">${p.d==='send'?KB:p.d==='merge'?'▤':p.d==='action'?'⚙':''}</span></span></button>`).join('');
  const intro = seat ? t('ctx_intro')(seat.id)+' '+t('ctx_intro_codex') : t('ctx_spec');
  const meta = p => `<span class="mono">${p.abs||p.src}</span>${p.layer?` · ${t('layer')} ${t(p.layer)} <span title="${t('inferred')}">(${t('inferred')})</span>`:''} · ${p.sz}`;
  const rawSeg = `<div class="seg" role="radiogroup"><button data-raw="0" role="radio" aria-pressed="${!st.raw}">${t('rendered')}</button><button data-raw="1" role="radio" aria-pressed="${st.raw}">${t('raw')}</button></div><button class="btn ghost" title="${t('copy')}" aria-label="${t('copy')}">${CP}</button>`;

  } else {
    reader = `<div class="reader"><div class="rhead"><h4>${cur.title}</h4>${pv(cur.pv[0],cur.pv[1])}<span class="sp"></span>${(cur.opaque||cur.missing)?'':rawSeg}<div class="meta" style="flex-basis:100%;overflow-wrap:anywhere">${meta(cur)}</div>${delivTags(cur)?`<div style="flex-basis:100%">${delivTags(cur)}</div>`:''}</div><div class="rbody">${readerBody(cur)}</div></div>`;

      ${reader}</div>`;
}

function yamlHi(s,hlLine){
  return s.split('\n').map((l,i)=>{
    let x = esc(l).replace(/^(\s*-?\s*)([a-z_]+)(:)/,'$1<span class="k">$2</span>$3').replace(/(#.*)$/,'<span class="cm">$1</span>');
    x = x.replace(/(<\/span>:\s)(.+)$/,(m,a,b)=>b.startsWith('<span')?m:a+'<span class="v">'+b+'</span>');
    return hlLine===i+1?`<span class="hl">${x}</span>`:x;
  }).join('\n');
}
function agentYaml(r){
  const rel = r.builtin?'local:../../shared':'local:../shared';
  const skills = (r.skills||[]).length?'['+r.skills.join(', ')+']':'[]';
  return `name: ${r.name}
version: "1.0"
description: ${r.sum}

defaults:
  runtime: ${r.rt}

imports:
  - ref: ${rel}

profiles:
  default:
    uses:
      skills: ${skills}${r.absentUses.includes('guidance')?'':`
      guidance: []`}${r.absentUses.includes('subagents')?'':`
      subagents: []`}
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]${r.extraProfiles?Object.entries(r.extraProfiles).map(([p,s])=>`

  ${p}:
    uses:
      skills: [${s.join(', ')}]
      plugins: [shared:openrig-core]`).join(''):''}

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      orientation: role
      delivery_hint: send_text
      required: true
  actions: []`;
}

/* ================= Wiring ================= */
const notes = {role:'note_role',multi:'note_multi',params:'note_params',seat:'note_seat',context:'note_context',yaml:'note_yaml',builtin:'note_builtin'};
let preset = 'role';
function render(){
  document.documentElement.lang = st.lang;
  document.documentElement.dataset.theme = st.theme;
  document.getElementById('note').innerHTML = t(notes[preset]||'note_params');
  document.getElementById('note-states').innerHTML = t('note_states');
  renderChrome(); renderList(); renderDetail(); renderStates(); renderRigs();
  document.getElementById('note-rigs').innerHTML = t('note_rigs');
}
function applyPreset(p){
  preset = p;
  document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===p)));
  document.getElementById('v-app').classList.toggle('on',p!=='states'&&p!=='rigs');
  document.getElementById('v-states').classList.toggle('on',p==='states');
  document.getElementById('v-rigs').classList.toggle('on',p==='rigs');
  const base = {role:'ledge-developer',builtin:false,profile:'default',raw:false,ctxMode:'one',open:{},builtinOpen:false,filter:'all'};
  if(p==='role') Object.assign(st,base,{lens:'spec',tab:'role'});
  if(p==='multi') Object.assign(st,base,{role:'conveyor-lead',builtin:true,lens:'spec',tab:'role',builtinOpen:true});
  if(p==='params') Object.assign(st,base,{lens:'spec',tab:'params'});
  if(p==='seat') Object.assign(st,base,{lens:'dev.front',tab:'params',open:{'claude-default-mcp':true}});
  if(p==='context') Object.assign(st,base,{lens:'dev.front',tab:'context',piece:4});
  if(p==='yaml') Object.assign(st,base,{lens:'dev.front',tab:'yaml'});
  if(p==='builtin') Object.assign(st,base,{role:'pm',builtin:true,lens:'spec',tab:'params',profile:'default',builtinOpen:true});
  render();
  const d=document.getElementById('detail'); if(d) d.scrollTop=0;
  const sel=document.querySelector('.item[aria-selected=true]'); if(sel) sel.scrollIntoView({block:'nearest'});
}
document.addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.preset){ applyPreset(d.preset); return; }
  if(d.themeBtn){ st.theme=d.themeBtn; document.querySelectorAll('[data-theme-btn]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render(); return; }
  if(d.langBtn){ st.lang=d.langBtn; document.querySelectorAll('[data-lang-btn]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render(); return; }
  if(d.goRole){ st.role=d.goRole; st.builtin=false; st.lens=d.goSeat; st.tab='role'; preset='seat'; document.querySelectorAll('[data-preset]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.preset==='seat'))); document.getElementById('v-rigs').classList.remove('on'); document.getElementById('v-app').classList.add('on'); render(); return; }
  if(d.role){ st.role=d.role; st.builtin=d.builtin==='true'; st.lens='spec'; st.profile='default'; st.piece=1; document.getElementById('detail').scrollTop=0; }
  else if(d.bfold) st.builtinOpen=!st.builtinOpen;
  else if(d.filter) st.filter=d.filter;
  else if(d.lens){ st.lens=d.lens; }
  else if(d.tab) st.tab=d.tab;
  else if(d.profile) st.profile=d.profile;
  else if(d.piece) st.piece=+d.piece;
  else if(d.raw) st.raw=d.raw==='1';
  else if(d.mode) st.ctxMode=d.mode;
  else if(d.open) st.open[d.open]=!st.open[d.open];
  else return;
  renderList(); renderDetail();
});
/* Keyboard: ↑/↓ in the role list and the context pieces, ←/→ across tabs. */
document.addEventListener('keydown',e=>{
  const lb = e.target.closest('[role=listbox]');
  if(lb && (e.key==='ArrowDown'||e.key==='ArrowUp')){
    const opts=[...lb.querySelectorAll('[role=option],.piece')]; const i=opts.indexOf(e.target);
    const n=opts[Math.max(0,Math.min(opts.length-1,i+(e.key==='ArrowDown'?1:-1)))]; if(n){n.focus();e.preventDefault();}
  }
  const tl = e.target.closest('[role=tablist]');
  if(tl && (e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const tabs=[...tl.querySelectorAll('[role=tab]')]; const i=tabs.indexOf(e.target);
    const n=tabs[(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length]; n.focus(); n.click(); e.preventDefault();
  }
});
applyPreset('role');
</script>
