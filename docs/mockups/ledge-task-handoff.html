<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmission d'une tâche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens: packages/ui/src/styles/tokens.css (subset), plus --task, the one new colour (#92). */
:root,:root[data-theme=light]{
  --background:oklch(1 0 0);--foreground:oklch(.145 0 0);--card:oklch(1 0 0);--popover:oklch(1 0 0);
  --secondary:oklch(.967 .001 286.375);--muted:oklch(.97 0 0);--muted-foreground:oklch(.556 0 0);--accent:oklch(.97 0 0);
  --border:oklch(.922 0 0);--input:oklch(.922 0 0);--ring:oklch(.708 0 0);
  --sidebar:oklch(.985 0 0);--sidebar-accent:oklch(.97 0 0);--sidebar-primary:oklch(.577 .245 27.325);
  --success:#059669;--warning:#b45309;--info:#2563eb;--danger-text:oklch(.505 .213 27.518);--well:oklch(.97 0 0);
  --radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:14px;
  --bot-shell-line:#ffffff99;--bot-visor:#22292b;
  --task:#6d4fc4;--task-soft:color-mix(in srgb,var(--task) 9%,var(--card));
  --page:#f4f2ef;--chrome:#fbfaf8;
  /* The TUI, on a light terminal: the palette proposed with #95. */
  --t-bg:#faf8f6;--t-fg:#2b2522;--t-dim:#6f6560;--t-faint:#a39a95;--t-line:#d9d2cd;--t-violet:#6d4fc4;--t-green:#2f8a55;--t-red:#c4483a;--t-coral:#c9563f;--t-blue:#2f6db5;--t-sel:#efeae6;
}
:root[data-theme=dark]{
  --background:oklch(.145 0 0);--foreground:oklch(.985 0 0);--card:oklch(.205 0 0);--popover:oklch(.205 0 0);
  --secondary:oklch(.274 .006 286.033);--muted:oklch(.269 0 0);--muted-foreground:oklch(.708 0 0);--accent:oklch(.269 0 0);
  --border:#ffffff1a;--input:#ffffff26;--ring:oklch(.556 0 0);
  --sidebar:oklch(.205 0 0);--sidebar-accent:oklch(.269 0 0);--sidebar-primary:oklch(.637 .237 25.331);
  --success:#34d399;--warning:#fbbf24;--info:#60a5fa;--danger-text:oklch(.704 .191 22.216);--well:oklch(.145 0 0);
  --bot-shell-line:#859397;--bot-visor:#172124;
  --task:#b9a2f0;--task-soft:color-mix(in srgb,var(--task) 11%,var(--card));
  --page:#0b0b0c;--chrome:#141414;
  /* The TUI's own palette (packages/ledge/src/tui/theme.ts). */
  --t-bg:#1a1817;--t-fg:#e6e0dc;--t-dim:#8f8681;--t-faint:#5f5854;--t-line:#3a3532;--t-violet:#b9a2f0;--t-green:#86cf9d;--t-red:#f0806e;--t-coral:#f07a62;--t-blue:#7fb2ec;--t-sel:#2b2725;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--foreground);font:14px/1.45 'Geist','Segoe UI',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
svg.i{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- The mockup's chrome ---- */
.bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px;background:var(--chrome);border-bottom:1px solid var(--border);font-size:12px}
.bar .brand{font-weight:600;font-size:14px}
.bar .brand small{font-weight:400;color:var(--muted-foreground);margin-left:6px;font-size:12px}
.field{display:flex;align-items:center;gap:6px;color:var(--muted-foreground)}
.seg{display:inline-flex;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--background)}
.seg button{height:24px;padding:0 9px;border-radius:6px;color:var(--muted-foreground);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--secondary);color:var(--foreground)}
.seg button:focus-visible{outline:2px solid var(--ring)}
.replay{height:28px;padding:0 10px;border:1px solid var(--input);border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding:22px 20px 40px;align-items:start}
@media(max-width:1180px){.layout{grid-template-columns:1fr}}
.cap{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;font-size:11px;color:var(--muted-foreground)}
.cap b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--foreground)}
.cap b.next{color:var(--task)}
.notes{display:flex;flex-direction:column;gap:14px}
.note{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:14px 16px;font-size:12.5px;line-height:1.55}
.note h3{margin:0 0 2px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--task)}
.note h4{margin:0 0 8px;font-size:14px;font-weight:600}
.note ul,.note ol{margin:0;padding-left:18px}
.note li+li{margin-top:5px}
.note code,.note kbd{font:11px 'Geist Mono',monospace;padding:0 4px;border:1px solid var(--border);border-radius:4px;background:var(--secondary)}
.note table{width:100%;border-collapse:collapse;font-size:12px}
.note td{padding:4px 0;border-top:1px solid var(--border);vertical-align:top}
.note td:first-child{color:var(--muted-foreground);padding-right:10px;white-space:nowrap}

/* ---- The atelier (atelier.css / office.css, simplified: one team room, one table) ---- */
.floor{position:relative;width:1000px;height:660px;border:1px solid var(--border);border-radius:14px;overflow:hidden;
  --office-wood:color-mix(in srgb,var(--secondary) 88%,var(--warning));--office-floor:color-mix(in srgb,var(--sidebar) 97%,var(--warning));
  background:repeating-linear-gradient(90deg,transparent 0,transparent 89px,var(--border) 90px,transparent 91px),repeating-linear-gradient(0deg,transparent 0,transparent 89px,var(--border) 90px,transparent 91px),var(--office-floor)}
.fit{transform-origin:0 0}
.room{position:absolute;left:130px;top:146px;width:760px;height:440px;border:1px solid color-mix(in srgb,var(--info) 18%,var(--input));border-top:4px solid var(--info);border-radius:30px 18px 30px 18px;background:color-mix(in srgb,var(--info) 5%,var(--sidebar));box-shadow:0 4px 0 var(--border)}
.plaque{position:absolute;left:50%;top:-16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:4px 10px;background:var(--sidebar);border:1px solid var(--input);border-radius:8px;box-shadow:0 2px 0 var(--border);font-size:12px;white-space:nowrap}
.plaque b{font-weight:600}.plaque span{color:var(--muted-foreground);font-size:11px}
.plaque i{width:7px;height:7px;border-radius:2px;background:var(--info)}
.worktable{position:absolute;left:130px;top:170px;width:500px;height:112px;border-radius:18px;transform:skewY(-4deg);background:linear-gradient(150deg,color-mix(in srgb,var(--office-wood) 90%,var(--foreground)),var(--office-wood));border:1px solid color-mix(in srgb,var(--warning) 18%,var(--input));box-shadow:0 7px 0 var(--secondary),0 8px 0 var(--input)}
.sheet{--sheet:color-mix(in srgb,var(--card) 86%,var(--foreground));position:absolute;width:86px;min-height:40px;padding:6px 8px 8px;border-radius:2px;background:var(--sheet);border:1px solid var(--input);box-shadow:2px 3px 0 color-mix(in srgb,var(--foreground) 12%,transparent)}
:root[data-theme=light] .sheet{--sheet:var(--card)}
.sheet p{margin:0;font-size:9px;line-height:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet .flag{position:absolute;top:-5px;right:7px;width:14px;height:13px;border-radius:1px}
.sheet.with-task .flag{background:var(--task)}
.sheet.with-task{outline:1.5px solid color-mix(in srgb,var(--task) 70%,transparent);outline-offset:1px}
.sheet.fresh{animation:sheet-in .45s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--land)}
.sheet.leaving{animation:sheet-out .4s ease-in both;animation-delay:var(--land)}
@keyframes sheet-in{from{opacity:0;transform:translateY(-10px) rotate(-6deg) scale(.8)}}
@keyframes sheet-out{to{opacity:.25;transform:translateY(4px) scale(.94)}}
.seat{position:absolute;width:120px;margin-left:-60px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:8px;z-index:3}
.seat strong{font-size:13px;font-weight:500;line-height:18px}
.seat.gone{opacity:.35}
.role{display:inline-block;font:10px/14px 'Geist Mono',monospace;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--info) 16%,transparent);color:color-mix(in srgb,var(--info) 70%,var(--foreground))}
.state{font-size:10px;line-height:15px;padding:0 6px;border-radius:4px;margin-top:2px}
.state.work{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.state.idle{color:var(--success);background:color-mix(in srgb,var(--success) 13%,transparent)}
.state.done{color:var(--muted-foreground);background:color-mix(in srgb,var(--muted-foreground) 13%,transparent)}
.ledge-desk{position:absolute;left:22px;top:84px;display:flex;gap:8px;align-items:flex-start}
.ledge-desk .who{display:flex;flex-direction:column;font-size:12px;font-weight:500}
.ledge-desk small{font-size:10px;font-weight:400;color:var(--muted-foreground)}
.legend{position:absolute;left:16px;bottom:12px;display:flex;gap:14px;align-items:center;padding:7px 12px;border:1px solid var(--border);border-radius:10px;background:var(--popover);font-size:11px;color:var(--muted-foreground);z-index:8}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg.w{width:30px;height:8px;overflow:visible}
.legend svg.w path{fill:none;stroke-width:1.5;stroke-linecap:round}

/* ---- One layer for every transmission (#92): a wire, a token travelling on it, the sender's bubble. ---- */
.tx-layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.tx-wire{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tx-wire path{fill:none;stroke-width:1.5;stroke-linecap:round;animation:wire-draw .5s ease-out both,wire-flow 1s linear infinite,wire-out .4s ease-in 4.7s forwards}
.tx-message .tx-wire path{stroke:var(--foreground);stroke-opacity:.5;stroke-dasharray:2 5}
/* A task: dashes, not dots (told apart without the colour), in the task's violet. */
.tx-task .tx-wire path{stroke:var(--task);stroke-opacity:.85;stroke-dasharray:7 5;stroke-width:1.75}
.tx-token{position:absolute;left:0;top:0;offset-rotate:0deg;filter:drop-shadow(0 2px 0 var(--border));animation:token-fly 1.3s cubic-bezier(.45,0,.3,1) both,token-out .4s ease-in 1.5s forwards}
.tx-message .tx-token{width:26px;height:19px;margin:-9.5px 0 0 -13px}
.tx-task .tx-token{width:24px;height:29px;margin:-14.5px 0 0 -12px;animation-duration:1.45s,.4s;animation-delay:0s,1.65s}
.tx-token svg{display:block;width:100%;height:100%;overflow:visible}
.tx-message .tx-token svg{animation:envelope-sway .65s ease-in-out 2}
/* The task's sheet glides flat and turns once to show its face as it lands. */
.tx-task .tx-token svg{animation:sheet-glide 1.45s cubic-bezier(.45,0,.3,1) both}
.env-body{fill:var(--popover);stroke:var(--foreground);stroke-width:1.4;stroke-linejoin:round}
.env-flap{fill:none;stroke:var(--foreground);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.tk-paper{fill:var(--popover);stroke:var(--task);stroke-width:1.5;stroke-linejoin:round}
.tk-fold{fill:color-mix(in srgb,var(--task) 25%,var(--popover));stroke:var(--task);stroke-width:1.5;stroke-linejoin:round}
.tk-line{stroke:color-mix(in srgb,var(--foreground) 45%,transparent);stroke-width:1.4;stroke-linecap:round}
.tk-flag{fill:var(--task)}
.tk-stamp{fill:var(--popover);stroke-width:1.6}
.tk-stamp.done{stroke:var(--success)}.tk-stamp.refused,.tk-stamp.cancelled{stroke:var(--danger-text)}.tk-stamp.dropped{stroke:var(--muted-foreground)}
.tk-mark{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tk-mark.done{stroke:var(--success)}.tk-mark.refused,.tk-mark.cancelled{stroke:var(--danger-text)}.tk-mark.dropped{stroke:var(--muted-foreground)}
.tx-bubble{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:max-content;max-width:250px;padding:6px 10px 7px;border:1px solid var(--input);border-radius:10px 10px 10px 2px;background:var(--popover);box-shadow:0 3px 0 var(--border);text-align:left;pointer-events:auto;animation:bubble-in .25s cubic-bezier(.3,1.4,.5,1) both,bubble-out .35s ease-in 4.65s forwards}
.tx-bubble:hover,.tx-bubble:focus-visible{border-color:var(--ring);outline:none}
.tx-task .tx-bubble{border-left:3px solid var(--task);padding-left:9px;border-radius:4px 10px 10px 2px}
.tx-head{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted-foreground);white-space:nowrap}
.tx-task .tx-head{color:var(--task);font-weight:500}
.tx-head .out{display:inline-flex;align-items:center;gap:3px;padding:0 5px;border-radius:4px;font-weight:500}
.out.done{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent)}
.out.refused,.out.cancelled{color:var(--danger-text);background:color-mix(in srgb,var(--danger-text) 14%,transparent)}
.out.dropped{color:var(--muted-foreground);background:color-mix(in srgb,var(--muted-foreground) 14%,transparent)}
.tx-text{font-size:11px;line-height:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tx-task .tx-text{font-weight:500}
.tx-sub{font-size:10.5px;line-height:14px;color:var(--muted-foreground);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tx-sub q{font-style:italic}
.seat.lit{outline:2px solid var(--ring);outline-offset:3px}
.seat.arrived:after{content:'';position:absolute;inset:-6px;border-radius:10px;border:2px solid var(--foreground);opacity:0;animation:seat-ring 1.4s ease-out forwards;animation-delay:var(--land);pointer-events:none}
.seat.arrived.by-task:after{border-color:var(--task)}
@keyframes wire-draw{from{opacity:0}}
@keyframes wire-flow{to{stroke-dashoffset:-14}}
@keyframes wire-out{to{opacity:0}}
@keyframes token-fly{from{offset-distance:0%;opacity:0;scale:.6}12%{opacity:1;scale:1}to{offset-distance:100%;opacity:1;scale:1}}
@keyframes token-out{to{opacity:0;scale:.85}}
@keyframes envelope-sway{25%{transform:translateY(-1.5px) rotate(-4deg)}75%{transform:translateY(1.5px) rotate(4deg)}}
@keyframes sheet-glide{0%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes bubble-in{from{opacity:0;transform:translate(-50%,-90%) scale(.92)}}
@keyframes bubble-out{to{opacity:0}}
@keyframes seat-ring{0%{opacity:.7;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
/* Frozen or reduced, as for a message today: no token, no ring, the wire and the bubble hold still; the sheet is simply there. */
.still .tx-wire path,.still .tx-bubble,.still .sheet{animation:none!important}
.still .tx-token,.still .seat.arrived:after{display:none}
/* Mockup only: the token stopped half-way, for the captures. */
.freeze .tx-wire path,.freeze .tx-bubble,.freeze .tx-token,.freeze .tx-token svg{animation:none!important}
.freeze .tx-token{offset-distance:58%}
.freeze .sheet.fresh{display:none}
.freeze .sheet.leaving{animation:none}
.freeze .seat.arrived:after{display:none}

/* ---- The session thread (session.css + the PR #74 message cards) ---- */
.window{width:960px;border:1px solid var(--border);border-radius:12px;background:var(--background);overflow:hidden;display:flex;flex-direction:column}
.pane-head{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--sidebar);font-size:13px}
.pane-head .meta{color:var(--muted-foreground);font-size:11px}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs span{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--muted-foreground)}
.tabs span.on{background:var(--secondary);color:var(--foreground)}
.tabs span.task-tab.on{box-shadow:inset 0 -2px 0 var(--task)}
.split{display:flex;min-height:560px}
.thread{flex:1;min-width:0;padding:16px 18px 24px}
.thread ol{list-style:none;margin:0 auto;padding:0;max-width:760px;position:relative}
.thread ol:before{content:'';position:absolute;left:19.5px;top:6px;bottom:6px;width:1px;background:var(--border)}
.r{display:grid;grid-template-columns:40px minmax(0,1fr) 56px;column-gap:14px;align-items:start;padding:4px 0;position:relative}
.r>.n{justify-self:center;z-index:1}
.r>.tm{font:11px/20px 'Geist Mono',monospace;color:var(--muted-foreground);text-align:right;font-variant-numeric:tabular-nums}
.node{width:24px;height:24px;margin-top:-2px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--sidebar);border:1px solid var(--border);color:var(--muted-foreground)}
.node.task{color:var(--task);border-color:color-mix(in srgb,var(--task) 40%,var(--border));background:color-mix(in srgb,var(--task) 12%,var(--sidebar))}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted-foreground);margin-top:7px}
.you{font-size:13px;line-height:20px}
.you b{font-weight:600;margin-right:6px}
.say{font-size:13.5px;line-height:21px}
.tool{font:12px/20px 'Geist Mono',monospace;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .ok{color:var(--success)}.tool b{font-weight:500;color:var(--foreground);margin-right:6px}
.message-card{justify-self:start;max-width:86%;min-width:0;display:flex;flex-direction:column;gap:4px;padding:9px 13px;border:1px solid var(--border);border-radius:14px 14px 14px 4px;background:var(--card)}
.message-card.sent{justify-self:end;max-width:78%;background:var(--secondary);border-color:transparent;border-radius:14px 14px 4px 14px}
.route{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--muted-foreground)}
.route strong{color:var(--foreground);font-weight:500}
.lnk{color:var(--muted-foreground);text-decoration:underline;text-decoration-color:var(--input);text-underline-offset:3px;font-size:11px}
.lnk:hover{color:var(--foreground)}
.message-body{font-size:13.5px;line-height:21px}
/* The task card: the message card's frame and place (right when sent, left when received), with a ticket's edge and its own head. */
.task-card{justify-self:start;width:min(86%,560px);display:flex;flex-direction:column;border:1px solid color-mix(in srgb,var(--task) 30%,var(--border));border-left:3px solid var(--task);border-radius:6px 14px 14px 4px;background:var(--task-soft);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.task-card.sent{justify-self:end;border-radius:6px 14px 4px 14px}
.task-card:hover,.task-card:focus-visible{border-color:var(--task);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--task) 20%,transparent)}
.task-card.lit{box-shadow:0 0 0 3px color-mix(in srgb,var(--task) 32%,transparent)}
.task-card .kicker{display:flex;align-items:center;gap:6px;padding:8px 13px 0;font-size:11px;color:var(--task);font-weight:500}
.task-card .kicker .id{font:10.5px 'Geist Mono',monospace;color:var(--muted-foreground);font-weight:400}
.task-card .kicker .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:500;white-space:nowrap}
.pill.open{color:var(--task);background:color-mix(in srgb,var(--task) 15%,transparent)}
.pill.taken{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.pill.done{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent)}
.pill.refused,.pill.cancelled{color:var(--danger-text);background:color-mix(in srgb,var(--danger-text) 14%,transparent)}
.pill.dropped{color:var(--muted-foreground);background:color-mix(in srgb,var(--muted-foreground) 14%,transparent)}
.task-card .title{padding:3px 13px 0;font-size:14px;font-weight:600;line-height:20px}
.task-card .detail{padding:2px 13px 0;font-size:13px;line-height:19px;color:color-mix(in srgb,var(--foreground) 82%,transparent);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-card .quote{margin:7px 13px 0;padding:5px 10px;border-left:2px solid var(--input);font-size:12.5px;line-height:18px;color:var(--muted-foreground)}
.task-card .quote b{display:block;font-size:10.5px;font-weight:500;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em}
.task-card .quote.result{border-left-color:var(--success)}
.task-card .quote.reason{border-left-color:var(--danger-text)}
.task-card .quote span{color:var(--foreground)}
.task-card .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:6px 13px 8px;border-top:1px dashed color-mix(in srgb,var(--task) 28%,var(--border));font-size:11px;color:var(--muted-foreground)}
.task-card .foot .sp{flex:1}

<script>
// ---- State in the URL: #vue=atelier&cas=give&anim=play&theme=dark ----
const DEF = { vue: 'atelier', cas: 'give', anim: 'play', theme: 'dark', fil: 'pim', plie: '0', largeur: '120', ecran: 'desktop', charge: 'normal' };
const st = Object.assign({}, DEF, Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
const save = () => { history.replaceState(null, '', '#' + new URLSearchParams(Object.fromEntries(Object.entries(st).filter(([k, v]) => DEF[k] !== v || k === 'vue'))).toString()); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const ICON = {
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  task: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  pass: '<path d="M4 12h12M12 6l6 6-6 6"/><path d="M20 5v14"/>',
  back: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  replay: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>'
};
const ic = (k, s = 12) => `<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${ICON[k]}</svg>`;

// A mascot, simplified: the shell in the session's colour, the visor, two eyes in the state's colour.
const BOT = { Pim: '#e0866d', Nova: '#8f86e8', Bix: '#7f9aa5', Lu: '#d9a066', Max: '#c97f9b', Ida: '#76b59a', Ledge: '#e0866d' };
const bot = (name, size = 40, eye = '#90c7f2') => `<svg class="botmini" width="${size}" height="${size * .9}" viewBox="0 0 40 36"><line x1="20" y1="2" x2="20" y2="7" stroke="${BOT[name]}" stroke-width="2"/><circle cx="20" cy="2.5" r="2" fill="${BOT[name]}"/><rect x="4" y="7" width="32" height="26" rx="8" fill="${BOT[name]}"/><rect x="4.5" y="7.5" width="31" height="10" rx="7" fill="var(--bot-shell-line)" opacity=".25"/><rect x="9" y="13" width="22" height="12" rx="5" fill="var(--bot-visor)"/><rect x="13" y="16" width="4" height="6" rx="1.5" fill="${eye}"/><rect x="23" y="16" width="4" height="6" rx="1.5" fill="${eye}"/></svg>`;

// ---- The story: Pim gives Nova a task; Nova passes it to Lu for review; Lu closes it, back to Pim. ----
const TASK = {
  id: 't5c2e19', title: 'Émettre task.updated pour toutes les tâches',
  text: "Aujourd'hui seul Ledge apprend les changements de ses propres tâches. Émets l'événement pour toutes, avec le journal, et couvre pass, done, refuse et la reprise par des tests.",
  note: 'Relis surtout la reprise du journal au redémarrage',
  result: 'Fait sur feat/task-handoff : task.updated pour toutes les tâches, 6 tests. La reprise du journal n’émet plus deux fois.',
  reason: 'Le daemon n’est pas à moi : je relis, je n’écris pas. Repasse-la à Nova.'
};

// ---- The atelier: one team room, seats around one table ----
const SEATS = {
  Pim: { x: 230, y: 52, role: 'lead', state: ['idle', 'Disponible'], sheet: 'Découper #92' },
  Nova: { x: 380, y: 52, role: 'dev-back', state: ['work', 'Au travail'], sheet: 'Journal des tâches' },
  Bix: { x: 530, y: 52, role: 'dev-front', state: ['work', 'Au travail'], sheet: 'Carte de tâche du fil' },
  Ida: { x: 230, y: 312, role: 'ux-ui', state: ['work', 'Au travail'], sheet: 'Maquette #92' },
  Max: { x: 380, y: 312, role: 'rev-front', state: ['idle', 'Disponible'], sheet: 'Relire #95' },
  Lu: { x: 530, y: 312, role: 'rev-back', state: ['idle', 'Disponible'], sheet: 'Relire PR #97' }
};
const ROOM = { x: 130, y: 146 };
const LEDGE_AT = { x: 42, y: 90 };
// The seat's anchor, in floor coordinates: its top centre (the app's `top + 6`).
const anchor = n => n === 'Ledge' ? LEDGE_AT : { x: ROOM.x + SEATS[n].x, y: ROOM.y + SEATS[n].y + 6 };
// The app's arc, plus one change (#92): between two rows it rises by half the rows' gap, so it clears the seats in between.
const arc = (a, b) => `M ${a.x} ${a.y} Q ${(a.x + b.x) / 2} ${Math.min(a.y, b.y) - 70 - Math.abs(a.x - b.x) * .12 - (a === LEDGE_AT || b === LEDGE_AT ? 0 : Math.abs(a.y - b.y) * .5)} ${b.x} ${b.y}`;

const CASES = {
  message: { label: 'Message (aujourd’hui)', kind: 'message', from: 'Bix', to: 'Max', head: 'à Max', text: 'La carte de tâche est prête à relire, deux états à vérifier.' },
  ledge: { label: 'Ledge confie', kind: 'task', from: 'Ledge', to: 'Pim', verb: 'Tâche confiée à Pim', text: '#92 : transmission d’une tâche (Atelier, fil, TUI)', landSheet: 'Pim' },
  give: { label: 'Confiée', kind: 'task', from: 'Pim', to: 'Nova', verb: 'Tâche confiée à Nova', text: TASK.title, landSheet: 'Nova' },
  pass: { label: 'Passée (avec la note)', kind: 'task', from: 'Nova', to: 'Lu', verb: 'Tâche passée à Lu', text: TASK.title, sub: `de Pim · <q>${TASK.note}</q>`, landSheet: 'Lu', leaveSheet: 'Nova' },
  done: { label: 'Rendue : terminée', kind: 'task', from: 'Lu', to: 'Pim', verb: 'Rendue à Pim', out: ['done', '✓ terminée'], text: TASK.title, sub: TASK.result, leaveSheet: 'Lu' },

const T = (cls, s) => ({ cls, s });
const pad = (s, n) => s.length >= n ? s.slice(0, n) : s + ' '.repeat(n - s.length);
function renderBox(W, title, lines, color = 'line') {
  const inner = W - 4;
  const top = [T(`c-${color}`, '╭─ '), T('c-dim', title.toUpperCase()), T(`c-${color}`, ' ' + '─'.repeat(Math.max(0, W - 5 - title.length)) + '╮')];
  const body = lines.map(segs => {
    let used = 0; const out = [];
    const bg = segs.sel ? ' sel-bg' : '';
    for (const g of segs) { if (used >= inner) break; let s = g.s; if (used + s.length > inner) s = s.slice(0, inner - used - 1) + '…'; out.push({ ...g, cls: g.cls + bg, s }); used += s.length; }
    return [T(`c-${color}`, '│ '), ...out, T(bg, ' '.repeat(Math.max(0, inner - used))), T(`c-${color}`, ' │')];
  });
  const bottom = [T(`c-${color}`, '╰' + '─'.repeat(W - 2) + '╯')];
  return [top, ...body, bottom];
}
const term = rows => `<div class="term">${rows.map(r => `<div class="ln">${r.map(g => g.glyph ? `<span class="g ${g.cls}">${esc(g.s)}</span>` : `<span class="${g.cls}">${esc(g.s)}</span>`).join('')}</div>`).join('')}</div>`;
const G = (cls, s) => ({ cls, s, glyph: true });

function tui() {

    [T('c-faint', '10:20 '), T('c-fg', 'Ledge'), T('c-violet', ' → '), T('c-fg', 'Pim'), T('', '  '), T('c-dim', '#92 : transmission d’une tâche (Atelier, fil, TUI)')]
  ]);
  // Proposed: messages and every task change, newest first; a task line names its verb; the routes align.
  const ex = [
    ['11:05', 'task', 'Lu', 'Pim', [T('c-green', '✓ terminée  '), T('c-fg', TASK.title)]],
    ['11:02', 'msg', 'Bix', 'Max', [T('c-dim', 'La carte de tâche est prête à relire, deux états à vérifier.')]],

    ['10:21', 'task', 'Pim', 'Nova', [T('c-violet', 'confiée  '), T('c-fg', TASK.title)]],

  ];
  const rw = Math.max(...ex.map(e => e[2].length + e[3].length + 3));
  const next = renderBox(W, 'Échanges', ex.map(([at, k, a, b, rest]) => [T('c-faint', at + ' '), { ...G(k === 'task' ? 'c-violet' : 'c-dim', k === 'task' ? '▤' : '✉') }, T('', ' '), T('c-fg', a), T(k === 'task' ? 'c-violet' : 'c-faint', ' → '), T('c-fg', pad(b, rw - a.length - 3)), T('', '  '), ...rest]));
  // The team's tasks box (key T) gains the same verbs.
  return `<div class="tui-pair">

}

// ---- Notes ----
const NOTES = {

    <li>Repliée (le réglage des messages) : une ligne, route, titre, état.</li>
    <li>Le pointeur <code>&lt;ledge-task&gt;</code> tapé dans le terminal reste ; c’est la carte qui le montre dans le fil, pas le texte brut.</li></ul></div>`,
  tui: `<div class="note"><h3>TUI</h3><h4>« Échanges » montre toutes les transmissions</h4><ul>

    <li><b>Téléphone</b> : la ligne d’équipe de « Le point » ouvre un écran de l’équipe (mêmes groupes, puces de siège défilantes) ; une tâche s’ouvre en feuille, « Ouvrir le fil de Lu » en tête.</li>
    <li><b>TUI</b> : la boîte <kbd>T</kbd> garde sa place, met les tâches à prendre d’abord, ajoute porteur et âge, et compte le reste ; <kbd>t</kbd> (libre aujourd’hui) ouvre l’écran « Tâches de l’équipe » : liste groupée à gauche, la tâche à droite, <kbd>↵</kbd> fil du porteur, <kbd>p</kbd> fil du donneur, <kbd>c</kbd> les closes, <kbd>esc</kbd> retour.</li>
    <li>Textes en : « To take · Taken · Closed today · Who holds what · waiting for 48 min · taken 25 min ago · passed by Nova · Nothing to take, nothing in progress in ledge-roles ».</li></ul></div>
    <div class="note"><h3>Données</h3><h4>Ce qui manque au daemon (pour Nova)</h4><ol>
    <li><b>Les changements des tâches entre sièges</b> n’arrivent pas aux fronts : <code>task.updated</code> ne part que pour celles de Ledge (<code>onLedgeTask</code>). La flotte liste une équipe à la connexion, puis plus rien. C’est la question 1 de #92, déjà chez Nova : sans elle, la vue se fige.</li>
    <li><b>Un genre par entrée du journal</b> (<code>kind: given · taken · passed · done · refused · cancelled · dropped</code>). Aujourd’hui seul le texte (« passée à Lu », « prise », « annulée : … ») dit ce qui s’est passé ; « passée par », « prise il y a » et « annulée » s’en déduiraient sans lire du français.</li>
    <li><b>Le téléphone</b> ne reçoit que les tâches de Ledge (<code>phoneTasks</code>, filtre <code>giver === ledge</code>) et sans <code>giverName</code> ni journal. Il faut les tâches des équipes vivantes (ouvertes + closes du jour, borné), avec <code>giverName</code>, les passages et le journal court de la feuille.</li>
    <li>Le <b>rôle du porteur</b> se déduit des sièges de l’équipe (Desktop, TUI) ; le téléphone a déjà <code>ownerRole</code>. Rien à ajouter, sauf si une tâche doit garder le rôle d’origine quand le siège change de main.</li></ol></div>`
};
const OPEN_EQ = `<div class="note"><h3>À trancher</h3><ol>
  <li>Le filtre d’équipe en <b>puces</b> au lieu du select : d’accord ? Au-delà de 5 équipes, les puces se replient en « + 3 ».</li>
  <li>« Attend depuis » en ambre après <b>30 min</b> : le bon seuil ? Faut-il aussi le signaler dans « À toi » ?</li>
  <li>Les closes : seulement <b>celles du jour</b> (comme la boîte de la TUI), ou les 24 dernières heures (comme le téléphone) ?</li>
  <li>Une action « Relancer Lu » sur une tâche qui attend (un message au porteur) : utile, ou le fil du porteur suffit ?</li>
  <li>TUI : <kbd>t</kbd> pour l’écran et <kbd>T</kbd> pour la boîte, ou <kbd>T</kbd> qui cycle boîte → écran → caché ?</li></ol></div>`;
const OPEN = `<div class="note"><h3>À trancher</h3><ol>
  <li><b>Données</b> : un événement <code>task.updated</code> pour <b>toutes</b> les tâches (proposé : l’Atelier, le fil et la TUI le lisent tels quels), ou une relecture périodique du journal ?</li>
  <li>La transmission entre-t-elle dans <code>history</code> (comme <code>recordSent</code>) pour que les cartes survivent au redémarrage, ou le fil les déduit-il du journal de la tâche ?</li>
  <li>Couleur : violet <code>--task</code>, nouveau jeton, ou la couleur du projet ? Le violet évite les couleurs d’état (bleu, rouge, ambre, vert).</li>
  <li>Le drapeau violet « pas encore prise » sur la fiche de la table : utile, ou une marque de trop ?</li>
  <li>« Convertir un message en tâche » : hors de cette maquette ; une issue à part ?</li></ol></div>`;

// ---- Chrome ----
const CASE_KEYS = { atelier: Object.keys(CASES), fil: Object.keys(THREADS) };
function seg(key, opts) { return `<span class="seg">${opts.map(([v, l]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${st[key] === v}">${l}</button>`).join('')}</span>`; }
function bar() {
  let h = `<span class="brand">Ledge.<small>#92 · transmission d’une tâche</small></span>
    <span class="field">Vue ${seg('vue', [['atelier', 'Atelier'], ['fil', 'Fil de session'], ['tui', 'TUI'], ['equipe', 'Tâches d’équipe']])}</span>`;
  if (st.vue === 'atelier') h += `<span class="field">Cas ${seg('cas', Object.entries(CASES).map(([k, c]) => [k, c.label]))}</span>
    <span class="field">Animation ${seg('anim', [['play', 'Animée'], ['freeze', 'Arrêt sur image'], ['still', 'Figée / réduite']])}</span><button class="replay" type="button" id="replay">${ic('replay', 12)}Rejouer</button>`;
  if (st.vue === 'fil') h += `<span class="field">Fil ${seg('fil', Object.entries(THREADS).map(([k, v]) => [k, k === 'open' ? 'Tâche ouverte' : `Chez ${v.who}`]))}</span>
    <span class="field">Cartes ${seg('plie', [['0', 'Dépliées'], ['1', 'Repliées']])}</span>`;
  if (st.vue === 'equipe') h += `<span class="field">Écran ${seg('ecran', [['desktop', 'Desktop'], ['acces', 'Par où on y arrive'], ['telephone', 'Téléphone'], ['tui', 'TUI']])}</span>${st.ecran === 'acces' ? '' : `<span class="field">Charge ${seg('charge', [['normal', 'Ordinaire'], ['vide', 'Vide'], ['beaucoup', 'Beaucoup']])}</span>`}`;
  if (st.vue === 'tui') h += `<span class="field">Terminal ${seg('largeur', [['120', '120 colonnes'], ['160', '160 colonnes']])}</span>`;
  h += `<span class="field">Thème ${seg('theme', [['dark', 'Sombre'], ['light', 'Clair']])}</span>`;
  return h;
}
let loop;
function render() {
  document.documentElement.dataset.theme = st.theme;
  document.getElementById('bar').innerHTML = bar();
  document.getElementById('view').innerHTML = st.vue === 'fil' ? fil() : st.vue === 'tui' ? tui() : st.vue === 'equipe' ? equipe() : atelier();
  document.getElementById('notes').innerHTML = NOTES[st.vue] + (st.vue === 'equipe' ? OPEN_EQ : OPEN);
  fitFloor();
  clearInterval(loop);
  if (st.vue === 'atelier' && st.anim === 'play') loop = setInterval(replay, 6000);
  save();
}
function replay() { const f = document.getElementById('floor'); if (!f) return; const n = f.cloneNode(true); f.replaceWith(n); fitFloor(); }
function fitFloor() {
  const w = document.querySelector('.floor-wrap'); if (!w) return;
  const f = w.firstElementChild, k = Math.min(1, w.clientWidth / 1000);
  f.style.transform = k < 1 ? `scale(${k})` : ''; f.classList.add('fit'); w.style.height = 660 * k + 'px';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b) { st[b.dataset.k] = b.dataset.v; render(); return; }
  if (e.target.closest('#replay')) replay();
});
document.addEventListener('mouseover', e => { const b = e.target.closest('.tx-bubble'); if (b) lightSeats(true); });
document.addEventListener('mouseout', e => { const b = e.target.closest('.tx-bubble'); if (b) lightSeats(false); });
function lightSeats(on) {
  const c = CASES[st.cas]; for (const s of document.querySelectorAll('.seat')) if ([c.from, c.to].includes(s.querySelector('strong').textContent)) s.classList.toggle('lit', on);
}
addEventListener('resize', fitFloor);
addEventListener('hashchange', () => { Object.assign(st, DEF, Object.fromEntries(new URLSearchParams(location.hash.slice(1)))); render(); });
render();
</script>
