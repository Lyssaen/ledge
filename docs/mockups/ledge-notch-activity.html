  --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0); --card-foreground: oklch(0.145 0 0);
  --popover: oklch(1 0 0); --popover-foreground: oklch(0.145 0 0);
  --primary: oklch(0.505 0.213 27.518); --primary-foreground: oklch(0.971 0.013 17.38); --primary-hover: oklch(0.444 0.177 26.899);
  --secondary: oklch(0.967 0.001 286.375); --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0); --accent-foreground: oklch(0.205 0 0);

  --radius: 0.625rem; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px; --radius-xl: 14px;
  --sidebar: oklch(0.985 0 0); --sidebar-foreground: oklch(0.145 0 0); --sidebar-primary: oklch(0.577 0.245 27.325);
  --sidebar-primary-foreground: oklch(0.971 0.013 17.38); --sidebar-accent: oklch(0.97 0 0); --sidebar-accent-foreground: oklch(0.205 0 0);
  --sidebar-border: oklch(0.922 0 0); --sidebar-ring: oklch(0.708 0 0);
  /* The notch itself: pure white (light) or pure black (dark), borderless, so it merges with the screen edge. */
  --notch: #fff;
  --task: #7c3aed; /* a task handed between seats (issue #92): no seat state wears violet */
  --success: #059669; --warning: #b45309; --info: #2563eb; --danger-text: oklch(0.505 0.213 27.518);
  --status-success-soft: #ecfdf5; --status-warning-soft: #fffbeb; --status-info-soft: #eff6ff; --status-danger-soft: #fef2f2;
  --shadow-overlay: 0 20px 40px -12px rgba(0,0,0,0.25);
  --well: oklch(0.97 0 0);
  /* The embedded terminal (apps/desktop term/theme.ts): its background, text, sixteen ANSI colours, cursor and selection. */
  --term-bg: oklch(0.99 0 0); --term-fg: oklch(0.22 0 0);
  --term-ansi-0: #24292f; --term-ansi-1: #b91c1c; --term-ansi-2: #047857; --term-ansi-3: #a16207;
  --term-ansi-4: #1d4ed8; --term-ansi-5: #8250df; --term-ansi-6: #1b7c83; --term-ansi-7: #6e7781;
  --term-ansi-8: oklch(0.52 0 0); --term-ansi-9: #a40e26; --term-ansi-10: #1a7f37; --term-ansi-11: #9a6700;
  --term-ansi-12: #0550ae; --term-ansi-13: #6639ba; --term-ansi-14: #136061; --term-ansi-15: #424a53;
  --term-cursor: oklch(0.145 0 0); --term-selection: #0969da33;
  --edge-hot: rgba(0,0,0,.06);
}
:root[data-theme="dark"] {
  --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
  --popover: oklch(0.205 0 0); --popover-foreground: oklch(0.985 0 0);
  --primary: oklch(0.444 0.177 26.899); --primary-foreground: oklch(0.971 0.013 17.38); --primary-hover: oklch(0.396 0.141 25.723);
  --secondary: oklch(0.274 0.006 286.033); --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216); --destructive-foreground: oklch(0.985 0 0);
  --border: #ffffff1a; --input: #ffffff26; --ring: oklch(0.556 0 0);
  --sidebar: oklch(0.205 0 0); --sidebar-foreground: oklch(0.985 0 0); --sidebar-primary: oklch(0.637 0.237 25.331);
  --sidebar-primary-foreground: oklch(0.971 0.013 17.38); --sidebar-accent: oklch(0.269 0 0); --sidebar-accent-foreground: oklch(0.985 0 0);
  --sidebar-border: #ffffff1a; --sidebar-ring: oklch(0.556 0 0);
  --notch: #000;
  --task: #a78bfa;
  --success: #34d399; --warning: #fbbf24; --info: #60a5fa; --danger-text: oklch(0.704 0.191 22.216);
  --status-success-soft: #052e16; --status-warning-soft: #422006; --status-info-soft: #172554; --status-danger-soft: #450a0a;
  --shadow-overlay: 0 20px 40px -12px rgba(0,0,0,0.7);
  --well: oklch(0.145 0 0);
  --term-bg: #0c0c0d; --term-fg: #e5e5e5;
  --term-ansi-0: #484f58; --term-ansi-1: #f87171; --term-ansi-2: #4ade80; --term-ansi-3: #facc15;
  --term-ansi-4: #7cb3fb; --term-ansi-5: #bc8cff; --term-ansi-6: #39c5cf; --term-ansi-7: #b1bac4;
  --term-ansi-8: #8f8f8f; --term-ansi-9: #ffa198; --term-ansi-10: #56d364; --term-ansi-11: #e3b341;
  --term-ansi-12: #79c0ff; --term-ansi-13: #d2a8ff; --term-ansi-14: #56d4dd; --term-ansi-15: #ffffff;
  --term-cursor: oklch(0.985 0 0); --term-selection: #58a6ff40;
  --edge-hot: rgba(255,255,255,.08);
}

/* Mascots (spec section 6). Material follows the theme: Galet (light) / Signal (dark).
   A bot's own data-material wins over the root theme so its theme prop is authoritative. */
@property --bot-shell-top { syntax: '<color>'; inherits: true; initial-value: #f0eee6; }
@property --bot-shell-bottom { syntax: '<color>'; inherits: true; initial-value: #b7b7b0; }
@property --bot-shell-line { syntax: '<color>'; inherits: true; initial-value: #ffffff99; }
@property --bot-visor { syntax: '<color>'; inherits: true; initial-value: #22292b; }
@property --bot-shine { syntax: '<color>'; inherits: true; initial-value: #ffffff77; }
:root, :root[data-theme="light"], [data-material="pebble"] {
  --bot-shell-top: #f0eee6; --bot-shell-bottom: #b7b7b0; --bot-shell-line: #ffffff99; --bot-visor: #22292b;
  --bot-shine: #ffffff77;
}
:root[data-theme="dark"], [data-material="signal"] {
  --bot-shell-top: #34434b; --bot-shell-bottom: #273238; --bot-shell-line: #859397; --bot-visor: #172124;
  --bot-shine: #ffffff00;
}
/* Halo (docs/mockups/mascots-halo.html, "Contour" rendering): a glow in the state's badge colour hugging the
   silhouette. Full strength for a bot that waits or errs, softer for a live bot, none for done or read-only. */
@property --bot-halo-a { syntax: '<number>'; inherits: false; initial-value: 0; }
:root { --bot-halo-alpha: .55; --bot-halo-alpha-soft: .3; --bot-halo-spread: .32; }
:root {
  --bot-visor-line: #00000055; --bot-reflection: #ffffff; --bot-ground: #000000; --bot-readonly-line: #adb3b2;
  --bot-eye-starting: #90c7f2; --bot-eye-working: #90c7f2; --bot-eye-approval: #f2b09c; --bot-eye-question: #f6d487;
  --bot-eye-idle: #a9dfc7; --bot-eye-error: #ffab9f; --bot-eye-done: #a3aaa9;
}

/* Signal / Galet mascots, ported from docs/mockups/prototype/mascot.css and the mascot block of prototype.css.
   Colors come from tokens.css; durations come from inline variables set by Bot (scaled by VITE_LEDGE_MOTION). */

.bot {
  display: block; flex-shrink: 0; overflow: visible;
  transition:
    --bot-shell-top var(--bot-material-ms, 240ms), --bot-shell-bottom var(--bot-material-ms, 240ms),
    --bot-shell-line var(--bot-material-ms, 240ms), --bot-visor var(--bot-material-ms, 240ms),
    --bot-shine var(--bot-material-ms, 240ms), opacity 180ms;
}
.bot .shell-top { stop-color: var(--bot-shell-top); }
.bot .shell-bottom { stop-color: var(--bot-shell-bottom); }

/* Layers */
.bot .body {
  transform-origin: 48px 72px;
  animation: bot-breathe var(--bot-breath, 5.4s) ease-in-out infinite;
  animation-delay: var(--bot-phase, 0s);
}
/* The working hop (spec §6): a 480 ms hop inside a 3.6–4.4 s cycle on the group that wraps the body, so breathing and
   the hop compose. Only data-hop="true" (working, not reduced/read-only/frozen/paused) animates; the simplified crop keeps it. */
.bot .hop { transform-origin: 48px 86px; }
.bot[data-hop="true"] .hop {
  animation: bot-hop var(--bot-hop-cycle, 3.6s) linear infinite;
  animation-delay: var(--bot-phase, 0s);
}
/* Reduced motion keeps the progress signal: the eyes pulse at the running-dot rhythm (not at ≤ 20 px). */
.bot[data-detailed="true"][data-reduced="true"][data-state="working"]:not([data-frozen="true"]):not([data-paused="true"]):not([data-readonly="true"]) .eye-open {
  animation: bot-pulse 1.2s ease-in-out infinite !important;
}
.bot .pose {
  transform-origin: 48px 59px;
  transform: rotate(var(--bot-tilt, 0deg)) translateY(var(--bot-lift, 0px));
  transition: transform var(--bot-pose-ms, 300ms) var(--bot-ease);
}
.bot .gaze {
  transform: translate(var(--bot-gx, 0px), var(--bot-gy, 0px));
  transition: transform var(--bot-gaze-ms, 450ms) var(--bot-ease);
}
.bot .eye-blink { transform-origin: 48px 48px; }
.bot .eye-open, .bot .eye-happy, .bot .eye-error, .bot .eye-sleep {
  transform-origin: 48px 49px;
  transition: opacity var(--bot-eye-ms, 260ms) var(--bot-ease), transform var(--bot-eye-ms, 260ms) var(--bot-ease);
}
.bot .eye-open { fill: var(--bot-eye); }
.bot .eye-happy, .bot .eye-error, .bot .eye-sleep {
  opacity: 0; fill: none; stroke: var(--bot-eye); stroke-width: 3.4; stroke-linecap: round;
}
.bot .visor { fill: var(--bot-visor); stroke: var(--bot-visor-line); stroke-width: 1; }
.bot .shell { stroke: var(--bot-shell-line); stroke-width: .8; transition: stroke-width var(--bot-material-ms, 240ms); }
.bot .shine { fill: none; stroke: var(--bot-shine); stroke-width: 1.25; stroke-linecap: round; }
.bot .reflection { fill: var(--bot-reflection); opacity: .035; }
.bot .ground { fill: var(--bot-ground); opacity: .16; }
.bot .arm {
  fill: var(--bot-shell-bottom); stroke: var(--bot-shell-line); stroke-width: .7;
  transform-origin: 75px 66px; opacity: 0;
  transition: transform var(--bot-pose-ms, 300ms) var(--bot-ease), opacity 180ms;
}

/* Logo-inspired bodies (issue #61). Each harness has its own tint per material; the eyes and the halo keep the
   semantic state colours. A bot without data-tool keeps the neutral tokens. */
.bot .shell { stroke-linejoin: round; }
.bot .cube-top { fill: var(--bot-shine); opacity: .35; }
.bot .cube-side { fill: var(--bot-visor); opacity: .14; }
.bot .cube-edge { fill: none; stroke: var(--bot-shell-line); stroke-width: 1; stroke-linejoin: round; opacity: .3; }
.bot:not(.legacy-bot)[data-tool="claude"][data-material="signal"] { --bot-shell-top: #c78669; --bot-shell-bottom: #8c503d; --bot-shell-line: #e0ab8f; --bot-visor: #33231f; }
.bot:not(.legacy-bot)[data-tool="claude"][data-material="pebble"] { --bot-shell-top: #eab69b; --bot-shell-bottom: #c8876a; --bot-shell-line: #f5d6c4; --bot-visor: #392824; }
.bot:not(.legacy-bot)[data-tool="codex"][data-material="signal"] { --bot-shell-top: #7774ce; --bot-shell-bottom: #40488b; --bot-shell-line: #a9b1ee; --bot-visor: #20243f; }
.bot:not(.legacy-bot)[data-tool="codex"][data-material="pebble"] { --bot-shell-top: #e0dffb; --bot-shell-bottom: #a5a5d8; --bot-shell-line: #eeedff; --bot-visor: #292b48; }
.bot:not(.legacy-bot)[data-tool="cursor"][data-material="signal"] { --bot-shell-top: #656763; --bot-shell-bottom: #343733; --bot-shell-line: #bdc0b9; --bot-visor: #191d1a; }
.bot:not(.legacy-bot)[data-tool="cursor"][data-material="pebble"] { --bot-shell-top: #faf9f3; --bot-shell-bottom: #babcb4; --bot-shell-line: #e3e4dc; --bot-visor: #232824; }
.bot:not(.legacy-bot)[data-tool="omp"][data-material="signal"] { --bot-shell-top: #cf6bbd; --bot-shell-bottom: #6989bc; --bot-shell-line: #dba4df; --bot-visor: #2d213b; }
.bot:not(.legacy-bot)[data-tool="omp"][data-material="pebble"] { --bot-shell-top: #f0bee3; --bot-shell-bottom: #a7c4e5; --bot-shell-line: #f8ddf4; --bot-visor: #34283e; }

/* Material: Signal has a readable outline and no white shine; Galet keeps a light shine and a matte gradient. */
.bot[data-material="signal"] .shell { stroke-width: 1.5; }

/* Expressions */
.bot[data-eyes="wide"] .eye-open { transform: scaleY(1.2); }
.bot[data-eyes="happy"] .eye-open, .bot[data-eyes="error"] .eye-open, .bot[data-eyes="sleep"] .eye-open { opacity: 0; }
.bot[data-eyes="happy"] .eye-happy, .bot[data-eyes="error"] .eye-error, .bot[data-eyes="sleep"] .eye-sleep { opacity: 1; }
/* Logo bots wear no visor: dark eyes sit on the shell and the state colour survives as a glint (and the halo). */
.bot:not(.legacy-bot) .eye-open { fill: var(--bot-visor); }
.bot:not(.legacy-bot) :is(.eye-happy, .eye-error, .eye-sleep) { stroke: var(--bot-visor); }
.bot .eye-glint { fill: var(--bot-eye); transition: opacity var(--bot-eye-ms, 260ms) var(--bot-ease), fill var(--bot-eye-ms, 260ms) var(--bot-ease); }
.bot:is([data-eyes="happy"], [data-eyes="error"], [data-eyes="sleep"]) .eye-glint { opacity: 0; }
.bot[data-eyes="wide"] .eye-glint { transform: translateY(-1px); }
.bot[data-state="approval"] .arm { opacity: 1; transform: rotate(-22deg) translateY(-5px); transition-delay: 180ms; }
.bot[data-state="done"] { opacity: .55; }
.bot[data-state="done"] .body, .bot[data-state="error"] .body { animation: none; }

/* Halo: two drop-shadows in the state colour (the badge's and the handle tick's) hugging the silhouette. Bot sets
   --bot-size inline; the spread is a fraction of it, so the halo scales with the avatar and with the handle's zoom.
   The ground shadow hides under a halo so it does not glow. A waiting bot's halo breathes: 5 s, strength only, offset
   per bot like its breathing. Done, read-only and the `readonly` state carry no halo (data-halo is set by Bot). */
.bot[data-halo="true"] {
  --bot-halo-r: calc(var(--bot-size, 32px) * var(--bot-halo-spread, .32));
  filter:
    drop-shadow(0 0 calc(var(--bot-halo-r) * .35) color-mix(in srgb, var(--bot-halo) calc(var(--bot-halo-a) * 170%), transparent))
    drop-shadow(0 0 calc(var(--bot-halo-r) * .9) color-mix(in srgb, var(--bot-halo) calc(var(--bot-halo-a) * 90%), transparent));
}
.bot[data-halo="true"] .ground { opacity: 0; }
.bot[data-state="approval"], .bot[data-state="error"] { --bot-halo: var(--danger-text); --bot-halo-a: var(--bot-halo-alpha); }
.bot[data-state="question"] { --bot-halo: var(--warning); --bot-halo-a: var(--bot-halo-alpha); }
.bot[data-state="starting"], .bot[data-state="working"] { --bot-halo: var(--info); --bot-halo-a: var(--bot-halo-alpha-soft); }
.bot[data-state="idle"] { --bot-halo: var(--success); --bot-halo-a: var(--bot-halo-alpha-soft); }
.bot[data-halo="true"]:is([data-state="approval"], [data-state="question"]) {
  animation: bot-halo-breathe 5s ease-in-out infinite;
  animation-delay: var(--bot-phase, 0s);
}

/* Modifiers: read-only (dashed outline), frozen (connection lost), simplified (≤20 px head crop) */
.bot[data-readonly="true"] { opacity: .6; }
.bot[data-readonly="true"] .shell { stroke: var(--bot-readonly-line); stroke-width: 1.3; stroke-dasharray: 3 3; }
.bot[data-readonly="true"] .body { animation: none; }
.bot[data-frozen="true"] { opacity: .5; }
.bot[data-frozen="true"], .bot[data-frozen="true"] * { animation-play-state: paused !important; }
/* Inactive (inert) layers and explicitly paused views hold every loop in place, like the prototype's .paused rule. */
[inert] .bot, [inert] .bot *, .bot[data-paused="true"], .bot[data-paused="true"] * { animation-play-state: paused !important; }
.bot[data-simplified="true"] :is(.arm, .shine, .ground, .cube-edge) { display: none; }
.bot[data-simplified="true"] .eye-open { transform: scale(1.1); }
.bot[data-simplified="true"] .body { animation: none; }

/* Gestures, set by useBotMotion */
.bot[data-blink="true"] .eye-blink { animation: bot-blink var(--bot-blink-ms, 180ms) ease-in-out; }
.bot[data-gesture="ask"] .arm { animation: bot-ask var(--bot-ask-ms, 850ms) var(--bot-ease); }
.bot[data-gesture="nod"] .pose { animation: bot-nod var(--bot-nod-ms, 650ms) var(--bot-ease); }

/* Reduced motion: app preference / VITE_LEDGE_MOTION=0 (data-reduced) and the OS preference */
.bot[data-reduced="true"], .bot[data-reduced="true"] * { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .bot, .bot * { animation: none !important; transition: none !important; }
}

/* Respiration 4.8–6.4 s: 0.7 SVG unit up, ±0.3°, 1.4 % vertical stretch */
@keyframes bot-breathe {
  0%, 100% { transform: translateY(0) rotate(-.3deg) scaleY(1); }
  50% { transform: translateY(-.7px) rotate(.3deg) scaleY(1.014); }
}
/* 480 ms of a 3.6 s cycle = 13.3 %: anticipation squash, rise with stretch, land with squash, settle, then still. */
@keyframes bot-hop {
  0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-in; }
  1.9% { transform: translateY(0) scale(1.06, .92); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  5.9% { transform: translateY(calc(var(--bot-hop, 8px) * -1)) scale(.96, 1.06); animation-timing-function: cubic-bezier(.6, 0, .9, .4); }
  9.3% { transform: translateY(0) scale(1.05, .95); animation-timing-function: ease-out; }
  11.5% { transform: translateY(0) scale(.99, 1.01); }
  13.3%, 100% { transform: translateY(0) scale(1, 1); }
}
@keyframes bot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes bot-blink { 0%, 100% { transform: scaleY(1); } 45%, 60% { transform: scaleY(.08); } }
@keyframes bot-halo-breathe { 0%, 100% { --bot-halo-a: var(--bot-halo-alpha, .55); } 50% { --bot-halo-a: calc(var(--bot-halo-alpha, .55) * .7); } }
@keyframes bot-nod {
  0%, 100% { transform: rotate(var(--bot-tilt, 0deg)) translateY(var(--bot-lift, 0px)); }
  35% { transform: translateY(3px) rotate(5deg); }
  65% { transform: translateY(-1px) rotate(-2deg); }
}
@keyframes bot-ask {
  0%, 100% { transform: rotate(-22deg) translateY(-5px); }
  35% { transform: rotate(-42deg) translateY(-7px); }
  65% { transform: rotate(-16deg) translateY(-5px); }
}

/* Persistent layers compose transitions, tool signatures and interaction. */
.bot :is(.arrival, .signature, .touch) { transform-origin: 48px 70px; }
.bot .ground { transform-origin: 48px 90px; }
.bot[data-tool="claude"] { --bot-roll-pre: 0deg; --bot-roll-top: 0deg; --bot-roll-land: 5deg; }
.bot[data-tool="codex"] { --bot-roll-pre: -4deg; --bot-roll-top: 5deg; --bot-roll-land: 2deg; }
.bot[data-tool="cursor"] { --bot-roll-pre: -2deg; --bot-roll-top: 7deg; --bot-roll-land: 2deg; }
.bot[data-tool="omp"] { --bot-roll-pre: -2deg; --bot-roll-top: 2deg; --bot-roll-land: -2deg; }
.bot[data-detailed="true"][data-hop="true"] .signature,
.bot[data-detailed="true"][data-hop="true"][data-halo="false"] .ground {
  animation-duration: var(--bot-hop-cycle, 3.6s);
  animation-delay: var(--bot-phase, 0s);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.bot[data-detailed="true"][data-hop="true"] .signature { animation-name: bot-signature; }
.bot[data-detailed="true"][data-hop="true"][data-halo="false"] .ground { animation-name: bot-shadow; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .hop { animation: none; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .arrival { transform-origin: 48px 86px; animation: bot-entry-hop var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .signature { animation: bot-entry-signature var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"][data-halo="false"] .ground { animation: bot-entry-shadow var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-transition="question"] .arrival { animation: bot-question var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="question"] .gaze { animation: bot-question-gaze var(--bot-question-ms, 650ms) var(--bot-ease); }
.bot[data-transition="idle"] .arrival { animation: bot-idle-arrival var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="error"] .arrival { animation: bot-recoil var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="done"] .eye-blink { animation: bot-close var(--bot-arrival-ms, 500ms) ease-in-out; }
.bot[data-transition="done"] .eye-open { animation: bot-close-open var(--bot-arrival-ms, 500ms) linear; }
.bot[data-transition="done"] .eye-sleep { animation: bot-close-sleep var(--bot-arrival-ms, 500ms) linear; }
.bot[data-transition="done"] .arrival { animation: bot-settle var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-touch="true"] .touch { animation: bot-touch var(--bot-touch-ms, 360ms) var(--bot-ease); }

/* Native controls (radios, checkboxes, scrollbars) follow the theme inside the overlay's own boxes only: on the root it
   would paint the transparent window's canvas. */
:root[data-theme="dark"] [data-surface], :root[data-theme="dark"] [data-coachmark] { color-scheme: dark; }
:root[data-theme="light"] [data-surface], :root[data-theme="light"] [data-coachmark] { color-scheme: light; }
html, body, #root { margin: 0; height: 100%; background: transparent; }
body { font-family: 'Geist', system-ui, sans-serif; color: var(--sidebar-foreground); font-size: 14px; line-height: 20px; overflow: hidden; }
/* The page never scrolls: a fixed, clipping root adds nothing to the document's scrollable overflow, so a control taking
   focus while the native window is still at the island's height (a keyboard open grows it after the first paint) scrolls
   only its own list, never the page out of the window's top. A hidden body alone still scrolls programmatically. */
#root { position: fixed; inset: 0; overflow: clip; }
.mono { font-family: 'Geist Mono', ui-monospace, monospace; }
button, input { font-family: inherit; }
/* The bubble countdown drains from the controller's remainder (--ledge-from) to empty. */
/* The update card's running step, and the island's busy pip. */
@keyframes ledge-spin { to { transform: rotate(360deg) } }
@keyframes ledge-pulse { 50% { opacity: .35 } }
/* The live tool line's outcome mark (src/surface/LiveToolLine.tsx) pops in where the spinner was. */
@keyframes ledge-mark-in { from { transform: scale(.4); opacity: 0 } }
.ledge-spin { animation: ledge-spin .9s linear infinite }
@media (prefers-reduced-motion: reduce) { .ledge-spin { animation: none } }
@keyframes ledge-drain { from { width: var(--ledge-from, 100%) } to { width: 0% } }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.dnd-switch:has(input:focus-visible) .dnd-track, .ledge-seg:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.ledge-opt:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
/* Text fields (launch form, reply): no focus ring, the caret shows where you type. */
.ledge-field:focus, .ledge-field:focus-visible { outline: none; }
/* Buttons: variant colors, hover and disabled states (tokens only). */
.ledge-btn { cursor: pointer; border: 1px solid transparent; }
.ledge-btn[data-variant="primary"] { background: var(--primary); color: var(--primary-foreground); }
.ledge-btn[data-variant="outline"] { background: transparent; color: var(--sidebar-foreground); border-color: var(--input); }
.ledge-btn[data-variant="ghost"] { background: transparent; color: var(--muted-foreground); }
.ledge-btn[data-variant="secondary"] { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
.ledge-btn[data-variant="primary"]:hover:not(:disabled) { background: var(--primary-hover); }
.ledge-btn[data-variant="outline"]:hover:not(:disabled),
.ledge-btn[data-variant="ghost"]:hover:not(:disabled) { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.ledge-btn[data-variant="secondary"]:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
button:disabled { opacity: .5; cursor: not-allowed; }
/* Thin, token-coloured scrollbars on every scrolling area (list, session content, terminal preview, settings, help):
   a muted thumb on a transparent track, as in the mockup's views. */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted-foreground) 45%, transparent) transparent; }
/* A text toggle (the list footer's do-not-disturb). */
.ledge-text-btn:hover { color: var(--sidebar-foreground) !important; }
.ledge-text-btn[aria-pressed="true"]:hover { color: var(--sidebar-primary) !important; }
/* Question options: radio cards, the chosen one with a red border, a red tint and a red radio. */
.ledge-opt input[type="radio"], .ledge-check input[type="checkbox"] { accent-color: var(--sidebar-primary); }
.ledge-opt[data-checked] { border-color: var(--sidebar-primary) !important; background-color: color-mix(in srgb, var(--sidebar-primary) 8%, transparent) !important; }
textarea::placeholder, .ledge-field::placeholder { color: var(--muted-foreground); }
/* The launch form's recent folders: rows that light up on hover like list rows. */
.ledge-recent:hover { background: var(--sidebar-accent) !important; }
/* The session's terminal strip (src/surface/TerminalBand.tsx): its dot breathes while the agent works. */
.ledge-band:hover { filter: brightness(1.15); }
.ledge-band-live { animation: ledge-pulse 1.6s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { .ledge-band-live { animation: none } }
/* A row's remove button shows on hover or keyboard focus of the row only (it stays in the tab order). */
.ledge-row .ledge-row-dismiss { opacity: 0; transition: opacity 120ms ease; }
.ledge-row:hover .ledge-row-dismiss, .ledge-row:focus-within .ledge-row-dismiss { opacity: 1; }

/* The notch-activity mockup: a scrolling page (base.css pins the overlay root), small desks, the notch on top of each. */
html, body { height: auto; min-height: 100%; }
body { overflow: auto; background: var(--background); color: var(--foreground); }
#root { position: static; overflow: visible; }

/* Each desk carries its own theme so light and dark sit side by side (values from packages/ui tokens.css). */
.th-light { --notch: #fff; --foreground: oklch(0.145 0 0); --muted-foreground: oklch(0.556 0 0); --sidebar-border: oklch(0.922 0 0);
  --sidebar-accent: oklch(0.97 0 0); --sidebar-primary: oklch(0.577 0.245 27.325); --task: #7c3aed; --success: #059669; --warning: #b45309;
  --info: #2563eb; --danger-text: oklch(0.505 0.213 27.518); --na-desk: #cfd6de; --na-desk-2: radial-gradient(120% 90% at 20% 110%, #e9c9c3 0%, transparent 60%), radial-gradient(90% 80% at 90% 0%, #b9cfdc 0%, transparent 65%);
  --na-ctl-hover: oklch(0.95 0 0); color: var(--foreground); }
.th-dark { --notch: #000; --foreground: oklch(0.985 0 0); --muted-foreground: oklch(0.708 0 0); --sidebar-border: #ffffff1a;
  --sidebar-accent: oklch(0.269 0 0); --sidebar-primary: oklch(0.637 0.237 25.331); --task: #a78bfa; --success: #34d399; --warning: #fbbf24;
  --info: #60a5fa; --danger-text: oklch(0.704 0.191 22.216); --na-desk: #141821; --na-desk-2: radial-gradient(120% 90% at 20% 110%, #3b2a4a 0%, transparent 60%), radial-gradient(90% 80% at 90% 0%, #1f3b4d 0%, transparent 65%);
  --na-ctl-hover: #1d1e21; color: var(--foreground); }

/* ---- page ---- */
.na-page { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 44px; box-sizing: border-box; }
.na-top { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.na-top > div:first-child { flex: 1 1 520px; min-width: 0; }
.na-top h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.na-top p { margin: 6px 0 0; color: var(--muted-foreground); max-width: 72ch; }
.na-section { display: grid; gap: 16px; }
.na-section > header h2 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }
.na-section > header p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 13.5px; max-width: 80ch; }
.na-small { margin: 0; color: var(--muted-foreground); font-size: 13px; max-width: 90ch; }
.na-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.na-chip { padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--card-foreground); font: 500 13px var(--font-sans, inherit); cursor: pointer; }
.na-chip:hover { background: var(--accent); }
.na-chip[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.na-chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.na-tag { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted-foreground); }

.na-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 22px 20px; }
.na-pair { margin: 0; display: grid; gap: 8px; min-width: 0; }
.na-pair-row { display: grid; grid-template-columns: 1fr; gap: 6px; }
.na-pair figcaption, .na-frame figcaption { display: grid; gap: 2px; font-size: 13px; color: var(--muted-foreground); }
.na-pair figcaption strong { color: var(--foreground); font-weight: 600; font-size: 14px; }

/* ---- desks ---- */
.na-desk { position: relative; display: flex; justify-content: center; height: 72px; border-radius: 0 0 10px 10px; overflow: hidden; background: var(--na-desk-2), var(--na-desk); }
.na-desk[data-tall] { height: 230px; border-radius: 0 0 12px 12px; }
.na-desk-label { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted-foreground); }
.na-live { display: grid; gap: 14px; }
.na-live-hint { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; font-size: 12.5px; color: var(--muted-foreground); }
.na-controls { display: grid; gap: 10px; }
.na-log { margin: 0; padding: 0 0 0 18px; color: var(--muted-foreground); font-size: 12.5px; font-family: 'Geist Mono', ui-monospace, monospace; min-height: 90px; }
.na-log li:first-child { color: var(--foreground); }

/* ---- the notch ---- */
.na-holder { position: relative; display: flex; justify-content: center; align-self: flex-start; }
.na-notch { position: relative; display: flex; align-items: center; background: var(--notch); color: var(--foreground); box-sizing: border-box; max-width: 640px; font-size: 13px; line-height: 18px;
  transition: height .22s cubic-bezier(.2,.8,.2,1), border-radius .22s, padding .22s; }
.na-notch[data-mode="filet"] { height: 10px; padding: 0 6px; border-radius: 0 0 5px 5px; gap: 4px; }
.na-notch[data-mode="mini"] { height: 30px; padding: 0 8px 0 10px; border-radius: 0 0 14px 14px; gap: 10px; }
.na-notch[data-mode="awake"] { height: 38px; padding: 0 12px; border-radius: 0 0 19px 19px; }
.na-ledge { display: block; flex: none; width: 9px; height: 3px; border-radius: 1px; background: var(--sidebar-primary); }
.na-ledge[data-pending="permission"] { background: var(--danger-text); box-shadow: 0 0 0 2px color-mix(in srgb, var(--danger-text) 25%, transparent); }
.na-ledge[data-pending="question"] { background: var(--warning); box-shadow: 0 0 0 2px color-mix(in srgb, var(--warning) 25%, transparent); }
.na-eq { display: flex; align-items: flex-end; gap: 1px; height: 4px; }
.na-eq i { display: block; width: 1px; background: var(--muted-foreground); border-radius: 1px; }
.na-eq i:nth-child(1) { height: 2px; } .na-eq i:nth-child(2) { height: 4px; } .na-eq i:nth-child(3) { height: 3px; }
.na-resident { display: grid; place-items: center; flex: none; width: 22px; height: 22px; }

.na-line-btn { min-width: 0; flex: 0 1 auto; max-width: 420px; margin-left: 10px; padding: 0 4px; height: 26px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.na-line-btn:hover { background: var(--sidebar-accent); }
.na-line-btn:focus-visible, .na-cover-btn:focus-visible, .na-ctl:focus-visible { outline: 2px solid var(--sidebar-primary); outline-offset: 1px; }
.na-line-empty { display: block; width: 0; }
.na-line { display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; }
.na-line[data-aged] { opacity: .62; }
.na-glyph { display: grid; place-items: center; flex: none; width: 14px; height: 14px; }
.na-words { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted-foreground); }
.na-words > * { margin-right: 5px; }
.na-words > *:last-child { margin-right: 0; }
.na-words b { color: var(--foreground); font-weight: 600; }
.na-words .na-text { color: var(--foreground); }
.na-line[data-kind="tool"] .na-words .na-text, .na-line[data-kind="thinking"] .na-words .na-text { color: var(--muted-foreground); }
.na-words code { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: var(--foreground); }
.na-arrow { color: var(--task); }
.na-sub { color: var(--muted-foreground); font-size: 12px; }
.na-age { flex: none; font-size: 11.5px; color: var(--muted-foreground); }
.na-spin { font: 13px/14px 'Geist Mono', ui-monospace, monospace; }
.na-dots { display: flex; gap: 2px; }
.na-dots i { width: 3px; height: 3px; border-radius: 50%; background: var(--muted-foreground); animation: na-dot 1.4s ease-in-out infinite; }
.na-dots i:nth-child(2) { animation-delay: .2s; } .na-dots i:nth-child(3) { animation-delay: .4s; }
.na-dots[data-still] i { animation: none; opacity: .8; }
@keyframes na-dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

.na-sep { display: block; flex: none; width: 1px; height: 16px; margin: 0 10px 0 12px; background: var(--sidebar-border); }
.na-music { display: flex; align-items: center; flex: none; }
.na-cover-btn { display: grid; place-items: center; flex: none; padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
.na-cover { position: relative; display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 5px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 10%, transparent); transition: filter .2s; }
.na-cover[data-empty] { background: var(--sidebar-accent); color: var(--muted-foreground); }
.na-cover[data-paused] { filter: grayscale(.85) brightness(.75); }
.na-cover[data-pulse] { animation: na-pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes na-pop { 0% { transform: scale(.82); } 100% { transform: scale(1); } }
.na-pz { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 2.5px; }
.na-pz i { width: 2.5px; height: 9px; border-radius: 1px; background: #fff; }
.na-notch[data-mode="mini"] .na-cover { width: 20px; height: 20px; border-radius: 4px; }

.na-titles { display: grid; max-width: 0; overflow: hidden; opacity: 0; white-space: nowrap; line-height: 15px; transition: max-width .18s ease, opacity .14s, margin .18s; }
.na-titles b { font-size: 12.5px; font-weight: 600; color: var(--foreground); overflow: hidden; text-overflow: ellipsis; }
.na-titles span { font-size: 11.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; }
.na-titles em { font-style: normal; }
.na-ctls { display: flex; align-items: center; gap: 2px; }
.na-ctl { display: grid; place-items: center; flex: none; width: 0; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); cursor: pointer; opacity: 0; overflow: hidden; transition: width .18s ease, opacity .14s, background-color .12s; }
.na-ctl svg { width: 15px; height: 15px; }
.na-ctl:hover { background: var(--na-ctl-hover); }
.na-ctl[aria-disabled] { cursor: default; color: var(--muted-foreground); }
.na-ctl[aria-disabled]:hover { background: transparent; }
.na-music[data-open] .na-titles { max-width: 168px; opacity: 1; margin: 0 8px 0 8px; }
.na-music[data-open] .na-ctl { width: 28px; opacity: 1; }
.na-music[data-open] .na-ctl[aria-disabled] { opacity: .35; }

.na-notch:has(.na-music[data-open]) .na-line-btn { max-width: 220px; }

/* ---- anatomy, frames, tables ---- */
.na-anatomy { margin: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.na-anatomy ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13.5px; color: var(--muted-foreground); }
.na-anatomy b { color: var(--foreground); font-weight: 600; }
.na-frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px 20px; }
.na-frame { margin: 0; display: grid; gap: 6px; }
.na-frame figcaption { grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.na-rules, .na-keys { width: 100%; border-collapse: collapse; font-size: 13px; }
.na-rules th, .na-rules td, .na-keys th, .na-keys td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.na-rules thead th, .na-keys thead th { color: var(--muted-foreground); font-weight: 500; }
.na-rules tbody th { font-weight: 600; white-space: nowrap; }
.na-rules td { color: var(--muted-foreground); }
.na-keys code { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; }
.na-section:has(.na-keys), .na-section:has(.na-rules) { overflow-x: auto; }
.na-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 13.5px; color: var(--muted-foreground); max-width: 92ch; }
.na-list b { color: var(--foreground); font-weight: 600; }
.na-questions { margin: 0; padding-left: 22px; display: grid; gap: 14px; max-width: 92ch; }
.na-questions b { font-weight: 600; }
.na-questions p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted-foreground); }
.na-questions .na-reco { color: var(--foreground); font-weight: 600; }

@media (max-width: 760px) {
  .na-anatomy { grid-template-columns: 1fr; }
  .na-desk { height: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  .na-dots i, .na-cover[data-pulse] { animation: none; }
  .na-notch, .na-ctl, .na-titles { transition: none; }
}
