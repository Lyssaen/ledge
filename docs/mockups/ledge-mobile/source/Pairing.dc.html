<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Appairer le téléphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.scroll{overflow-y:auto;min-height:0;overscroll-behavior:contain;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
a{color:#fafafa;text-decoration:none}a:hover{color:#fff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.bot .shell{fill:url(#sig);stroke:#859397;stroke-width:.8}.bot .visor{fill:#172124;stroke:#00000055;stroke-width:1}.bot .foot{fill:#273238}.bot .ant{stroke:#273238;stroke-width:2;stroke-linecap:round}.bot .lamp,.bot .eye{fill:var(--eye)}
.digit{width:44px;height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #ffffff26;background:#0a0a0a;color:#fafafa;font:500 20px/24px 'Geist Mono',ui-monospace,monospace;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 16px;border-radius:10px;font:600 15px/20px 'Geist',system-ui,sans-serif;box-sizing:border-box;cursor:pointer}
.btn-primary{background:#9f0712;color:#fef2f2;border:0}
</style>
</helmet>
<div style="width: 390px; height: 100vh; max-height: 844px; box-sizing: border-box; background: #000; color: #fafafa; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 20px; padding: 64px 20px 34px; overflow-y: auto; scrollbar-width: none;">
  <svg width="0" height="0" style="position: absolute;" aria-hidden="true"><defs><linearGradient id="sig" x1=".2" y1="0" x2=".75" y2="1"><stop stop-color="#34434b"></stop><stop offset="1" stop-color="#273238"></stop></linearGradient></defs></svg>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
    <svg class="bot" width="64" height="64" viewBox="0 0 96 96" aria-hidden="true" style="--eye: #90c7f2;"><path class="ant" d="M49 22V14"></path><circle class="lamp" cx="49" cy="12" r="3"></circle><rect class="foot" x="29" y="75" width="13" height="8" rx="4"></rect><rect class="foot" x="54" y="75" width="13" height="8" rx="4"></rect><rect class="shell" x="15" y="22" width="66" height="56" rx="20"></rect><rect class="visor" x="25" y="35" width="47" height="29" rx="13"></rect><rect class="eye" x="36" y="43" width="6" height="12" rx="3"></rect><rect class="eye" x="55" y="43" width="6" height="12" rx="3"></rect></svg>
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.025em;">Appairer ce téléphone</h1>
    <p style="margin: 0; color: #a1a1a1; max-width: 300px;">Sur le PC, ouvrez Réglages › Mobile dans Ledge, puis scannez le code affiché.</p>
  </div>

  <div role="img" aria-label="Viseur de la caméra" style="position: relative; height: 280px; border-radius: 16px; background: #0a0a0a; border: 1px solid #ffffff1a; display: grid; place-items: center;">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 180px; height: 180px; fill: none; stroke: #fafafa; stroke-width: 0.6; stroke-linecap: round;"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path></svg>
    <span style="position: absolute; bottom: 14px; font-size: 12px; color: #a1a1a1;">Caméra</span>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; color: #a1a1a1; font-size: 12px;">
    <span style="flex-grow: 1; height: 1px; background: #ffffff1a;"></span>ou saisir le code<span style="flex-grow: 1; height: 1px; background: #ffffff1a;"></span>
  </div>

  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; justify-content: center; gap: 8px;">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Code à six chiffres</legend>
    <input class="digit" type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Chiffre 1">
    <input class="digit" type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Chiffre 2">
    <input class="digit" type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Chiffre 3">
    <input class="digit" type="text" inputmode="numeric" maxlength="1" value="" aria-label="Chiffre 4">
    <input class="digit" type="text" inputmode="numeric" maxlength="1" value="" aria-label="Chiffre 5">
    <input class="digit" type="text" inputmode="numeric" maxlength="1" value="" aria-label="Chiffre 6">
  </fieldset>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid #ffffff1a; background: #0a0a0a; color: #a1a1a1; font-size: 13px; line-height: 18px;">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin-top: 1px; color: #fafafa;"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    <span>La connexion passe par votre réseau Tailscale. Rien n'est exposé sur internet, et vous pouvez retirer ce téléphone depuis le PC.</span>
  </div>
  <button type="button" class="btn btn-primary" style="width: 100%;">Appairer</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
