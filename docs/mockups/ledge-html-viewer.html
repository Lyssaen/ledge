/* Mascots (spec section 6). Material follows the theme: Galet (light) / Signal (dark).
   A bot's own data-material wins over the root theme so its theme prop is authoritative. */
@property --bot-shell-top { syntax: '<color>'; inherits: true; initial-value: #f0eee6; }
@property --bot-shell-bottom { syntax: '<color>'; inherits: true; initial-value: #b7b7b0; }
@property --bot-shell-line { syntax: '<color>'; inherits: true; initial-value: #ffffff99; }
@property --bot-visor { syntax: '<color>'; inherits: true; initial-value: #22292b; }
@property --bot-shine { syntax: '<color>'; inherits: true; initial-value: #ffffff77; }
:root, :root[data-theme="light"], [data-material="pebble"] {
  --bot-shell-top: #f0eee6; --bot-shell-bottom: #b7b7b0; --bot-shell-line: #ffffff99; --bot-visor: #22292b;
  --bot-shine: #ffffff77;
}
:root[data-theme="dark"], [data-material="signal"] {
  --bot-shell-top: #34434b; --bot-shell-bottom: #273238; --bot-shell-line: #859397; --bot-visor: #172124;
  --bot-shine: #ffffff00;
}
/* Halo (docs/mockups/mascots-halo.html, "Contour" rendering): a glow in the state's badge colour hugging the
   silhouette. Full strength for a bot that waits or errs, softer for a live bot, none for done or read-only. */
@property --bot-halo-a { syntax: '<number>'; inherits: false; initial-value: 0; }
:root { --bot-halo-alpha: .55; --bot-halo-alpha-soft: .3; --bot-halo-spread: .32; }
:root {
  --bot-visor-line: #00000055; --bot-reflection: #ffffff; --bot-ground: #000000; --bot-readonly-line: #adb3b2;
  --bot-eye-starting: #90c7f2; --bot-eye-working: #90c7f2; --bot-eye-approval: #f2b09c; --bot-eye-question: #f6d487;
  --bot-eye-idle: #a9dfc7; --bot-eye-error: #ffab9f; --bot-eye-done: #a3aaa9;
}




/* Native controls (radios, checkboxes, scrollbars) follow the theme inside the overlay's own boxes only: on the root it
   would paint the transparent window's canvas. */
:root[data-theme="dark"] [data-surface], :root[data-theme="dark"] [data-coachmark] { color-scheme: dark; }
:root[data-theme="light"] [data-surface], :root[data-theme="light"] [data-coachmark] { color-scheme: light; }
html, body, #root { margin: 0; height: 100%; background: transparent; }
body { font-family: 'Geist', system-ui, sans-serif; color: var(--sidebar-foreground); font-size: 14px; line-height: 20px; overflow: hidden; }
/* The page never scrolls: a fixed, clipping root adds nothing to the document's scrollable overflow, so a control taking
   focus while the native window is still at the island's height (a keyboard open grows it after the first paint) scrolls
   only its own list, never the page out of the window's top. A hidden body alone still scrolls programmatically. */
#root { position: fixed; inset: 0; overflow: clip; }
.mono { font-family: 'Geist Mono', ui-monospace, monospace; }
button, input { font-family: inherit; }
/* The bubble countdown drains from the controller's remainder (--ledge-from) to empty. */
/* The update card's running step, and the island's busy pip. */
@keyframes ledge-spin { to { transform: rotate(360deg) } }
@keyframes ledge-pulse { 50% { opacity: .35 } }
/* The live tool line's outcome mark (src/surface/LiveToolLine.tsx) pops in where the spinner was. */
@keyframes ledge-mark-in { from { transform: scale(.4); opacity: 0 } }
.ledge-spin { animation: ledge-spin .9s linear infinite }
@media (prefers-reduced-motion: reduce) { .ledge-spin { animation: none } }
@keyframes ledge-drain { from { width: var(--ledge-from, 100%) } to { width: 0% } }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.dnd-switch:has(input:focus-visible) .dnd-track, .ledge-seg:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.ledge-opt:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
/* Text fields (launch form, reply): no focus ring, the caret shows where you type. */
.ledge-field:focus, .ledge-field:focus-visible { outline: none; }
/* Buttons: variant colors, hover and disabled states (tokens only). */
.ledge-btn { cursor: pointer; border: 1px solid transparent; }
.ledge-btn[data-variant="primary"] { background: var(--primary); color: var(--primary-foreground); }
.ledge-btn[data-variant="outline"] { background: transparent; color: var(--sidebar-foreground); border-color: var(--input); }
.ledge-btn[data-variant="ghost"] { background: transparent; color: var(--muted-foreground); }
.ledge-btn[data-variant="secondary"] { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
.ledge-btn[data-variant="primary"]:hover:not(:disabled) { background: var(--primary-hover); }
.ledge-btn[data-variant="outline"]:hover:not(:disabled),
.ledge-btn[data-variant="ghost"]:hover:not(:disabled) { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.ledge-btn[data-variant="secondary"]:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
button:disabled { opacity: .5; cursor: not-allowed; }
/* Thin, token-coloured scrollbars on every scrolling area (list, session content, terminal preview, settings, help):
   a muted thumb on a transparent track, as in the mockup's views. */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted-foreground) 45%, transparent) transparent; }
/* A text toggle (the list footer's do-not-disturb). */
.ledge-text-btn:hover { color: var(--sidebar-foreground) !important; }
.ledge-text-btn[aria-pressed="true"]:hover { color: var(--sidebar-primary) !important; }
/* Question options: radio cards, the chosen one with a red border, a red tint and a red radio. */
.ledge-opt input[type="radio"], .ledge-check input[type="checkbox"] { accent-color: var(--sidebar-primary); }
.ledge-opt[data-checked] { border-color: var(--sidebar-primary) !important; background-color: color-mix(in srgb, var(--sidebar-primary) 8%, transparent) !important; }
textarea::placeholder, .ledge-field::placeholder { color: var(--muted-foreground); }
/* The launch form's recent folders: rows that light up on hover like list rows. */
.ledge-recent:hover { background: var(--sidebar-accent) !important; }
/* The session's terminal strip (src/surface/TerminalBand.tsx): its dot breathes while the agent works. */
.ledge-band:hover { filter: brightness(1.15); }
.ledge-band-live { animation: ledge-pulse 1.6s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { .ledge-band-live { animation: none } }
/* A row's remove button shows on hover or keyboard focus of the row only (it stays in the tab order). */
.ledge-row .ledge-row-dismiss { opacity: 0; transition: opacity 120ms ease; }
.ledge-row:hover .ledge-row-dismiss, .ledge-row:focus-within .ledge-row-dismiss { opacity: 1; }

/* The session page (docs/mockups/desktop-observatory/session.css, ported whole): the thread's rail (issue #34, track B of
   https://claude.ai/artifact/XKxXpf68zvDLp9x1VGXi43), Modifications, the side pane, plans, the task list, the pinned request
   and the reply. Tokens only, both themes. Deliberate departures from the mockups:
   - a rail node masks the line with the conversation's background (--sidebar), so its tints are mixed opaque with it;
   - « Voir » under 600 px comes from the link's data-short attribute (translated), not from a French string in the CSS. */

/* The session place (observatory.css: .conversation-workspace, .conversation, .pane-heading, .messages, the terminal; office.css:
   the « N sous-agents » pill, .pane-meta). Departure: no rail of the project's agents on the left, the sidebar tree has them.
   First, so the session's own rules below win as in the mockup. The mockup's !important (office.css over observatory.css)
   is not needed: the grid is declared once, here. The right panel's column (Fil | Terminal v3: Modifications and shells) is
   --term-width of the place (Workspace), its handle in a zero-wide track on the page's border. Enlarged, the panel takes the
   whole width under the page's heading, which stays (its Fil | Terminal switch): the page lends the grid its heading alone. */
.conversation-workspace{display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-height:0}
.conversation-workspace.with-terminal{grid-template-columns:minmax(0,1fr) 0 minmax(0,calc(var(--term-width) * 100%))}
.conversation-workspace.term-maxed{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.term-maxed>.conversation{display:contents}
.term-maxed>.conversation>:not(.pane-heading){display:none}
.term-maxed>.conversation>.pane-heading{background:var(--sidebar)}
.term-handle{width:7px;margin-left:-4px;z-index:4;cursor:col-resize;position:relative;outline:none}
.term-handle:after{content:'';position:absolute;inset:0 3px;transition:background .15s}
.term-handle:hover:after,.term-handle:focus-visible:after,.term-handle:active:after{background:var(--ring)}
.conversation,.right-panel,.agent-view{min-width:0;min-height:0;display:flex;flex-direction:column}
.conversation{border-right:1px solid var(--border);background:var(--sidebar)}
.pane-heading{height:43px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 20px;font-size:12px}
.pane-heading>.muted{font-size:10px}
.messages{overflow:auto;padding:24px;flex:1}
.pane-meta{margin-left:10px;font-size:10px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.right-panel{background:var(--background)}
/* The Terminal view: the agent's screen alone, full frame under the switch (Fil | Terminal v3). */
.agent-view{flex:1;background:var(--well)}
.agent-native{flex:1;display:grid;place-items:center;background:var(--term-bg)}
.agent-native>div{max-width:440px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;font-size:13px;color:var(--muted-foreground)}
.agent-native strong{color:var(--foreground);font-weight:500}
.terminal-footer .footkey{color:var(--foreground)}
/* The panel's « ± Modifications »: today's Changes view, in its narrow layout (the panel is under 640 px). */
.panel-changes{flex:1;min-height:0;display:flex;flex-direction:column}
.panel-changes>.changes-view,.panel-changes>.changes-empty{flex:1;min-height:0}
/* The mockup keeps « Copier le chemin » spelled out in the panel (its narrow layout otherwise keeps the icon alone). */
.panel-changes .file-actions .ledge-btn[data-variant=ghost]{font-size:12px!important;gap:6px!important;width:auto;padding:0 8px!important}
/* The keyboard in the agent's screen: a blue outline (the mockup's .screen.focused). */
.agent-view .terminal-screen:focus-within{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--info) 55%,transparent)}
.terminal-content{padding:18px 20px;flex:1;overflow:auto;font-size:11px;line-height:21px}
.terminal-content>.muted:first-child{font-size:10px}
.terminal-output{white-space:pre-wrap;overflow-wrap:anywhere;margin:25px 0}
.terminal-content>.terminal-output:first-child{margin-top:0}
.terminal-footer{border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted-foreground)}
/* The embedded terminal (the mockup's TermPane): tabs in the heading, a banner under it, the xterm in the body. */
.pane-heading.term-heading{gap:4px;padding:0 8px 0 0}
.term-title{display:flex;align-items:center;gap:8px;padding-left:20px}
.term-tabs{display:flex;align-items:stretch;align-self:stretch;min-width:0;overflow-x:auto}
.term-tab{display:flex;align-items:center;max-width:220px;border-right:1px solid var(--border);color:var(--muted-foreground)}
.term-tab>button:first-child{display:flex;align-items:center;gap:6px;min-width:0;height:100%;padding:0 10px 0 14px;font-size:12px}
.term-tab>button:first-child span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-tab.current{background:var(--term-bg);color:var(--foreground);box-shadow:inset 0 -2px 0 var(--ring)}
.term-tab:hover{color:var(--foreground)}
.term-add{display:inline-flex;align-items:center;justify-content:center;width:32px;color:var(--muted-foreground)}
.term-add:hover{color:var(--foreground);background:var(--sidebar-accent)}
.term-chip{font-size:10px;padding:2px 7px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted-foreground);white-space:nowrap}
.term-heading .term-icon{width:28px!important;height:28px!important;color:var(--muted-foreground)}
.term-banner{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 20px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--secondary) 70%,transparent);font-size:12px;line-height:18px;flex-shrink:0}
.term-banner>span{flex:1;min-width:0}
.term-banner.warn{background:var(--status-warning-soft);border-bottom-color:color-mix(in srgb,var(--warning) 35%,var(--border))}
.term-banner.info{background:var(--status-info-soft);border-bottom-color:color-mix(in srgb,var(--info) 35%,var(--border))}
.term-banner .ledge-btn{height:28px!important;font-size:12px!important;padding:0 10px!important;white-space:nowrap}
.terminal-screen{flex:1;min-height:0;padding:8px 0 0 12px;background:var(--term-bg)}
.terminal-screen>[data-terminal]{width:100%;height:100%}
.term-dot.on{color:var(--success)}
.term-dot.wait{color:var(--warning)}
.term-dot.off{color:var(--muted-foreground)}
.kids-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--muted-foreground)}
.kids-pill:hover{color:var(--foreground);border-color:var(--input)}
.kids-pill:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
/* A session's relief (context handover spec §3.3): « Passer le relais » lit near the limit, the relief's state. */
.kids-pill.near{color:var(--warning,#e5b85c);border-color:color-mix(in srgb,var(--warning,#e5b85c) 45%,transparent)}
.pane-relief{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.pane-relief.failed{color:var(--destructive)}
@media(max-width:1000px){.conversation-workspace.with-terminal{grid-template-columns:minmax(0,1fr)}.term-handle{display:none}}
@media(max-width:850px){.conversation-workspace{grid-template-columns:1fr;overflow:auto;display:flex;flex-direction:column}.conversation{min-height:520px;flex-shrink:0}.right-panel{min-height:310px;flex-shrink:0;border-top:1px solid var(--border)}.messages{max-height:480px}}
@media(max-width:540px){.messages{padding:18px}}

/* Session page content */
.session-page{position:relative;min-width:0;container-type:inline-size;container-name:session}
.session-page .kids-pill{white-space:nowrap}
@container session (max-width:600px){.session-page .pane-meta{display:none}.reply-hint{display:none}.action-verb{display:none}.vb{width:auto}.action-link{font-size:0}.action-link:after{content:attr(data-short);font-size:11px}.session-thread{padding:16px 16px 24px}.r{grid-template-columns:32px minmax(0,1fr) 44px;column-gap:10px}.rail:before{left:15.5px}.doc{max-width:none}.message-card,.message-card.sent{max-width:100%}.pane-heading .tags{display:none}}
.session-page .pane-heading{gap:10px;padding:0 14px 0 12px}
.session-page .pane-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-switch{display:flex;gap:2px;padding:2px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--muted);flex-shrink:0}
.view-switch button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:calc(var(--radius-md) - 2px);font-size:12px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.view-switch button:hover{color:var(--foreground)}
.view-switch button[aria-selected=true]{background:var(--sidebar);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0/.18)}
/* « Fil »'s badge while the agent waits for an answer on Terminal; « Terminal »'s state dot (on, reconnecting, nothing to type into). */
.view-badge{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--primary);color:var(--primary-foreground,#fff);font-size:10.5px;line-height:16px;text-align:center}
.view-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.view-dot.wait{background:var(--warning)}
.view-dot.off{background:var(--muted-foreground)}
/* On Terminal, the heading names where the agent's screen runs and opens it in an external terminal. */
.session-page .pane-heading .term-chip{flex-shrink:0}
.session-page .pane-heading .term-icon{width:28px!important;height:28px!important;color:var(--muted-foreground);flex-shrink:0;margin-left:-6px}
.tab-count{font-size:10px;line-height:16px;min-width:18px;padding:0 5px;border-radius:4px;text-align:center;background:color-mix(in srgb,currentColor 12%,transparent)}
.session-body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
/* Focused by the page when a pane tab closes (SessionPage): a landing place, not a control. */
.session-body:focus,.side-pane:focus{outline:none}
.session-thread{position:relative;flex:1;min-height:0;overflow:auto;padding:18px 24px 28px;max-height:none}

/* The rail (issue #34, the mockup's track B): one list of exchanges, each a list of rows `node · content · time` whose nodes
   are strung on one 1 px line. A node masks the line with the page's own background (the conversation's, --sidebar), so its
   tints are mixed opaque. */
.rail{list-style:none;margin:0 auto;padding:10px 0 24px;max-width:calc(var(--col) + 60px);position:relative;display:flex;flex-direction:column}
.rail:before{content:'';position:absolute;left:19.5px;top:22px;bottom:36px;width:1px;background:var(--border)}
.turn{list-style:none;margin:0 0 6px}
.turn-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:40px minmax(0,1fr) 56px;column-gap:14px;align-items:start;padding:4px 0}
.r>.n{justify-self:center;z-index:1}
.r>.tm{font:11px/20px 'Geist Mono',monospace;color:var(--muted-foreground);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Nodes: a disc for what matters (its tone), a pip for a quiet action, your avatar, the agent's bot. */
.node{width:24px;height:24px;margin-top:-2px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--sidebar);border:1px solid var(--border);color:var(--muted-foreground)}
.node.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,var(--border));background:color-mix(in srgb,var(--info) 10%,var(--sidebar))}
.node.success{color:var(--success);border-color:color-mix(in srgb,var(--success) 35%,var(--border));background:color-mix(in srgb,var(--success) 10%,var(--sidebar))}
.node.warning{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 35%,var(--border));background:color-mix(in srgb,var(--warning) 10%,var(--sidebar))}
.node.danger{color:var(--danger-text);border-color:color-mix(in srgb,var(--danger-text) 35%,var(--border));background:color-mix(in srgb,var(--danger-text) 10%,var(--sidebar))}
.pip{width:5px;height:5px;margin-top:8px;border-radius:50%;background:color-mix(in srgb,var(--muted-foreground) 35%,var(--sidebar))}
.av,.botn{width:28px;height:28px;margin-top:-3px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.av{background:var(--foreground);color:var(--background)}
/* Your profile photo (#50): it fills the disc, cropped round. */
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.botn{background:var(--sidebar)}
.new-dot{width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--sidebar-primary)}

/* A folded exchange, a folded run of actions: one row, its chevron on the rail. */
.r-fold{align-items:center}
.r-fold>.node{margin-top:0}
.fold-row{display:block;width:100%;min-width:0;padding:2px 0;border:0;background:none;text-align:left;font-size:13px;line-height:20px;color:var(--muted-foreground);cursor:pointer}
.fold-row:hover{color:var(--foreground)}
.fold-row strong{font-weight:500;color:var(--foreground)}
.fold-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-failed{color:var(--danger-text)}
.fold-row:focus-visible,.tg:focus-visible,.lnk:focus-visible,.doc:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}

/* Your prompt (or the parent's), with the Story / Objectif it carried. */
.prompt-row{padding:12px 0 8px}
.prompt-col{min-width:0}
.who{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11px;font-weight:500;line-height:20px;color:var(--muted-foreground)}
.prompt-images{margin-top:8px}
.prompt-text{margin:2px 0 0;font-size:15px;line-height:24px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--border);border-radius:999px;font-size:11px;font-weight:400;color:var(--muted-foreground);white-space:nowrap}
.tag b{font-weight:500;color:var(--foreground)}
.pane-heading .tags{min-width:0;flex-wrap:nowrap;overflow:hidden}

/* What the agent said, and the documents it names. */
.say-row{padding:6px 0}
.say{min-width:0;padding-top:1px}
.msg-body{font-size:14px;line-height:22px;color:color-mix(in srgb,var(--foreground) 92%,var(--muted-foreground));overflow-wrap:anywhere}
.msg-body .ledge-thread-md{display:block}
.msg-body .ledge-thread-md>p:first-child{display:block;margin-top:0}
.msg-body .ledge-thread-md a{color:var(--foreground)}
.msg-body p{margin:0 0 8px}
.msg-body li{margin:2px 0}
.msg-body pre{font-size:12px}
.doc{display:flex;align-items:center;gap:12px;width:100%;max-width:460px;margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);text-align:left;font-size:12px;color:var(--muted-foreground)}
.doc:hover{border-color:var(--ring);color:var(--foreground)}
.doc-ico{flex:none;width:34px;height:34px;border-radius:var(--radius-md);background:var(--muted);color:var(--muted-foreground);display:inline-flex;align-items:center;justify-content:center}
.doc-name{flex:1;min-width:0;display:flex;flex-direction:column}
.doc-name strong{font-size:13px;font-weight:500;color:var(--foreground)}
.doc-name small{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-open{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}

/* Actions: a row each, its verb in a fixed column so the targets line up; failed, it shows its output; running, a ring. */
.action-row{padding:2px 0}
.action-row.flash{animation:session-flash 1.8s ease-out;border-radius:var(--radius-md)}
@keyframes session-flash{0%,40%{background:color-mix(in srgb,var(--info) 16%,transparent)}100%{background:transparent}}
.act-col{min-width:0}
.act{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;line-height:20px}
.action-mark{display:inline-flex;align-items:center;justify-content:center;flex:none}
.mark-success{color:var(--success)}
.mark-unknown{width:13px;font-weight:700;color:var(--muted-foreground)}
.vb{display:inline-flex;align-items:center;gap:6px;width:86px;flex:none;color:var(--muted-foreground)}
.tg{flex:0 1 auto;min-width:0;padding:0;border:0;background:none;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px 'Geist Mono',monospace;color:var(--foreground)}
button.tg:not(:disabled){cursor:pointer}
button.tg:not(:disabled):hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted-foreground)}
button.tg:disabled{cursor:default}
.status-unknown .tg{color:var(--muted-foreground)}
.action-row.status-failed{padding:6px 0 14px}
.status-failed .act{font-size:13px}
.status-failed .vb{color:var(--danger-text)}
.status-running .vb,.status-running>.tm{color:var(--info)}
.lnk{display:inline-flex;align-items:center;gap:4px;padding:0;border:0;background:none;font:inherit;font-size:12px;color:var(--muted-foreground);text-decoration:none;white-space:nowrap;cursor:pointer}
.lnk:hover{color:var(--foreground)}
.pre{margin:6px 0 0;padding:8px 10px;background:var(--well);border:1px solid var(--border);border-radius:var(--radius-md);font:12px/18px 'Geist Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted-foreground)}
.action-output{max-height:200px;overflow:auto}
.action-captures{margin-top:6px}
.action-dropped{margin:4px 0 0;font-size:12px;font-style:italic;color:var(--muted-foreground)}
.action-output.is-error{color:var(--danger-text);border-color:color-mix(in srgb,var(--destructive) 35%,var(--border))}
.delta{display:inline-flex;gap:6px;font-size:11px;white-space:nowrap}
.delta .plus{color:var(--success)}.delta .minus{color:var(--danger-text)}
.spin{display:inline-block;flex:none;width:12px;height:12px;border:1.5px solid var(--info);border-top-color:transparent;border-radius:50%;animation:session-spin .9s linear infinite}
/* Not in the mockup: offline, or under the app's reduced motion, the ring stands still (the OS's setting is the media query). */
.spin.still{animation:none}
@keyframes session-spin{to{transform:rotate(360deg)}}
@keyframes session-pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.spin,.todo-dot{animation:none}}

/* Decisions: your answer to a request (its badge, the command), a plan approved or sent back. */
.decision-row{padding:10px 0 14px}
.decision-chip{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0;font-size:13px;line-height:20px;color:var(--muted-foreground)}
.decision-chip code{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px 'Geist Mono',monospace;color:var(--foreground)}
.decision-chip strong{font-weight:500;color:var(--foreground)}
.plan-row{padding:8px 0}
.plan-row .plan-card{margin:0;min-width:0}

/* Subagents launched together: one card, a row each. */
.helpers-row{padding:8px 0}
.helpers-row>.node{margin-top:8px}
.card{min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card)}
.helpers-card{padding:0 14px}
.helpers-card.many{padding:10px 14px 4px}
.helpers-head{display:flex;gap:4px;padding-bottom:10px;font-size:12px;line-height:20px}
.helpers-head .muted{color:var(--muted-foreground)}
.helper-card{display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:10px;row-gap:4px;align-items:center;padding:10px 0}
.helper-card+.helper-card,.helpers-head+.helper-card{border-top:1px solid var(--border)}
.helper-bot{grid-row:span 3;align-self:start;display:inline-flex}
.helper-name{display:flex;align-items:baseline;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.helper-name strong{font-weight:500}
.helper-name .muted{font-size:12px;color:var(--muted-foreground)}
.helper-task{grid-column:2/4;min-width:0;font-size:13px;line-height:20px;overflow-wrap:anywhere}
.helper-live{margin-top:4px}
.helper-live .vb{color:var(--info)}
.helper-foot{grid-column:2/4;display:flex;align-items:center;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted-foreground)}

/* A task notification (`<task-notification>`): « Tâche », its state, what it was about, the raw XML folded. */
.task-row{padding:8px 0}
.task-head{display:flex;align-items:center;gap:8px}
.task-head .kicker{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}
.task-text{margin:6px 0 0;font-size:13px;line-height:20px}
.task-text strong{font-weight:500}
.task-text code{padding:0 4px;border-radius:4px;background:var(--muted);font:12px 'Geist Mono',monospace}
.task-meta{margin-top:4px;font-size:11px;color:var(--muted-foreground);overflow-wrap:anywhere}
.raw{margin-top:8px}
.raw summary{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted-foreground);cursor:pointer;list-style:none}
.raw summary::-webkit-details-marker{display:none}
.raw summary svg{transition:transform .15s}
.raw[open] summary svg{transform:rotate(90deg)}
.raw .pre{max-height:220px;overflow:auto}

/* The objective an agent noted: the old one struck out, the new one, who noted it. */
.objective-row{padding:6px 0}
.objective{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-width:0;font-size:12px;line-height:22px;color:var(--muted-foreground)}
.objective .muted{color:var(--muted-foreground)}
.tag.was{opacity:.7}

/* Markers: what is new since your last visit, the request the thread waits on, an exchange's end, the session's end. */
.unread-marker{padding:8px 0}
.newsep{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:500;line-height:20px;color:var(--sidebar-primary)}
.newsep:after{content:'';flex:1;height:1px;background:color-mix(in srgb,var(--sidebar-primary) 40%,transparent)}
.waiting-row{padding:8px 0}
/* The waiting row (mockup C): the agent works and no action runs. Shaped like a running action, quieter. */
.wait-row{padding:4px 0}
.wait-phrase{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:20px;color:var(--muted-foreground);animation:wait-rise .18s ease-out}
.wait-phrase code{font:12px 'Geist Mono',monospace;color:var(--foreground);background:var(--muted);padding:1px 5px;border-radius:var(--radius-sm)}
.wait-phrase.still{animation:none}
@keyframes wait-rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.wait-phrase{animation:none}}
.waiting-text{font-size:13px;line-height:20px;color:var(--danger-text)}
.end-row,.turn-end,.frozen-end{padding:6px 0 10px}
.end-text{font-size:12px;line-height:20px;color:var(--muted-foreground)}
.end-failed{color:var(--danger-text)}
.frozen-banner{display:flex;gap:10px;align-items:flex-start;margin:0 0 18px;padding:10px 12px;border:1px dashed var(--input);border-radius:var(--radius-md);font-size:12px;line-height:18px;color:var(--muted-foreground);background:var(--well)}
.frozen-banner strong{color:var(--foreground);font-weight:500}
.frozen-banner svg{margin-top:1px}
.source-note{font-size:11px;margin:4px 0 0}
.to-latest{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px!important;border:1px solid var(--input)!important;background:var(--popover)!important;font-size:12px;box-shadow:0 6px 20px rgb(0 0 0/.25);z-index:2}
.to-latest:hover{border-color:var(--ring)!important}

/* Pinned request + reply */
.session-reply{display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.pending-card{border:1px solid var(--input);border-radius:var(--radius-lg);padding:12px 14px;background:var(--popover);max-height:46vh;overflow:auto;box-shadow:0 -6px 24px rgb(0 0 0/.12)}
.pending-card.approval{border-color:color-mix(in srgb,var(--destructive) 45%,var(--input))}
.pending-card.question{border-color:color-mix(in srgb,var(--warning) 45%,var(--input))}
.pending-head{display:flex;align-items:center;gap:10px;font-size:13px}
.pending-head strong{font-weight:500}
.pending-since{font-size:11px;white-space:nowrap}
.pending-command{display:flex;align-items:center;gap:8px;margin:10px 0 6px;padding:8px 10px;background:var(--well);border:1px solid var(--border);border-radius:var(--radius-md)}
.pending-command code{font:12px 'Geist Mono',monospace;overflow-wrap:anywhere}
.tool-tag{font:10px 'Geist Mono',monospace;padding:1px 6px;border:1px solid var(--input);border-radius:4px;color:var(--muted-foreground)}
.pending-summary{margin:6px 0 10px;font-size:12px;line-height:18px;color:var(--muted-foreground)}
.pending-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pending-actions .ledge-btn kbd{margin-left:2px}
.pending-question{margin:10px 0 8px;font-size:13px;line-height:20px}
.pending-choices{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pending-choices button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--background)}
.pending-choices button:hover:not(:disabled){border-color:var(--ring)}
.pending-choices button>span{display:flex;flex-direction:column;min-width:0}
.pending-choices strong{font-size:12px;font-weight:500}
.pending-choices small{font-size:11px;color:var(--muted-foreground)}
.pending-choices .pending-own button{border-style:dashed}
.pending-relay{font-size:11px;margin:8px 0 0}
.session-reply form{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px;background:var(--well);border:1px solid var(--input);border-radius:var(--radius-lg)}
.session-reply form:focus-within{border-color:var(--ring)}
/* Two rows: the prompt across the whole width (two lines at least, growing up to about ten), its controls under it. */
.session-reply textarea{flex:1 0 100%;min-width:0;resize:none;background:none;border:0;font-size:12px;line-height:18px;padding:7px 6px;min-height:50px;max-height:220px;field-sizing:content}
.session-reply textarea:focus-visible{outline:none}
/* #58 lot 2: the session's model and effort beside the field (launch.css draws the chip and its list). */
.session-reply .model-chip{flex:none;height:28px;max-width:240px;margin-right:auto;padding:0 8px 0 10px;gap:6px;font-size:12px;background:var(--background)}
.model-chip-text{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.model-chip-next{flex:none;font-size:11px;color:var(--info)}
.model-chip.scheduled{border-color:color-mix(in srgb,var(--info) 45%,var(--input))}
.reply-hint{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.reply-note{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--well);font-size:12px;line-height:18px;color:var(--muted-foreground)}
.reply-note>span{flex:1}
.reply-note strong{color:var(--foreground);font-weight:500}

/* Modifications */
.changes-view{position:relative;flex:1;min-height:0;display:flex;container-type:inline-size}
.changes-layout{flex:1;min-width:0;display:grid;grid-template-columns:230px minmax(0,1fr)}
.file-list{border-right:1px solid var(--border);overflow:auto;padding:8px 6px;background:var(--sidebar)}
.file-list-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 8px;font-size:11px;color:var(--muted-foreground);border-bottom:1px solid var(--border);margin-bottom:6px}
.file-dir{margin-bottom:6px}
.dir-name{display:flex;align-items:center;gap:5px;padding:4px 8px;font-size:10px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row{display:flex;align-items:center;gap:7px;width:100%;padding:5px 8px 5px 14px;border-radius:var(--radius-sm);font-size:12px;color:var(--muted-foreground)}
.file-row:hover{background:var(--sidebar-accent);color:var(--foreground)}
.file-row.current{background:var(--sidebar-accent);color:var(--foreground);box-shadow:inset 2px 0 0 var(--sidebar-primary)}
.file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.change-letter{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font:600 9px 'Geist Mono',monospace;flex-shrink:0}
.change-add{color:var(--success);background:color-mix(in srgb,var(--success) 14%,transparent)}
.change-edit,.change-write,.change-rename{color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,transparent)}
.change-delete{color:var(--danger-text);background:color-mix(in srgb,var(--destructive) 14%,transparent)}
.file-pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.file-head{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.file-title{display:flex;align-items:center;gap:8px;min-width:0}
.file-title code{font:12px 'Geist Mono',monospace;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.change-badge{font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;white-space:nowrap}
.file-actions{display:flex;align-items:center;gap:4px;margin-left:-8px}
.file-actions .ledge-btn[data-variant=ghost]{height:28px!important;font-size:12px!important;padding:0 8px!important;gap:6px!important}
.file-pos{font-size:11px;color:var(--muted-foreground);margin-right:4px}
.file-touches{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px}
.touch-link{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--foreground)}
.touch-link:hover{border-color:var(--ring)}
.file-list-toggle{display:none;align-items:center;gap:6px;align-self:flex-start;height:26px;padding:0 9px;border:1px solid var(--input)!important;border-radius:var(--radius-md);font-size:12px}
.diff-scroll{flex:1;min-height:0;overflow:auto;background:var(--background)}
.diff-view{min-width:max-content;font-size:11.5px;line-height:19px;padding:0 0 16px}
.diff-line{display:grid;grid-template-columns:44px 44px 18px auto;white-space:pre}
.diff-line .ln{text-align:right;padding-right:8px;color:var(--muted-foreground);opacity:.7;user-select:none;font-variant-numeric:tabular-nums}
.diff-line .sign{text-align:center;user-select:none;color:var(--muted-foreground)}
.diff-line .code{padding-right:24px}
.diff-line.add{background:color-mix(in srgb,var(--success) 11%,transparent)}
.diff-line.add .sign,.diff-line.add .ln:nth-child(2){color:var(--success);opacity:1}
.diff-line.del{background:color-mix(in srgb,var(--destructive) 11%,transparent)}
.diff-line.del .sign,.diff-line.del .ln:first-child{color:var(--danger-text);opacity:1}
.diff-hunk{display:flex;gap:10px;padding:4px 14px;margin-top:8px;font-size:11px;color:var(--info);background:color-mix(in srgb,var(--info) 7%,transparent);border-block:1px solid var(--border)}
.diff-hunk:first-child{margin-top:0;border-top:0}
.hunk-ctx{color:var(--muted-foreground)}
.diff-fold{display:flex;align-items:center;gap:6px;width:100%;padding:3px 14px 3px 70px;font:11px 'Geist Mono',monospace;color:var(--muted-foreground);background:var(--well);border-block:1px dashed var(--border)!important}
.diff-fold:hover{color:var(--foreground)}
.diff-gap{padding:6px 14px 6px 70px;font-size:11px;color:var(--muted-foreground)}
/* Not in the mockup (its diffs were never cut): the daemon's 80-line cut, said under the diff like a gap. */
.diff-cut,.diff-none{margin:0;padding:6px 14px 6px 70px;font-size:11px}
.changes-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted-foreground);text-align:center;padding:24px}
.changes-empty strong{color:var(--foreground);font-weight:500}
.changes-empty p{margin:0;font-size:12px}
@container (max-width:640px){
 .changes-layout{grid-template-columns:minmax(0,1fr)}
 .file-list{display:none;position:absolute;z-index:3;top:44px;left:12px;width:min(300px,calc(100% - 24px));max-height:60%;border:1px solid var(--input);border-radius:var(--radius-lg);background:var(--popover);box-shadow:0 12px 32px rgb(0 0 0/.3)}
 .file-list.open{display:block}
 .file-list-toggle{display:inline-flex}
 .file-actions .ledge-btn[data-variant=ghost]{font-size:0!important;gap:0!important;width:28px;padding:0!important}
}

/* Document reader, over the conversation pane */
.doc-reader{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--sidebar)}
.reader-head{height:43px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 8px;border-bottom:1px solid var(--border)}
.reader-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.reader-title strong{font-size:13px;font-weight:500;white-space:nowrap}
.reader-title code{font:11px 'Geist Mono',monospace;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-ro{font-size:11px}
.reader-body{flex:1;overflow:auto}
.reader-body .ledge-document{font-size:13px;line-height:21px}

/* Narrow window: the conversation pane stacks (observatory.css @850px) and caps the thread. */
@media(max-width:850px){.session-thread{max-height:520px}}

/* The reading column: the rail centred (~72 characters between its nodes and its times), the reply under it. */
.session-thread{--col:760px;padding-inline:24px}
.session-thread>.frozen-banner,.session-thread>.source-note{max-width:var(--col);margin-inline:auto}
.session-reply>*{width:100%;max-width:760px;margin-inline:auto}
.session-reply textarea{font-size:13px;line-height:20px;min-height:54px}

/* Split reading: the thread (and its reply field) on the left, a document, a diff or a plan on the right. */
.session-split{position:relative;flex:1;min-height:0;display:flex}
.session-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.split-handle{flex:0 0 7px;margin:0 -3px;z-index:4;cursor:col-resize;position:relative;outline:none}
.split-handle:after{content:'';position:absolute;inset:0 3px;background:var(--border);transition:background .15s}
.split-handle:hover:after,.split-handle:focus-visible:after,.split-handle:active:after{background:var(--ring)}
.side-pane{flex:0 0 min(var(--split),calc(100% - 440px));min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--sidebar);border-left:1px solid var(--border)}
.pane-tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.pane-tab{display:flex;align-items:center;max-width:220px;border:1px solid transparent;border-bottom:0;border-radius:var(--radius-md) var(--radius-md) 0 0;color:var(--muted-foreground)}
.pane-tab>button:first-child{display:flex;align-items:center;gap:6px;min-width:0;height:28px;padding:0 4px 0 10px;font-size:12px}
.pane-tab>button:first-child span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane-tab.current{background:var(--background);border-color:var(--border);color:var(--foreground);margin-bottom:-1px}
.pane-tab:hover{color:var(--foreground)}
.tab-close{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-right:4px;border-radius:4px;opacity:.6}
.tab-close:hover{opacity:1;background:var(--sidebar-accent)}
.side-head{height:43px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;border-bottom:1px solid var(--border)}
.pane-tabs+.side-head{background:var(--background)}
.side-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.side-title strong{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.side-title code{font:11px 'Geist Mono',monospace;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head .ledge-btn{height:28px!important;font-size:12px!important;padding:0 8px!important;gap:6px!important}
.side-close span{display:none}
.side-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;background:var(--background)}
.side-body>.ledge-document,.side-body .plan-doc .ledge-document{font-size:13px;line-height:21px;max-width:680px;margin:0;padding:20px 24px}
.side-diff{flex:1;min-height:0;display:flex;flex-direction:column}
.side-diff-head{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--border)}
.side-diff-head .ledge-btn{height:28px!important;font-size:12px!important;padding:0 8px!important;gap:6px!important}
/* A narrow conversation (≈ window under 1250 px, or the terminal open): the pane covers the thread, the reply stays below. */
@container session (max-width:860px){
 .split-handle,.side-grow{display:none!important}
 .side-pane{position:absolute;z-index:6;top:0;right:0;bottom:var(--reply-h,0px);width:min(100%,680px);border:1px solid var(--input);border-top:0;box-shadow:-18px 0 40px rgb(0 0 0/.28)}
 .side-close{border:1px solid var(--input)!important;color:var(--foreground)!important}
 .side-close span{display:inline}
}

/* Plans (plan mode) and the task list */
.plan-card{margin:10px 0 10px var(--gutter,0);padding:12px 14px;border:1px solid var(--input);border-radius:var(--radius-lg);background:var(--background)}
.plan-card.status-proposed{border-color:color-mix(in srgb,var(--destructive) 40%,var(--input))}
.plan-card.status-revised{opacity:.75}
.plan-card-head{display:flex;align-items:center;gap:8px;font-size:13px}
.plan-card-head strong{font-weight:600}
.plan-kicker{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.plan-status{font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;white-space:nowrap;background:color-mix(in srgb,currentColor 10%,transparent)}
.plan-status.proposed{color:var(--danger-text)}.plan-status.approved{color:var(--success)}.plan-status.revised,.plan-status.open{color:var(--muted-foreground)}
.plan-intro{margin:8px 0 4px;font-size:13px;line-height:20px;color:var(--muted-foreground)}
.plan-intro .ledge-thread-md{display:block}
.plan-steps{margin:6px 0 8px;padding-left:22px;font-size:12px;line-height:20px}
.plan-steps li.more{list-style:none;margin-left:-22px;color:var(--muted-foreground)}
.plan-card-foot{display:flex;align-items:center;gap:8px;font-size:11px}
.plan-doc-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px 0;font-size:11px}
.plan-doc .ledge-document ol{counter-reset:step;list-style:none;padding-left:0}
.plan-doc .ledge-document ol>li{counter-increment:step;position:relative;padding:8px 0 8px 36px;margin:0;border-bottom:1px solid var(--border)}
.plan-doc .ledge-document ol>li:before{content:counter(step);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 11px 'Geist Mono',monospace;background:var(--secondary);border:1px solid var(--border)}
.plan-doc.status-approved .ledge-document ol>li:before{color:var(--success)}
.todo-bar{position:sticky;top:-18px;z-index:3;max-width:var(--col,760px);margin:-18px auto 16px;padding-top:10px;background:var(--sidebar)}
.todo-head{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--popover);font-size:12px;color:var(--muted-foreground);box-shadow:0 4px 14px rgb(0 0 0/.12)}
.todo-head:hover{border-color:var(--input)}
.todo-head strong{font-weight:500;color:var(--foreground);white-space:nowrap}
.todo-count{font-size:11px;color:var(--foreground)}
.todo-progress{flex:0 0 72px;height:4px;border-radius:2px;background:var(--muted);overflow:hidden}
.todo-progress i{display:block;height:100%;background:var(--success);border-radius:2px;transition:width .3s}
.todo-current{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-dot{width:6px;height:6px;border-radius:50%;background:var(--info);flex-shrink:0;animation:session-pulse 1.4s ease-in-out infinite}
/* Not in the mockup: offline or under reduced motion (the OS's or the app's), the dot stands still as the box's spinner does. */
.todo-dot.still{animation:none}
.todo-bar.open .todo-head{border-bottom-left-radius:0;border-bottom-right-radius:0}
.todo-bar.open .todo-head>svg:last-child{transform:rotate(180deg)}
.todo-list{list-style:none;margin:0;padding:6px 12px 10px;border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius-lg) var(--radius-lg);background:var(--popover);font-size:12px;line-height:18px}
.todo-list li{display:flex;align-items:center;gap:9px;padding:4px 0}
.todo-box{width:16px;height:16px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--input);border-radius:4px;font:600 10px 'Geist Mono',monospace}
.todo-list li.completed{color:var(--muted-foreground);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted-foreground) 60%,transparent)}
.todo-list li.completed .todo-box{color:var(--success);border-color:color-mix(in srgb,var(--success) 50%,var(--input))}
.todo-list li.in_progress{font-weight:500}
.todo-list li.in_progress .todo-box{color:var(--info);border-color:var(--info)}
.todo-row .action-target{font-family:inherit;color:var(--muted-foreground)}

.pending-head strong{flex:1;min-width:0}
.pending-head .spacer{display:none}

/* Not in the mockup (its thread is always there): the loading and empty-thread notes sit in the reading column. */
.session-thread>.thread-note{max-width:var(--col);margin-inline:auto}
/* An OMP seat of OpenRig in its thread's place (docs/mockups/ledge-openrig-omp.html): why there is no thread, or that it stopped. */
.seat-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--input);border-radius:var(--radius-lg);font-size:12.5px;line-height:18px;color:var(--muted-foreground)}
.session-thread>.seat-note{max-width:var(--col);margin-inline:auto}
.seat-note p{margin:0}
.seat-note strong{color:var(--foreground);font-weight:500}
.seat-note svg{flex:none;margin-top:1px}
.seat-note>div{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.seat-note .message-link{color:var(--info);font-size:12.5px}
.seat-note .message-link:hover{text-decoration:underline}
/* A stopped OMP seat's « Terminal »: in its place, disabled. */
.view-switch [role=tab][aria-disabled=true]{opacity:.45;cursor:not-allowed}

/* An archived session: the banner over the page, the pill in the header (the mockup's manage.css). */
.archived-banner{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--secondary) 70%,transparent);font-size:12px}
.archived-banner>svg{color:var(--muted-foreground)}
.archived-banner .ledge-btn{height:28px!important;font-size:12px!important;padding:0 10px!important;white-space:nowrap}
.archived-banner .danger-outline{color:var(--danger-text)!important}
.archived-pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--border);font-size:11px;color:var(--muted-foreground)}
/* Messages between agents (MessageCard, the mockup's bubbles): neutral on purpose, the state colours stay for what the agents
   need from you. Received on the left, its tail at the bottom left; sent on the right, filled, its tail at the bottom right. */
.message-head-row{padding:10px 0 2px}
.message-head{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px;line-height:22px;color:var(--muted-foreground)}
.message-head strong{color:var(--foreground);font-weight:500}
.message-head .spacer{flex:1}
.lnk.message-fold{height:22px;padding:0 7px;gap:3px;border:1px solid var(--border);border-radius:999px;font-size:11px}
.lnk.message-fold:hover{background:var(--accent)}
.message-fold[aria-expanded=false] svg{transform:rotate(-90deg)}
.message-row{padding:6px 0}
.message-card{justify-self:start;max-width:86%;min-width:0;display:flex;flex-direction:column;gap:4px;padding:9px 13px;border:1px solid var(--border);border-radius:14px 14px 14px 4px;background:var(--card);transition:box-shadow .3s,border-color .3s}
.message-card.sent{justify-self:end;max-width:78%;background:var(--secondary);border-color:transparent;border-radius:14px 14px 4px 14px}
.message-card.lit,.message-line.lit{border-color:var(--ring)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 28%,transparent)}
.message-card .who{gap:4px}
.who strong{font-weight:500;color:var(--foreground)}
.who .lnk{font-size:11px}
.message-summary{margin:0;font-size:13px;font-weight:500;line-height:19px}
.message-body{font-size:14px;line-height:21px;color:var(--foreground);overflow-wrap:anywhere}
.message-body>*:first-child{margin-top:0}.message-body>*:last-child{margin-bottom:0}
.message-body.clamped{max-height:63px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.message-card>.lnk{align-self:flex-start}
.message-read{display:inline-flex;align-items:center;gap:4px;color:var(--muted-foreground);white-space:nowrap}
.message-read i{font-style:normal;font-size:10px;letter-spacing:-2px;padding-right:2px}
.message-read.is-read i{color:var(--foreground)}

/* Folded: one line per message, still in its place on the rail. */
.message-line{display:flex;align-items:center;gap:8px;width:100%;min-width:0;padding:5px 10px;border:1px solid var(--border)!important;border-radius:var(--radius-md);background:transparent;color:var(--foreground);font:inherit;font-size:12px;text-align:left;cursor:pointer}
.message-line.sent{background:var(--secondary)}
.message-line .message-route{display:inline-flex;align-items:center;flex:none;gap:3px;font-size:11px;color:var(--muted-foreground)}
.message-line .message-route strong{font-weight:500;color:var(--foreground)}
.message-line:hover{background:var(--accent)}
.message-line-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The « Conversation » tab: the exchange between this agent and one other, beside the thread. Neutral like the cards: the
   bubbles are the thread's .message-card, the state colours stay for what the agents need from the user. */
/* The head: the pair (bots and names), the count, the peer's thread; then « Agrandir » / « Fermer » as every tab. */
.conv-head .conv-title{align-items:center;gap:10px}
.conv-pair{display:inline-flex;align-items:center;gap:6px;min-width:0;color:var(--muted-foreground)}
.conv-bot,.conv-exchange{display:inline-flex;flex:none}
.conv-title .conv-pair strong{max-width:14em;font-size:13px;font-weight:500;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-count{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.conv-head .conv-peer{margin-right:4px;font-size:11px}
/* The messages: a column centred in the pane, one bubble each, the page's agent on the right (as « sent » in the thread). */
.conv-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.conv-body{padding:16px 20px 28px}
.conv-loading{margin:0 auto 12px;max-width:680px;font-size:12px;text-align:center}
.conv-log{list-style:none;margin:0 auto;padding:0;width:100%;max-width:680px;display:flex;flex-direction:column;gap:4px}
.conv-row{display:flex;padding:1px 0}
.conv-row.first{padding-top:12px}
.conv-row:first-child{padding-top:0}
.conv-row.mine{justify-content:flex-end}
.conv-bubble,.conv-bubble.sent{max-width:86%}
.conv-bubble.can-light{cursor:pointer}
.conv-bubble.received.can-light:hover{border-color:var(--input)}
.conv-bubble.sent.can-light:hover{border-color:var(--border)}
.conv-who{gap:5px}
.conv-meta{gap:4px;font-weight:400}
.conv-row.mine .conv-meta{justify-content:flex-end}
.conv-meta time{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
/* One side only (the peer unknown here): a strip under the head, kept in view, in the frozen thread's quiet tone. */
.conv-note{flex-shrink:0;display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px dashed var(--input);font-size:12px;line-height:18px;color:var(--muted-foreground);background:var(--well)}
.conv-note strong{color:var(--foreground);font-weight:500}
.conv-note svg{margin-top:1px}
.conv-empty{gap:8px}
.conv-empty strong{font-size:13px}
/* The conversation header's pill, pressed while its tab is the active one; the tab's dot for unseen messages. */
.conv-follow[aria-pressed=true]{background:var(--secondary);color:var(--foreground)}
.conv-tab-dot{width:6px;height:6px;margin-left:2px;border-radius:50%;background:var(--sidebar-primary);flex:none}

/* The « Navigateur » tab (browser captures spec §5.4): the selected capture large over the strip of all of them. Comparing,
   two side by side, stacked when the pane is narrow. The pictures sit on the well, as the thread's thumbnails do. */
.browser-tab{container:browser/inline-size}
.browser-stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.browser-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground);min-width:0}
.browser-meta .mono{font-family:'Geist Mono',monospace;font-size:11px;font-variant-numeric:tabular-nums}
.browser-meta .ledge-btn{height:28px!important;font-size:12px!important;padding:0 8px!important;gap:6px!important}
.browser-url{color:var(--foreground);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.browser-big{position:relative;flex:1;min-height:160px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--well)}
.browser-big img,.browser-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.browser-actions{display:flex;align-items:center;gap:2px;margin-left:auto}
.browser-pair{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.browser-side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.browser-side .browser-meta{flex-wrap:nowrap;gap:8px;overflow:hidden;white-space:nowrap}
.browser-side.empty .browser-big{border-style:dashed;background:transparent}
@container browser (max-width:560px){.browser-pair{grid-template-columns:1fr;grid-auto-rows:minmax(160px,1fr)}}
.browser-badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;line-height:16px;background:var(--info);color:var(--background)}
.browser-quit{color:var(--info)!important;border:1px solid color-mix(in srgb,var(--info) 45%,transparent)!important;background:color-mix(in srgb,var(--info) 12%,transparent)!important}
.browser-strip{flex-shrink:0;border-top:1px solid var(--border);padding:10px 16px 14px}
.browser-strip-lab{display:flex;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted-foreground)}
.browser-strip-lab .mono{font-family:'Geist Mono',monospace;font-size:11px}
.browser-cells{display:flex;gap:10px;overflow-x:auto;padding:3px 3px 4px}
.browser-turn{flex:none;width:1px;margin:0 2px;background:var(--input)}
.browser-cell{flex:none;width:132px;display:flex;flex-direction:column;gap:2px;padding:0;text-align:left;cursor:pointer}
.browser-thumb{position:relative;height:84px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--well)}
.browser-thumb .browser-badge{position:absolute;z-index:1;right:5px;top:5px}
.browser-cell:hover .browser-thumb{border-color:var(--input)}
.browser-cell.selected .browser-thumb{outline:2px solid var(--info);outline-offset:1px}
.browser-cell:focus-visible{outline:none}
.browser-cell:focus-visible .browser-thumb{outline:2px solid var(--ring);outline-offset:1px}
.browser-c1{margin-top:3px;font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser-c2{font-size:11px;color:var(--muted-foreground);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser-none{gap:10px}

/* Claude Code's automated cross-session notices (NoticeLine): a quiet system line on the rail, not a card nor a prompt. */
.notice-row{padding:6px 0}
.notice-line{min-width:0;padding:2px 0 2px 10px;border-left:2px solid var(--border);font-size:12px;line-height:20px;color:var(--muted-foreground)}
.notice-line.warn{border-left-color:var(--warning)}
.notice-line.warn .notice-title{color:var(--warning)}
.notice-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice-head .spacer{flex:1}
.notice-head .message-link{display:inline-flex;align-items:center;gap:3px;color:var(--muted-foreground)}
.notice-head .message-link:hover{color:var(--foreground)}
.notice-kicker{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.notice-title{color:var(--foreground);font-weight:500}
.notice-summary{margin:4px 0 0;padding-left:8px;border-left:2px solid var(--input);font-style:italic;line-height:18px;white-space:pre-wrap}
.ask-form{display:grid;gap:12px}
.ask-question{display:grid;gap:6px;margin:0;padding:0;border:0;min-width:0}
.ask-question legend{display:flex;flex-direction:column;gap:2px;padding:0;margin-bottom:6px}
.ask-question legend small{color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em;font-size:.68rem}
.ask-question label{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--background);cursor:pointer}
.ask-question label:hover{border-color:var(--ring)}
.ask-question label.selected{border-color:var(--primary)}
.ask-question label>span{display:flex;flex-direction:column;min-width:0}
.ask-question label small{color:var(--muted-foreground)}
.ask-other{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--background);color:inherit;font:inherit}

/* OMP's queue (mockup omp-sessions, File B): a stack resting on the field, one row per instruction in the order they leave. */
.session-reply>.reply-queue{width:calc(100% - 20px);max-width:740px;margin:0 auto -10px;}
.reply-queue{border:1px solid var(--input);border-bottom:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--card);font-size:12px}
.reply-queue-head{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--border)}
.reply-queue-head strong{font-weight:500}
.reply-queue-head .ledge-btn{margin-left:auto;height:26px;padding:0 8px;font-size:11px}
.reply-queue ul{list-style:none;margin:0;padding:0}
.reply-queue li{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:13px}
.reply-queue li+li{border-top:1px solid var(--border)}
.queue-text{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.queue-tag{flex:none;padding:0 6px;border-radius:5px;font-size:10px;font-weight:500;line-height:16px;background:var(--muted);color:var(--muted-foreground)}
.queue-tag.now{background:var(--status-info-soft,color-mix(in srgb,var(--info) 18%,transparent));color:var(--info)}
/* Interrompre A: while OMP works with an empty field, the send button is a stop square; a spinner once asked. */
.session-reply .reply-stop{background:var(--foreground);color:var(--background)}
.session-reply .reply-stop:hover:not(:disabled){background:color-mix(in srgb,var(--foreground) 85%,var(--background))}
.reply-stop-spin{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,var(--background) 35%,transparent);border-top-color:var(--background);animation:reply-spin .8s linear infinite}
@keyframes reply-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reply-stop-spin{animation:none}}

/* A seat's current task, pinned above the reply field (atelier rooms spec §3.5). */
.pinned-task{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:6px 10px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--well);font-size:12px}
.pinned-task .kicker{font-size:10px;letter-spacing:.08em;color:var(--sidebar-primary)}
.pinned-task .pinned-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice-line.notice-task .notice-kicker{color:var(--sidebar-primary)}
.session-reply .reply-chips{flex:1 0 100%;padding:2px 2px 0}
.session-reply .reply-images-error{color:var(--danger-text)}

/* The « / » list above the reply field (mockup docs/mockups/ledge-slash-commands.html). */
.session-reply form{position:relative}
.slash-menu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:5;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 -6px 24px rgb(0 0 0/.18);overflow:hidden}
.slash-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted-foreground)}
.slash-head strong{color:var(--foreground);font-weight:500}
.slash-menu ul{list-style:none;margin:0;padding:4px;max-height:236px;overflow:auto}
.slash-menu li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 8px;border-radius:var(--radius-md);cursor:pointer}
.slash-menu li[aria-selected="true"]{background:var(--accent)}
.slash-name{font:12px 'Geist Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slash-name mark{background:none;color:var(--foreground);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.slash-arg{color:var(--muted-foreground);font-size:11px}
.slash-desc{grid-column:1/2;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slash-src{grid-row:1/3;grid-column:2;align-self:center;font-size:10.5px;color:var(--muted-foreground);border:1px solid var(--input);border-radius:5px;padding:0 6px;line-height:17px}
.slash-src.project{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.slash-menu li.blocked{cursor:default}
.slash-menu li.blocked .slash-name{color:var(--muted-foreground)}
.slash-menu li.blocked .slash-desc,.slash-warn{color:var(--warning)}
.slash-warn{white-space:normal}
.slash-foot{display:flex;gap:12px;padding:6px 10px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted-foreground)}
.slash-empty{margin:0;padding:12px;font-size:12px;line-height:18px;color:var(--muted-foreground)}
.slash-empty strong{color:var(--foreground);font-weight:500}
.slash-skel{height:10px;border-radius:4px;background:var(--muted);margin:10px}
.slash-skel.s{width:40%}.slash-skel.m{width:65%}
.slash-spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--input);border-top-color:var(--foreground);animation:slash-spin .8s linear infinite}
@keyframes slash-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.slash-spin{animation:none}}
/* The arguments a completed command takes, faint after it: the draft's own text, invisible, places them. */
.slash-ghost{position:absolute;top:13px;left:12px;right:12px;pointer-events:none;font-size:13px;line-height:20px;white-space:pre-wrap;overflow:hidden;max-height:20px;color:var(--muted-foreground)}
.slash-ghost-typed{visibility:hidden}
.slash-ghost-hint{font:12px 'Geist Mono',monospace}

/* ---- OpenRig's messages in a seat's thread (docs/mockups/ledge-openrig-messages.html) ---- */
.rig-who{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.rig-who .spacer{flex:1}
.rig-who .seat,.tcard .seat{font:11px var(--font-mono,'Geist Mono',ui-monospace,monospace);color:var(--muted-foreground)}
.rigtag{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border:1px solid var(--border);border-radius:999px;font-size:10.5px;color:var(--muted-foreground)}
.rig-dup{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:999px;font-size:10.5px;color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent)}
.rig-foot{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:2px}
.lnk.strong{color:var(--foreground);font-weight:500}
details.rig-raw{margin-top:2px}
details.rig-raw summary{list-style:none;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted-foreground);cursor:pointer}
details.rig-raw summary::-webkit-details-marker{display:none}
details.rig-raw summary svg{transition:transform .15s}
details.rig-raw[open] summary svg{transform:rotate(90deg)}
details.rig-raw summary:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
details.rig-raw pre,.rig-bad .rawbox{margin:6px 0 0;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--well);font:11px/16px var(--font-mono,'Geist Mono',ui-monospace,monospace);color:var(--muted-foreground);white-space:pre-wrap;overflow-wrap:anywhere}
.node.task{color:var(--task);border-color:color-mix(in srgb,var(--task) 40%,var(--border));background:color-mix(in srgb,var(--task) 10%,var(--sidebar))}
.rig-row .node.warn{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 35%,var(--border));background:color-mix(in srgb,var(--warning) 10%,var(--sidebar))}
/* the task card: the #92 handoff card, violet */
.tcard{justify-self:start;width:min(100%,520px);display:flex;flex-direction:column;gap:6px;padding:10px 13px;border:1px solid color-mix(in srgb,var(--task) 35%,var(--border));border-left:3px solid var(--task);border-radius:10px;background:var(--card);min-width:0}
.tcard.out{justify-self:end}
.tcard .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--task);font-weight:500}
.tcard .k .id{font:11px var(--font-mono,'Geist Mono',ui-monospace,monospace);color:var(--muted-foreground);font-weight:400}
.tcard .k .sp,.tcard .row .sp{flex:1}
.tcard h4{margin:0;font-size:14.5px;line-height:21px;font-weight:600;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted-foreground)}
.tcard .meta b{color:var(--foreground);font-weight:500}
.tcard .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--border)}
.tcard .st{flex:none;width:auto;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.tcard .st.pending{color:var(--muted-foreground);background:var(--muted)}
.tcard .st.taken{color:var(--info);background:var(--status-info-soft)}
.tcard .st.passed{color:var(--task);background:color-mix(in srgb,var(--task) 14%,transparent)}
.tcard .st.done{color:var(--success);background:var(--status-success-soft)}
.tcard .st.blocked{color:var(--warning);background:var(--status-warning-soft)}
.tcard .st.unknown{color:var(--muted-foreground);background:transparent;border:1px dashed var(--border)}
/* notices */
.notice-line.task{border-left-color:var(--task)}
.notice-line.task .notice-kicker{color:var(--task)}
.notice-sub{display:block}
.rig-row .notice-line .notice-kicker{font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.rig-fold strong{font-weight:500;color:var(--foreground)}
.rig-bad{border-left:2px dashed var(--border);padding-left:10px;min-width:0}
.rig-bad .who{color:var(--muted-foreground)}
@media (prefers-reduced-motion:reduce){details.rig-raw summary svg{transition:none}}
.tcard .st.notHanded{color:var(--danger-text);background:var(--status-danger-soft)}
.fold-row.rig-fold{display:flex;align-items:center;gap:4px;flex-wrap:wrap}

/* The mockup's chrome and the new pieces; the session page and its pane are session.css, unchanged. */
:root { font-family: 'Geist', system-ui, sans-serif; }
:root[data-theme=dark] { color-scheme: dark; }
:root[data-theme=light] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--background); color: var(--foreground); font-size: 14px; line-height: 20px; }
button { font: inherit; }
button:not(.ledge-btn) { border: 0; background: none; color: inherit; cursor: pointer; }
code { font-family: 'Geist Mono', monospace; font-size: .92em; }
.spacer { flex: 1; }
.muted { color: var(--muted-foreground); }
.mono { font-family: 'Geist Mono', monospace; }

.mk-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 20px; background: var(--background); border-bottom: 1px solid var(--border); }
.mk-bar strong { font-size: 13px; }
.mk-fill { flex: 1; }
.mk-seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--well); }
.mk-seg button { padding: 3px 10px; border-radius: var(--radius-sm); font-size: 12px; color: var(--muted-foreground); }
.mk-seg button[aria-checked=true] { background: var(--muted); color: var(--foreground); }
.mk-main { padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
.mk-intro { margin: 0; max-width: 1100px; font-size: 13px; line-height: 20px; color: var(--muted-foreground); }
.mk-intro b, .mk-note b { color: var(--foreground); font-weight: 500; }
.mk-note { margin: 0; font-size: 12px; color: var(--muted-foreground); }

/* The app frame: the session page at a real size. */
.mk-app { height: 720px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; display: flex; }
.mk-app.wide { width: 1360px; max-width: 100%; }
.mk-app.narrow { width: 800px; }
.mk-app > .session-page { flex: 1; border-right: 0; }
.mk-on { color: var(--foreground) !important; border-color: var(--info) !important; }
.view-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

/* The thread, drawn. */
.mk-thread { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.mk-ex { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.mk-chev { width: 18px; height: 18px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; font-size: 11px; color: var(--muted-foreground); }
.mk-you { padding-left: 24px; }
.mk-you small { font-size: 11px; }
.mk-you div { font-weight: 500; }
.mk-act { position: relative; display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 2px 6px 2px 24px; border-radius: var(--radius-md); font-size: 12.5px; }
.mk-act code { font-size: 11.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mk-act.mk-hit { background: color-mix(in srgb, var(--info) 8%, transparent); }
.mk-act.mk-hit code { color: var(--foreground); }
.mk-pip { position: absolute; left: 8px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted-foreground); }
.mk-verb { color: var(--info); font-weight: 500; flex: none; }
.mk-see { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 1px solid color-mix(in srgb, var(--info) 45%, transparent) !important; border-radius: 999px; font-size: 11px !important; color: var(--info) !important; background: color-mix(in srgb, var(--info) 10%, transparent) !important; }
.mk-see.small { height: 18px; padding: 0 6px; vertical-align: 1px; }
.mk-say { margin-top: 6px; padding-left: 24px; }
.mk-say p { margin: 6px 0; line-height: 20px; }
.mk-say-who { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 12.5px; }
.mk-bot { width: 16px; height: 12px; border-radius: 8px 8px 3px 3px; background: #e0784f; }
.mk-doclink { font: 12px 'Geist Mono', monospace; color: var(--info); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--info) 40%, transparent); text-underline-offset: 3px; }

/* The head's Pages | Captures switch (the view-switch, smaller). */
.mk-switch { display: flex; gap: 2px; padding: 2px; margin-right: 6px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--muted); }
.mk-switch button { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: calc(var(--radius-md) - 2px); font-size: 12px; color: var(--muted-foreground); }
.mk-switch button[aria-selected=true] { background: var(--sidebar); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0/.18); }

/* The Pages view: the address, its meta, the frame. */
.mk-page { padding: 12px 14px 14px; gap: 10px; position: relative; }
.mk-addr-wrap { position: relative; display: flex; flex-direction: column; gap: 4px; }
.mk-addr { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mk-pick { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--input) !important; border-radius: var(--radius-md); background: var(--well) !important; color: var(--foreground); }
.mk-pick code { flex: 1; min-width: 0; text-align: left; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-pick[aria-expanded=true] { border-color: var(--ring) !important; }
.mk-actions { display: flex; gap: 2px; margin-left: auto; }
.mk-actions .ledge-btn, .mk-problem .ledge-btn, .file-actions .ledge-btn { height: 28px !important; font-size: 12px !important; padding: 0 8px !important; gap: 6px !important; }
.mk-addr-meta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted-foreground); padding-left: 2px; }
.mk-iso { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); border: 1px solid color-mix(in srgb, var(--success) 30%, transparent); cursor: help; }
.mk-frame { position: relative; flex: 1; min-height: 200px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: #fff; }
.mk-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.mk-frame.mk-blank { display: grid; place-items: center; font-size: 12px; background: #fff; }
.mk-toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 11.5px; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: var(--shadow-overlay); }
.mk-band { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-md); font-size: 12px; color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }

/* The picker. */
.mk-pop { position: absolute; z-index: 5; top: 34px; left: 0; width: min(100%, 470px); padding: 6px; border-radius: var(--radius-lg); background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: var(--shadow-overlay); }
.mk-pop-group { padding: 6px 8px 4px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.mk-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12px; }
.mk-opt.current { background: var(--accent); }
.mk-check { width: 14px; display: grid; place-items: center; color: var(--info); }
.mk-opt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mk-opt-main code { font-size: 12px; }
.mk-opt-main small { font-size: 10.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-opt-sub { font-size: 11px; color: var(--muted-foreground); }
.mk-pop-foot { margin-top: 4px; padding: 6px 8px 2px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted-foreground); }

/* 2 · States: the pane alone. */
.mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 18px; }
.mk-mini { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.mk-mini figcaption { font-size: 13px; }
.mk-mini-pane.side-pane { position: static; flex: none; width: 100%; height: 350px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: none; }
.mk-mini-note { margin: 0; font-size: 11.5px; line-height: 16px; color: var(--muted-foreground); }
.mk-problem { gap: 8px; }
.mk-problem p { max-width: 320px; }

/* 3 · Entries. */
.mk-entries { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.mk-entry { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.mk-entry:first-child { grid-row: span 2; }
.mk-entry figcaption { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted-foreground); line-height: 17px; }
.mk-entry figcaption strong { font-size: 13px; color: var(--foreground); }
.mk-entry figcaption b { color: var(--foreground); font-weight: 500; }
.mk-entry-box { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--sidebar); }
.mk-entry-box.right-panel { background: var(--background); }
.mk-entry-thread .messages { overflow: visible; }
.mk-on-btn { color: var(--info) !important; }
.mk-plus { font-size: 11px; color: var(--success); }

/* 4 · Isolation, 5 · Choices. */
.mk-iso-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .9fr); gap: 14px; align-items: start; }
.mk-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.mk-card { border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); padding: 14px 16px; font-size: 12.5px; line-height: 18px; }
.mk-card ul, .mk-card ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; }
.mk-kicker { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); font-weight: 600; }
.mk-card code { background: var(--well); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.mk-small { margin: 10px 0 0; font-size: 11.5px; line-height: 16px; }
.mk-can, .mk-choices, .mk-texts table { width: 100%; border-collapse: collapse; }
.mk-can td, .mk-choices td, .mk-choices th, .mk-texts td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; text-align: left; }
.mk-choices th { font-size: 11px; color: var(--muted-foreground); font-weight: 500; border-top: 0; }
.mk-choices td:first-child { width: 30%; }
.mk-choices td:nth-child(2) { width: 24%; }
.mk-can td:last-child { width: 96px; font-weight: 500; white-space: nowrap; }
.mk-can .ok { color: var(--success); }
.mk-can .no { color: var(--danger-text); }
.mk-can .ask { color: var(--warning); }
.mk-texts td:first-child { width: 24%; }
