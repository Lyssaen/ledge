<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledge fil ou terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens: packages/ui/src/styles/tokens.css (light + dark). */
:root,:root[data-theme=light]{
  --background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--muted:oklch(0.97 0 0);--secondary:oklch(0.967 0.001 286.375);
  --muted-foreground:oklch(0.556 0 0);--primary:oklch(0.505 0.213 27.518);--border:oklch(0.922 0 0);--input:oklch(0.88 0 0);--ring:oklch(0.708 0 0);
  --sidebar:oklch(0.985 0 0);--success:#059669;--warning:#b45309;--info:#2563eb;--danger-text:oklch(0.505 0.213 27.518);
  --s-ok:#ecfdf5;--s-warn:#fffbeb;--s-info:#eff6ff;--s-danger:#fef2f2;--well:oklch(0.975 0 0);--chrome:oklch(0.96 0 0);--page:#e9e9e9;
  --term-bg:oklch(0.99 0 0);--term-fg:oklch(0.22 0 0);--t-dim:#8a8a8a;--t-acc:#c2410c;--t-blue:#2563eb;--t-green:#047857;--scrim:#0006;--hl:#fde68a;--del:#fecaca55;
}
:root[data-theme=dark]{
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--muted:oklch(0.269 0 0);--secondary:oklch(0.274 0.006 286.033);
  --muted-foreground:oklch(0.708 0 0);--primary:oklch(0.444 0.177 26.899);--border:#ffffff1a;--input:#ffffff26;--ring:oklch(0.556 0 0);
  --sidebar:oklch(0.205 0 0);--success:#34d399;--warning:#fbbf24;--info:#60a5fa;--danger-text:oklch(0.704 0.191 22.216);
  --s-ok:#052e16;--s-warn:#422006;--s-info:#172554;--s-danger:#450a0a;--well:#0c0c0d;--chrome:#0d0d0d;--page:#000;
  --term-bg:#0c0c0d;--term-fg:#e5e5e5;--t-dim:#8f8f8f;--t-acc:#f0a17a;--t-blue:#7cb3fb;--t-green:#4ade80;--scrim:#000a;--hl:#facc1540;--del:#f8717122;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Geist',system-ui,sans-serif;background:var(--page);color:var(--foreground);font-size:14px;line-height:20px;min-height:100vh}
.mono,code,kbd{font-family:'Geist Mono',ui-monospace,monospace}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--info);outline-offset:1px}

/* Mockup chrome (not product) */
.mk-bar{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--chrome);border-bottom:1px solid var(--border)}
.mk-bar strong{margin-right:10px;font-weight:600}
.mk-bar .sp{flex:1}
.mk-bar button{border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted-foreground)}
.mk-bar button[aria-pressed=true]{background:var(--muted);color:var(--foreground);border-color:var(--input)}
.mk-bar .seg{display:flex;gap:2px;border:1px solid var(--border);border-radius:9px;padding:2px}
.mk-bar .seg button{border:0;padding:3px 9px}
.note{max-width:1280px;margin:14px auto 12px;padding:0 16px;color:var(--muted-foreground);font-size:13px}
.note b{color:var(--foreground);font-weight:500}
.note code{font-size:12px}
.cap{max-width:1280px;margin:18px auto 6px;padding:0 16px;font-size:12px;color:var(--muted-foreground)}
#screens{padding:0 16px 40px}

/* Window */
.win{max-width:1280px;height:760px;margin:0 auto;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:32px 1fr;background:var(--background);position:relative}
.win.short{height:520px}
.titlebar{display:flex;align-items:center;padding:0 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--border);background:var(--chrome)}
.main{display:grid;grid-template-columns:250px 1fr;min-height:0}
.side{background:var(--sidebar);border-right:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:4px;font-size:13px;overflow:hidden}
.side .ask{border:1px solid var(--input);border-radius:9px;padding:7px 10px;color:var(--muted-foreground);margin-bottom:6px}
.side .sec{font-size:11.5px;color:var(--muted-foreground);padding:8px 4px 2px}
.side .s{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px}
.side .s small{margin-left:auto;font-size:11px;color:var(--muted-foreground);font-family:'Geist Mono',monospace}
.side .s.cur{background:var(--muted)}
.mascot{width:18px;height:12px;border-radius:8px 8px 3px 3px;background:#c2564f;flex:none}
.content{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border);font-size:13.5px}
.topbar .crumb{color:var(--muted-foreground)}
.topbar .sp{flex:1}
.topbar .acc{font-size:12px;padding:1px 8px;border-radius:5px;background:var(--s-danger);color:var(--danger-text)}
.tbtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:7px;color:var(--muted-foreground);font-family:'Geist Mono',monospace;font-size:13px}
.tbtn[aria-pressed=true]{background:var(--muted);color:var(--foreground)}
.pane-heading{height:43px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 20px;font-size:12px}
.pane-meta{margin-left:10px;font-size:10.5px;color:var(--muted-foreground);font-family:'Geist Mono',monospace}
.pane-heading .sp{flex:1}
.kids{font-size:12px;color:var(--muted-foreground)}
.view-switch{display:flex;gap:2px;padding:2px;border:1px solid var(--input);border-radius:9px;background:var(--muted)}
.view-switch button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.view-switch button[aria-selected=true]{background:var(--sidebar);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0/.18)}
.view-switch .ic{font-family:'Geist Mono',monospace;font-size:11px;width:13px;text-align:center}
.view-switch .badge{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--primary);color:#fff;font-size:10.5px;line-height:16px;text-align:center}
.view-switch .tdot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.view-switch .tdot.off{background:var(--muted-foreground)}.view-switch .tdot.wait{background:var(--warning)}
.focusring{outline:2px solid var(--info);outline-offset:1px}

/* Thread view */
.thread{flex:1;overflow:hidden;padding:24px 0 0;display:flex;flex-direction:column;align-items:center;min-height:0}
.tcol{width:min(780px,92%);display:flex;flex-direction:column;gap:16px;font-size:13.5px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}
.row .t{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--muted-foreground)}
.circ{width:24px;height:24px;border-radius:50%;border:1px solid var(--input);display:grid;place-items:center;font-size:11px;color:var(--muted-foreground)}
.circ.me{background:var(--foreground);color:var(--background);border:0}
.circ.wait{border-color:var(--danger-text);color:var(--danger-text)}
.red{color:var(--danger-text)}.blue{color:var(--info)}
.grow{flex:1}
.reqcard{width:min(780px,92%);border:1px solid var(--danger-text);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13px;margin-top:auto}
.reqcard .h{display:flex;gap:10px;align-items:center}
.reqcard .h small{margin-left:auto;color:var(--muted-foreground);font-size:12px}
.pilltag{font-size:12px;padding:1px 8px;border-radius:5px;background:var(--s-danger);color:var(--danger-text)}
.code{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:'Geist Mono',monospace;font-size:12.5px;background:var(--well)}
.btns{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;font-size:12.5px;border-radius:7px;border:1px solid var(--input)}
.btn.primary{background:var(--primary);border-color:transparent;color:#fff}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.btn kbd{font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
.composer{width:min(780px,92%);border:1px solid var(--input);border-radius:12px;padding:10px 12px;margin:10px 0 16px;color:var(--muted-foreground);font-size:13px;height:84px;display:flex;flex-direction:column;justify-content:space-between}

/* Terminal view (TermPane, full frame) */
.tview{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--well)}
.term-heading{height:38px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px;padding:0 8px 0 0;font-size:12px}
.term-tab{display:flex;align-items:center;gap:6px;height:100%;padding:0 12px;border-right:1px solid var(--border);color:var(--muted-foreground);font-size:12px}
.term-tab.current{background:var(--term-bg);color:var(--foreground);box-shadow:inset 0 -2px 0 var(--ring)}
.term-tab{white-space:nowrap;flex:0 1 auto;min-width:0;max-width:190px;overflow:hidden}.term-heading{overflow:hidden}
.term-tab .x{font-size:11px;opacity:.6;margin-left:4px}
.term-add{width:30px;text-align:center;color:var(--muted-foreground);font-size:15px}
.term-chip{font-size:10.5px;padding:2px 7px;border:1px solid var(--border);border-radius:5px;color:var(--muted-foreground);font-family:'Geist Mono',monospace}
.term-icon{width:28px;height:28px;display:inline-grid;place-items:center;color:var(--muted-foreground);border-radius:6px;font-size:13px}
.term-banner{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 20px;border-bottom:1px solid var(--border);background:var(--secondary);font-size:12px;line-height:18px;flex:none}
.term-banner.warn{background:var(--s-warn)}.term-banner.info{background:var(--s-info)}
.term-banner > span:first-child{flex:1}.term-banner .btn{flex:none}
.screen{flex:1;min-height:0;background:var(--term-bg);color:var(--term-fg);padding:12px 16px;font-family:'Geist Mono',monospace;font-size:12.5px;line-height:19px;white-space:pre;overflow:hidden}
.screen.focused{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--info) 55%,transparent)}
.screen .d{color:var(--t-dim)}.screen .a{color:var(--t-acc)}.screen .b{color:var(--t-blue)}.screen .g{color:var(--t-green)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--term-fg);vertical-align:-3px}
.screen.ro{color:var(--muted-foreground)}
.empty{flex:1;display:grid;place-items:center;background:var(--term-bg)}
.empty div{max-width:440px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;font-size:13px;color:var(--muted-foreground)}
.empty b{color:var(--foreground);font-weight:500}
.terminal-footer{flex:none;border-top:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted-foreground)}
.terminal-footer .sp{flex:1}.terminal-footer{white-space:nowrap;overflow:hidden}
.dot.on{color:var(--success)}.dot.wait{color:var(--warning)}.dot.off{color:var(--muted-foreground)}
.footkey{color:var(--foreground)}

/* Changes column (the old split, now Modifications) */
.split{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 7px minmax(0,var(--cw,46%));min-height:0}
.split>*{min-width:0;min-height:0}
.handle{background:var(--border);position:relative;cursor:col-resize}
.handle::after{content:'';position:absolute;top:50%;left:2px;width:3px;height:34px;margin-top:-17px;border-radius:2px;background:var(--ring)}
.chgbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--input);border-radius:9px;font-size:12px;font-weight:500;color:var(--muted-foreground)}
.chgbtn[aria-pressed=true]{background:var(--muted);color:var(--foreground)}
.tab-count{font-family:'Geist Mono',monospace;font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--secondary);color:var(--muted-foreground)}
.chg{display:flex;flex-direction:column;background:var(--background);overflow:hidden}
.chg-head{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1px solid var(--border);font-size:12.5px;white-space:nowrap}
.chg-head b{font-weight:500}
.delta{font-family:'Geist Mono',monospace;font-size:11px;white-space:nowrap}.delta .p{color:var(--success)}.delta .m{color:var(--danger-text);margin-left:4px}
.muted{color:var(--muted-foreground)}
.ftoggle{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}
.flist{border-bottom:1px solid var(--border);padding:4px 0 6px;font-size:12.5px}
.fdir{padding:5px 14px 2px;font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground)}
.frow{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;padding:4px 14px 4px 24px}
.frow.cur{background:var(--muted)}
.letter{font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:600}.letter.M{color:var(--warning)}.letter.A{color:var(--success)}.letter.D{color:var(--danger-text)}
.ftitle{padding:10px 14px 4px;display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}
.ftitle code{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge-ch{font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--s-warn);color:var(--warning);flex:none}
.facts{display:flex;align-items:center;gap:6px;padding:2px 10px 6px 8px;font-size:12px;color:var(--muted-foreground)}
.facts .sp{flex:1}
.nb{width:28px;height:28px;border:1px solid var(--input);border-radius:7px;display:inline-grid;place-items:center;font-size:12px}
.touches{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 10px;font-size:11.5px;color:var(--muted-foreground);border-bottom:1px solid var(--border)}
.touch{border:1px solid var(--border);border-radius:6px;padding:0 6px;color:var(--info)}
.diff{flex:1;overflow:hidden;font-family:'Geist Mono',monospace;font-size:11.5px;line-height:19px;background:var(--well);padding:6px 0}
.dl{display:grid;grid-template-columns:34px 14px 1fr;white-space:pre;padding-right:10px}
.dl .n{color:var(--muted-foreground);text-align:right;padding-right:8px;opacity:.7}
.dl.add{background:color-mix(in srgb,var(--success) 14%,transparent)}.dl.del{background:color-mix(in srgb,var(--danger-text) 14%,transparent)}
.dl.add .s{color:var(--success)}.dl.del .s{color:var(--danger-text)}
.dl.gap{color:var(--muted-foreground);grid-template-columns:1fr;padding-left:14px;background:var(--muted)}
.chg-empty{flex:1;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted-foreground);padding:20px}
.chg-empty b{display:block;color:var(--foreground);font-weight:500;margin-bottom:6px}

/* Panels (states) */
.grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{border:1px solid var(--border);border-radius:10px;overflow:hidden;height:330px;display:flex;flex-direction:column;background:var(--background)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);margin-bottom:6px}
.lbl small{text-transform:none;letter-spacing:0;font-size:11.5px;margin-left:6px}

/* Keys card */
.keys{max-width:1280px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden}
.keys table{width:100%;border-collapse:collapse;font-size:13px}
.keys th,.keys td{text-align:left;padding:9px 14px;border-top:1px solid var(--border);vertical-align:top}
.keys th{font-size:11.5px;color:var(--muted-foreground);font-weight:500;border-top:0;background:var(--muted)}
.keys kbd,.help kbd{font-size:11.5px;border:1px solid var(--input);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--well);white-space:nowrap}
.keys .muted{color:var(--muted-foreground)}

/* Help dialog */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:5}
.help{width:560px;max-height:690px;overflow:hidden;background:var(--card);border:1px solid var(--input);border-radius:14px;padding:16px 20px;box-shadow:0 20px 40px -12px #000b;font-size:13px}
.help h4{font-size:15px;font-weight:600;margin-bottom:6px}
.help p{color:var(--muted-foreground);font-size:12px;margin:6px 0}
.help .r{display:flex;justify-content:space-between;align-items:center;padding:3.5px 0;border-top:1px solid var(--border)}
.help .r.del{background:var(--del);text-decoration:line-through;color:var(--muted-foreground)}
.help .r.new{background:var(--hl)}
.cmp{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp .win{height:760px}.cmp .main{grid-template-columns:1fr}.cmp .side{display:none}
.topbar,.pane-heading{white-space:nowrap;overflow:hidden}
@media (max-width:900px){.grid,.cmp{grid-template-columns:1fr}.main{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="mk-bar" role="toolbar" aria-label="Vues de la maquette">
  <strong>Maquette · Session : Fil ou Terminal · v3</strong>
  <button data-v="thread" aria-pressed="true">1 · Fil + panneau</button>
  <button data-v="term" aria-pressed="false">2 · Terminal (écran de l’agent)</button>
  <button data-v="keys" aria-pressed="false">3 · Bascule au clavier</button>
  <button data-v="cases" aria-pressed="false">4 · Cas limites</button>
  <button data-v="help" aria-pressed="false">5 · Aide clavier</button>
  <span class="sp"></span>
  <span class="seg"><button data-theme-btn="dark" aria-pressed="true">Sombre</button><button data-theme-btn="light" aria-pressed="false">Clair</button></span>
  <span class="seg"><button data-lang-btn="fr" aria-pressed="true">FR</button><button data-lang-btn="en" aria-pressed="false">EN</button></span>
</div>
<p class="note" id="note"></p>
<div id="screens"></div>

<script>
const T = {
fr:{
  n_thread:'<b>Le sélecteur de la session devient « Fil | Terminal »</b>, une bascule plein cadre (clé <code>session.views</code> : <code>thread</code>, <code>terminal</code>). <b>Modifications n\'est plus un onglet : elle devient la colonne de droite</b>, à la place où le terminal se scindait. Un bouton <b>« ± Modifications 3 »</b> à droite de l\'en-tête l\'ouvre et la ferme (enfoncé quand elle est ouverte ; touche <code>M</code> proposée). La largeur se règle avec la même poignée qu\'avant. Le contenu est celui de la vue Modifications actuelle, en disposition étroite : la liste des fichiers se replie au-dessus du diff, puis viennent ‹ ›, « Modifié par · tour n » et le diff. L\'onglet Terminal porte un point d\'état. La barre latérale ne montre plus rien d\'OpenRig.',
  n_term:'<b>Vue Terminal, plein cadre</b> : le terminal remplace le fil sous le sélecteur, au lieu de se mettre à côté. Ce qu\'il avait déjà reste en place : les onglets (l\'agent et vos shells, <code>+</code>), la puce <code>wsl</code> ou <code>ssh · hôte</code>, « ouvrir dans un terminal externe », les bandeaux et le pied de page. Ce qui disparaît : la poignée de largeur, « Agrandir » et la croix (c\'est le sélecteur qui ramène au fil). La colonne Modifications reste ouverte d\'une vue à l\'autre, à côté du terminal comme à côté du fil. La zone de réponse est masquée : on tape dans le terminal. Si l\'agent attend une réponse pendant que vous êtes sur Terminal, l\'onglet Fil porte une pastille rouge (« Votre accord » reste en haut).',
  n_keys:'<b>Bascule au clavier</b> : <code>O</code> et <code>Ctrl ²</code> deviennent la bascule. En arrivant sur Terminal, <b>le clavier va tout de suite au terminal</b> : on tape sans cliquer. En revenant sur le fil, le focus retourne au fil. <code>J / K</code> parcourt toujours les fichiers, quand la colonne Modifications est ouverte et que le clavier n\'est ni dans la saisie ni dans le terminal. <code>M</code> (proposée) ouvre et ferme la colonne. Le pied du terminal rappelle la touche.',
  n_cases:'<b>Quand il n\'y a pas de terminal à taper</b>, l\'onglet Terminal reste là et s\'ouvre quand même : il montre ce qui existe (dernières lignes, écran du parent, shells), avec le bandeau actuel qui dit pourquoi. Seul cas nouveau : une session pilotée par Ledge (OMP), qui n\'a pas d\'écran d\'agent. Elle a un texte à elle et propose d\'ouvrir un shell. Dans ces cas, la bascule ne donne pas le clavier à un écran en lecture seule : le focus va au bouton du bandeau.',

    ${panel3(L.cs.ended,agentView({banner:banner(L.ended('Otto').replace(/ Votre shell reste disponible\.| Your shell is still available\./,'')),body:`<div class="screen ro">${LAST()}</div>`,dot:'off',state:L.preview,foot:'none'}),{tdot:'off'})}
    ${panel3(L.cs.native,agentView({body:`<div class="empty"><div><b>${L.nativeT('Pim')}</b><span>${L.nativeB}</span><span class="btn sm">+ ${L.nativeBtn}</span></div></div>`,dot:'off',state:L.agentFoot,where:null,foot:'none'}),{tdot:'off',chip:false})}
    ${panel3(L.cs.phone,agentView({banner:banner(L.phone('Pixel 9','Otto'),L.takeBack,'info'),foot:'none'}),{})}
    ${panel3(L.cs.chEmpty,split(threadMini(),rpanel({tab:'chg',shells:0,empty:true}),'52%'),{v:'thread'})}
  </div>`]],
  help: VIEWS.help,
};
function panel3(lbl,body,o={}){ const v=o.v??'terminal'; const wide=o.wide?' style="grid-column:1/-1"':''; const bits = v==='terminal'&&o.chip!==false?`<span class="term-chip">${o.chip??'wsl'}</span>${o.ext===false?'':`<span class="term-icon">↗</span>`}`:''; return `<div${wide}><p class="lbl">${lbl}</p><div class="panel"><div class="pane-heading">${sw(v,o)}<span class="pane-meta">${o.meta??'Local · ledge'}</span>${bits}</div>${body}</div></div>`; }
const threadMini=()=>`<div class="thread" style="padding-top:14px"><div class="tcol" style="gap:10px"><div class="row"><span class="circ me">●</span><span><b style="font-weight:500">${L.fix}</b></span><span class="t">16:49</span></div><div class="row"><span class="circ blue">◌</span><span class="blue">&gt;_ ${L.cmd}</span><span></span></div></div></div>`;
for (const k of Object.keys(VIEWS)) delete VIEWS[k];
Object.assign(VIEWS, V3);

function render(){
  L=T[lang];
  document.documentElement.dataset.theme=theme; document.documentElement.lang=lang;
  document.getElementById('note').innerHTML=L['n_'+view].replaceAll('Ctrl ²','Ctrl '+L.key);
  document.getElementById('screens').innerHTML=VIEWS[view]().map(([c,h])=>`${c?`<p class="cap">${c}</p>`:'<div style="height:6px"></div>'}${h}`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.mk-bar button'); if(!b) return;
  if(b.dataset.v){ view=b.dataset.v; }
  else if(b.dataset.themeBtn){ theme=b.dataset.themeBtn; }
  else if(b.dataset.langBtn){ lang=b.dataset.langBtn; }
  else return;
  sync(); render();
});
function sync(){
  document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===view)));
  document.querySelectorAll('[data-theme-btn]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.themeBtn===theme)));
  document.querySelectorAll('[data-lang-btn]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.langBtn===lang)));
}
const q=new URLSearchParams(location.search); if(q.get('v')) view=q.get('v'); if(q.get('theme')) theme=q.get('theme'); if(q.get('lang')) lang=q.get('lang');
sync(); render();
</script>
</body>
