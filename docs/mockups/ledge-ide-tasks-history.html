<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledge IDE — Tâches et Historique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Lot 12 complement to the IDE prototype v27 (ledge-ide-interactive.html, on main): what only the old interface had.
   1) « Tâches » and 2) « Historique » as tabs of the right panel's Ledge chat (ChatPanel, 300 px), 3) « À toi » completed with
   what « Le point » showed. Texts reuse the old home's keys (home.tabs, home.tasks, home.history, home.point) where they exist.
   Tokens: packages/ui tokens.css (light + dark), the page and blocks as the v27's atoiPage(), the chat header as ChatView. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--popover:oklch(0.205 0 0);--muted:oklch(0.269 0 0);
  --muted-foreground:oklch(0.708 0 0);--primary:oklch(0.444 0.177 26.899);--border:#ffffff1a;--input:#ffffff26;
  --shell:#0d0d0d;--side:#141414;--pane:#111112;--page:#000;--hover:#ffffff10;--note:#a78bfa;--hl:#a78bfa26;
  --st-perm:#f87171;--st-ask:#fbbf24;--st-work:#60a5fa;--st-idle:#34d399;--st-off:#71717a;--coral:#ea6a58;
}
:root[data-theme="light"]{
  color-scheme:light;
  --background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--popover:oklch(1 0 0);--muted:oklch(0.97 0 0);
  --muted-foreground:oklch(0.556 0 0);--primary:oklch(0.505 0.213 27.518);--border:oklch(0.922 0 0);--input:oklch(0.922 0 0);
  --shell:oklch(0.985 0 0);--side:oklch(0.975 0 0);--pane:#fff;--page:oklch(0.95 0 0);--hover:#0000000a;--note:#7c3aed;--hl:#7c3aed1f;
  --st-perm:#dc2626;--st-ask:#b45309;--st-work:#2563eb;--st-idle:#059669;--st-off:#a1a1aa;--coral:#cc5241;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Geist','Segoe UI',system-ui,sans-serif;background:var(--page);color:var(--foreground);font-size:13px;line-height:18px}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
code,.mono{font-family:'Geist Mono',ui-monospace,Consolas,monospace;font-size:11px}
.mut{color:var(--muted-foreground)}
header.bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:var(--shell);border-bottom:1px solid var(--border)}
header.bar h1{font-size:14px;font-weight:600;margin:0}
header.bar .sub{color:var(--muted-foreground);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:7px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12px;color:var(--muted-foreground)}
.seg button.on{background:var(--muted);color:var(--foreground)}
main{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;max-width:1560px;align-items:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card h2{font-size:12.5px;font-weight:600;margin:0;padding:10px 14px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 .n{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted-foreground)}
.card .why{padding:4px 14px 8px;color:var(--muted-foreground);font-size:12px}
.card .why b{color:var(--foreground);font-weight:500}
.card .keys{padding:0 14px 10px;font-size:11px;color:var(--muted-foreground)}
.tag{font-size:10.5px;border-radius:8px;padding:0 6px;border:1px solid}
.tag.new{color:var(--note);border-color:color-mix(in srgb,var(--note) 45%,transparent)}
.tag.same{color:var(--muted-foreground);border-color:var(--input)}
.scene{border-top:1px solid var(--border);background:var(--page);padding:14px;display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--st-off);display:inline-block}
.dot.perm{background:var(--st-perm)}.dot.ask{background:var(--st-ask)}.dot.work{background:var(--st-work)}.dot.idle{background:var(--st-idle)}
.btn{height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--input);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.btn.pri{background:var(--primary);border-color:transparent;color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted-foreground)}
.btn.hov{background:var(--hover)}

/* The right panel: ChatView's docked header (56 px), then the new tab strip, then the tab's body. */
.rp{width:300px;height:520px;background:var(--side);border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;position:relative;flex-shrink:0}
.rp.short{height:300px}
.ch{height:56px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.ch .mascot{width:28px;height:28px;border-radius:8px;background:radial-gradient(circle at 50% 40%,var(--coral),color-mix(in srgb,var(--coral) 40%,var(--side)));flex-shrink:0}
.ch .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ch .t b{font-size:14px;line-height:18px;font-weight:650}.ch .t b i{color:var(--coral);font-style:normal}
.ch .t span{font-size:11px;line-height:14px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted-foreground)}
.rtabs{display:flex;height:30px;border-bottom:1px solid var(--border);padding:0 6px;flex-shrink:0}
.rtabs button{padding:0 8px;font-size:12px;color:var(--muted-foreground);position:relative;display:flex;align-items:center;gap:5px}
.rtabs button.on{color:var(--foreground)}
.rtabs button.on::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--foreground);border-radius:1px}
.rtabs .n{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--muted-foreground)}
.rbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.msgs{flex:1;padding:10px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.bubble{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12px;line-height:17px}
.bubble.me{align-self:flex-end;background:var(--muted);border-color:transparent;max-width:88%}
.bubble.flash{box-shadow:0 0 0 2px var(--note);background:var(--hl)}
.composer{border-top:1px solid var(--border);padding:8px 10px;color:var(--muted-foreground);font-size:12px;flex-shrink:0}
.composer .in{border:1px solid var(--input);border-radius:8px;padding:7px 9px;background:var(--pane)}
.filters{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sel{height:24px;border:1px solid var(--input);border-radius:6px;padding:0 6px;font-size:11.5px;display:inline-flex;align-items:center;gap:5px;background:var(--pane)}
.sel::after{content:"▾";font-size:9px;color:var(--muted-foreground)}
.list{display:flex;flex-direction:column;padding:4px 4px;overflow:hidden}
.trow{display:grid;grid-template-columns:14px 1fr;gap:2px 7px;padding:6px 6px;border-radius:6px;text-align:left;font-size:12px}
.trow.hov,.trow.sel{background:var(--hover)}
.trow .mk{grid-row:1/3;font-size:11px;line-height:17px;text-align:center;color:var(--muted-foreground)}
.trow .mk.open{color:var(--st-work)}.trow .mk.done{color:var(--st-idle)}.trow .mk.bad{color:var(--st-perm)}.trow .mk.asked{color:var(--st-ask);font-weight:600}
.trow b{font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.trow small{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 6px;border-radius:6px;text-align:left;font-size:12px}
.hrow.hov{background:var(--hover)}
.hrow small{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--muted-foreground);padding-top:1px}
.hrow span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{padding:28px 18px;text-align:center;color:var(--muted-foreground);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.banner{margin:8px 10px 0;padding:6px 9px;border-radius:7px;border:1px solid var(--input);background:var(--pane);font-size:11.5px;color:var(--muted-foreground);display:flex;gap:7px;align-items:center}
.dim{opacity:.55}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted-foreground);border-top-color:transparent;display:inline-block}
.detail{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px;overflow:hidden}
.detail .back{align-self:flex-start;margin-left:-4px}
.detail h3{margin:0;font-size:13px;font-weight:600;line-height:18px}
.detail h3 code{color:var(--muted-foreground);font-weight:400}
.detail .meta{font-size:11.5px;color:var(--muted-foreground)}
.detail .txt{background:var(--pane);border:1px solid var(--border);border-radius:7px;padding:7px 9px;line-height:17px}
.detail h4{margin:4px 0 0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:500}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:11.5px}
.log small{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--muted-foreground);margin-right:6px}
.answer{border:1px solid var(--input);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:7px;background:var(--pane)}
.answer .opts{display:flex;flex-wrap:wrap;gap:5px}
.answer .fld{border:1px solid var(--input);border-radius:6px;padding:6px 8px;color:var(--muted-foreground);font-size:11.5px;min-height:44px}
.answer .go{display:flex;gap:6px;justify-content:flex-end}

/* The IDE's sidebar « À toi » (Attention), only the row the link comes from. */
.side{width:248px;background:var(--side);border:1px solid var(--border);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-self:center}
.side .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.side .row{display:flex;gap:7px;align-items:flex-start;font-size:12px;padding:6px 7px;border-radius:7px;background:var(--hover)}
.side .row .ok{color:var(--st-idle)}
.side .row small{display:block;color:var(--muted-foreground);font-size:11px}
.arrow{align-self:center;color:var(--muted-foreground);font-size:18px}

/* The page « À toi » (atoiPage of the v27, AtoiPage.tsx). */
.page{width:100%;max-width:820px;background:var(--pane);border:1px solid var(--border);border-radius:6px;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.page .top{display:flex;align-items:flex-start;gap:12px}
.page h3{margin:0;font-size:15px;font-weight:600}
.page .psub{color:var(--muted-foreground);font-size:12px}
.blk{border:1px solid var(--border);border-radius:9px;background:var(--pane)}
.blk.new{border-color:color-mix(in srgb,var(--note) 55%,var(--border))}
.blk-h{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.blk-h b{font-weight:600}.blk-h .sp{flex:1}.blk-h .psub{font-size:11.5px}
.blk-b{padding:9px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.line{display:flex;align-items:center;gap:8px}
.line .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .mk{width:14px;text-align:center;font-size:11px;flex-shrink:0}
.mk.asked{color:var(--st-ask);font-weight:600}.mk.near{color:var(--st-ask)}.mk.done{color:var(--st-idle)}.mk.bad{color:var(--st-perm)}
.pill{font-size:10.5px;border:1px solid var(--input);border-radius:8px;padding:0 6px;color:var(--muted-foreground);flex-shrink:0}
.pill.urgent{color:var(--st-perm);border-color:color-mix(in srgb,var(--st-perm) 50%,transparent)}
.newmark{font-size:10px;color:var(--note);border:1px dashed color-mix(in srgb,var(--note) 60%,transparent);border-radius:6px;padding:0 5px}
.collapsed{font-size:11.5px;color:var(--muted-foreground);padding:2px 2px}
.askc{border:1px solid var(--border);border-radius:9px;background:var(--card);padding:11px 13px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:18px;margin:2px 0 4px 22px}
.askc.hot{border-color:color-mix(in srgb,var(--coral) 45%,var(--border))}
.askc.focus{box-shadow:0 0 0 2px var(--note)}
.askc .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
.askc .who b{color:var(--foreground)}
.askc h4{margin:0;font-size:13.5px;font-weight:600}
.askc p{margin:0;color:var(--muted-foreground)}
.askc .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.askc .src{font:11px 'Geist Mono',monospace;color:var(--muted-foreground);border:1px dashed var(--input);border-radius:5px;padding:0 6px}
.pill.dec{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 50%,transparent)}
.abanner{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--st-ask) 55%,var(--border));background:color-mix(in srgb,var(--st-ask) 8%,transparent);font-size:12px}
.abanner p{margin:2px 0 0;color:var(--muted-foreground)}
.ptab{display:flex;height:30px;background:var(--shell);border:1px solid var(--border);border-bottom:0;border-radius:6px 6px 0 0;width:100%;max-width:820px}
.ptab span{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--muted-foreground);border-right:1px solid var(--border)}
.ptab span.on{background:var(--pane);color:var(--foreground);box-shadow:inset 0 -2px 0 var(--coral)}
.stack{display:flex;flex-direction:column;align-items:center;width:100%}
section.fiche{grid-column:1/-1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:12.5px}
section.fiche h2{font-size:13px;margin:0 0 6px}
section.fiche table{border-collapse:collapse;width:100%;font-size:12px}
section.fiche td,section.fiche th{border-top:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
section.fiche th{color:var(--muted-foreground);font-weight:500}
section.fiche ol{margin:6px 0 0;padding-left:20px}section.fiche li{margin:5px 0}
@media (max-width:560px){main{grid-template-columns:1fr;padding:12px}.rp{width:100%}}
</style>
</head>

  <h1 id="h1"></h1><span class="sub" id="hsub"></span><span style="flex:1"></span>
  <span class="seg" id="theme"><button data-v="dark">Sombre</button><button data-v="light">Clair</button></span>
  <span class="seg" id="lang"><button data-v="fr">FR</button><button data-v="en">EN</button></span>
</header>
<main id="main"></main>

let L = 'fr';
const t = () => T[L];
const mark = s => s==='done' ? ['done','✓'] : (s==='refused'||s==='dropped') ? ['bad','!'] : ['open','○'];
const chatHead = () => `<div class="ch"><span class="mascot"></span><div class="t"><b>${t().title}<i>.</i></b><span>${t().subtitle}</span></div><span class="ib"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div>`;
const tabs = (on, n=3) => `<div class="rtabs"><button class="${on==='conv'?'on':''}">${t().tabs.conv}</button><button class="${on==='tasks'?'on':''}">${t().tabs.tasks}<span class="n">${n}</span></button><button class="${on==='history'?'on':''}">${t().tabs.history}</button></div>`;
const panel = (on, body, cls='') => `<div class="rp ${cls}">${chatHead()}${tabs(on)}<div class="rbody">${body}</div></div>`;
const filters = (s, g) => `<div class="filters"><span class="sel">${s}</span><span class="sel">${g}</span></div>`;
const trow = (x, o={}) => { const [k, m] = x.asked ? ['asked','?'] : mark(x.state);
  return `<button class="trow ${o.sel?'sel':''} ${o.hov?'hov':''}"><span class="mk ${k}">${m}</span><b>${x.title}</b><small><code>${x.id}</code> · ${t().from(x.giver, x.owner)} · ${x.asked ? t().pillDecision : t().st[x.state]}</small></button>`; };
const tlist = (rows, o={}) => `<div class="list ${o.dim?'dim':''}">${rows.map((x,i)=>trow(x, {hov:o.hov===i})).join('')}</div>`;
const conv = (flash) => `<div class="msgs">
  <div class="bubble me ${flash?'flash':''}">${HIST[1][1]}</div>
  <div class="bubble">Je l’ai confiée à Otto (<code>t-14</code>). Je te préviens quand il a fini.</div>
  <div class="bubble me">${HIST[0][1]}</div>
  <div class="bubble">Nova attend ta décision sur le nom du dossier des captures, et Pia demande l’accord pour <code>pnpm test</code>.</div>
</div><div class="composer"><div class="in">${t().ask}</div></div>`;
const hrows = (o={}) => `<div class="list ${o.dim?'dim':''}">${HIST.map(([h,q],i)=>`<button class="hrow ${o.hov===i?'hov':''}" title="${t().hOpen}"><small>${h}</small><span>${q}</span></button>`).join('')}</div>`;

    <li><b>Carte d’une demande de rig</b> : dépliée sous sa ligne dans la page « À toi », et le « Voir » de la barre latérale ouvre cette page sur la carte (recommandé) ; ou épinglée en tête de la Conversation du chat de droite, comme l’ancien « Le point » ?</li>

  <h2 style="margin-top:14px">Questions pour jde (recommandation en premier) — tranchées le 2026-11-09 14:13 : 1A 2A 3A 4A</h2>
  <ol>
    <li><b>Détail d’une tâche</b> : à la place de la liste, dans le panneau (cartes 3 à 5, recommandé), ou dans un onglet de l’éditeur ?</li>
    <li><b>Tâches de Ledge closes</b> dans « À toi » : dans « Terminé depuis ton passage » (recommandé), ou un bloc à elles ?</li>
    <li><b>« Confiées par Ledge »</b> (la 2e colonne du Point) : abandonnée, puisque Tâches avec le filtre « Ledge » la remplace (recommandé), ou un bloc de plus dans « À toi » ?</li>
    <li><b>« Résumer la journée »</b> : un bouton en haut de « À toi » qui pose la question au chat (recommandé), ou abandonné ?</li>
  </ol></section>`;
}

function render(){
  const x = t();
  document.getElementById('h1').textContent = x.h1;
  document.getElementById('hsub').textContent = x.hsub;
  const all = [...cards(), atoiCard(), ...complementCards()];
  document.getElementById('main').innerHTML = all.map((c,i)=>`<article class="card ${c.wide?'wide':''}" id="s${i+1}"><h2><span class="n">${i+1}</span>${c.title}<span class="tag ${c.tag}">${c.tag==='new'?'nouveau':'comme avant'}</span></h2><div class="why">${c.why}</div><div class="keys">${c.keys!=='—'?'<code>'+c.keys+'</code>':''}</div><div class="scene">${c.scene}</div></article>`).join('') + fiche();
}
function set(kind, v){
  if (kind==='theme') document.documentElement.dataset.theme = v; else { L = v; document.documentElement.lang = v; }
  document.querySelectorAll(`#${kind} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render();
}
document.getElementById('theme').addEventListener('click', e => { if (e.target.dataset.v) set('theme', e.target.dataset.v); });
document.getElementById('lang').addEventListener('click', e => { if (e.target.dataset.v) set('lang', e.target.dataset.v); });
const q = new URLSearchParams(location.search);
set('theme', q.get('theme')==='light'?'light':'dark'); set('lang', q.get('lang')==='en'?'en':'fr');
</script>
