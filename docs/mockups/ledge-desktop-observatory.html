<!doctype html><html lang="fr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledge desktop — Atelier · Design system</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"><style>:root, :root[data-theme="light"] {
  --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0); --card-foreground: oklch(0.145 0 0);
  --popover: oklch(1 0 0); --popover-foreground: oklch(0.145 0 0);
  --primary: oklch(0.505 0.213 27.518); --primary-foreground: oklch(0.971 0.013 17.38); --primary-hover: oklch(0.444 0.177 26.899);
  --secondary: oklch(0.967 0.001 286.375); --secondary-foreground: oklch(0.21 0.006 285.885);
  --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0); --accent-foreground: oklch(0.205 0 0);
  --destructive: oklch(0.577 0.245 27.325); --destructive-foreground: oklch(0.985 0 0);
  --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
  --radius: 0.625rem; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px; --radius-xl: 14px;
  --sidebar: oklch(0.985 0 0); --sidebar-foreground: oklch(0.145 0 0); --sidebar-primary: oklch(0.577 0.245 27.325);
  --sidebar-primary-foreground: oklch(0.971 0.013 17.38); --sidebar-accent: oklch(0.97 0 0); --sidebar-accent-foreground: oklch(0.205 0 0);
  --sidebar-border: oklch(0.922 0 0); --sidebar-ring: oklch(0.708 0 0);
  /* The notch itself: pure white (light) or pure black (dark), borderless, so it merges with the screen edge. */
  --notch: #fff;
  --success: #059669; --warning: #b45309; --info: #2563eb; --danger-text: oklch(0.505 0.213 27.518);
  --status-success-soft: #ecfdf5; --status-warning-soft: #fffbeb; --status-info-soft: #eff6ff; --status-danger-soft: #fef2f2;
  --shadow-overlay: 0 20px 40px -12px rgba(0,0,0,0.25);
  --well: oklch(0.97 0 0);

}
:root[data-theme="dark"] {
  --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
  --popover: oklch(0.205 0 0); --popover-foreground: oklch(0.985 0 0);
  --primary: oklch(0.444 0.177 26.899); --primary-foreground: oklch(0.971 0.013 17.38); --primary-hover: oklch(0.396 0.141 25.723);
  --secondary: oklch(0.274 0.006 286.033); --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216); --destructive-foreground: oklch(0.985 0 0);
  --border: #ffffff1a; --input: #ffffff26; --ring: oklch(0.556 0 0);
  --sidebar: oklch(0.205 0 0); --sidebar-foreground: oklch(0.985 0 0); --sidebar-primary: oklch(0.637 0.237 25.331);
  --sidebar-primary-foreground: oklch(0.971 0.013 17.38); --sidebar-accent: oklch(0.269 0 0); --sidebar-accent-foreground: oklch(0.985 0 0);
  --sidebar-border: #ffffff1a; --sidebar-ring: oklch(0.556 0 0);
  --notch: #000;
  --success: #34d399; --warning: #fbbf24; --info: #60a5fa; --danger-text: oklch(0.704 0.191 22.216);
  --status-success-soft: #052e16; --status-warning-soft: #422006; --status-info-soft: #172554; --status-danger-soft: #450a0a;
  --shadow-overlay: 0 20px 40px -12px rgba(0,0,0,0.7);
  --well: oklch(0.145 0 0);
  --edge-hot: rgba(255,255,255,.08);
}

/* Mascots (spec section 6). Material follows the theme: Galet (light) / Signal (dark).
   A bot's own data-material wins over the root theme so its theme prop is authoritative. */
@property --bot-shell-top { syntax: '<color>'; inherits: true; initial-value: #f0eee6; }
@property --bot-shell-bottom { syntax: '<color>'; inherits: true; initial-value: #b7b7b0; }
@property --bot-shell-line { syntax: '<color>'; inherits: true; initial-value: #ffffff99; }
@property --bot-visor { syntax: '<color>'; inherits: true; initial-value: #22292b; }
@property --bot-shine { syntax: '<color>'; inherits: true; initial-value: #ffffff77; }
:root, :root[data-theme="light"], [data-material="pebble"] {
  --bot-shell-top: #f0eee6; --bot-shell-bottom: #b7b7b0; --bot-shell-line: #ffffff99; --bot-visor: #22292b;
  --bot-shine: #ffffff77;
}
:root[data-theme="dark"], [data-material="signal"] {
  --bot-shell-top: #34434b; --bot-shell-bottom: #273238; --bot-shell-line: #859397; --bot-visor: #172124;
  --bot-shine: #ffffff00;
}
/* Halo (docs/mockups/mascots-halo.html, "Contour" rendering): a glow in the state's badge colour hugging the
   silhouette. Full strength for a bot that waits or errs, softer for a live bot, none for done or read-only. */
@property --bot-halo-a { syntax: '<number>'; inherits: false; initial-value: 0; }
:root { --bot-halo-alpha: .55; --bot-halo-alpha-soft: .3; --bot-halo-spread: .32; }
:root {
  --bot-visor-line: #00000055; --bot-reflection: #ffffff; --bot-ground: #000000; --bot-readonly-line: #adb3b2;
  --bot-eye-starting: #90c7f2; --bot-eye-working: #90c7f2; --bot-eye-approval: #f2b09c; --bot-eye-question: #f6d487;
  --bot-eye-idle: #a9dfc7; --bot-eye-error: #ffab9f; --bot-eye-done: #a3aaa9;
}

/* Signal / Galet mascots, ported from docs/mockups/prototype/mascot.css and the mascot block of prototype.css.
   Colors come from tokens.css; durations come from inline variables set by Bot (scaled by VITE_LEDGE_MOTION). */

.bot {
  display: block; flex-shrink: 0; overflow: visible;
  transition:
    --bot-shell-top var(--bot-material-ms, 240ms), --bot-shell-bottom var(--bot-material-ms, 240ms),
    --bot-shell-line var(--bot-material-ms, 240ms), --bot-visor var(--bot-material-ms, 240ms),
    --bot-shine var(--bot-material-ms, 240ms), opacity 180ms;
}
.bot .shell-top { stop-color: var(--bot-shell-top); }
.bot .shell-bottom { stop-color: var(--bot-shell-bottom); }

/* Layers */
.bot .body {
  transform-origin: 48px 72px;
  animation: bot-breathe var(--bot-breath, 5.4s) ease-in-out infinite;
  animation-delay: var(--bot-phase, 0s);
}
/* The working hop (spec §6): a 480 ms hop inside a 3.6–4.4 s cycle on the group that wraps the body, so breathing and
   the hop compose. Only data-hop="true" (working, not reduced/read-only/frozen/paused) animates; the simplified crop keeps it. */
.bot .hop { transform-origin: 48px 83px; }
.bot[data-hop="true"] .hop {
  animation: bot-hop var(--bot-hop-cycle, 3.6s) linear infinite;
  animation-delay: var(--bot-phase, 0s);
}
/* Reduced motion keeps the progress signal: the antenna light pulses at the running-dot rhythm (hidden at ≤ 20 px). */
.bot[data-detailed="true"][data-reduced="true"][data-state="working"]:not([data-frozen="true"]):not([data-paused="true"]):not([data-readonly="true"]) .antenna-light {
  animation: bot-pulse 1.2s ease-in-out infinite !important;
}
.bot .pose {
  transform-origin: 48px 59px;
  transform: rotate(var(--bot-tilt, 0deg)) translateY(var(--bot-lift, 0px));
  transition: transform var(--bot-pose-ms, 300ms) var(--bot-ease);
}
.bot .gaze {
  transform: translate(var(--bot-gx, 0px), var(--bot-gy, 0px));
  transition: transform var(--bot-gaze-ms, 450ms) var(--bot-ease);
}
.bot .eye-blink { transform-origin: 48px 48px; }
.bot .eye-open, .bot .eye-happy, .bot .eye-error, .bot .eye-sleep {
  transform-origin: 48px 49px;
  transition: opacity var(--bot-eye-ms, 260ms) var(--bot-ease), transform var(--bot-eye-ms, 260ms) var(--bot-ease);
}
.bot .eye-open { fill: var(--bot-eye); }
.bot .eye-happy, .bot .eye-error, .bot .eye-sleep {
  opacity: 0; fill: none; stroke: var(--bot-eye); stroke-width: 3.4; stroke-linecap: round;
}
.bot .visor { fill: var(--bot-visor); stroke: var(--bot-visor-line); stroke-width: 1; }
.bot .shell { stroke: var(--bot-shell-line); stroke-width: .8; transition: stroke-width var(--bot-material-ms, 240ms); }
.bot .shine { fill: none; stroke: var(--bot-shine); stroke-width: 1.25; stroke-linecap: round; }
.bot .reflection { fill: var(--bot-reflection); opacity: .035; }
.bot .ground { fill: var(--bot-ground); opacity: .16; }
.bot .feet { fill: var(--bot-shell-bottom); }
.bot .antenna { stroke: var(--bot-shell-bottom); stroke-width: 2; stroke-linecap: round; }
.bot .antenna-light { fill: var(--bot-eye); }
.bot .arm {
  fill: var(--bot-shell-bottom); stroke: var(--bot-shell-line); stroke-width: .7;
  transform-origin: 75px 66px; opacity: 0;
  transition: transform var(--bot-pose-ms, 300ms) var(--bot-ease), opacity 180ms;
}

/* Material: Signal has a readable outline and no white shine; Galet keeps a light shine and a matte gradient. */
.bot[data-material="signal"] .shell { stroke-width: 1.5; }

/* Expressions */
.bot[data-eyes="wide"] .eye-open { transform: scaleY(1.2); }
.bot[data-eyes="happy"] .eye-open, .bot[data-eyes="error"] .eye-open, .bot[data-eyes="sleep"] .eye-open { opacity: 0; }
.bot[data-eyes="happy"] .eye-happy, .bot[data-eyes="error"] .eye-error, .bot[data-eyes="sleep"] .eye-sleep { opacity: 1; }
.bot[data-state="approval"] .arm { opacity: 1; transform: rotate(-22deg) translateY(-5px); transition-delay: 180ms; }
.bot[data-state="done"] { opacity: .55; }
.bot[data-state="done"] .body, .bot[data-state="error"] .body { animation: none; }

/* Halo: two drop-shadows in the state colour (the badge's and the handle tick's) hugging the silhouette. Bot sets
   --bot-size inline; the spread is a fraction of it, so the halo scales with the avatar and with the handle's zoom.
   The ground shadow hides under a halo so it does not glow. A waiting bot's halo breathes: 5 s, strength only, offset
   per bot like its breathing. Done, read-only and the `readonly` state carry no halo (data-halo is set by Bot). */
.bot[data-halo="true"] {
  --bot-halo-r: calc(var(--bot-size, 32px) * var(--bot-halo-spread, .32));
  filter:
    drop-shadow(0 0 calc(var(--bot-halo-r) * .35) color-mix(in srgb, var(--bot-halo) calc(var(--bot-halo-a) * 170%), transparent))
    drop-shadow(0 0 calc(var(--bot-halo-r) * .9) color-mix(in srgb, var(--bot-halo) calc(var(--bot-halo-a) * 90%), transparent));
}
.bot[data-halo="true"] .ground { opacity: 0; }
.bot[data-state="approval"], .bot[data-state="error"] { --bot-halo: var(--danger-text); --bot-halo-a: var(--bot-halo-alpha); }
.bot[data-state="question"] { --bot-halo: var(--warning); --bot-halo-a: var(--bot-halo-alpha); }
.bot[data-state="starting"], .bot[data-state="working"] { --bot-halo: var(--info); --bot-halo-a: var(--bot-halo-alpha-soft); }
.bot[data-state="idle"] { --bot-halo: var(--success); --bot-halo-a: var(--bot-halo-alpha-soft); }
.bot[data-halo="true"]:is([data-state="approval"], [data-state="question"]) {
  animation: bot-halo-breathe 5s ease-in-out infinite;
  animation-delay: var(--bot-phase, 0s);
}

/* Modifiers: read-only (dashed outline), frozen (connection lost), simplified (≤20 px head crop) */
.bot[data-readonly="true"] { opacity: .6; }
.bot[data-readonly="true"] .shell { stroke: var(--bot-readonly-line); stroke-width: 1.3; stroke-dasharray: 3 3; }
.bot[data-readonly="true"] .body { animation: none; }
.bot[data-frozen="true"] { opacity: .5; }
.bot[data-frozen="true"], .bot[data-frozen="true"] * { animation-play-state: paused !important; }
/* Inactive (inert) layers and explicitly paused views hold every loop in place, like the prototype's .paused rule. */
[inert] .bot, [inert] .bot *, .bot[data-paused="true"], .bot[data-paused="true"] * { animation-play-state: paused !important; }
.bot[data-simplified="true"] :is(.arm, .feet, .shine, .ground, .antenna-group) { display: none; }
.bot[data-simplified="true"] .eye-open { transform: scale(1.1); }
.bot[data-simplified="true"] .body { animation: none; }

/* Gestures, set by useBotMotion */
.bot[data-blink="true"] .eye-blink { animation: bot-blink var(--bot-blink-ms, 180ms) ease-in-out; }
.bot[data-gesture="ask"] .arm { animation: bot-ask var(--bot-ask-ms, 850ms) var(--bot-ease); }
.bot[data-gesture="nod"] .pose { animation: bot-nod var(--bot-nod-ms, 650ms) var(--bot-ease); }

/* Reduced motion: app preference / VITE_LEDGE_MOTION=0 (data-reduced) and the OS preference */
.bot[data-reduced="true"], .bot[data-reduced="true"] * { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .bot, .bot * { animation: none !important; transition: none !important; }
}

/* Respiration 4.8–6.4 s: 0.7 SVG unit up, ±0.3°, 1.4 % vertical stretch */
@keyframes bot-breathe {
  0%, 100% { transform: translateY(0) rotate(-.3deg) scaleY(1); }
  50% { transform: translateY(-.7px) rotate(.3deg) scaleY(1.014); }
}
/* 480 ms of a 3.6 s cycle = 13.3 %: anticipation squash, rise with stretch, land with squash, settle, then still. */
@keyframes bot-hop {
  0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-in; }
  1.9% { transform: translateY(0) scale(1.06, .92); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  5.9% { transform: translateY(calc(var(--bot-hop, 8px) * -1)) scale(.96, 1.06); animation-timing-function: cubic-bezier(.6, 0, .9, .4); }
  9.3% { transform: translateY(0) scale(1.05, .95); animation-timing-function: ease-out; }
  11.5% { transform: translateY(0) scale(.99, 1.01); }
  13.3%, 100% { transform: translateY(0) scale(1, 1); }
}
@keyframes bot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes bot-blink { 0%, 100% { transform: scaleY(1); } 45%, 60% { transform: scaleY(.08); } }
@keyframes bot-halo-breathe { 0%, 100% { --bot-halo-a: var(--bot-halo-alpha, .55); } 50% { --bot-halo-a: calc(var(--bot-halo-alpha, .55) * .7); } }
@keyframes bot-nod {
  0%, 100% { transform: rotate(var(--bot-tilt, 0deg)) translateY(var(--bot-lift, 0px)); }
  35% { transform: translateY(3px) rotate(5deg); }
  65% { transform: translateY(-1px) rotate(-2deg); }
}
@keyframes bot-ask {
  0%, 100% { transform: rotate(-22deg) translateY(-5px); }
  35% { transform: rotate(-42deg) translateY(-7px); }
  65% { transform: rotate(-16deg) translateY(-5px); }
}

/* Persistent layers compose transitions, tool signatures and interaction. */
.bot :is(.arrival, .signature, .touch) { transform-origin: 48px 70px; }
.bot .ground { transform-origin: 48px 88px; }
.bot[data-tool="claude"] { --bot-roll-pre: 0deg; --bot-roll-top: 0deg; --bot-roll-land: 5deg; }
.bot[data-tool="codex"] { --bot-roll-pre: -4deg; --bot-roll-top: 5deg; --bot-roll-land: 2deg; }
.bot[data-tool="cursor"] { --bot-roll-pre: -2deg; --bot-roll-top: 7deg; --bot-roll-land: 2deg; }
.bot[data-detailed="true"][data-hop="true"] .signature,
.bot[data-detailed="true"][data-hop="true"] .antenna-group,
.bot[data-detailed="true"][data-hop="true"][data-halo="false"] .ground {
  animation-duration: var(--bot-hop-cycle, 3.6s);
  animation-delay: var(--bot-phase, 0s);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.bot[data-detailed="true"][data-hop="true"] .signature { animation-name: bot-signature; }
.bot[data-detailed="true"][data-hop="true"] .antenna-group { transform-origin: 49px 22px; animation-name: bot-antenna; }
.bot[data-detailed="true"][data-hop="true"][data-halo="false"] .ground { animation-name: bot-shadow; }
.bot[data-detailed="true"] .antenna-light { filter: drop-shadow(0 0 2px var(--bot-eye)); }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .hop { animation: none; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .arrival { transform-origin: 48px 83px; animation: bot-entry-hop var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .signature { animation: bot-entry-signature var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .antenna-group { animation: bot-entry-antenna var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"][data-halo="false"] .ground { animation: bot-entry-shadow var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-transition="question"] .arrival { animation: bot-question var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="question"] .gaze { animation: bot-question-gaze var(--bot-question-ms, 650ms) var(--bot-ease); }
.bot[data-transition="idle"] .arrival { animation: bot-idle-arrival var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="error"] .arrival { animation: bot-recoil var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="done"] .eye-blink { animation: bot-close var(--bot-arrival-ms, 500ms) ease-in-out; }
.bot[data-transition="done"] .eye-open { animation: bot-close-open var(--bot-arrival-ms, 500ms) linear; }
.bot[data-transition="done"] .eye-sleep { animation: bot-close-sleep var(--bot-arrival-ms, 500ms) linear; }
.bot[data-transition="done"] .arrival { animation: bot-settle var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-touch="true"] .touch { animation: bot-touch var(--bot-touch-ms, 360ms) var(--bot-ease); }
.bot[data-idle="look"] .gaze { animation: bot-idle-look var(--bot-idle-ms, 1700ms) ease-in-out; }
.bot[data-idle="stretch"] .arrival { animation: bot-stretch var(--bot-idle-ms, 1700ms) ease-in-out; }
.bot[data-idle="tilt"] .arrival { animation: bot-idle-tilt var(--bot-idle-ms, 1700ms) ease-in-out; }
.bot[data-hover="true"] .gaze { animation: none; transition-duration: 220ms; }
/* A scaled full SVG also keeps only the work hop at ≤20 px. */
.bot[data-detailed="false"], .bot[data-detailed="false"] * { animation: none !important; transition: none !important; }
.bot[data-detailed="false"][data-hop="true"] .hop {
  animation: bot-hop var(--bot-hop-cycle, 3.6s) linear infinite !important;
  animation-delay: var(--bot-phase, 0s) !important;
}
.bot[data-suspended="true"], .bot[data-suspended="true"] * { animation-play-state: paused !important; transition: none !important; }
.bot[data-paused="true"] *, .bot[data-frozen="true"] *, [inert] .bot *, .bot[data-readonly="true"] * { transition: none !important; }
.bot[data-readonly="true"] *, .bot[data-reduced="true"] * { animation: none !important; }

@keyframes bot-entry-hop {
  0%, 100% { transform: translateY(0) scale(1); }
  14% { transform: scale(1.06,.92); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
  44% { transform: translateY(calc(var(--bot-hop) * -1)) scale(.96,1.06); animation-timing-function: cubic-bezier(.6,0,.9,.4); }
  70% { transform: scale(1.05,.95); animation-timing-function: ease-out; }
}
@keyframes bot-question { 0% { transform: rotate(-5deg); } 50% { transform: rotate(2deg); } 100% { transform: rotate(0deg); } }
@keyframes bot-question-gaze { 0%, 30%, 100% { transform: translate(0,0); } 60% { transform: translate(2px,-1px); } }
@keyframes bot-idle-arrival { 0%, 100% { transform: scale(1); } 40% { transform: translateY(-2px) scale(.98,1.04); } 70% { transform: scale(1.03,.97); } }
@keyframes bot-recoil { 0%, 100% { transform: translateX(0); } 40% { transform: translateX(-3px) rotate(-3deg); } }
@keyframes bot-close { 0%, 100% { transform: scaleY(1); } 25% { transform: scaleY(.5); } 45% { transform: scaleY(.65); } 70% { transform: scaleY(.12); } }
@keyframes bot-close-open { 0%, 60% { opacity: 1; } 70%, 100% { opacity: 0; } }
@keyframes bot-close-sleep { 0%, 60% { opacity: 0; } 70%, 100% { opacity: 1; } }
@keyframes bot-settle { 0% { transform: translateY(-1px); } 100% { transform: translateY(0); } }
@keyframes bot-touch { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.07,.92); } 65% { transform: scale(.97,1.04); } }
@keyframes bot-idle-look { 0%, 100% { transform: translateX(0); } 35%, 65% { transform: translateX(2px); } }
@keyframes bot-stretch { 0%, 100% { transform: scale(1); } 50% { transform: scale(.98,1.04); } }
@keyframes bot-idle-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-2deg); } }

@keyframes bot-signature {
  0%, 13.3%, 100% { transform: rotate(0deg); }
  1.9% { transform: rotate(var(--bot-roll-pre)); }
  5.9% { transform: rotate(var(--bot-roll-top)); }
  9.3% { transform: rotate(var(--bot-roll-land)); }
}

@keyframes bot-antenna {
  0%, 13.3%, 100% { transform: rotate(0deg); }
  1.9% { transform: rotate(0deg); }
  5.9% { transform: rotate(-3deg); }
  9.3% { transform: rotate(3deg); }
}

@keyframes bot-shadow {
  0%, 13.3%, 100% { transform: scaleX(1); opacity: .16; }
  1.9% { transform: scaleX(.9); }
  5.9% { transform: scaleX(.72); opacity: .07; }
  9.3% { transform: scaleX(.95); }
}

@keyframes bot-entry-signature {
  0%, 100% { transform: rotate(0deg); }
  14% { transform: rotate(var(--bot-roll-pre)); }
  44% { transform: rotate(var(--bot-roll-top)); }
  70% { transform: rotate(var(--bot-roll-land)); }
}

@keyframes bot-entry-antenna {
  0%, 100% { transform: rotate(0deg); }
  14% { transform: rotate(0deg); }

/* Native controls (radios, checkboxes, scrollbars) follow the theme inside the overlay's own boxes only: on the root it
   would paint the transparent window's canvas. */
:root[data-theme="dark"] [data-surface], :root[data-theme="dark"] [data-coachmark] { color-scheme: dark; }
:root[data-theme="light"] [data-surface], :root[data-theme="light"] [data-coachmark] { color-scheme: light; }
html, body, #root { margin: 0; height: 100%; background: transparent; }
body { font-family: 'Geist', system-ui, sans-serif; color: var(--sidebar-foreground); font-size: 14px; line-height: 20px; overflow: hidden; }
/* The page never scrolls: a fixed, clipping root adds nothing to the document's scrollable overflow, so a control taking
   focus while the native window is still at the island's height (a keyboard open grows it after the first paint) scrolls
   only its own list, never the page out of the window's top. A hidden body alone still scrolls programmatically. */
#root { position: fixed; inset: 0; overflow: clip; }
.mono { font-family: 'Geist Mono', ui-monospace, monospace; }
button, input { font-family: inherit; }
/* The bubble countdown drains from the controller's remainder (--ledge-from) to empty. */
/* The update card's running step, and the island's busy pip. */
@keyframes ledge-spin { to { transform: rotate(360deg) } }
@keyframes ledge-pulse { 50% { opacity: .35 } }
/* The live tool line's outcome mark (src/surface/LiveToolLine.tsx) pops in where the spinner was. */
@keyframes ledge-mark-in { from { transform: scale(.4); opacity: 0 } }
.ledge-spin { animation: ledge-spin .9s linear infinite }
@media (prefers-reduced-motion: reduce) { .ledge-spin { animation: none } }
@keyframes ledge-drain { from { width: var(--ledge-from, 100%) } to { width: 0% } }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.dnd-switch:has(input:focus-visible) .dnd-track, .ledge-seg:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.ledge-opt:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
/* Text fields (launch form, reply): no focus ring, the caret shows where you type. */
.ledge-field:focus, .ledge-field:focus-visible { outline: none; }
/* Buttons: variant colors, hover and disabled states (tokens only). */
.ledge-btn { cursor: pointer; border: 1px solid transparent; }
.ledge-btn[data-variant="primary"] { background: var(--primary); color: var(--primary-foreground); }
.ledge-btn[data-variant="outline"] { background: transparent; color: var(--sidebar-foreground); border-color: var(--input); }
.ledge-btn[data-variant="ghost"] { background: transparent; color: var(--muted-foreground); }

.ledge-btn[data-variant="primary"]:hover:not(:disabled) { background: var(--primary-hover); }
.ledge-btn[data-variant="outline"]:hover:not(:disabled),
.ledge-btn[data-variant="ghost"]:hover:not(:disabled) { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.ledge-btn[data-variant="secondary"]:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
button:disabled { opacity: .5; cursor: not-allowed; }
/* Thin, token-coloured scrollbars on every scrolling area (list, session content, terminal preview, settings, help):
   a muted thumb on a transparent track, as in the mockup's views. */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted-foreground) 45%, transparent) transparent; }
/* A text toggle (the list footer's do-not-disturb). */
.ledge-text-btn:hover { color: var(--sidebar-foreground) !important; }
.ledge-text-btn[aria-pressed="true"]:hover { color: var(--sidebar-primary) !important; }
/* Question options: radio cards, the chosen one with a red border, a red tint and a red radio. */
.ledge-opt input[type="radio"], .ledge-check input[type="checkbox"] { accent-color: var(--sidebar-primary); }
.ledge-opt[data-checked] { border-color: var(--sidebar-primary) !important; background-color: color-mix(in srgb, var(--sidebar-primary) 8%, transparent) !important; }
textarea::placeholder, .ledge-field::placeholder { color: var(--muted-foreground); }
/* The launch form's recent folders: rows that light up on hover like list rows. */
.ledge-recent:hover { background: var(--sidebar-accent) !important; }
/* The session's terminal strip (src/surface/TerminalBand.tsx): its dot breathes while the agent works. */
.ledge-band:hover { filter: brightness(1.15); }
.ledge-band-live { animation: ledge-pulse 1.6s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { .ledge-band-live { animation: none } }
/* A row's remove button shows on hover or keyboard focus of the row only (it stays in the tab order). */

.ledge-row:hover .ledge-row-dismiss, .ledge-row:focus-within .ledge-row-dismiss { opacity: 1; }

/* Atelier: Ledge's desk, the tables and "Sans projet" are tiles of one mosaic that fills the space (zoom set in App). */
.overview-scroll.atelier .office-shell{display:flex;flex-wrap:wrap;align-content:space-evenly;justify-content:center;gap:0 12px;padding:44px 56px}

/* Navigating the atelier like a canvas: zoom controls, drag to pan. */
.workspace{position:relative}
.zoom-controls{position:absolute;right:28px;bottom:58px;z-index:6;display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--border);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--popover) 92%,transparent);backdrop-filter:blur(6px);box-shadow:var(--shadow-overlay)}

.zoom-level{min-width:52px;height:30px;font:12px 'Geist Mono',monospace;color:var(--foreground);border-radius:var(--radius-sm)}
.zoom-level:hover{background:var(--accent)}
.zoom-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.zoom-hint{font-size:10px;color:var(--muted-foreground);padding:0 8px 0 6px;white-space:nowrap}

.overview-scroll.atelier.can-pan,.overview-scroll.atelier.can-pan *{cursor:grab!important}
.overview-scroll.atelier.panning,.overview-scroll.atelier.panning *{cursor:grabbing!important;user-select:none}
/* The floor grid belongs to the view, not the content: it fills the whole area and never zooms or moves
   (default background attachment on the scroller); only the content scales and pans over it. */
.overview-scroll.atelier{--office-floor:color-mix(in srgb,var(--sidebar) 97%,var(--warning));padding:0!important;background:repeating-linear-gradient(90deg,transparent 0,transparent 89px,var(--border) 90px,transparent 91px),repeating-linear-gradient(0deg,transparent 0,transparent 89px,var(--border) 90px,transparent 91px),var(--office-floor);box-shadow:inset 0 -2px 10px color-mix(in srgb,var(--foreground) 3%,transparent);border-top:1px solid var(--border)}
.overview-scroll.atelier .office-shell{background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}
.overview-scroll.atelier .workspace-legend{padding:12px 26px 14px}
/* The legend is pinned to the page's bottom-left corner, out of the zoomed and panned content
   (its containing block is .workspace, so the scroller neither scrolls nor clips it). */
.overview-scroll.atelier .workspace-legend{position:absolute;left:28px;bottom:58px;z-index:6;padding:8px 14px!important;gap:14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--popover) 92%,transparent);backdrop-filter:blur(6px);box-shadow:var(--shadow-overlay)}
.overview-scroll.atelier .workspace-legend .spacer{display:none}
.overview-scroll.atelier.fitted{overflow:hidden}
/* Room for the pinned legend and zoom bar, outside the zoom (the floor grid still covers it). */
.overview-scroll.atelier{padding-bottom:76px!important}
/* Heading carries the view controls now that the project select is gone; a single project gets a way back. */
.view-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.view-title{min-width:0}
.view-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:auto}
.view-actions-sep{width:1px;height:20px;background:var(--border);margin:0 6px}
/* A single project is a filter on the atelier: a chip in the project's colour next to the title, × (or Échap) clears it. */
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.project-filter{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 4px 0 10px;border:1px solid var(--input);border-radius:999px;background:var(--secondary);font-size:13px;font-weight:500}
.project-filter .side-swatch{margin:0}
.project-filter .filter-none{width:9px;height:9px;border-radius:3px;border:1.5px dashed var(--muted-foreground)}
.project-filter button{width:22px;height:22px;display:grid;place-items:center;border-radius:999px;color:var(--muted-foreground)}
.project-filter button:hover{background:var(--accent);color:var(--foreground)}
.project-filter button:focus-visible{outline:2px solid var(--ring)}
.crumb-link{color:var(--muted-foreground)}.crumb-link:hover{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
.zoom-controls{z-index:12}.overview-scroll.atelier .workspace-legend{z-index:11}
/* With the chat docked the workspace narrows: the zoom bar drops its hint and the legend its footnote so they never meet. */
.prototype:has(.ledge-chat-panel) .zoom-hint,.prototype:has(.ledge-chat-panel) .workspace-legend>span:last-child{display:none}
/* The page heading is gone: the breadcrumb says where we are, and the view controls sit in the top bar. */
.app-header{gap:12px}
.app-header .breadcrumb{min-width:0;flex-shrink:1}
.header-view{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
.header-view .view-tabs [role=tablist]{height:32px}
.header-view+.header-actions{margin-left:8px}
.app-header .project-filter{height:26px;font-size:12px}
@media(max-width:1250px){.header-view>.ledge-btn{padding-inline:8px}}
@media(max-width:1100px){.app-header .overlay-state{display:none}}
.app-header .project-filter>span,.app-header .ledge-btn,.side-actions .ledge-btn{white-space:nowrap}
@media(max-width:1250px){.side-actions .ledge-btn kbd{display:none}.app-header .header-actions>.ledge-btn[data-variant=outline]{font-size:0;gap:0;padding:0 9px}.app-header .header-actions>.ledge-btn[data-variant=outline] svg{margin:0}}
.app-header .breadcrumb{overflow:hidden}
.app-header .project-filter{min-width:0}.app-header .project-filter>span{overflow:hidden;text-overflow:ellipsis;max-width:180px}
@media(max-width:1250px){.header-view .long-label{display:none}}
.header-view .short-label{display:none}
@media(max-width:1250px){.header-view .short-label{display:inline}}
/* Top bar, icon-only and grouped: view (Atelier / Liste) · display (sub-agents, freeze) · tools (search, chat, help) · full screen. */
.header-view{gap:4px}
.icon-tabs{display:flex;padding:2px;gap:2px;border-radius:var(--radius-md);background:var(--muted);border:1px solid var(--input)}
.icon-tabs button{width:32px;height:28px;display:grid;place-items:center;border-radius:calc(var(--radius-md) - 2px);color:var(--muted-foreground)}
.icon-tabs button:hover{color:var(--foreground)}
.icon-tabs button[aria-selected=true]{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px color-mix(in srgb,var(--foreground) 12%,transparent)}
.icon-tabs button:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.header-view .ledge-btn[aria-pressed=true]{color:var(--foreground)}
.header-view .ledge-btn[aria-pressed=false]{color:var(--muted-foreground)}
.header-actions{display:flex;align-items:center;gap:2px}

.footer-status{display:flex;align-items:center;gap:16px}
.footer-status>span{display:flex;align-items:center;gap:6px}

/* Session page: the project's agents in a rail on the left, the conversation, and the terminal only when asked for. */
.conversation-workspace{grid-template-columns:240px minmax(0,1fr)!important}
.conversation-workspace.with-terminal{grid-template-columns:240px minmax(0,1.15fr) minmax(0,1fr)!important}
.project-rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--sidebar)}
.rail-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:500}
.rail-head>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-head small{font:10px 'Geist Mono',monospace;color:var(--muted-foreground)}
.rail-head .side-swatch{margin:0}.rail-head .filter-none{width:9px;height:9px;border-radius:3px;border:1.5px dashed var(--muted-foreground)}
.rail-list{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.rail-agent{position:relative;display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--radius-md);text-align:left;color:var(--muted-foreground)}
.rail-agent:hover{background:var(--sidebar-accent);color:var(--foreground)}
.rail-agent.current{background:var(--sidebar-accent);color:var(--foreground);box-shadow:inset 2px 0 0 var(--sidebar-primary)}
.rail-agent>span{flex:1;min-width:0;display:flex;flex-direction:column}
.rail-agent strong{font-size:12px;font-weight:500;color:var(--foreground)}

.rail-agent.child{padding-left:24px}
.rail-agent.child:before{content:'';position:absolute;left:14px;top:0;bottom:50%;width:7px;border-left:1px solid var(--input);border-bottom:1px solid var(--input);border-bottom-left-radius:4px}
.rail-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--info)}

.rail-dot.question{background:var(--warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 25%,transparent)}
.rail-dot.done{background:var(--muted-foreground);opacity:.5}.rail-dot.off{background:none;border:1px solid var(--muted-foreground)}
.rail-new{display:flex;align-items:center;gap:6px;margin:6px;padding:8px;border:1px dashed var(--input);border-radius:var(--radius-md);font-size:12px;color:var(--muted-foreground)}
.rail-new:hover{color:var(--foreground);border-color:var(--ring)}
.session-identity .ledge-btn{margin-left:10px}
@media(max-width:1000px){.conversation-workspace,.conversation-workspace.with-terminal{grid-template-columns:minmax(0,1fr)!important}.project-rail{display:none}}
.session-heading{padding-top:18px}
/* Several sub-agents on one parent: the sticky note counts the others. */
.note-more{position:absolute;right:-6px;bottom:-6px;min-width:16px;height:14px;padding:0 3px;border-radius:999px;background:var(--card);border:1px solid var(--input);font:600 8px/12px 'Geist Mono',monospace;font-style:normal;text-align:center;color:var(--foreground)}
/* Overflow, on the rug's bottom-right corner (mirror of the project label): who else sits at this table. */

.more-faces{display:flex}
.more-faces i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--secondary);border:1.5px solid var(--sidebar);margin-left:-7px;overflow:hidden}

/* Sub-agents live only in the rail, grouped under their parent behind a "Sous-agents" caption and a tree line. */
.rail-kids{position:relative;margin:0 0 4px 20px;padding:2px 0 2px 10px;border-left:1px dashed var(--input);border-radius:0 0 0 6px;transition:background .3s}
.rail-kids-label{display:flex;align-items:center;gap:5px;padding:3px 6px 2px;font:500 10px/14px 'Geist Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}

/* Session in the top bar: the breadcrumb ends with the agent and its task; status and the terminal toggle sit on the right. */

.pane-meta{margin-left:10px;font-size:10px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.app-header .breadcrumb{flex:1 1 auto}

 .side-count{position:absolute;top:2px;right:2px;min-width:14px;height:14px;font-size:8px}}

/* Starting a session: the instruction first, the harness by its bot, then where it runs. */

.composer-label{display:block;font-size:11px;font-weight:500;color:var(--muted-foreground);margin-bottom:8px;padding:0}

.composer-where{display:flex;flex-direction:column;gap:14px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--well)}
.chip-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip-group legend{width:100%}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;background:var(--card);cursor:pointer;color:var(--muted-foreground)}
.chip:hover{color:var(--foreground);border-color:var(--input)}
.chip.selected{color:var(--foreground);border-color:var(--foreground);background:var(--accent)}
.chip:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:2px}
.chip.disabled{opacity:.5;cursor:not-allowed}
.chip small{font-size:10px;color:var(--muted-foreground)}
.chip .side-swatch{margin:0}
.chip .machine-dot{margin:0}
.chip-note{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--muted-foreground)}
.chip-group[aria-invalid=true] .chip{border-color:color-mix(in srgb,var(--destructive) 60%,var(--border))}
.composer-footer{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.composer-preview{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-size:12px}
.composer-preview>span{display:flex;flex-direction:column;min-width:0}
.composer-preview small{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-empty{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--input);flex-shrink:0}
.composer-missing{font-size:11px;color:var(--destructive);white-space:nowrap}
.composer-footer .ledge-btn kbd{margin-left:4px;font-size:9px!important;background:color-mix(in srgb,var(--primary-foreground) 15%,transparent)!important;color:inherit!important;border-color:transparent!important}
.composer-footer [aria-disabled=true]{opacity:.55}
.composer-demo{margin:0;padding:0 20px 12px;font-size:10px;color:var(--muted-foreground);text-align:right}
@media(max-width:700px){.composer-tools{grid-template-columns:1fr}.composer-footer{flex-wrap:wrap}.composer-preview{flex-basis:100%}}

/* Ledge chat, docked to the right of the workspace so the tables stay in view. */
.ledge-chat-panel{width:400px;flex-shrink:0;position:relative;display:flex;flex-direction:column;border-left:1px solid var(--sidebar-border);background:var(--sidebar)}
.ledge-chat-panel .chat-drawer-content{position:relative;flex:1;min-height:0}
.ledge-chat-panel [aria-label="Retour aux sessions"]{display:none!important}
.ledge-chat-panel a[href^="ledge://session/"]{color:var(--sidebar-primary);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
@media(max-width:1250px){.ledge-chat-panel{width:340px}}
@media(max-width:900px){.ledge-chat-panel{position:fixed;inset:32px 0 0 auto;width:min(400px,100vw);z-index:4;box-shadow:var(--shadow-overlay)}}
/* A name hovered in the chat lights its agent at its table. */
.chat-hover{background:color-mix(in srgb,var(--sidebar-primary) 14%,transparent)!important;outline:2px solid var(--sidebar-primary);outline-offset:2px;border-radius:var(--radius-md)}
.chat-hover .ledge-bot,.chat-hover svg{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--sidebar-primary) 60%,transparent))}

/* Plants around the tables: several species, in different free spots of each rug. */
.plants{position:absolute;top:-6px;bottom:6px;pointer-events:none;z-index:2;--p-line:var(--input);--p-leaf:color-mix(in srgb,var(--success) 70%,#14532d);--p-leaf-2:color-mix(in srgb,var(--success) 55%,#365314);--p-pot:linear-gradient(110deg,var(--muted-foreground),var(--secondary))}
.plant-spot{position:absolute;display:block}
.plant-spot>span{position:relative;display:block}
.plant-spot.flip>span{transform:scaleX(-1)}
.plants i,.plants b,.plants em{position:absolute;display:block}
.spot-tl{left:14px;top:8px}
.spot-tr{right:14px;top:8px}
.spot-br{right:18px;bottom:10px}
.spot-ml{left:10px;top:calc(50% - 26px)}
.spot-mr{right:10px;top:calc(50% - 26px)}
/* Shared pot */
.plants b{bottom:0;border:1px solid var(--p-line);border-radius:3px 3px 8px 8px;background:var(--p-pot);box-shadow:3px 5px 3px color-mix(in srgb,var(--foreground) 10%,transparent)}

.p-monstera{width:58px;height:64px}
.p-monstera b{left:16px;width:26px;height:20px}
.p-monstera i{bottom:16px;left:24px;width:20px;height:30px;transform-origin:bottom center;border-radius:80% 10% 80% 10%;background:var(--p-leaf);border:1px solid color-mix(in srgb,var(--success) 40%,var(--border));animation:p-sway 6s ease-in-out infinite}
.p-monstera i:nth-child(1){transform:rotate(-55deg)}.p-monstera i:nth-child(2){transform:rotate(-20deg);height:38px}.p-monstera i:nth-child(3){transform:rotate(15deg);height:36px;animation-delay:-2s}.p-monstera i:nth-child(4){transform:rotate(50deg)}.p-monstera i:nth-child(5){transform:rotate(-82deg);height:22px}


.p-fern{width:62px;height:50px}
.p-fern b{left:19px;width:24px;height:16px;border-radius:50% 50% 8px 8px/20% 20% 8px 8px}
.p-fern i{left:29px;bottom:12px;width:5px;height:34px;transform-origin:bottom center;border-radius:50%;background:repeating-linear-gradient(0deg,var(--p-leaf-2) 0 3px,transparent 3px 5px),var(--p-leaf-2);opacity:.95;animation:p-sway 7s ease-in-out infinite}
.p-fern i:nth-child(1){transform:rotate(-70deg);height:28px}.p-fern i:nth-child(2){transform:rotate(-45deg)}.p-fern i:nth-child(3){transform:rotate(-18deg);height:36px}.p-fern i:nth-child(4){transform:rotate(4deg);height:38px;animation-delay:-3s}.p-fern i:nth-child(5){transform:rotate(26deg);height:34px}.p-fern i:nth-child(6){transform:rotate(50deg)}.p-fern i:nth-child(7){transform:rotate(72deg);height:26px}

.p-snake{width:36px;height:66px}
.p-snake b{left:5px;width:26px;height:18px;border-radius:3px}
.p-snake i{bottom:16px;width:8px;border-radius:50% 50% 2px 2px/90% 90% 2px 2px;background:linear-gradient(90deg,color-mix(in srgb,#eab308 50%,var(--p-leaf)) 0 15%,var(--p-leaf) 15% 85%,color-mix(in srgb,#eab308 50%,var(--p-leaf)) 85%)}
.p-snake i:nth-child(1){left:6px;height:34px;transform:rotate(-10deg)}.p-snake i:nth-child(2){left:13px;height:48px}.p-snake i:nth-child(3){left:20px;height:40px;transform:rotate(8deg)}.p-snake i:nth-child(4){left:25px;height:26px;transform:rotate(18deg)}

.p-ficus{width:48px;height:80px}
.p-ficus b{left:12px;width:24px;height:18px}
.p-ficus em{left:23px;bottom:16px;width:3px;height:34px;background:color-mix(in srgb,#78350f 70%,var(--muted-foreground));border-radius:2px}
.p-ficus i{width:28px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--p-leaf) 70%,#bef264),var(--p-leaf));border:1px solid color-mix(in srgb,var(--success) 35%,var(--border));animation:p-sway 8s ease-in-out infinite}
.p-ficus i:nth-child(1){left:4px;top:8px}.p-ficus i:nth-child(2){left:18px;top:0;animation-delay:-2s}.p-ficus i:nth-child(3){left:14px;top:18px;width:24px;height:20px}.p-ficus i:nth-child(4){left:0;top:24px;width:20px;height:16px;animation-delay:-5s}

.p-succulent{width:44px;height:32px}
.p-succulent b{left:4px;width:36px;height:14px;border-radius:4px 4px 12px 12px;background:color-mix(in srgb,var(--info) 30%,var(--secondary))}
.p-succulent i{bottom:10px;width:12px;height:16px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:color-mix(in srgb,#5eead4 40%,var(--p-leaf));border:1px solid color-mix(in srgb,var(--success) 35%,var(--border));transform-origin:bottom center}
.p-succulent i:nth-child(1){left:6px;transform:rotate(-40deg)}.p-succulent i:nth-child(2){left:12px;transform:rotate(-15deg);height:19px}.p-succulent i:nth-child(3){left:17px;height:21px}.p-succulent i:nth-child(4){left:22px;transform:rotate(15deg);height:19px}.p-succulent i:nth-child(5){left:27px;transform:rotate(40deg)}

@keyframes p-sway{0%,100%{rotate:0deg}50%{rotate:3deg}}
.office-paused .plants *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.plants *{animation:none!important}}
/* The plants' layer follows the rug's skew so each spot sits on the rug; each plant is counter-skewed to stand upright. */
.plants{transform:skewY(-4deg)}
.plant-spot>span{transform:skewY(4deg)}
.plant-spot.flip>span{transform:skewY(4deg) scaleX(-1)}
.spot-tl{left:20px;top:16px}.spot-tr{right:20px;top:16px}.spot-br{right:22px;bottom:18px}.spot-ml{left:16px}.spot-mr{right:16px}

/* Réglages: one page for the island and Ledge Desktop. Left, the sections; right, cards of rows. */
.side-footer{padding:8px 12px 12px;border-top:1px solid var(--sidebar-border)}
.side-footer .side-row>svg{color:var(--muted-foreground)}
.side-footer .side-row.active>svg{color:var(--sidebar-primary)}
.crumb-link{font-size:12px;color:var(--muted-foreground);border-radius:4px}
.crumb-link:hover{color:var(--foreground)}
button.overlay-state{padding:4px 6px;border-radius:var(--radius-sm)}
button.overlay-state:hover{background:var(--sidebar-accent);color:var(--foreground)}
.overlay-state.off i{background:none;border:1px solid var(--muted-foreground)}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.settings-page{flex:1;min-height:0;display:flex}
.settings-nav{width:224px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding:16px 12px;border-right:1px solid var(--border);overflow:auto}
.settings-back{justify-content:flex-start!important;margin:0 0 12px;color:var(--muted-foreground);white-space:nowrap}
.settings-back kbd{margin-left:auto;font-size:9px!important}
.settings-tab{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted-foreground);flex-shrink:0}
.settings-tab>span{flex:1;white-space:nowrap}
.settings-tab:hover{background:var(--sidebar-accent);color:var(--foreground)}
.settings-tab.active{background:var(--sidebar-accent);color:var(--foreground);font-weight:500}
.settings-tab.active>svg{color:var(--sidebar-primary)}
.settings-scroll{flex:1;min-width:0;overflow:auto}
.settings-content{max-width:760px;padding:28px 32px 56px;display:flex;flex-direction:column;gap:18px}
.settings-head h1{margin:0 0 4px;font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.5px}
.settings-head p{margin:0;font-size:13px;color:var(--muted-foreground)}

.set-card{border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--sidebar)}
.set-card>h2{margin:0;padding:14px 18px 0;font-size:13px;font-weight:600}
.set-card-note{margin:4px 18px 0;font-size:12px;line-height:18px;color:var(--muted-foreground)}
.set-card-note strong{color:var(--foreground);font-weight:500}
.set-rows{display:flex;flex-direction:column;padding:4px 18px}
.set-row{display:flex;align-items:center;gap:20px;padding:14px 0;min-width:0}
.set-row+.set-row,.set-rows>*+.set-row,.set-fieldset .set-row{border-top:1px solid var(--border)}
.set-fieldset>.set-row:first-of-type{border-top:1px solid var(--border)}
.set-row.stack{flex-direction:column;align-items:stretch;gap:10px}
.set-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.set-label{font-size:13px;font-weight:500;line-height:18px}
.set-hint{font-size:12px;line-height:17px;color:var(--muted-foreground)}
.set-hint code,.set-well code,.set-card-note code{font:11px 'Geist Mono',monospace;color:var(--foreground);background:var(--well);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.set-control{flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;min-width:0;max-width:60%}
.set-row.stack .set-control{max-width:none;justify-content:flex-start;flex-direction:column;align-items:stretch;gap:10px}
.set-inline{display:flex;align-items:center;gap:8px}
.set-error{font-size:12px;color:var(--danger-text)}
.set-warn{color:var(--warning);font-weight:500}
.set-footnote{margin:0 4px;font-size:12px;line-height:18px;color:var(--muted-foreground)}
.set-fieldset{border:0;margin:0;padding:0;min-width:0}
.set-fieldset:disabled .set-row{opacity:.5}
.set-tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;color:var(--muted-foreground);background:var(--accent);white-space:nowrap}
.set-tag.ok{color:var(--success);background:var(--status-success-soft)}
.set-tag.warn{color:var(--warning);background:var(--status-warning-soft);margin-left:8px}

/* Switch: a button with role="switch"; the thumb follows aria-checked. */
.set-switch{position:relative;width:36px;height:20px;flex-shrink:0;border-radius:999px!important;background:var(--muted)!important;border:1px solid var(--input)!important;transition:background-color .15s}
.set-switch i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted-foreground);transition:left .15s,background-color .15s}
.set-switch[aria-checked=true]{background:var(--sidebar-primary)!important;border-color:transparent!important}
.set-switch[aria-checked=true] i{left:18px;background:var(--primary-foreground)}
.set-switch:disabled{opacity:.45}

/* Segmented: native radios in a radiogroup. */
.set-seg{display:inline-flex;padding:2px;gap:2px;border-radius:var(--radius-md);background:var(--muted);border:1px solid var(--input);max-width:100%}
.set-seg label{position:relative;flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:calc(var(--radius-md) - 2px);font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted-foreground);cursor:pointer;transition:background-color .15s,color .15s}
.set-seg label.wide{flex-grow:1.5}
.set-seg label:hover{color:var(--foreground)}
.set-seg label.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0/.18)}
.set-seg label:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:1px}
.set-seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.set-seg[aria-disabled=true]{opacity:.5}
.set-seg[aria-disabled=true] label{cursor:not-allowed}
.set-row.stack .set-seg{display:flex;width:100%;max-width:560px}
.set-seg .ledge-bot,.set-seg svg{flex-shrink:0}
.set-row.stack .set-seg label{height:34px}

.set-input{height:32px;padding:0 10px;font-size:13px;background:var(--well)!important}
.set-input.hex{width:96px}
.set-input[aria-invalid=true]{border-color:var(--destructive)}
input[type=checkbox]{accent-color:var(--sidebar-primary);width:16px;height:16px;margin:0}
input[type=color]{width:34px;height:32px;padding:2px;border-radius:var(--radius-md);cursor:pointer;background:var(--well)}

.set-banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-lg);border:1px solid color-mix(in srgb,var(--sidebar-primary) 35%,var(--border));background:color-mix(in srgb,var(--sidebar-primary) 8%,var(--sidebar))}
.set-banner>svg{color:var(--sidebar-primary);margin-top:2px}
.set-banner div{display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:18px;color:var(--muted-foreground)}
.set-banner strong{font-size:13px;color:var(--foreground);font-weight:600}

/* Appearance */
.theme-picks{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:10px}
.theme-pick{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;background:var(--card)}
.theme-pick:hover{border-color:var(--input)}
.theme-pick.on{border-color:var(--sidebar-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--sidebar-primary) 15%,transparent)}
.theme-pick:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:2px}
.theme-pick input,.accent-swatches input,.day-chips input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.theme-swatch{width:52px;height:44px;border-radius:var(--radius-md);display:grid;place-items:center;border:1px solid var(--border)}
.theme-pick[data-preview=light] .theme-swatch{background:#f6f6f5}
.theme-pick[data-preview=dark] .theme-swatch{background:#1a1a1a}
.theme-pick>span:last-child{display:flex;flex-direction:column}
.theme-pick strong{font-size:13px;font-weight:500}
.theme-pick small{font-size:11px;color:var(--muted-foreground)}
.accent-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.accent-swatches{display:flex;gap:6px;margin-right:4px}
.accent-swatches label{position:relative;width:24px;height:24px;border-radius:50%;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgb(0 0 0/.15)}
.accent-swatches label.on{box-shadow:0 0 0 2px var(--sidebar),0 0 0 4px var(--c)}
.accent-swatches label:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:4px}
.accent-sample{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-md);background:var(--well);border:1px solid var(--border)}

/* Island preview: two screens, the island on the chosen one. */
.island-preview{margin:0;display:flex;flex-direction:column;gap:10px}
.preview-desk{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:18px 14px 12px;border-radius:var(--radius-lg);background:var(--well);border:1px solid var(--border)}
.preview-screen{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.preview-glass{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:3px solid color-mix(in srgb,var(--foreground) 22%,var(--background));background:linear-gradient(160deg,color-mix(in srgb,var(--info) 30%,var(--muted)),color-mix(in srgb,var(--sidebar-primary) 22%,var(--muted)))}
.preview-screen:not(.here) .preview-glass{opacity:.6}
.preview-caption{font-size:10px;color:var(--muted-foreground);white-space:nowrap}
.preview-caption strong{color:var(--foreground);font-weight:500}
.preview-notch{position:absolute;top:0;height:calc(18px*var(--k));min-width:calc(78px*var(--k));padding:0 calc(8px*var(--k));display:flex;align-items:center;gap:calc(4px*var(--k));border-radius:0 0 calc(10px*var(--k)) calc(10px*var(--k));background:#000;transform:translateX(-50%);transition:left .3s,height .2s,min-width .2s}
:root[data-theme=light] .preview-notch{background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25)}
.preview-notch.pos-center{left:50%}.preview-notch.pos-left{left:25%}.preview-notch.pos-right{left:75%}
.preview-notch.strip{height:3px;min-width:48px;padding:0;border-radius:0 0 3px 3px}
.preview-notch i{width:calc(5px*var(--k));height:calc(5px*var(--k));border-radius:50%}
.preview-notch .d-approval{background:var(--sidebar-primary)}.preview-notch .d-question{background:var(--warning)}.preview-notch .d-working{background:var(--info)}
.preview-mascot{display:flex;margin-right:auto}
.preview-bubble{position:absolute;top:calc(24px*var(--k,1));transform:translateX(-50%);padding:3px 7px;border-radius:6px;font-size:8px;line-height:11px;white-space:nowrap;background:var(--popover);color:var(--foreground);box-shadow:0 2px 6px rgb(0 0 0/.25);transition:left .3s}
.preview-bubble.pos-center{left:50%}.preview-bubble.pos-left{left:25%}.preview-bubble.pos-right{left:75%}
.preview-window{position:absolute;inset:0;background:var(--background);display:flex;flex-direction:column;gap:5px;padding:16px 10px}
.preview-window i{height:5px;border-radius:3px;background:var(--muted)}
.preview-window i:nth-child(2){width:70%}.preview-window i:nth-child(3){width:45%}
.island-preview figcaption{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted-foreground)}
.island-preview figcaption>span{flex:1}

.key-recorder{display:inline-flex;align-items:center;gap:10px;height:32px;padding:0 6px 0 8px;border:1px solid var(--input)!important;border-radius:var(--radius-md);font-size:12px;color:var(--muted-foreground)}
.key-recorder span{padding:0 6px;border-left:1px solid var(--border)}
.key-recorder:hover{color:var(--foreground);border-color:var(--ring)!important}
.key-recorder.recording{border-color:var(--sidebar-primary)!important;color:var(--foreground);box-shadow:0 0 0 3px color-mix(in srgb,var(--sidebar-primary) 18%,transparent)}
.key-recorder:disabled{opacity:.5}

/* Notifications */
.time-range{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.time-range label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground)}
.day-chips{display:flex;gap:6px}
.day-chips label{position:relative;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted-foreground);cursor:pointer;background:var(--card)}
.day-chips label.on{background:var(--sidebar-primary);border-color:transparent;color:var(--primary-foreground)}
.day-chips label:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:2px}
.event-grid{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.event-grid th,.event-grid td{padding:11px 0;border-top:1px solid var(--border);text-align:center}
.event-grid thead th{border-top:0;font-size:11px;font-weight:500;color:var(--muted-foreground);padding:8px 4px}
.event-grid th:first-child{text-align:left;width:52%}
.event-grid tbody th{font-weight:400}
.event-grid tbody th strong{display:block;font-size:13px;font-weight:500;line-height:18px}
.event-grid tbody th small{display:block;font-size:11px;color:var(--muted-foreground)}
.event-grid input:disabled{opacity:.55}
.table-note{margin:0;padding:10px 0 14px;border-top:1px solid var(--border)}
.set-slider{display:flex;align-items:center;gap:12px}
.set-slider input[type=range]{width:200px;accent-color:var(--sidebar-primary);border:0;background:none}
.set-slider output{min-width:36px;font-size:12px;text-align:right}

.check-list{display:flex;flex-direction:column;gap:2px}
.check-list label{display:flex;align-items:center;gap:10px;min-height:30px;font-size:13px;cursor:pointer}

/* Machines */
.machine-entry{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--border)}
.set-rows>.machine-entry:first-child{border-top:0}
.machine-glyph{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--radius-md);background:var(--muted);border:1px solid var(--input);color:var(--muted-foreground)}
.machine-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.machine-top{display:flex;align-items:center;gap:8px}
.machine-top strong{font-size:14px;font-weight:600}
.set-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground)}
.set-status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.set-status.online i{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 18%,transparent)}
.set-status.offline{color:var(--warning)}
.set-status.offline i{background:none;border:1.5px solid currentColor}
.set-status.connecting i{animation:ledge-pulse 1s ease-in-out infinite}
.set-well{display:flex;align-items:flex-start;gap:8px;margin-top:6px;padding:9px 11px;border-radius:var(--radius-md);background:var(--well);border:1px solid var(--input);font-size:12px;line-height:18px;flex-wrap:wrap}
.set-well>span:not(.ledge-spin){flex:1;min-width:0}
.set-well>svg,.set-well .ledge-spin{margin-top:2px;flex-shrink:0;display:inline-flex}
.set-well.ok>svg{color:var(--success)}
.set-well.bad>svg{color:var(--danger-text)}
.set-well.warn{border-color:color-mix(in srgb,var(--warning) 45%,var(--input));flex-direction:column}
.set-well.steps{display:block;padding-left:30px;margin:0;color:var(--muted-foreground)}
.set-well.steps li+li{margin-top:4px}
.set-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px}
.machine-main>.set-actions{margin-left:-10px}
.machine-form{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-top:1px solid var(--border)}
.machine-form h3{margin:0;font-size:14px;font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500}
.form-grid input{height:34px;padding:0 10px;font-size:13px;background:var(--well);margin-top:2px}
.form-grid input[aria-invalid=true]{border-color:var(--destructive)}
.set-disclosure{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);width:max-content}
.set-disclosure span{display:inline-flex;transition:transform .15s}
.set-disclosure:hover{color:var(--foreground)}

/* Projects */
.project-entry{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.set-rows>.project-entry:first-child{border-top:0}
.project-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.project-main strong{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.swatch-docs{background:#a3a3a3}
.rule-entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto 150px auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.rule-entry code{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule-arrow{color:var(--muted-foreground)}
.rule-entry select{width:100%;min-width:0;text-overflow:ellipsis}
.set-hint.empty{margin:0;padding:12px 0;border-top:1px solid var(--border)}

/* About */
.about-hero{display:flex;align-items:center;gap:14px;padding:14px 0}
.about-hero div{display:flex;flex-direction:column;gap:2px}
.about-hero strong{font-size:16px;font-weight:600}
.version-list{margin:0;padding:6px 0 10px}
.version-list>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:13px}
.version-list>div+div{border-top:1px solid var(--border)}
.version-list dt{color:var(--muted-foreground)}
.version-list dd{margin:0;display:flex;align-items:center;gap:6px}.version-list dd .set-hint,.version-list dd .set-tag{font-family:'Geist',system-ui,sans-serif}.version-list dd .set-tag.warn{margin-left:4px}
.set-rows>.set-well{margin:0 0 14px}

@media(max-width:1250px){.settings-back kbd{display:none!important}.settings-nav{width:196px}.settings-content{padding:24px 24px 48px}}
@media(max-width:900px){
 .settings-page{flex-direction:column}
 .settings-nav{width:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--border);padding:8px 12px;overflow-x:auto}
 .settings-back{margin:0 6px 0 0;flex-shrink:0}.settings-back kbd{display:none!important}
 .settings-content{padding:20px 16px 40px}
 .form-grid{grid-template-columns:1fr}
 .rule-entry{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.rule-arrow{display:none}
 .set-row:not(.stack){flex-wrap:wrap}.set-control{max-width:100%}
}
@media(max-width:850px){.side-footer{padding:8px}.side-footer .side-row{justify-content:center;padding:0}}
@media(max-width:600px){.event-grid thead th:not(:first-child){font-size:10px}.theme-picks{grid-template-columns:1fr 1fr}.accent-swatches{flex-wrap:wrap}.preview-desk{flex-direction:column;align-items:center}}

/* Projects: the editor (same footing as the session composer), the folder picker, Ledge's proposals. */
.modal.project-modal{width:720px;max-height:min(92vh,860px);display:flex;flex-direction:column;overflow:hidden}
.pe{display:flex;flex-direction:column;min-height:0;flex:1}
.pe-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:18px 20px 16px}
.pe fieldset{border:0;margin:0;padding:0;min-width:0}
.pe .composer-label small{font-weight:400;opacity:.8}
.pe-field{display:flex;flex-direction:column;gap:0;min-width:0}
.pe-field input{height:36px;padding:0 12px;font-size:14px;background:var(--background)}
.pe-field input[aria-invalid=true]{border-color:var(--destructive)}
.pe-field .set-error{margin-top:6px}
.pe-identity{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.pe-colors{display:flex;flex-wrap:wrap;gap:7px;max-width:250px}
.pe-colors legend{width:100%}
.pe-colors label{position:relative;width:24px;height:24px;border-radius:7px;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgb(0 0 0/.15)}
.pe-colors label.on{box-shadow:0 0 0 2px var(--popover),0 0 0 4px var(--c)}
.pe-colors label:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:4px}
.pe-colors input,.picker-machines input,.pe-move input,.pe-agents input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}

.pe-ledge{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius-lg);border:1px solid color-mix(in srgb,var(--sidebar-primary) 35%,var(--border));background:color-mix(in srgb,var(--sidebar-primary) 7%,var(--card))}
.pe-ledge>div,.pe-proposal>div{flex:1;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:18px;color:var(--muted-foreground);min-width:0}
.pe-ledge strong,.pe-proposal strong{font-size:13px;color:var(--foreground);font-weight:600}
.pe-proposal{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius-lg);background:var(--well);border:1px solid var(--border)}

.pe-scan{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 20px 28px;text-align:center}
.pe-scan>strong{font-size:15px;font-weight:600}
.pe-scan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground);text-align:left;min-width:300px}
.pe-scan li{display:flex;align-items:center;gap:8px;opacity:.45;transition:opacity .2s}
.pe-scan li.done{opacity:1;color:var(--foreground)}.pe-scan li.done svg{color:var(--success)}
.pe-scan li.now{opacity:1}
.pe-wait{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--input);flex-shrink:0}
.pe-scan li.now .pe-wait{border-color:var(--sidebar-primary);border-top-color:transparent;animation:ledge-spin .9s linear infinite}
.pe-scan-mascot{position:relative;display:block}
.pe-dots{position:absolute;right:-30px;top:4px;display:flex;gap:3px;padding:5px 7px;border-radius:10px;background:var(--popover);border:1px solid var(--border)}
.pe-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted-foreground);animation:ledge-pulse 1s ease-in-out infinite}
.pe-dots i:nth-child(2){animation-delay:.2s}.pe-dots i:nth-child(3){animation-delay:.4s}

.pe-repos{display:flex;flex-direction:column;gap:10px}
.pe-repos-head{display:flex;align-items:center;justify-content:space-between;min-height:28px}
.pe-repos-head .composer-label{margin:0}
.pe-repo-list{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card)}
.pe-repo-list li{display:flex;align-items:flex-start;gap:10px;padding:10px 6px 10px 12px}
.pe-repo-list li+li{border-top:1px solid var(--border)}
.pe-repo-list li.off .pe-repo-main{opacity:.5}
.pe-repo-list input[type=checkbox]{margin-top:2px}
.pe-repo-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pe-repo-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pe-repo-line strong{font-size:13px;font-weight:500}
.pe-machine{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--muted-foreground)}
.pe-machine .machine-dot{width:6px;height:6px;box-shadow:none}
.pe-branch{font-size:11px;color:var(--muted-foreground);padding:0 6px;border-radius:4px;background:var(--accent)}
.pe-repo-main code{font-size:11px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe-why{font-size:11px;color:var(--info)}.pe-why::before{content:"Ledge · ";font-weight:500}
.pe-repo-main .set-warn{font-size:11px;font-weight:400}
.pe-empty{margin:0;font-size:12px;color:var(--muted-foreground);padding:12px;border:1px dashed var(--input);border-radius:var(--radius-lg)}
.pe-repos>.ledge-btn{align-self:flex-start}
.pe-agents{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.pe-agents .composer-label{margin:0 4px 0 0}
.pe-agents .chip{gap:4px}

.picker{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--well)}
.picker-machines{display:flex;flex-wrap:wrap;gap:6px}
.picker-crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:11px;color:var(--muted-foreground)}
.picker-crumbs button{padding:2px 5px;border-radius:4px;font:inherit;color:var(--muted-foreground)}
.picker-crumbs button:hover{background:var(--accent);color:var(--foreground)}
.picker-crumbs button[aria-current]{color:var(--foreground);font-weight:500}
.picker-list{list-style:none;margin:0;padding:4px;max-height:236px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card)}
.picker-list li{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 0 0;border-radius:var(--radius-sm)}
.picker-list li:hover{background:var(--accent)}
.picker-name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;font-size:13px;border-radius:var(--radius-sm)}
.picker-name>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-name:disabled{cursor:default;opacity:1}
.picker-name>svg{color:var(--muted-foreground)}
.picker-list li.is-git .picker-name>svg:first-child{color:var(--success)}
.picker-branch{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.picker-list .ledge-btn{height:28px!important;padding:0 10px!important;font-size:12px!important;gap:5px!important}
.picker-offline{margin:0;padding:14px;font-size:12px;color:var(--warning);border:1px dashed var(--input);border-radius:var(--radius-md)}
.picker-typed{display:flex;gap:8px}
.picker-typed input{flex:1;min-width:0;height:32px;padding:0 10px;font-size:12px;background:var(--card)}
.picker-typed input[aria-invalid=true]{border-color:var(--destructive)}

.pe-delete{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--destructive) 40%,var(--border));border-radius:var(--radius-lg);background:color-mix(in srgb,var(--destructive) 6%,var(--card));font-size:13px;line-height:20px}
.pe-delete p{margin:0}
.pe-delete ul{margin:0;padding-left:18px;color:var(--muted-foreground)}
.pe-delete ul strong{color:var(--foreground)}
.pe-move{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.pe-move legend{width:100%}
.pe-move select{height:28px;padding:0 8px;font-size:12px;max-width:200px}
.pe-delete-btn{color:var(--danger-text)!important}
.pe .composer-footer .composer-preview .side-swatch{margin:0 2px}

/* The table's "…" menu, on the rug label. */
.room-menu-wrap{position:relative;display:inline-flex}
.room-menu{right:-4px;min-width:200px}
.room-menu button>span,.assign-new>span{display:flex;align-items:center;gap:8px}
.room-menu button svg{color:var(--muted-foreground)}
.assign-new{border-top:1px solid var(--border)!important;margin-top:4px;padding-top:8px!important;border-radius:0 0 var(--radius-sm) var(--radius-sm)!important}
.assign-new>span{color:var(--sidebar-primary);font-weight:500}
.project-room:has(.room-menu){z-index:6}

/* Réglages › Projets */
.ledge-suggest{padding:14px 18px}
.ledge-suggest-head{display:flex;align-items:center;gap:14px}
.ledge-suggest-head>div{flex:1;min-width:0}
.ledge-suggest-head h2{margin:0 0 2px;font-size:13px;font-weight:600}
.ledge-suggest-head p{margin:0}
.ledge-suggest-scan{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:12px;color:var(--muted-foreground)}
.ledge-suggest-list{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--border)}
.suggest-card{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.suggest-card:last-child{border-bottom:0;padding-bottom:0}
.suggest-card .side-swatch{margin-top:5px}
.suggest-card>div:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.suggest-card strong{font-size:13px;font-weight:600}
.suggest-actions{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex-shrink:0}
.tag-machine{margin-left:4px;padding-left:5px;border-left:1px solid var(--border);font-size:10px;opacity:.8}
.project-actions{display:flex;gap:2px;flex-shrink:0}
.project-count{white-space:nowrap}
.project-entry .project-main{min-width:0}
@media(max-width:700px){.pe-identity{grid-template-columns:1fr}.pe-colors{max-width:none}.pe .composer-footer{flex-wrap:wrap}.pe .composer-preview{flex-basis:100%}.suggest-card{flex-wrap:wrap}.suggest-actions{flex-direction:row}}
.office-shell .office-rug .room-menu{transform:skewY(4deg);transform-origin:right bottom}

/* Liste: a toolbar, sticky group headers and aligned rows. */
.overview-scroll.compact{padding-top:0}
.list-view{--toolbar-h:52px;--row-bg:var(--background);container-type:inline-size;padding-bottom:8px}
.list-view mark{background:color-mix(in srgb,var(--warning) 28%,transparent);color:inherit;border-radius:2px;padding:0 1px}

/* Toolbar */
.list-toolbar{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 0 10px;background:var(--background);border-bottom:1px solid var(--border)}
.list-filter{display:flex;align-items:center;gap:8px;flex:0 1 300px;min-width:200px;height:32px;padding:0 6px 0 10px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--background);color:var(--muted-foreground)}
.list-filter:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 22%,transparent)}
.list-filter input{flex:1;min-width:0;height:30px;border:0!important;padding:0;background:none;outline:none;font-size:13px;box-shadow:none!important}
.list-filter input::placeholder{color:var(--muted-foreground)}
.filter-clear{width:22px;height:22px;display:grid;place-items:center;border-radius:999px;color:var(--muted-foreground)}
.filter-clear:hover{background:var(--accent);color:var(--foreground)}
.state-chips{display:flex;flex-wrap:wrap;gap:4px}
.state-chips button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid transparent;border-radius:999px;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.state-chips button:hover:not(:disabled){color:var(--foreground);background:var(--accent)}
.state-chips button[aria-pressed=true]{color:var(--foreground);background:var(--secondary);border-color:var(--input)}
.state-chips button:disabled{opacity:.45;cursor:default}
.state-chips button span{font-size:11px;color:var(--muted-foreground)}
.state-chips .chip-decide:not(:disabled) span{color:var(--danger-text);font-weight:600}
.state-chips button:focus-visible,.seg button:focus-visible,.g-toggle:focus-visible,.g-name:focus-visible,.kids-chip:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.seg{display:inline-flex;align-items:center;gap:2px;height:30px;padding:2px;border:1px solid var(--border);border-radius:var(--radius-md)}
.seg-label{font-size:11px;color:var(--muted-foreground);padding:0 6px 0 6px}
.seg button{height:24px;padding:0 9px;border-radius:calc(var(--radius-md) - 2px);font-size:12px;color:var(--muted-foreground)}
.seg button:hover{color:var(--foreground)}
.seg button[aria-checked=true]{background:var(--secondary);color:var(--foreground);font-weight:500}
.density-toggle{width:30px!important;height:30px!important}
.density-toggle[aria-pressed=true]{background:var(--secondary)}

/* State dots */
.g-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--info)}
.g-dot.dot-decide{background:var(--danger-text)}
.g-dot.dot-done{background:var(--muted-foreground);opacity:.55}
.g-dot.dot-offline{background:none;border:1.5px solid var(--muted-foreground)}
.lgroup-head .g-dot.dot-decide{box-shadow:0 0 0 3px color-mix(in srgb,var(--danger-text) 20%,transparent)}

/* Groups */
.lgroup{margin-top:14px}
.lgroup-head{position:sticky;top:var(--toolbar-h);z-index:4;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 4px 0 0;background:var(--background);border-bottom:1px solid var(--border);font-size:13px}
.lgroup-head .side-swatch{margin:0 2px}
.g-toggle{width:24px;height:24px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--muted-foreground);flex-shrink:0}
.g-toggle:hover{background:var(--accent);color:var(--foreground)}
.g-toggle svg{transform:rotate(90deg);transition:transform .15s ease}
.lgroup.collapsed .g-toggle svg{transform:none}
.g-name{font-weight:600;font-size:13px;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border-radius:4px}
button.g-name:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted-foreground)}
.g-branch{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.g-count{font-size:11px;color:var(--muted-foreground);padding:0 6px;height:18px;line-height:18px;border-radius:999px;background:var(--secondary)}
.g-summary{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;overflow:hidden;min-width:0}
.g-summary .g-alert{color:var(--danger-text);font-weight:500}
.g-help{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lgroup-head .drop-hint{font-size:11px;color:var(--sidebar-primary);white-space:nowrap}

.lgroup.unassigned .lgroup-head .g-name{font-weight:500}
.lgroup.drop-over .lgroup-head,.lgroup.drop-over .lgroup-rows{background:color-mix(in srgb,var(--sidebar-primary) 6%,var(--background))}
.lgroup.drop-over .lgroup-rows{outline:1.5px dashed color-mix(in srgb,var(--sidebar-primary) 60%,transparent);outline-offset:-2px;border-radius:var(--radius-md)}

/* Rows */
.lrow{--bot-col:36px;--indent:0px;position:relative;display:grid;grid-template-columns:calc(var(--bot-col) + var(--indent)) minmax(0,calc(150px - var(--indent))) minmax(0,1fr) 112px minmax(84px,128px) 98px;grid-template-areas:"bot name task state ctx when";align-items:center;column-gap:14px;min-height:56px;padding:6px 10px 6px 8px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent);background:var(--row-bg);cursor:pointer;outline:none}
.lrow:hover{--row-bg:var(--sidebar-accent)}
.lrow:focus-visible,.lrow.keyboard-selected{--row-bg:color-mix(in srgb,var(--sidebar-accent) 70%,var(--background))}
.lrow:focus-visible,.lrow.keyboard-selected:focus-within{box-shadow:inset 0 0 0 2px var(--ring);border-radius:var(--radius-md)}
.lrow.keyboard-selected:not(:focus-within){box-shadow:inset 2px 0 0 var(--ring)}
.lrow.b-decide::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--danger-text)}
