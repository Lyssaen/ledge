  --primary: oklch(0.505 0.213 27.518); --primary-foreground: oklch(0.971 0.013 17.38); --primary-hover: oklch(0.444 0.177 26.899);

  --sidebar-primary-foreground: oklch(0.971 0.013 17.38); --sidebar-accent: oklch(0.97 0 0); --sidebar-accent-foreground: oklch(0.205 0 0);

  --notch: #fff;

  --success: #059669; --warning: #b45309; --info: #2563eb; --danger-text: oklch(0.505 0.213 27.518);
  --status-success-soft: #ecfdf5; --status-warning-soft: #fffbeb; --status-info-soft: #eff6ff; --status-danger-soft: #fef2f2;

  --term-bg: oklch(0.99 0 0); --term-fg: oklch(0.22 0 0);
  --term-ansi-0: #24292f; --term-ansi-1: #b91c1c; --term-ansi-2: #047857; --term-ansi-3: #a16207;
  --term-ansi-4: #1d4ed8; --term-ansi-5: #8250df; --term-ansi-6: #1b7c83; --term-ansi-7: #6e7781;

  --term-ansi-12: #0550ae; --term-ansi-13: #6639ba; --term-ansi-14: #136061; --term-ansi-15: #424a53;

  --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
  --popover: oklch(0.205 0 0); --popover-foreground: oklch(0.985 0 0);
  --primary: oklch(0.444 0.177 26.899); --primary-foreground: oklch(0.971 0.013 17.38); --primary-hover: oklch(0.396 0.141 25.723);
  --secondary: oklch(0.274 0.006 286.033); --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
  --destructive: oklch(0.704 0.191 22.216); --destructive-foreground: oklch(0.985 0 0);
  --border: #ffffff1a; --input: #ffffff26; --ring: oklch(0.556 0 0);
  --sidebar: oklch(0.205 0 0); --sidebar-foreground: oklch(0.985 0 0); --sidebar-primary: oklch(0.637 0.237 25.331);
  --sidebar-primary-foreground: oklch(0.971 0.013 17.38); --sidebar-accent: oklch(0.269 0 0); --sidebar-accent-foreground: oklch(0.985 0 0);
  --sidebar-border: #ffffff1a; --sidebar-ring: oklch(0.556 0 0);
  --notch: #000;
  --task: #a78bfa;
  --success: #34d399; --warning: #fbbf24; --info: #60a5fa; --danger-text: oklch(0.704 0.191 22.216);
  --status-success-soft: #052e16; --status-warning-soft: #422006; --status-info-soft: #172554; --status-danger-soft: #450a0a;
  --shadow-overlay: 0 20px 40px -12px rgba(0,0,0,0.7);

  --term-bg: #0c0c0d; --term-fg: #e5e5e5;
  --term-ansi-0: #484f58; --term-ansi-1: #f87171; --term-ansi-2: #4ade80; --term-ansi-3: #facc15;
  --term-ansi-4: #7cb3fb; --term-ansi-5: #bc8cff; --term-ansi-6: #39c5cf; --term-ansi-7: #b1bac4;
  --term-ansi-8: #8f8f8f; --term-ansi-9: #ffa198; --term-ansi-10: #56d364; --term-ansi-11: #e3b341;
  --term-ansi-12: #79c0ff; --term-ansi-13: #d2a8ff; --term-ansi-14: #56d4dd; --term-ansi-15: #ffffff;
  --term-cursor: oklch(0.985 0 0); --term-selection: #58a6ff40;
  --edge-hot: rgba(255,255,255,.08);
}

/* Mascots (spec section 6). Material follows the theme: Galet (light) / Signal (dark).
   A bot's own data-material wins over the root theme so its theme prop is authoritative. */
@property --bot-shell-top { syntax: '<color>'; inherits: true; initial-value: #f0eee6; }
@property --bot-shell-bottom { syntax: '<color>'; inherits: true; initial-value: #b7b7b0; }
@property --bot-shell-line { syntax: '<color>'; inherits: true; initial-value: #ffffff99; }
@property --bot-visor { syntax: '<color>'; inherits: true; initial-value: #22292b; }
@property --bot-shine { syntax: '<color>'; inherits: true; initial-value: #ffffff77; }
:root, :root[data-theme="light"], [data-material="pebble"] {
  --bot-shell-top: #f0eee6; --bot-shell-bottom: #b7b7b0; --bot-shell-line: #ffffff99; --bot-visor: #22292b;
  --bot-shine: #ffffff77;
}
:root[data-theme="dark"], [data-material="signal"] {
  --bot-shell-top: #34434b; --bot-shell-bottom: #273238; --bot-shell-line: #859397; --bot-visor: #172124;
  --bot-shine: #ffffff00;
}
/* Halo (docs/mockups/mascots-halo.html, "Contour" rendering): a glow in the state's badge colour hugging the
   silhouette. Full strength for a bot that waits or errs, softer for a live bot, none for done or read-only. */
@property --bot-halo-a { syntax: '<number>'; inherits: false; initial-value: 0; }
:root { --bot-halo-alpha: .55; --bot-halo-alpha-soft: .3; --bot-halo-spread: .32; }
:root {
  --bot-visor-line: #00000055; --bot-reflection: #ffffff; --bot-ground: #000000; --bot-readonly-line: #adb3b2;
  --bot-eye-starting: #90c7f2; --bot-eye-working: #90c7f2; --bot-eye-approval: #f2b09c; --bot-eye-question: #f6d487;
  --bot-eye-idle: #a9dfc7; --bot-eye-error: #ffab9f; --bot-eye-done: #a3aaa9;
}

/* Signal / Galet mascots, ported from docs/mockups/prototype/mascot.css and the mascot block of prototype.css.
   Colors come from tokens.css; durations come from inline variables set by Bot (scaled by VITE_LEDGE_MOTION). */

.bot {
  display: block; flex-shrink: 0; overflow: visible;
  transition:
    --bot-shell-top var(--bot-material-ms, 240ms), --bot-shell-bottom var(--bot-material-ms, 240ms),
    --bot-shell-line var(--bot-material-ms, 240ms), --bot-visor var(--bot-material-ms, 240ms),
    --bot-shine var(--bot-material-ms, 240ms), opacity 180ms;
}
.bot .shell-top { stop-color: var(--bot-shell-top); }
.bot .shell-bottom { stop-color: var(--bot-shell-bottom); }

/* Layers */
.bot .body {
  transform-origin: 48px 72px;
  animation: bot-breathe var(--bot-breath, 5.4s) ease-in-out infinite;
  animation-delay: var(--bot-phase, 0s);
}
/* The working hop (spec §6): a 480 ms hop inside a 3.6–4.4 s cycle on the group that wraps the body, so breathing and
   the hop compose. Only data-hop="true" (working, not reduced/read-only/frozen/paused) animates; the simplified crop keeps it. */
.bot .hop { transform-origin: 48px 86px; }
.bot[data-hop="true"] .hop {
  animation: bot-hop var(--bot-hop-cycle, 3.6s) linear infinite;
  animation-delay: var(--bot-phase, 0s);
}
/* Reduced motion keeps the progress signal: the eyes pulse at the running-dot rhythm (not at ≤ 20 px). */
.bot[data-detailed="true"][data-reduced="true"][data-state="working"]:not([data-frozen="true"]):not([data-paused="true"]):not([data-readonly="true"]) .eye-open {
  animation: bot-pulse 1.2s ease-in-out infinite !important;
}
.bot .pose {
  transform-origin: 48px 59px;
  transform: rotate(var(--bot-tilt, 0deg)) translateY(var(--bot-lift, 0px));
  transition: transform var(--bot-pose-ms, 300ms) var(--bot-ease);
}
.bot .gaze {
  transform: translate(var(--bot-gx, 0px), var(--bot-gy, 0px));
  transition: transform var(--bot-gaze-ms, 450ms) var(--bot-ease);
}
.bot .eye-blink { transform-origin: 48px 48px; }
.bot .eye-open, .bot .eye-happy, .bot .eye-error, .bot .eye-sleep {
  transform-origin: 48px 49px;
  transition: opacity var(--bot-eye-ms, 260ms) var(--bot-ease), transform var(--bot-eye-ms, 260ms) var(--bot-ease);
}
.bot .eye-open { fill: var(--bot-eye); }
.bot .eye-happy, .bot .eye-error, .bot .eye-sleep {
  opacity: 0; fill: none; stroke: var(--bot-eye); stroke-width: 3.4; stroke-linecap: round;
}
.bot .visor { fill: var(--bot-visor); stroke: var(--bot-visor-line); stroke-width: 1; }
.bot .shell { stroke: var(--bot-shell-line); stroke-width: .8; transition: stroke-width var(--bot-material-ms, 240ms); }
.bot .shine { fill: none; stroke: var(--bot-shine); stroke-width: 1.25; stroke-linecap: round; }
.bot .reflection { fill: var(--bot-reflection); opacity: .035; }
.bot .ground { fill: var(--bot-ground); opacity: .16; }
.bot .arm {
  fill: var(--bot-shell-bottom); stroke: var(--bot-shell-line); stroke-width: .7;
  transform-origin: 75px 66px; opacity: 0;
  transition: transform var(--bot-pose-ms, 300ms) var(--bot-ease), opacity 180ms;
}

/* Logo-inspired bodies (issue #61). Each harness has its own tint per material; the eyes and the halo keep the
   semantic state colours. A bot without data-tool keeps the neutral tokens. */
.bot .shell { stroke-linejoin: round; }
.bot .cube-top { fill: var(--bot-shine); opacity: .35; }
.bot .cube-side { fill: var(--bot-visor); opacity: .14; }
.bot .cube-edge { fill: none; stroke: var(--bot-shell-line); stroke-width: 1; stroke-linejoin: round; opacity: .3; }
.bot:not(.legacy-bot)[data-tool="claude"][data-material="signal"] { --bot-shell-top: #c78669; --bot-shell-bottom: #8c503d; --bot-shell-line: #e0ab8f; --bot-visor: #33231f; }
.bot:not(.legacy-bot)[data-tool="claude"][data-material="pebble"] { --bot-shell-top: #eab69b; --bot-shell-bottom: #c8876a; --bot-shell-line: #f5d6c4; --bot-visor: #392824; }
.bot:not(.legacy-bot)[data-tool="codex"][data-material="signal"] { --bot-shell-top: #7774ce; --bot-shell-bottom: #40488b; --bot-shell-line: #a9b1ee; --bot-visor: #20243f; }
.bot:not(.legacy-bot)[data-tool="codex"][data-material="pebble"] { --bot-shell-top: #e0dffb; --bot-shell-bottom: #a5a5d8; --bot-shell-line: #eeedff; --bot-visor: #292b48; }
.bot:not(.legacy-bot)[data-tool="cursor"][data-material="signal"] { --bot-shell-top: #656763; --bot-shell-bottom: #343733; --bot-shell-line: #bdc0b9; --bot-visor: #191d1a; }
.bot:not(.legacy-bot)[data-tool="cursor"][data-material="pebble"] { --bot-shell-top: #faf9f3; --bot-shell-bottom: #babcb4; --bot-shell-line: #e3e4dc; --bot-visor: #232824; }
.bot:not(.legacy-bot)[data-tool="omp"][data-material="signal"] { --bot-shell-top: #cf6bbd; --bot-shell-bottom: #6989bc; --bot-shell-line: #dba4df; --bot-visor: #2d213b; }
.bot:not(.legacy-bot)[data-tool="omp"][data-material="pebble"] { --bot-shell-top: #f0bee3; --bot-shell-bottom: #a7c4e5; --bot-shell-line: #f8ddf4; --bot-visor: #34283e; }

/* Material: Signal has a readable outline and no white shine; Galet keeps a light shine and a matte gradient. */
.bot[data-material="signal"] .shell { stroke-width: 1.5; }

/* Expressions */
.bot[data-eyes="wide"] .eye-open { transform: scaleY(1.2); }
.bot[data-eyes="happy"] .eye-open, .bot[data-eyes="error"] .eye-open, .bot[data-eyes="sleep"] .eye-open { opacity: 0; }
.bot[data-eyes="happy"] .eye-happy, .bot[data-eyes="error"] .eye-error, .bot[data-eyes="sleep"] .eye-sleep { opacity: 1; }
/* Logo bots wear no visor: dark eyes sit on the shell and the state colour survives as a glint (and the halo). */
.bot:not(.legacy-bot) .eye-open { fill: var(--bot-visor); }
.bot:not(.legacy-bot) :is(.eye-happy, .eye-error, .eye-sleep) { stroke: var(--bot-visor); }
.bot .eye-glint { fill: var(--bot-eye); transition: opacity var(--bot-eye-ms, 260ms) var(--bot-ease), fill var(--bot-eye-ms, 260ms) var(--bot-ease); }
.bot:is([data-eyes="happy"], [data-eyes="error"], [data-eyes="sleep"]) .eye-glint { opacity: 0; }
.bot[data-eyes="wide"] .eye-glint { transform: translateY(-1px); }
.bot[data-state="approval"] .arm { opacity: 1; transform: rotate(-22deg) translateY(-5px); transition-delay: 180ms; }
.bot[data-state="done"] { opacity: .55; }
.bot[data-state="done"] .body, .bot[data-state="error"] .body { animation: none; }

/* Halo: two drop-shadows in the state colour (the badge's and the handle tick's) hugging the silhouette. Bot sets
   --bot-size inline; the spread is a fraction of it, so the halo scales with the avatar and with the handle's zoom.
   The ground shadow hides under a halo so it does not glow. A waiting bot's halo breathes: 5 s, strength only, offset
   per bot like its breathing. Done, read-only and the `readonly` state carry no halo (data-halo is set by Bot). */
.bot[data-halo="true"] {
  --bot-halo-r: calc(var(--bot-size, 32px) * var(--bot-halo-spread, .32));
  filter:
    drop-shadow(0 0 calc(var(--bot-halo-r) * .35) color-mix(in srgb, var(--bot-halo) calc(var(--bot-halo-a) * 170%), transparent))
    drop-shadow(0 0 calc(var(--bot-halo-r) * .9) color-mix(in srgb, var(--bot-halo) calc(var(--bot-halo-a) * 90%), transparent));
}
.bot[data-halo="true"] .ground { opacity: 0; }
.bot[data-state="approval"], .bot[data-state="error"] { --bot-halo: var(--danger-text); --bot-halo-a: var(--bot-halo-alpha); }
.bot[data-state="question"] { --bot-halo: var(--warning); --bot-halo-a: var(--bot-halo-alpha); }
.bot[data-state="starting"], .bot[data-state="working"] { --bot-halo: var(--info); --bot-halo-a: var(--bot-halo-alpha-soft); }
.bot[data-state="idle"] { --bot-halo: var(--success); --bot-halo-a: var(--bot-halo-alpha-soft); }
.bot[data-halo="true"]:is([data-state="approval"], [data-state="question"]) {
  animation: bot-halo-breathe 5s ease-in-out infinite;
  animation-delay: var(--bot-phase, 0s);
}

/* Modifiers: read-only (dashed outline), frozen (connection lost), simplified (≤20 px head crop) */
.bot[data-readonly="true"] { opacity: .6; }
.bot[data-readonly="true"] .shell { stroke: var(--bot-readonly-line); stroke-width: 1.3; stroke-dasharray: 3 3; }
.bot[data-readonly="true"] .body { animation: none; }
.bot[data-frozen="true"] { opacity: .5; }
.bot[data-frozen="true"], .bot[data-frozen="true"] * { animation-play-state: paused !important; }
/* Inactive (inert) layers and explicitly paused views hold every loop in place, like the prototype's .paused rule. */
[inert] .bot, [inert] .bot *, .bot[data-paused="true"], .bot[data-paused="true"] * { animation-play-state: paused !important; }
.bot[data-simplified="true"] :is(.arm, .shine, .ground, .cube-edge) { display: none; }
.bot[data-simplified="true"] .eye-open { transform: scale(1.1); }
.bot[data-simplified="true"] .body { animation: none; }

/* Gestures, set by useBotMotion */
.bot[data-blink="true"] .eye-blink { animation: bot-blink var(--bot-blink-ms, 180ms) ease-in-out; }
.bot[data-gesture="ask"] .arm { animation: bot-ask var(--bot-ask-ms, 850ms) var(--bot-ease); }
.bot[data-gesture="nod"] .pose { animation: bot-nod var(--bot-nod-ms, 650ms) var(--bot-ease); }

/* Reduced motion: app preference / VITE_LEDGE_MOTION=0 (data-reduced) and the OS preference */
.bot[data-reduced="true"], .bot[data-reduced="true"] * { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .bot, .bot * { animation: none !important; transition: none !important; }
}

/* Respiration 4.8–6.4 s: 0.7 SVG unit up, ±0.3°, 1.4 % vertical stretch */
@keyframes bot-breathe {
  0%, 100% { transform: translateY(0) rotate(-.3deg) scaleY(1); }
  50% { transform: translateY(-.7px) rotate(.3deg) scaleY(1.014); }
}
/* 480 ms of a 3.6 s cycle = 13.3 %: anticipation squash, rise with stretch, land with squash, settle, then still. */
@keyframes bot-hop {
  0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-in; }
  1.9% { transform: translateY(0) scale(1.06, .92); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  5.9% { transform: translateY(calc(var(--bot-hop, 8px) * -1)) scale(.96, 1.06); animation-timing-function: cubic-bezier(.6, 0, .9, .4); }
  9.3% { transform: translateY(0) scale(1.05, .95); animation-timing-function: ease-out; }
  11.5% { transform: translateY(0) scale(.99, 1.01); }
  13.3%, 100% { transform: translateY(0) scale(1, 1); }
}
@keyframes bot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes bot-blink { 0%, 100% { transform: scaleY(1); } 45%, 60% { transform: scaleY(.08); } }
@keyframes bot-halo-breathe { 0%, 100% { --bot-halo-a: var(--bot-halo-alpha, .55); } 50% { --bot-halo-a: calc(var(--bot-halo-alpha, .55) * .7); } }
@keyframes bot-nod {
  0%, 100% { transform: rotate(var(--bot-tilt, 0deg)) translateY(var(--bot-lift, 0px)); }
  35% { transform: translateY(3px) rotate(5deg); }
  65% { transform: translateY(-1px) rotate(-2deg); }
}
@keyframes bot-ask {
  0%, 100% { transform: rotate(-22deg) translateY(-5px); }
  35% { transform: rotate(-42deg) translateY(-7px); }
  65% { transform: rotate(-16deg) translateY(-5px); }
}

/* Persistent layers compose transitions, tool signatures and interaction. */
.bot :is(.arrival, .signature, .touch) { transform-origin: 48px 70px; }
.bot .ground { transform-origin: 48px 90px; }
.bot[data-tool="claude"] { --bot-roll-pre: 0deg; --bot-roll-top: 0deg; --bot-roll-land: 5deg; }
.bot[data-tool="codex"] { --bot-roll-pre: -4deg; --bot-roll-top: 5deg; --bot-roll-land: 2deg; }
.bot[data-tool="cursor"] { --bot-roll-pre: -2deg; --bot-roll-top: 7deg; --bot-roll-land: 2deg; }
.bot[data-tool="omp"] { --bot-roll-pre: -2deg; --bot-roll-top: 2deg; --bot-roll-land: -2deg; }
.bot[data-detailed="true"][data-hop="true"] .signature,
.bot[data-detailed="true"][data-hop="true"][data-halo="false"] .ground {
  animation-duration: var(--bot-hop-cycle, 3.6s);
  animation-delay: var(--bot-phase, 0s);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.bot[data-detailed="true"][data-hop="true"] .signature { animation-name: bot-signature; }
.bot[data-detailed="true"][data-hop="true"][data-halo="false"] .ground { animation-name: bot-shadow; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .hop { animation: none; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .arrival { transform-origin: 48px 86px; animation: bot-entry-hop var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"] .signature { animation: bot-entry-signature var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-detailed="true"][data-hop="true"][data-transition="working"][data-halo="false"] .ground { animation: bot-entry-shadow var(--bot-entry-hop-ms, 480ms) linear; }
.bot[data-transition="question"] .arrival { animation: bot-question var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="question"] .gaze { animation: bot-question-gaze var(--bot-question-ms, 650ms) var(--bot-ease); }
.bot[data-transition="idle"] .arrival { animation: bot-idle-arrival var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="error"] .arrival { animation: bot-recoil var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-transition="done"] .eye-blink { animation: bot-close var(--bot-arrival-ms, 500ms) ease-in-out; }
.bot[data-transition="done"] .eye-open { animation: bot-close-open var(--bot-arrival-ms, 500ms) linear; }
.bot[data-transition="done"] .eye-sleep { animation: bot-close-sleep var(--bot-arrival-ms, 500ms) linear; }
.bot[data-transition="done"] .arrival { animation: bot-settle var(--bot-arrival-ms, 500ms) var(--bot-ease); }
.bot[data-touch="true"] .touch { animation: bot-touch var(--bot-touch-ms, 360ms) var(--bot-ease); }
.bot[data-idle="look"] .gaze { animation: bot-idle-look var(--bot-idle-ms, 1700ms) ease-in-out; }
.bot[data-idle="stretch"] .arrival { animation: bot-stretch var(--bot-idle-ms, 1700ms) ease-in-out; }
.bot[data-idle="tilt"] .arrival { animation: bot-idle-tilt var(--bot-idle-ms, 1700ms) ease-in-out; }
.bot[data-hover="true"] .gaze { animation: none; transition-duration: 220ms; }
/* A scaled full SVG also keeps only the work hop at ≤20 px. */
.bot[data-detailed="false"], .bot[data-detailed="false"] * { animation: none !important; transition: none !important; }
.bot[data-detailed="false"][data-hop="true"] .hop {
  animation: bot-hop var(--bot-hop-cycle, 3.6s) linear infinite !important;
  animation-delay: var(--bot-phase, 0s) !important;
}
.bot[data-suspended="true"], .bot[data-suspended="true"] * { animation-play-state: paused !important; transition: none !important; }
.bot[data-paused="true"] *, .bot[data-frozen="true"] *, [inert] .bot *, .bot[data-readonly="true"] * { transition: none !important; }
.bot[data-readonly="true"] *, .bot[data-reduced="true"] * { animation: none !important; }

@keyframes bot-entry-hop {
  0%, 100% { transform: translateY(0) scale(1); }
  14% { transform: scale(1.06,.92); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
  44% { transform: translateY(calc(var(--bot-hop) * -1)) scale(.96,1.06); animation-timing-function: cubic-bezier(.6,0,.9,.4); }
  70% { transform: scale(1.05,.95); animation-timing-function: ease-out; }
}
@keyframes bot-question { 0% { transform: rotate(-5deg); } 50% { transform: rotate(2deg); } 100% { transform: rotate(0deg); } }
@keyframes bot-question-gaze { 0%, 30%, 100% { transform: translate(0,0); } 60% { transform: translate(2px,-1px); } }
@keyframes bot-idle-arrival { 0%, 100% { transform: scale(1); } 40% { transform: translateY(-2px) scale(.98,1.04); } 70% { transform: scale(1.03,.97); } }
@keyframes bot-recoil { 0%, 100% { transform: translateX(0); } 40% { transform: translateX(-3px) rotate(-3deg); } }
@keyframes bot-close { 0%, 100% { transform: scaleY(1); } 25% { transform: scaleY(.5); } 45% { transform: scaleY(.65); } 70% { transform: scaleY(.12); } }
@keyframes bot-close-open { 0%, 60% { opacity: 1; } 70%, 100% { opacity: 0; } }
@keyframes bot-close-sleep { 0%, 60% { opacity: 0; } 70%, 100% { opacity: 1; } }
@keyframes bot-settle { 0% { transform: translateY(-1px); } 100% { transform: translateY(0); } }
@keyframes bot-touch { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.07,.92); } 65% { transform: scale(.97,1.04); } }
@keyframes bot-idle-look { 0%, 100% { transform: translateX(0); } 35%, 65% { transform: translateX(2px); } }
@keyframes bot-stretch { 0%, 100% { transform: scale(1); } 50% { transform: scale(.98,1.04); } }
@keyframes bot-idle-tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-2deg); } }

  0%, 13.3%, 100% { transform: rotate(0deg); }

  5.9% { transform: rotate(var(--bot-roll-top)); }
  9.3% { transform: rotate(var(--bot-roll-land)); }
}

@keyframes bot-shadow {

  5.9% { transform: scaleX(.72); opacity: .07; }
  9.3% { transform: scaleX(.95); }
}

@keyframes bot-entry-signature {
  0%, 100% { transform: rotate(0deg); }
  14% { transform: rotate(var(--bot-roll-pre)); }
  44% { transform: rotate(var(--bot-roll-top)); }
  70% { transform: rotate(var(--bot-roll-land)); }
}

@keyframes bot-entry-shadow {
  0%, 100% { transform: scaleX(1); opacity: .16; }
  14% { transform: scaleX(.9); }
  44% { transform: scaleX(.72); opacity: .07; }
  70% { transform: scaleX(.95); }
}




/* Native controls (radios, checkboxes, scrollbars) follow the theme inside the overlay's own boxes only: on the root it
   would paint the transparent window's canvas. */
:root[data-theme="dark"] [data-surface], :root[data-theme="dark"] [data-coachmark] { color-scheme: dark; }
:root[data-theme="light"] [data-surface], :root[data-theme="light"] [data-coachmark] { color-scheme: light; }
html, body, #root { margin: 0; height: 100%; background: transparent; }
body { font-family: 'Geist', system-ui, sans-serif; color: var(--sidebar-foreground); font-size: 14px; line-height: 20px; overflow: hidden; }
/* The page never scrolls: a fixed, clipping root adds nothing to the document's scrollable overflow, so a control taking
   focus while the native window is still at the island's height (a keyboard open grows it after the first paint) scrolls
   only its own list, never the page out of the window's top. A hidden body alone still scrolls programmatically. */
#root { position: fixed; inset: 0; overflow: clip; }
.mono { font-family: 'Geist Mono', ui-monospace, monospace; }
button, input { font-family: inherit; }
/* The bubble countdown drains from the controller's remainder (--ledge-from) to empty. */
/* The update card's running step, and the island's busy pip. */
@keyframes ledge-spin { to { transform: rotate(360deg) } }
@keyframes ledge-pulse { 50% { opacity: .35 } }
/* The live tool line's outcome mark (src/surface/LiveToolLine.tsx) pops in where the spinner was. */
@keyframes ledge-mark-in { from { transform: scale(.4); opacity: 0 } }
.ledge-spin { animation: ledge-spin .9s linear infinite }
@media (prefers-reduced-motion: reduce) { .ledge-spin { animation: none } }
@keyframes ledge-drain { from { width: var(--ledge-from, 100%) } to { width: 0% } }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.dnd-switch:has(input:focus-visible) .dnd-track, .ledge-seg:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.ledge-opt:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
/* Text fields (launch form, reply): no focus ring, the caret shows where you type. */
.ledge-field:focus, .ledge-field:focus-visible { outline: none; }
/* Buttons: variant colors, hover and disabled states (tokens only). */
.ledge-btn { cursor: pointer; border: 1px solid transparent; }
.ledge-btn[data-variant="primary"] { background: var(--primary); color: var(--primary-foreground); }
.ledge-btn[data-variant="outline"] { background: transparent; color: var(--sidebar-foreground); border-color: var(--input); }
.ledge-btn[data-variant="ghost"] { background: transparent; color: var(--muted-foreground); }
.ledge-btn[data-variant="secondary"] { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
.ledge-btn[data-variant="primary"]:hover:not(:disabled) { background: var(--primary-hover); }
.ledge-btn[data-variant="outline"]:hover:not(:disabled),
.ledge-btn[data-variant="ghost"]:hover:not(:disabled) { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.ledge-btn[data-variant="secondary"]:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }
button:disabled { opacity: .5; cursor: not-allowed; }
/* Thin, token-coloured scrollbars on every scrolling area (list, session content, terminal preview, settings, help):
   a muted thumb on a transparent track, as in the mockup's views. */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted-foreground) 45%, transparent) transparent; }
/* A text toggle (the list footer's do-not-disturb). */
.ledge-text-btn:hover { color: var(--sidebar-foreground) !important; }
.ledge-text-btn[aria-pressed="true"]:hover { color: var(--sidebar-primary) !important; }
/* Question options: radio cards, the chosen one with a red border, a red tint and a red radio. */
.ledge-opt input[type="radio"], .ledge-check input[type="checkbox"] { accent-color: var(--sidebar-primary); }
.ledge-opt[data-checked] { border-color: var(--sidebar-primary) !important; background-color: color-mix(in srgb, var(--sidebar-primary) 8%, transparent) !important; }
textarea::placeholder, .ledge-field::placeholder { color: var(--muted-foreground); }
/* The launch form's recent folders: rows that light up on hover like list rows. */
.ledge-recent:hover { background: var(--sidebar-accent) !important; }
/* The session's terminal strip (src/surface/TerminalBand.tsx): its dot breathes while the agent works. */
.ledge-band:hover { filter: brightness(1.15); }
.ledge-band-live { animation: ledge-pulse 1.6s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { .ledge-band-live { animation: none } }
/* A row's remove button shows on hover or keyboard focus of the row only (it stays in the tab order). */
.ledge-row .ledge-row-dismiss { opacity: 0; transition: opacity 120ms ease; }
.ledge-row:hover .ledge-row-dismiss, .ledge-row:focus-within .ledge-row-dismiss { opacity: 1; }

/* The sidebar as an IDE explorer, from docs/mockups/session-management/sidebar-tree.css: ask field, views,
   « À toi », the project › branch › session tree. No search row, no auto-hide, no word mark (the titlebar owns the brand).
   `.side-swatch` and `.machine-dot` stay: they are used across the app; `.side-footer` is an alias of `.st-foot`. */
.sidebar.st{position:relative;width:288px;display:flex;flex-direction:column;padding:0;gap:0;background:var(--sidebar);border-right:1px solid var(--sidebar-border)}
.st button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
.st button:focus-visible{outline:2px solid var(--ring);outline-offset:-2px;border-radius:var(--radius-sm)}
.st .mono{font-family:'Geist Mono',monospace}
.st-fill{flex:1}
.st-ask{margin:10px 10px 0;height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 8px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--well);cursor:text}
.st-ask:focus-within,.st-ask.on{border-color:var(--ring)}
.st .st-mascot{display:inline-flex;flex:none}
.st-views{display:flex;flex-direction:column;gap:2px;margin:10px 10px 8px;padding:4px;flex:none;border-radius:var(--radius-md);background:var(--well);border:1px solid var(--border)}
.st .st-views button{flex:1;height:30px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--muted-foreground)}
.st .st-views button:hover{color:var(--sidebar-foreground)}
.st .st-views button.on{background:var(--sidebar-accent);color:var(--sidebar-foreground)}
.st .st-views button.on svg{color:var(--sidebar-primary)}
.st-views small{font:10px 'Geist Mono',monospace;color:var(--muted-foreground)}
/* The scrollbar's gutter is kept (thin: 10 px) and stands for the right padding, so the kernel box keeps the views' edges whether the list scrolls or not. */
.st-scroll{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:2px 0 8px 8px;display:flex;flex-direction:column;gap:10px}
.st-label{display:flex;align-items:center;gap:4px;height:26px;padding:0 2px 0 8px;font-size:11px;color:var(--muted-foreground)}
.st-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font:600 10px 'Geist Mono',monospace;background:var(--sidebar-primary);color:var(--sidebar-primary-foreground,var(--primary-foreground))}
.st .st-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--muted-foreground)}
.st .st-icon:hover,.st .st-icon.on{background:var(--sidebar-accent);color:var(--sidebar-foreground)}
/* « À toi » */
.st-card{display:flex;gap:8px;padding:6px 6px 6px 8px;border-radius:var(--radius-md)}
.st-card:hover,.st-card.sel{background:var(--sidebar-accent)}
.st-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.st-l1{display:flex;align-items:center;gap:6px;font-size:13px}
.st .st-name{font-weight:500;color:var(--sidebar-foreground)}
.st .st-name:hover{text-decoration:underline}
.st-where{flex:1;min-width:0;display:flex;align-items:center;gap:2px;font:11px 'Geist Mono',monospace;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-task .st-where{display:block}
.st-where .side-swatch{width:7px;height:7px;margin:0 3px 0 0}
.st-l2{display:flex;align-items:center;gap:5px}
.st-req{flex:1;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .st-qa{height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;border:1px solid var(--input);color:var(--sidebar-foreground)}
.st .st-qa:hover{background:var(--sidebar-accent)}
.st .st-qa.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.st .st-qa.pri:hover{background:var(--primary-hover)}
.st .st-showall{margin:2px 0 0 34px;font-size:12px;color:var(--muted-foreground)}
.st .st-showall:hover{color:var(--sidebar-foreground)}
/* The tree */
.st-tree{display:flex;flex-direction:column;gap:1px}
.st-row{--d:0;position:relative;display:flex;align-items:center;gap:6px;min-height:28px;padding:0 6px 0 calc(4px + var(--d) * 14px);border-radius:var(--radius-sm);font-size:13px;color:var(--muted-foreground)}
.st-row:hover{background:var(--sidebar-accent);color:var(--sidebar-foreground)}
.st-row.sel{background:var(--sidebar-accent);color:var(--sidebar-foreground)}
.st-row.picked{background:color-mix(in srgb,var(--sidebar-primary) 14%,transparent);color:var(--sidebar-foreground);box-shadow:inset 2px 0 0 var(--sidebar-primary)}
.st-row.drop-over{background:color-mix(in srgb,var(--sidebar-primary) 16%,var(--sidebar-accent));outline:1.5px solid var(--sidebar-primary)}
.st-project.drop-over{background:color-mix(in srgb,var(--sidebar-primary) 16%,var(--sidebar-accent));color:var(--foreground);outline:1.5px solid var(--sidebar-primary)}
.is-dragging .st-project:not(.drop-over){outline:1px dashed var(--input);outline-offset:-1px}
.st .st-chev{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted-foreground);border-radius:4px}
.st .st-chev:hover{color:var(--sidebar-foreground)}
.st-chev span{display:grid;transition:transform .15s}
.st-chev span.open{transform:rotate(90deg)}
.st-gap{width:16px;flex:none}
.st-none{background:none!important;border:1px dashed var(--muted-foreground)}
.st .st-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:4px 0}
.st-main strong{font-weight:500;color:var(--sidebar-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-main span{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-project .st-main{flex-direction:row;align-items:baseline;gap:6px}
.st-project .st-main strong{font-weight:600;flex:none;max-width:60%}
.st-project .st-main span{font-size:11px}
.st-branch{color:var(--muted-foreground)}
.st-branch .st-main span{font:12px 'Geist Mono',monospace;color:var(--sidebar-foreground)}
.st-wt{font:500 9px 'Geist Mono',monospace;padding:1px 4px;border-radius:4px;border:1px solid var(--input);color:var(--muted-foreground);flex:none}
.st-count{font:10px 'Geist Mono',monospace;color:var(--muted-foreground)}
.st-tally{display:flex;gap:7px;flex:none;font:500 10px 'Geist Mono',monospace}
.st-tally span{display:flex;align-items:center;gap:3px}
.st-tally i{width:6px;height:6px;border-radius:50%;background:currentColor}
.t-need{color:var(--sidebar-primary)}.t-work{color:var(--info)}.t-done{color:var(--muted-foreground)}
.t-off{color:var(--muted-foreground)}.t-off i{background:none;border:1px solid currentColor}
.st-agent{align-items:flex-start;min-height:40px}
.st-agent>.st-chev,.st-agent>.st-gap{margin-top:7px}
.st-bot{width:18px;height:18px;flex:none;display:grid;place-items:center;margin-top:5px}
.st-card .st-bot{margin-top:1px}
.st-agent.helper{min-height:28px;align-items:center}
.st-agent.helper .st-main{flex-direction:row;gap:6px;align-items:baseline}
.st-agent.helper .st-main strong,.st-dense .st-agent .st-main strong{flex:none}
.st-agent.helper>.st-chev,.st-agent.helper>.st-gap,.st-agent.helper .st-bot,.st-agent.helper .st-time,.st-agent.helper .st-kids{margin-top:0}
.st-agent.done{opacity:.6}
.st-agent.off .st-main strong{color:var(--muted-foreground)}
.st-time{font:11px 'Geist Mono',monospace;color:var(--muted-foreground);flex:none;margin-top:6px}
.st-time.t-approval{color:var(--sidebar-primary)}.st-time.t-question{color:var(--warning)}.st-time.t-error{color:var(--danger-text)}
.st-kids{flex:none;margin-top:5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;border:1px solid var(--input);display:grid;place-items:center;font:500 10px 'Geist Mono',monospace;color:var(--muted-foreground)}
.st-acts{position:absolute;right:4px;top:4px;display:none;gap:1px;padding:1px;border-radius:var(--radius-sm);background:var(--sidebar-accent)}
.st-project .st-acts,.st-branch .st-acts,.st-agent.helper .st-acts{top:2px}
.st-row:hover .st-acts,.st-row:focus-within .st-acts{display:flex}
.st .st-acts button{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--muted-foreground)}
.st .st-acts button:hover{background:color-mix(in srgb,var(--foreground) 8%,transparent);color:var(--sidebar-foreground)}
.st-more{min-height:26px;font-size:12px}
.st .st-more button{color:var(--muted-foreground)}
.st .st-more button:hover{color:var(--sidebar-foreground)}
/* Archives, at the foot of the tree: folded, filterable, each session read, put back, resumed or deleted from its row. */
.st-archives{border-top:1px solid var(--sidebar-border);padding-top:6px}
.st .st-arch-toggle{display:flex;align-items:center;gap:6px;height:24px;font-size:11px;color:var(--muted-foreground)}
.st .st-arch-toggle:hover{color:var(--sidebar-foreground)}
.st-arch-toggle>span{display:grid;transition:transform .15s}
.st-arch-toggle>span.open{transform:rotate(90deg)}
.st-arch-toggle small{font:10px 'Geist Mono',monospace}
.st-arch-q{display:flex;align-items:center;gap:6px;height:28px;margin:2px 4px 4px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted-foreground)}
.st-arch-q input{flex:1;min-width:0;border:0;background:transparent;color:var(--sidebar-foreground);font:12px 'Geist',system-ui,sans-serif;outline:none}
.st-arch{padding-left:8px}
.st-arch .st-main strong{display:flex;align-items:center;gap:0;color:var(--muted-foreground)}
.st-arch .st-main strong .side-swatch{width:7px;height:7px;margin:0 6px 0 0}
.st-arch.sel .st-main strong{color:var(--sidebar-foreground)}
.st-arch .st-bot{opacity:.7}
.st .st-acts button.danger:hover{color:var(--danger-text)}
.st-help{margin:6px 8px 0;font-size:11px;line-height:15px;color:var(--muted-foreground)}
/* Compact: one line per session. */
.st-dense .st-agent{min-height:26px;align-items:center}
.st-dense .st-agent .st-main{flex-direction:row;gap:6px;align-items:baseline;padding:2px 0}
.st-dense .st-agent>.st-chev,.st-dense .st-agent>.st-gap,.st-dense .st-bot,.st-dense .st-time,.st-dense .st-kids{margin-top:0}
.st-dense .st-acts{top:1px}
/* The sessions picked with Ctrl/⌘ + click: « Écrire aux N sessions… » and « Annuler », above the foot. */
.st-picked{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid var(--sidebar-border);font-size:12px}
.st .st-picked-write{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-sm);background:var(--primary);color:var(--primary-foreground);font-weight:500}
.st .st-picked-write:hover{background:var(--primary-hover)}
.st .st-picked-cancel{height:28px;padding:0 8px;border-radius:var(--radius-sm);color:var(--muted-foreground)}
.st .st-picked-cancel:hover{background:var(--sidebar-accent);color:var(--sidebar-foreground)}
/* Machines and Settings at the foot. */
.st-foot{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-top:1px solid var(--sidebar-border);font-size:11px;color:var(--muted-foreground);overflow:hidden}
.st .st-mach{display:flex;align-items:center;gap:5px;white-space:nowrap}
.st .st-mach:hover{color:var(--sidebar-foreground)}
.st-mach small{font:10px 'Geist Mono',monospace}
.st-mach .machine-dot{margin:0}
/* The ? beside Settings: its tooltip lists the shortcuts (t.shortcuts.rows), on hover and on keyboard focus. It hangs from the
   aside (position:relative), above the foot, so the foot's overflow:hidden does not clip it. */
.st-keys-tip{position:absolute;left:8px;bottom:48px;z-index:30;width:max-content;max-width:320px;display:none;flex-direction:column;gap:5px;padding:10px 12px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-overlay);font-size:11px;line-height:15px;pointer-events:none}
.st-keys:hover .st-keys-tip,.st-keys:focus-within .st-keys-tip{display:flex}
.st-keys-tip>span{display:flex;align-items:center;justify-content:space-between;gap:14px}
.st-keys-tip kbd{flex:none;font-size:10px!important}
.side-footer{padding:0;border:0} /* alias: Settings' test reads this selector; the foot is .st-foot */
.side-swatch{width:9px;height:9px;border-radius:3px;margin:0 3px;flex-shrink:0;background:var(--info)}
.machine-dot{width:7px;height:7px;border-radius:50%;margin:0 4px 0 2px;background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 18%,transparent);flex-shrink:0}
.machine-dot.off{background:none;border:1.5px solid var(--muted-foreground);box-shadow:none}
/* A daemon restarting for its update (#48): neither online nor offline. */
.machine-dot.updating{background:var(--warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 18%,transparent)}
@media(max-width:1250px){.sidebar.st{width:256px}}
/* A narrow window: a 64 px rail, the projects as swatches with their tally, the rest behind icons. */
@media(max-width:850px){
 .sidebar.st{width:64px}
 .st kbd{display:none!important}
 .st .st-keys-tip kbd{display:inline-flex!important}
 .st-keys-tip{left:calc(100% + 6px);bottom:8px} /* the rail's foot is a column: the tooltip opens beside it */
 .st-ask{margin:10px 8px 0;padding:0;justify-content:center;border:0;background:none}.st-ask kbd{display:none}
 .st-views{flex-direction:column;margin:10px 8px 6px}.st .st-views button{font-size:0;gap:0}.st-views small{display:none}
 .st-attn,.st-label,.st-help,.st-empty,.st-kernel-box,.st-agent,.st-branch,.st-more,.st-archives{display:none}
 .st .st-views button{justify-content:center;padding:0}.st-views .st-fill{display:none}
 .st-project{justify-content:center;padding:0;min-height:36px}.st-project>.st-chev,.st-project>.st-gap,.st-project .st-main,.st-project .st-acts{display:none}
 .st-project .side-swatch{width:16px;height:16px;border-radius:5px}
 .st-tally{position:absolute;top:2px;right:6px}.st-tally span:not(.t-need){display:none}
 .st-foot{flex-direction:column;height:auto;padding:8px 0;gap:8px}.st .st-mach{font-size:0}.st-mach small{display:none}.st-foot .st-fill{display:none}
}

/* Ledge's entry (ledge home spec §2.1): the resident, « Ledge. », the live line and /, the question field under it; lit while the home view shows. */
.st-ask.st-ledge{height:auto;flex-direction:column;align-items:stretch;gap:0;padding:8px 14px;cursor:default}
.st-ledge .st-ledge-entry{display:flex;align-items:center;gap:8px;width:100%;padding:2px 0;border:0;background:none;color:var(--sidebar-foreground);text-align:left;cursor:pointer}
.st-ledge .st-ledge-names{display:flex;flex-direction:column;flex:1;min-width:0;line-height:14px}
.st-ledge .st-ledge-brand{font-size:13px;font-weight:650}
.st-ledge .st-ledge-line{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-ledge.on{background:color-mix(in srgb,var(--sidebar-primary) 8%,var(--well))}
@media(max-width:850px){.st-ask.st-ledge{padding:0}.st-ledge .st-ledge-names{display:none}.st-ledge .st-ledge-entry{justify-content:center}}
.st-card.st-task .st-task-mark{display:grid;place-items:center;width:18px;height:18px;font-size:12px;color:var(--success,#16a34a)}
.st-card.st-near .st-task-mark{color:var(--warning,#e5b85c)}
.st-card.st-decision .st-task-mark{color:var(--sidebar-primary);font-weight:700}

/* OpenRig's groups (docs/mockups/ledge-openrig-groups.html): a rig's hexagon, the kernel's. */
.st-rig-hex{display:inline-grid;place-items:center;color:var(--info);flex:none}
.st-kernel-hex{display:inline-grid;place-items:center;color:#8b5cf6;margin-right:4px}
.st-grouping{display:flex;flex:none;gap:2px;margin:0 10px 8px;padding:4px;border-radius:var(--radius-md);background:var(--well);border:1px solid var(--border)}
.st .st-grouping button{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px;height:26px;border-radius:var(--radius-sm);font-size:12px;color:var(--muted-foreground)}
.st .st-grouping button[aria-checked=true]{background:var(--card);color:var(--foreground);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18),0 0 0 1px var(--border)}

/* docs/mockups/ledge-sidebar-tidy.html, point 7 · Kernel, the operational layer: a tinted box in the kernel's violet, the
   same outer edges as the views and the toggle (the list's 8 px + 2 px = 10 px). Its header says the kernel's real state. */
.st-kernel-box{--kv:#8b5cf6;margin:0 0 0 2px;padding:2px 4px 4px;border:1px solid color-mix(in srgb,var(--kv) 34%,var(--border));border-radius:var(--radius-md);background:color-mix(in srgb,var(--kv) 7%,var(--sidebar))}
:root[data-theme="dark"] .st-kernel-box{--kv:#a78bfa;background:color-mix(in srgb,var(--kv) 9%,var(--sidebar))}
.st-kernel-box .st-label{padding:0 6px}
.st-kernel-box .st-kernel-name{color:var(--sidebar-foreground);font-weight:600}
.st-kernel-tag{display:flex;align-items:center;gap:5px;font:500 10px 'Geist Mono',monospace;color:color-mix(in srgb,var(--kv) 75%,var(--muted-foreground))}
.st-kernel-tag i{width:6px;height:6px;border-radius:50%;background:var(--muted-foreground)}
.st-kernel-tag[data-state="ready"] i{background:var(--success)}
.st-kernel-tag[data-state="starting"] i{background:var(--warning)}
.st-kernel-box .st-row{padding-left:6px}
.st-kernel-box .st-row:hover,.st-kernel-box .st-row.sel{background:color-mix(in srgb,var(--kv) 14%,var(--sidebar))}
/* Point 3 · Empty states: a quiet box in the list, its one action as an outline button. */
.st-empty{margin:2px 0 0 2px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:3px}
.st-empty strong{font-size:13px;font-weight:500;color:var(--sidebar-foreground);line-height:18px}
.st-empty p{margin:0;font-size:12px;line-height:17px;color:var(--muted-foreground)}
.st-empty p.err{color:var(--danger-text)}
.st .st-empty-btn{margin-top:8px;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--input);border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--sidebar-foreground);text-align:center}
.st .st-empty-btn:hover{background:var(--sidebar-accent)}
.st .st-empty-btn[disabled]{opacity:1;color:var(--muted-foreground);cursor:default}
.st .st-empty-btn[disabled]:hover{background:none}
.st .st-empty-link{margin-top:4px;align-self:center;font-size:11px;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:2px}
.st .st-empty-link:hover{color:var(--sidebar-foreground)}
.st-spin{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;animation:st-spin .9s linear infinite}
@keyframes st-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st-spin{animation:none}}

/* The mockup's chrome; the sidebar itself is sidebar.css, unchanged. */
:root { font-family: 'Geist', system-ui, sans-serif; }
:root[data-theme=dark] { color-scheme: dark; }
:root[data-theme=light] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--background); color: var(--foreground); font-size: 14px; line-height: 20px; }
button { font: inherit; }
button:not(.ledge-btn) { border: 0; background: none; color: inherit; cursor: pointer; }
code { font-family: 'Geist Mono', monospace; font-size: .92em; }

.mk-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--background); border-bottom: 1px solid var(--border); }
.mk-bar strong { font-size: 13px; }
.mk-fill { flex: 1; }
.mk-seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--well); }
.mk-seg button { padding: 3px 10px; border-radius: var(--radius-sm); font-size: 12px; color: var(--muted-foreground); }
.mk-seg button[aria-checked=true] { background: var(--muted); color: var(--foreground); }
.mk-main { padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.mk-panels { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.mk-panel { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.mk-panel figcaption { display: flex; flex-direction: column; font-size: 12px; color: var(--muted-foreground); line-height: 16px; }
.mk-panel figcaption strong { font-size: 13px; color: var(--foreground); display: inline-flex; gap: 8px; align-items: center; }
.mk-badge.was { background: var(--muted); color: var(--muted-foreground); }
.mk-eye-note { margin: 0; width: 288px; font-size: 11.5px; line-height: 16px; color: var(--muted-foreground); }
.mk-eye-note b { color: var(--foreground); font-weight: 500; }
.mk-badge { align-self: flex-start; font-size: 10px; padding: 0 6px; border-radius: 4px; background: var(--status-info-soft); color: var(--info); margin-bottom: 2px; }
.mk-sidebar { width: 288px; height: 660px; border: 1px solid var(--sidebar-border); border-radius: var(--radius-lg); overflow: hidden; }
.mk-eye-wrap { position: relative; display: inline-flex; }
.mk-tip { position: absolute; top: 28px; right: -6px; z-index: 5; white-space: nowrap; padding: 4px 8px; border-radius: var(--radius-sm); background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: var(--shadow-overlay); font-size: 11.5px; line-height: 16px; }
.st .mk-more-projects { margin-top: 4px; border-top: 1px dashed var(--sidebar-border); border-radius: 0; padding-top: 2px; }

.mk-cards { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.mk-card { border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); padding: 14px 16px; font-size: 12.5px; line-height: 18px; }
.mk-card h3 { margin: 0 0 8px; font-size: 13.5px; }
.mk-card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; }
.mk-kicker { margin: 0 0 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); font-weight: 600; }
.mk-card code { background: var(--well); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.mk-texts table { width: 100%; border-collapse: collapse; }
.mk-texts td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; }
.mk-texts td:first-child { width: 26%; }
@media (max-width: 1300px) { .mk-cards { grid-template-columns: 1fr; } }
