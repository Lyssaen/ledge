<title>Ledge · Accès mobile dans la TUI</title>
<!--
  Maquette : Réglages › Accès mobile dans `ledge tui`, pour un PC sans Ledge Desktop (2026-11-17).
  Mêmes réglages et mêmes messages au daemon que Desktop (docs/mockups/ledge-mobile-access.html) ; seule l'interface change.
  Choix du propriétaire : une ligne « Accès mobile » dans Réglages ouvre un écran dédié (B) ; une demande de liaison
  s'annonce par une ligne d'alerte et un badge, `m` ouvre « Lier un appareil » (B).
  Paramètres : ?st=<état> &theme=dark|light &lang=fr|en &w=72|100
-->
<style>

}
:root[data-theme="dark"] {

  --shadow: 0 20px 40px -12px rgba(0,0,0,.7);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 16px; background: var(--chrome); border-bottom: 1px solid var(--border); }
.bar b { font-weight: 600; margin-right: 4px; }
.grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.grp span { color: var(--muted); font-size: 12px; margin-right: 2px; }
.bar button { font: inherit; font-size: 12.5px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 24px 16px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; max-width: 900px; width: 100%; }
.note { max-width: 900px; width: 100%; color: var(--muted); font-size: 13px; margin: 0; }
.term { background: var(--t-bg); color: var(--t-fg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); max-width: 100%; overflow-x: auto; }
.term pre { font: 12.5px/17px 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace; white-space: pre; margin: 0; }
.term .fg{color:var(--t-fg)}.term .dim{color:var(--t-dim)}.term .faint{color:var(--t-faint)}.term .line{color:var(--t-line)}
.term .coral{color:var(--t-coral)}.term .red{color:var(--t-red)}.term .yellow{color:var(--t-yellow)}.term .green{color:var(--t-green)}
.term .blue{color:var(--t-blue)}.term .b{font-weight:700}.term .u{text-decoration:underline}
.term .barbg{background:var(--t-bar)}.term .selbg{background:var(--t-sel)}.term .key{background:var(--t-key)}
.term .w1{display:inline-block;width:1ch;text-align:center;overflow:visible;vertical-align:top}
ul.rules { max-width: 900px; width: 100%; margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; }
ul.rules li { margin: 3px 0; }

  },

const t = T[S.lang];

/* ---------- terminal grid ---------- */
const len = s => [...s].length;
const lenSegs = segs => segs.reduce((x, [s]) => x + len(s), 0);
function padSegs(segs, w, fill = '') {
  const out = []; let n = 0;
  for (const [txt, c] of segs) {
    if (n >= w) break;
    let s = txt;
    if (n + len(s) > w) s = [...s].slice(0, Math.max(0, w - n - 1)).join('') + '…';
    out.push([s, c]); n += len(s);
  }
  if (n < w) out.push([' '.repeat(w - n), fill]);
  return out;
}
function box(title, rows, w, color = 'line', tcolor = 'dim') {
  const inner = w - 4;
  const top = [['╭─ ', color], [title, tcolor], [' ' + '─'.repeat(Math.max(0, w - 5 - len(title))) + '╮', color]];
  return [top, ...rows.map(r => r.sel
    ? [['│', color], ['▌', 'coral selbg'], ...padSegs(r.segs, inner + 1, 'selbg').map(([s, c]) => [s, (c ? c + ' ' : '') + 'selbg']), ['│', color]]
    : [['│ ', color], ...padSegs(r.segs || r, inner), [' │', color]]), [['╰' + '─'.repeat(w - 2) + '╯', color]]];
}
const esc = s => [...s].map(ch => ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch).join('');
function renderTerm(lines, w) {
  return `<div class="term"><pre>${lines.map(segs => padSegs(segs, w).map(([s, c]) => c ? `<span class="${c}">${esc(s)}</span>` : esc(s)).join('')).join('\n')}</pre></div>`;
}
function status(w, badge) {
  const left = [[' ◖ ledge', 'coral'], [`  ${t.status.sessions}`, 'dim']];
  if (badge) left.push([' · ', 'dim'], ['▯ 1', 'yellow b']);
  const gap = w - lenSegs(left) - len(t.status.local) - 1;
  return [...left, [' '.repeat(Math.max(1, gap)), ''], [t.status.local + ' ', 'dim']].map(([s, c]) => [s, (c ? c + ' ' : '') + 'barbg']);
}
const keys = list => list.flatMap(([k, a]) => [[` ${k} `, 'key fg'], [` ${a}  `, 'dim']]);
const L = 22;
const lab = (s, c = 'dim') => [s.padEnd(L), c];
const row = (label, ...v) => [lab(label), ...v];
const sel = (label, ...v) => ({ sel: true, segs: [[label.padEnd(L), 'fg'], ...v] });

/* ---------- screens ---------- */
function settingsScreen(W) {
  const rows = [
    row(t.setLang, [S.lang === 'fr' ? 'Français' : 'English', 'fg']),
    row(t.setTheme, ['Auto', 'fg']),
    row(t.setCtx, ['‹ 85 % ›', 'fg'], [`  ${t.setCtxH}`, 'faint']),
    row(t.setLim, ['‹ 80 % ›', 'fg'], [`  ${t.setLimH}`, 'faint']),
    sel(t.mob, ['● ', 'green'], [t.mobSum.on(2, 1), 'fg'], ['  ↵', 'faint'])
  ];
  return [status(W, true), alertLine(W), ...box(t.set, rows, W), keys([['j k', t.keys.move], ['← →', t.keys.change], ['↵', t.keys.open], ['esc', t.keys.back]])];
}
function alertLine(W) {
  const k = [[' m ', 'key fg'], [` ${t.alertCompare}  `, 'fg'], [' x ', 'key fg'], [` ${t.alertLater} `, 'fg']];
  const left = [[' ● ', 'yellow'], [t.alert(t.pixel), 'fg']];
  const gap = W - lenSegs(left) - lenSegs(k);
  return [...left, [' '.repeat(Math.max(1, gap)), ''], ...k].map(([s, c]) => [s, (c ? c + ' ' : '') + 'selbg']);
}
function deviceRows(opts = {}) {
  const r = [];
  if (opts.pending) r.push(opts.selPending ? { sel: true, segs: [['! ', 'yellow'], [`${t.pixel} ${t.asks}`, 'fg b'], ['   ↵ ' + t.compare, 'faint']] } : [['! ', 'yellow'], [`${t.pixel} ${t.asks}`, 'yellow'], ['   ↵ ' + t.compare, 'faint']]);
  const iphone = opts.renaming
    ? { sel: true, segs: [['▯ ', 'fg'], [t.nameLabel + ' ', 'dim'], ['[ iPhone perso▏          ]'.replace('iPhone perso', S.lang === 'fr' ? 'iPhone perso' : 'Personal iPhone'), 'fg'], ['  ↵ ' + t.keys.save + '  esc ' + t.keys.cancel, 'faint']] }
    : opts.revoking
      ? { sel: true, segs: [['▯ ', 'fg'], [t.revokeAsk(t.iphone), 'red'], ['  y / n', 'fg b']] }
      : opts.recovered
        ? { sel: true, segs: [['▯ ', 'fg'], [t.iphone.padEnd(18), 'fg'], [` ${t.recTag} `, 'blue b'], ['  ' + t.seen.now, 'faint']] }
        : opts.selIphone ? { sel: true, segs: [['▯ ', 'fg'], [t.iphone.padEnd(18), 'fg'], [`${t.linkedOn(t.d1)} · ${t.seen.min}`, 'faint']] }
          : [['▯ ', 'fg'], [t.iphone.padEnd(18), 'fg'], [`${t.linkedOn(t.d1)} · ${t.seen.min}`, 'faint']];
  r.push(iphone);
  if (opts.recovered) { r.push([['  ' + t.recWell[0], 'blue']]); r.push([['  ' + t.recWell[1], 'blue']]); r.push([['  ↵ ', 'faint'], [t.recAck, 'fg u'], ['   x ', 'faint'], [t.keys.revoke, 'fg']]); }
  r.push([['▭ ', 'fg'], [t.ipad.padEnd(18), 'fg'], [`${t.linkedOn(t.d2)} · ${t.seen.yest}`, 'faint']]);
  return r;
}
function mobileScreen(W, st) {
  const dimmed = st === 'off';
  const D = dimmed ? 'faint' : 'fg';
  const access = st === 'off' ? sel(t.access, ['○ ', 'faint'], [t.offW, 'fg'], [`  ${t.accessH}`, 'faint']) : row(t.access, ['● ', 'green'], [t.on, 'fg'], [`  ${t.accessH}`, 'faint']);
  const relay = st === 'relay'
    ? sel(t.relay, ['[ http://relais.example/ledge▏ ]', 'fg'])
    : row(t.relay, ['app.kl-ledge.dev', D]);
  let account, statusRow, extra = [];
  if (st === 'signin') { account = sel(t.account, [t.signin, 'fg b'], ['  ↵', 'faint']); statusRow = row(t.statusL, ['○ ', 'faint'], [t.idle, 'fg'], [`  ${t.idleH}`, 'faint']); }
  else if (st === 'flow') {
    account = sel(t.account, [t.flowLead + ' ', 'fg'], [t.flowUrl, 'blue u']);
    extra = [[[' '.repeat(L), ''], [t.flowAnd + ' ', 'fg'], [t.flowCode, 'yellow b']], [[' '.repeat(L), ''], [t.flowWait, 'faint']]];
    statusRow = row(t.statusL, ['○ ', 'faint'], [t.idle, 'fg']);
  } else if (st === 'refused') {
    account = sel(t.account, [t.otherAccount, 'fg b'], ['  ↵', 'faint']);
    extra = [[[' '.repeat(L), ''], [t.notAllowed[0], 'red']], [[' '.repeat(L), ''], [t.notAllowed[1], 'red']]];
    statusRow = row(t.statusL, ['○ ', 'faint'], [t.idle, 'fg']);
  } else if (st === 'signedout') {
    account = sel(t.account, [t.reconnect, 'fg b'], ['  ↵', 'faint']);
    extra = [[[' '.repeat(L), ''], [t.signedOut[0], 'yellow']], [[' '.repeat(L), ''], [t.signedOut[1], 'yellow']]];
    statusRow = row(t.statusL, ['○ ', 'faint'], [t.idle, 'fg']);
  } else {
    account = row(t.account, ['@octocat', D], [`  · ${t.signout}`, 'faint']);
    statusRow = st === 'offline'
      ? sel(t.statusL, ['● ', 'yellow'], [t.retryIn(12), 'fg'], ['  ↵ ' + t.retry, 'faint'])
      : st === 'off' ? row(t.statusL, ['○ ', 'faint'], [t.offW, 'faint']) : row(t.statusL, ['● ', 'green'], [t.online, 'fg']);
    if (st === 'offline') extra = [[[' '.repeat(L), ''], [t.unreachable[0], 'yellow']], [[' '.repeat(L), ''], [t.unreachable[1], 'yellow']]];
  }
  const relayErr = st === 'relay' ? [[[' '.repeat(L), ''], [t.relayBad, 'red']], [[' '.repeat(L), ''], ['↵ ' + t.keys.save + '   esc ' + t.keys.cancel, 'faint']]] : [];
  const accountBlock = st === 'flow' || st === 'refused' || st === 'signedout' ? [account, ...extra, statusRow] : st === 'offline' ? [account, statusRow, ...extra] : [account, statusRow];
  const rows = [access, relay, ...relayErr, ...accountBlock, row(t.term, [t.no, D], [`  ${t.termH}`, 'faint'])];
  const lines = [status(W, st === 'online'), ...(st === 'online' ? [alertLine(W)] : []), ...box(t.title, rows, W)];
  // Devices
  if (st === 'off') lines.push(...box(t.devices(2), [[[t.offWell, 'faint']], [['▯ ', 'faint'], [t.iphone, 'faint']], [['▭ ', 'faint'], [t.ipad, 'faint']]], W));
  else if (st === 'empty') lines.push(...box(t.devicesNone, t.empty.map(s => [[s, 'dim']]), W));
  else if (['signin', 'flow', 'refused', 'signedout'].includes(st)) lines.push(...box(t.devices(2), deviceRows(), W));
  else if (st === 'blocked') lines.push(...box(t.devices(2), [{ sel: true, segs: [['⊘ ', 'red'], [t.blocked[0], 'red']] }, [['  ' + t.blocked[1], 'red']], [['  ' + t.blocked[2], 'red']], [['  ↵ ', 'faint'], [t.unblock, 'fg u']], ...deviceRows()], W));
  else lines.push(...box(t.devices(2), deviceRows({ pending: st === 'online', selPending: false, renaming: st === 'rename', revoking: st === 'revoke', recovered: st === 'recovered' }), W));
  const k = ['rename', 'relay'].includes(st) ? [['↵', t.keys.save], ['esc', t.keys.cancel]]
    : st === 'revoke' ? [['y', t.keys.yes], ['n', t.keys.no]]
      : st === 'flow' ? [['c', t.keys.copy], ['esc', t.keys.cancel]]
        : [['j k', t.keys.move], ['↵', t.keys.open], ['r', t.keys.rename], ['x', t.keys.revoke], ['esc', t.keys.back]];
  lines.push(keys(k));
  return lines;
}
function overviewLines(W) {
  const left = 32, right = W - left;
  const o = t.overview;
  const L1 = [...box(o.yours, [[['! ', 'red'], ['Otto ', 'fg'], [o.otto, 'dim']]], left, 'red', 'red'),
    ...box(o.projects, [[['ledge', 'fg']], [['! ', 'red'], ['Otto   ', 'fg'], [o.s[0], 'dim']], [['● ', 'blue'], ['Nova   ', 'fg'], [o.s[1], 'dim']], [['○ ', 'green'], ['Pim    ', 'fg'], [o.s[2], 'dim']]], left)];
  const R1 = box(o.sess, [[[o.you, 'dim']], [['  ' + o.msg, 'fg']], [['◆ ', 'red'], ['Bash   ', 'dim'], ['npm test', 'fg'], ['  ' + o.wait, 'red']], [], [], [], []], right);
  const n = Math.max(L1.length, R1.length);
  return Array.from({ length: n }, (_, i) => [...(L1[i] || [[' '.repeat(left), '']]), ...(R1[i] || [])]);
}
function overlay(base, dlg, W) {
  const dw = lenSegs(dlg[0]), x = Math.floor((W - dw) / 2), y = 3;
  return base.map((segs, i) => {
    const d = dlg[i - y];
    if (!d) return segs;
    const flat = padSegs(segs, W);
    // cut base at x and x + dw, keeping colors
    const out = []; let n = 0;
    for (const [s, c] of flat) {
      for (const ch of [...s]) {
        if (n < x || n >= x + dw) out.push([ch, c ? c + ' faint' : 'faint']);
        if (n === x) out.push(...d);
        n++;
      }
    }
    return out;
  });
}
function pairDialog(st) {
  const w = 58, inner = w - 4;
  let body;
  if (st === 'pair') body = [
    [[t.pairIntro[0], 'fg']], [[t.pairIntro[1], 'fg']], [],
    [[t.pairCode, 'dim']], [['          4 7 2 · 9 1 5 · 3 0 8', 'yellow b']], [],
    [[t.pairCheck[0], 'dim']], [[t.pairCheck[1], 'dim']],
    [[t.pairWarn[0], 'red']], [[t.pairWarn[1], 'red'], [' '.repeat(Math.max(1, inner - len(t.pairWarn[1]) - len(t.expires))), ''], [t.expires, 'faint']], [],
    [['  ', ''], [' y ', 'key fg'], [` ${t.approve}   `, 'green'], [' n ', 'key fg'], [` ${t.deny}   `, 'red'], [' esc ', 'key fg'], [` ${t.later}`, 'dim']]
  ];
  else {
    const [a, b] = st === 'approved' ? t.approvedL : st === 'linked' ? t.linkedL : t.expiredL;
    const c = st === 'expired' ? 'yellow' : 'green';
    body = [[[st === 'expired' ? '⊘ ' : '✓ ', c], [a, c + ' b']], [['  ' + b, 'fg']], [], [['  ', ''], [' esc ', 'key fg'], [` ${t.close}`, 'dim']]];
  }
  return box(t.pairT, body, w, 'yellow', 'yellow b').map(r => r.map(([s, c]) => [s, c]));
}

/* ---------- page ---------- */
function screen() {
  const W = S.w;
  if (S.st === 'settings') return settingsScreen(W);
  if (S.st === 'alert') return [status(W, true), alertLine(W), ...overviewLines(W), keys([['j k', t.keys.move], ['↵', t.keys.open], ['m', t.keys.pair], [',', t.keys.settings], ['?', t.keys.help]])];
  if (['pair', 'approved', 'linked', 'expired'].includes(S.st)) {
    const dlg = pairDialog(S.st);
    const top = [status(W, S.st === 'pair'), ...(S.st === 'pair' ? [alertLine(W)] : [[]]), ...overviewLines(W)];
    while (top.length < dlg.length + 4) top.push([]);
    const base = [...top, keys([['j k', t.keys.move], ['↵', t.keys.open], ['m', t.keys.pair], [',', t.keys.settings], ['?', t.keys.help]])];
    return overlay(base, dlg, W);
  }
  return mobileScreen(W, S.st);
}
function link(k, v) { const p = new URLSearchParams(location.search); p.set(k, v); return '?' + p.toString(); }
function renderBar() {
  const btn = (k, v, label) => `<button aria-pressed="${String(S[k]) === String(v)}" onclick="location.search='${link(k, v)}'">${label}</button>`;
  document.getElementById('bar').innerHTML = `<b>${t.page}</b>
    <div class="grp"><span>${S.lang === 'fr' ? 'État' : 'State'}</span>${STATES.map(s => btn('st', s, t.states[s])).join('')}</div>
    <div class="grp">${btn('theme', 'dark', S.lang === 'fr' ? 'Sombre' : 'Dark')}${btn('theme', 'light', S.lang === 'fr' ? 'Clair' : 'Light')}</div>
    <div class="grp">${btn('lang', 'fr', 'FR')}${btn('lang', 'en', 'EN')}</div>
    <div class="grp">${btn('w', 72, '72 col')}${btn('w', 100, '100 col')}</div>`;
}
function render() {
  renderBar();
  document.getElementById('main').innerHTML = `<h1>${t.states[S.st]}</h1><p class="note">${t.notes[S.st]}</p>${renderTerm(screen(), S.w)}<ul class="rules">${t.rules.map(r => `<li>${r}</li>`).join('')}</ul>`;
}
render();
</script>
