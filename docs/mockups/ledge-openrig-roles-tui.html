<script type="text/plain" id="md-role"># Rôle : développeur de ledge-dev

Tu implémentes la tâche qui t'est assignée et tu la prouves par l'effet. Ton périmètre (front ou back) t'est donné au démarrage.

## Au démarrage

`rig whoami --json`, puis `rig queue list --owned --limit 1000`. Réclame la ligne avant d'y travailler.

## Avant d'écrire du code

- **Écran touché ?** La tâche doit citer une maquette de `docs/mockups/` validée par l'utilisateur. Sans elle, renvoie la ligne au lead : tu ne commences pas le front-end. La maquette fait foi pour la disposition, les états, les textes FR/EN et les interactions ; un point absent se demande à `design-ux@ledge-dev`, il ne s'invente pas.
- Lis la zone concernée avant de la modifier ; reproduis un défaut avant de le corriger.

## Où travailler

Jamais dans `~/Workspace/ledge` (la copie de l'utilisateur, souvent avec du travail en cours). Un worktree par tâche, à côté du dépôt :

```
git -C ~/Workspace/ledge worktree add ../ledge-worktrees/<siège>-<sujet> -b <type>/<sujet> <base>
```

puis `pnpm install` **dans** ce worktree (jamais de `node_modules` lié depuis la copie principale : les builds liraient l'autre arbre). Travaille et teste dans ce dossier.

## Livrer

- Changement minimal et cohérent ; tests du comportement modifié ; `pnpm test` (Node 22) et `pnpm typecheck` du paquet touché au minimum.
- Commits locaux sur ta branche. Pas de push, PR ou merge sans accord explicite de l'utilisateur.</script>
<script type="text/plain" id="md-front"># Ton périmètre : front-end

Tu es `dev-front`. Tu tiens les interfaces : `apps/desktop` (Tauri 2 + React, Vite), `apps/mobile` (PWA), `apps/overlay` (l'île), `packages/ui`, et le rendu de `ledge tui`.

- Tout changement visible part d'une maquette validée (voir ton rôle). Tu travailles avec `design-ux@ledge-dev`.
- Avant de dire fini sur un écran : captures Playwright, zoomées, alignements contrôlés contre la maquette, thèmes clair et sombre.
- Textes ajoutés en FR et EN (`src/i18n/fr.ts`, `src/i18n/en.ts`).</script>

let C, L;

/* ---------- a cell grid ---------- */
class Scr{
  constructor(w,h){this.w=w;this.h=h;this.c=[...Array(h)].map(()=>[...Array(w)].map(()=>({ch:' ',fg:C.fg,bg:null,b:false})));}
  put(x,y,str,fg=C.fg,bg=null,b=false){ if(y<0||y>=this.h) return x; for(const ch of [...str]){ if(x>=0&&x<this.w) this.c[y][x]={ch,fg,bg:bg??this.c[y][x].bg,b}; x++; } return x; }
  segs(x,y,segs,maxX=this.w){ for(const s of segs){ const room=maxX-x; if(room<=0) break; const str=[...s.t].slice(0,room).join(''); x=this.put(x,y,str,s.fg??C.fg,s.bg??null,!!s.b); } return x; }
  fill(x,y,w,bg){ for(let i=x;i<x+w&&i<this.w;i++) if(y>=0&&y<this.h) this.c[y][i].bg=bg; }
  box(x,y,w,h,title,{color=C.line,tColor=C.dim,mark=null,foot=null,bold=false}={}){
    const head=' '+title.toUpperCase(); const mk=mark?' '+mark.t.toUpperCase():'';
    this.put(x,y,'╭─',color); let cx=this.put(x+2,y,head,tColor,null,bold); if(mark) cx=this.put(cx,y,mk,mark.fg); cx=this.put(cx,y,' ',tColor);
    this.put(cx,y,'─'.repeat(Math.max(0,x+w-1-cx)),color); this.put(x+w-1,y,'╮',color);
    for(let i=1;i<h-1;i++){ this.put(x,y+i,'│',color); this.put(x+w-1,y+i,'│',color); }
    if(foot){ const f=' '+foot+' '; const n=Math.max(1,w-4-[...f].length); this.put(x,y+h-1,'╰'+'─'.repeat(n),color); const fx=this.put(x+1+n,y+h-1,f,C.faint); this.put(fx,y+h-1,'─'.repeat(Math.max(0,x+w-1-fx))+'╯',color); }
    else this.put(x,y+h-1,'╰'+'─'.repeat(w-2)+'╯',color);
  }
  html(){
    return this.c.map(row=>row.map(k=>{ const st=`color:${k.fg};${k.bg?`background:${k.bg};`:''}${k.b?'font-weight:600;':''}`; const ch=k.ch==='&'?'&amp;':k.ch==='<'?'&lt;':k.ch==='>'?'&gt;':k.ch; return `<span class="c" style="${st}">${ch}</span>`; }).join('')).join('\n');
  }
}
const len = s => [...s].length;
const pad = (s,n) => len(s)>=n ? [...s].slice(0,n-1).join('')+'…' : s+' '.repeat(n-len(s));

/* ---------- frame: status bar, keys ---------- */
function frame(S,crumb,keys){
  S.fill(0,0,S.w,C.bar);
  let x=S.put(0,0,L.bar,C.coral,C.bar); S.put(x,0,L.sessions,C.dim,C.bar);
  const cr=len(crumb)<S.w-40?crumb:crumb.split(' · ').pop(); S.put(S.w-1-len(cr),0,cr,C.dim,C.bar);
  // fitKeys: drop the last keys until it fits, `?` stays.
  const help=['?',L.k.help]; let list=keys.slice();
  const w=l=>1+l.reduce((n,[k,lab],i)=>n+len(` ${k} `)+len(` ${lab}`)+(i?2:0),0);
  while(list.length && w([...list,help])>S.w-1) list.pop();
  x=1; for(const [k,lab] of [...list,help]){ x=S.put(x,S.h-1,` ${k} `,C.fg,C.key); x=S.put(x,S.h-1,` ${lab}`,C.dim); x+=2; }
}

/* ---------- markdown → styled lines ---------- */
function mdLines(src,width){
  const out=[]; let code=false;
  const toks = str => { const r=[]; str.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(p=>{ if(!p) return; if(p.startsWith('`')) r.push({t:p.slice(1,-1),fg:C.fg,bg:C.code}); else if(p.startsWith('**')) r.push({t:p.slice(2,-2),fg:C.fg,b:true}); else r.push({t:p,fg:C.fg}); }); return r; };
  const wrap = (segs,w,first='',hang='') => {
    const words=[]; segs.forEach(s=>s.t.split(/(\s+)/).forEach(p=>{ if(p) words.push({...s,t:p}); }));
    const lines=[]; let cur=first?[{t:first,fg:C.dim}]:[]; let n=len(first);
    for(const wd of words){ const l=len(wd.t); if(/^\s+$/.test(wd.t)){ if(n>0&&n<w){cur.push(wd);n+=l;} continue; } if(n+l>w && n>len(hang)){ lines.push(cur); cur=hang?[{t:hang,fg:C.dim}]:[]; n=len(hang); } cur.push(wd); n+=l; }
    if(cur.length) lines.push(cur); return lines;
  };
  for(const l of src.split('\n')){
    if(l.startsWith('```')){ code=!code; continue; }
    if(code){ out.push([{t:'  '+l,fg:C.dim,bg:C.code}]); continue; }
    if(/^# /.test(l)){ out.push([{t:l.slice(2),fg:C.coral,b:true}]); continue; }
    if(/^## /.test(l)){ if(out.length && out[out.length-1].length) out.push([]); out.push([{t:l.slice(3),fg:C.fg,b:true}]); continue; }
    if(/^- /.test(l)){ wrap(toks(l.slice(2)),width,'• ','  ').forEach(x=>out.push(x)); continue; }
    if(!l.trim()){ if(out.length && out[out.length-1].length) out.push([]); continue; }
    wrap(toks(l),width).forEach(x=>out.push(x));
  }
  return out;
}

/* ---------- pieces ---------- */
const provColor = k => ({here:C.fg,inh:C.blue,abs:C.faint,unk:C.yellow})[k];
/* The margin rail: here is grey (not the yellow of unknown), inherited blue, not declared faint, unknown yellow. */
function rail(S,x,y,k){ S.put(x,y,'▎',k==='here'?C.dim:provColor(k)); }
function rightAlign(S,xEnd,y,str,fg){ S.put(xEnd-len(str),y,str,fg); }

function roleList(S,x,y,w,h,{sel=0,narrow=false}={}){
  S.box(x,y,w,h,L.roles+' · 21');
  const ix=x+2, iw=w-4; let yy=y+1;
  S.put(ix,yy++,L.search,C.faint);
  yy++;
  S.segs(ix,yy++,[{t:L.mine,fg:C.dim},{t:' · 5',fg:C.faint}]);
  const rows=[['ledge-developer',L.seatsN(2),true],['ledge-lead',L.seat1,true],['ledge-reviewer',L.seat1,true],['ledge-ux',L.seat1,true],['shared',L.imported,false]];
  rows.forEach(([n,c,live],i)=>{
    const s=i===sel; if(s) S.fill(x+1,yy,w-2,C.sel);
    S.put(x+1,yy,s?'▌':' ',s?C.coral:C.faint,s?C.sel:null);
    S.put(ix,yy,n,live?C.fg:C.faint,s?C.sel:null,s);
    const ct=(live?'● ':'')+c; S.put(ix+iw-len(ct),yy,ct,live?C.green:C.faint,s?C.sel:null);
    if(live) S.put(ix+iw-len(ct)+2,yy,c,C.dim,s?C.sel:null);
    yy++;
    if(narrow){ const sum={'ledge-developer':'Dev de ledge-dev — implémente dans un worktree…','ledge-lead':'Lead de ledge-dev — reçoit les objectifs, applique…','ledge-reviewer':'Reviewer de ledge-dev — revue indépendante du diff…','ledge-ux':'UX/UI de ledge-dev — maquettes dans docs/mockups…','shared':'Ressources communes aux agents de ledge-dev…'}[n]; S.put(ix+2,yy++,pad(sum,iw-2),C.faint,s?null:null); }
  });
  yy++;
  S.segs(ix,yy++,[{t:'▸ ',fg:C.dim},{t:L.builtin,fg:C.dim},{t:' · 16',fg:C.faint}]);
}

function detailHead(S,x,y,w,{lens='spec',tab=0,ctxN=1,narrow=false}){
  const ix=x+2, iw=w-4; let yy=y+1;
  mdLines(L.desc,iw).forEach(l=>{ S.segs(ix,yy++,l.map(s=>({...s,fg:C.fg}))); });
  if(narrow) S.put(ix,yy++,pad(L.path,iw),C.faint);
  else S.segs(ix,yy++,[{t:L.path,fg:C.faint},{t:'  '+L.same,fg:C.green}]);
  const lensItems=[['spec',L.spec],['dev.front',L.from+' dev.front'],['dev.back',L.from+' dev.back']];
  let lx=S.put(ix,yy,L.seen+'  ',C.dim);
  lensItems.forEach(([k,lab])=>{ if(k===lens) lx=S.put(lx,yy,'‹ '+lab+' ›',C.fg,null,true); else lx=S.put(lx,yy,'  '+lab+'  ',C.dim); lx+=1; });
  yy+=2;
  const tabs=[L.tRole,L.tParams,L.tCtx+' '+ctxN,L.tYaml]; let tx=ix;
  tabs.forEach((lab,i)=>{ if(i===tab) tx=S.put(tx,yy,'‹ '+lab+' ›',C.coral,null,true); else tx=S.put(tx,yy,'  '+lab+'  ',C.dim); tx+=1; });
  yy++;
  S.put(ix,yy++,'─'.repeat(iw),C.line);
  return yy;
}

function roleBody(S,x,y,w,yEnd,{seat=false,narrow=false}){
  const ix=x+2, iw=w-4; let yy=y;
  const head=(file,prov,pc,size)=>{ S.segs(ix,yy,[{t:file,fg:C.fg,b:true},{t:'  '+prov,fg:pc}]); rightAlign(S,ix+iw,yy,size,C.faint); yy++; if(!narrow){ S.put(ix,yy++,L.delivered,C.faint);} yy++; };
  head('guidance/role.md',L.here,C.fg,lang==='fr'?'1,8 ko':'1.8 kB');
  const lines=mdLines(document.getElementById('md-role').textContent,iw);
  let shown=0;
  for(const l of lines){ if(yy>=yEnd) break; rail(S,x+1,yy,'here'); S.segs(ix,yy++,l,ix+iw); shown++; }
  return lines.length-shown;
}

/* ---------- screens ---------- */
function scrRole(w=120,h=38,{lens='spec'}={}){
  const S=new Scr(w,h);
  frame(S,L.crumb,[['tab',L.k.machine],['v',L.k.view],['j k',L.k.scroll],['← →',L.k.tab],['f',L.k.from],['r',L.k.raw],['/',L.k.search],['esc',L.k.list]]);
  roleList(S,0,1,40,h-2);
  const x=40,bw=w-40;
  const yy=detailHead(S,x,1,bw,{lens,tab:0,ctxN:lens==='spec'?1:10});
  const rest=roleBody(S,x,yy,bw,h-3,{});
  S.box(x,1,bw,h-2,'ledge-developer',{mark:{t:'· v1.0 · '+L.mine,fg:C.dim},foot:L.more(rest+0),color:C.coral,tColor:C.coral,bold:true});

  detailHead(S,x,1,bw,{lens,tab:0,ctxN:lens==='spec'?1:10}); roleBody(S,x,yy,bw,h-3,{});
  return S;
}

    row('here','startup.actions',L.empty,L.here,C.faint);
  };
  draw(); S.box(x,1,bw,h-2,'ledge-developer',{mark:{t:'· '+L.from+' dev.front',fg:C.blue},foot:L.more(9),color:C.coral,tColor:C.coral,bold:true}); draw();
  return S;
}

function scrContext(w=120,h=38){
  const S=new Scr(w,h);
  frame(S,L.crumb,[['tab',L.k.machine],['v',L.k.view],['j k',L.k.nav],['↵',L.k.read],['← →',L.k.tab],['f',L.k.from],['r',L.k.raw],['esc',L.k.list]]);

    let yy=detailHead(S,x,1,bw,{lens:'dev.front',tab:2,ctxN:10});

      S.put(ix,yy,String(i).padStart(2),C.faint,s?C.sel:null);

      S.put(ix+5,yy,pad(title,35),C.fg,s?C.sel:null,s);
      S.put(ix+41,yy,pad(ch,10),C.dim,s?C.sel:null);
      S.put(ix+51,yy,pad(sz,7),C.faint,s?C.sel:null);
      S.put(ix+58,yy,pad(src,iw-58),provColor(k)===C.fg?C.dim:provColor(k),s?C.sel:null);
      yy++;
    });
    S.put(ix,yy++,L.notShown,C.faint);
    S.put(ix,yy++,'─'.repeat(iw),C.line);
    S.segs(ix,yy++,[{t:'guidance/scope-front.md',fg:C.fg,b:true},{t:'  '+L.inh(L.member),fg:C.blue}]);

  };

/* ---------- render ---------- */
const VIEWS = {
  role:()=>[['120 × 38 · '+(lang==='fr'?'vu selon la spec':'from the spec'),scrRole()]],
  params:()=>[['120 × 38',scrParams()]],
  context:()=>[['120 × 38',scrContext()]],
  narrow:()=>[['80 × 32 · '+(lang==='fr'?'liste':'list'),scrNarrowList()],['80 × 32 · ↵ '+(lang==='fr'?'rôle':'role'),scrNarrowDetail()],['80 × 32 · → '+(lang==='fr'?'paramètres depuis dev.front':'parameters from dev.front'),scrNarrowParams()]],
  rigs:()=>[['120 × 26 · Rigs',scrRigs()],['120 × 38 · i → '+(lang==='fr'?'rôle depuis dev.front':'role from dev.front'),scrRole(120,38,{lens:'dev.front'})]],
  states:()=>[['120 × 34',scrStates()]],
};
function render(){
  C=PAL[theme]; L=T[lang];
  document.documentElement.dataset.theme=theme; document.documentElement.lang=lang;
  document.getElementById('note').innerHTML=L['n_'+view];
  document.getElementById('screens').innerHTML=VIEWS[view]().map(([cap,S])=>`<p class="cap">${cap}</p><div class="frame" style="background:${C.bg}"><div class="tt">${S.html()}</div></div>`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.v){ view=b.dataset.v; document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }
  else if(b.dataset.themeBtn){ theme=b.dataset.themeBtn; document.querySelectorAll('[data-theme-btn]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }
  else if(b.dataset.langBtn){ lang=b.dataset.langBtn; document.querySelectorAll('[data-lang-btn]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }
  else return;
  render();
});
render();
