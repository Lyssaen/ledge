<title>Ledge Espace de travail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: an IDE window — activity bar, explorer, a splittable editor area, a right panel, a status bar.
   Tokens are Ledge's own (packages/ui tokens.css, dark). Single dark look, as in every Ledge Desktop mockup. */
:root{
  color-scheme:dark;
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--muted:oklch(0.269 0 0);
  --muted-foreground:oklch(0.708 0 0);--primary:oklch(0.444 0.177 26.899);--primary-hover:oklch(0.396 0.141 25.723);
  --border:#ffffff1a;--input:#ffffff26;--sidebar:oklch(0.205 0 0);
  --danger-text:oklch(0.704 0.191 22.216);
  --st-perm:#f87171;--st-ask:#fbbf24;--st-work:#60a5fa;--st-idle:#34d399;--st-off:#71717a;
  --link1:#a78bfa;--link2:#2dd4bf;
  --term-bg:#0c0c0d;--term-fg:#e5e5e5;--t-green:#4ade80;--t-yellow:#facc15;--t-red:#f87171;--t-blue:#7cb3fb;--t-dim:#8f8f8f;
  --shell:#0d0d0d;--side:#141414;--pane:#111112;--mkbar:#0a0a0a;--page:#000;
  --diff-add:#0f2e1c;--diff-del:#3a1414;
  --font:'Geist','Segoe UI',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--page);color:var(--foreground);font-size:13px;line-height:18px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible{outline:2px solid var(--link1);outline-offset:1px}
.mono{font-family:var(--mono)}
.mut{color:var(--muted-foreground)}

/* Mockup chrome (not part of the product) */
.mk-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--mkbar);border-bottom:1px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--mkbar)}
.mk-bar strong{margin-right:10px;font-weight:600;font-size:14px}
.mk-bar button{border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--muted-foreground)}
.mk-bar button[aria-pressed=true]{background:var(--muted);color:var(--foreground);border-color:var(--input)}
.mk-bar .sp{flex:1}
.mk-note{max-width:1480px;margin:14px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted-foreground);font-size:13px;line-height:20px}
.mk-note p{margin:0 0 6px;max-width:110ch}
.mk-note b{color:var(--foreground);font-weight:500}
.stage-wrap{overflow-x:auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Window */
.win{width:1920px;margin:0 auto;height:1080px;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:34px 1fr 24px;background:var(--background);position:relative}
.titlebar{display:flex;align-items:center;gap:14px;padding:0 10px 0 14px;border-bottom:1px solid var(--border);background:var(--shell)}
.titlebar .brand{font-weight:600}.titlebar .brand i{font-style:normal;color:var(--danger-text)}
.search{flex:0 1 460px;margin:0 auto;display:flex;align-items:center;gap:8px;height:24px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--side);color:var(--muted-foreground);font-size:12px}
.search kbd,.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--input);border-radius:4px;padding:0 4px;color:var(--muted-foreground)}
.search .sp{flex:1}
.tb-act{display:flex;gap:2px}
.tb-act button{width:26px;height:24px;border-radius:5px;color:var(--muted-foreground);display:grid;place-items:center}
.tb-act button:hover,.tb-act button[aria-pressed=true]{background:var(--muted);color:var(--foreground)}

.body{display:grid;min-height:0}
.activity{background:var(--shell);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.activity button{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--muted-foreground);position:relative}
.activity button.on{color:var(--foreground);background:var(--muted)}
.activity .badge{position:absolute;top:2px;right:1px;min-width:15px;height:15px;border-radius:8px;background:var(--st-perm);color:#1a0505;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 3px}
.activity .badge.amber{background:var(--st-ask);color:#1d1400}
.activity .grow{flex:1}

/* Explorer */
.explorer{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:auto}
.ex-h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:500}
.tree{padding:0 6px 8px}
.row{display:flex;align-items:center;gap:7px;height:24px;padding:0 6px;border-radius:5px;white-space:nowrap;cursor:pointer}
.row:hover{background:#ffffff0d}
.row.sel{background:#ffffff14}
.row .chev{width:10px;color:var(--muted-foreground);font-size:10px}
.row .nm{overflow:hidden;text-overflow:ellipsis}
.row .meta{margin-left:auto;font-size:11px;color:var(--muted-foreground);font-family:var(--mono)}
.row.l1{padding-left:18px}.row.l2{padding-left:32px}
.row .open{width:6px;height:6px;border-radius:50%;margin-left:auto;background:var(--muted-foreground)}

/* State dot */
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--st-off)}
.dot.perm{background:var(--st-perm);box-shadow:0 0 0 3px #f8717133}
.dot.ask{background:var(--st-ask);box-shadow:0 0 0 3px #fbbf2433}
.dot.work{background:var(--st-work)}
.dot.idle{background:var(--st-idle)}
@media (prefers-reduced-motion:no-preference){.dot.work{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.45}}
.lk{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.lk.l1{background:var(--link1)}.lk.l2{background:var(--link2)}

/* Editor area */
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--background)}
.spaces{display:flex;align-items:stretch;height:32px;border-bottom:1px solid var(--border);background:var(--shell);padding-left:6px}
.spaces button{display:flex;align-items:center;gap:7px;padding:0 14px;color:var(--muted-foreground);border-right:1px solid var(--border);font-size:12.5px}
.spaces button.on{color:var(--foreground);background:var(--background);box-shadow:inset 0 2px 0 var(--link1)}
.spaces .cnt{font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:8px;background:var(--muted)}
.spaces .cnt.perm{background:var(--st-perm);color:#1a0505}.spaces .cnt.ask{background:var(--st-ask);color:#1d1400}
.spaces .add{padding:0 12px}
.spaces .hint{margin-left:auto;align-self:center;padding-right:12px;font-size:11px;color:var(--muted-foreground)}

.split{display:grid;gap:1px;background:var(--border);min-height:0;flex:1}
.split>*{min-width:0;min-height:0}

/* Pane (one tab group) */
.pane{display:flex;flex-direction:column;background:var(--pane);min-height:0}
.tabs{display:flex;align-items:stretch;height:30px;background:var(--shell);border-bottom:1px solid var(--border);overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;color:var(--muted-foreground);border-right:1px solid var(--border);white-space:nowrap}
.tab.on{background:var(--pane);color:var(--foreground)}
.tab .x{opacity:.5;font-size:11px}
.tab.alert{box-shadow:inset 0 -2px 0 var(--st-perm)}
.tab.alert-a{box-shadow:inset 0 -2px 0 var(--st-ask)}
.tabs .tools{margin-left:auto;display:flex;align-items:center;gap:2px;padding-right:6px}
.tabs .tools button{height:22px;padding:0 7px;border-radius:5px;color:var(--muted-foreground);font-size:11.5px;display:flex;align-items:center;gap:5px}
.tabs .tools button:hover{background:var(--muted);color:var(--foreground)}
.ph{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px;min-height:34px}
.ph b{font-weight:600;font-size:13px}
.ph .chip{font-family:var(--mono);font-size:11px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:5px;padding:0 6px;white-space:nowrap}
.ph .ctx{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted-foreground)}
.meter{width:46px;height:4px;border-radius:2px;background:var(--muted);overflow:hidden}
.meter i{display:block;height:100%;background:var(--muted-foreground)}
.meter i.hi{background:var(--st-ask)}
.seg{display:flex;gap:2px;padding:6px 12px 0}
.seg button{font-size:11.5px;padding:2px 9px;border-radius:5px;color:var(--muted-foreground)}
.seg button.on{background:var(--muted);color:var(--foreground)}
.pb{flex:1;overflow:auto;padding:10px 12px 12px;min-height:0;display:flex;flex-direction:column;gap:8px}

/* Thread */
.m-user{align-self:flex-end;max-width:85%;background:var(--muted);border-radius:10px 10px 2px 10px;padding:6px 10px}
.m-agent{max-width:95%}
.m-agent p{margin:0}
.tool{font-family:var(--mono);font-size:11.5px;color:var(--muted-foreground);display:flex;gap:6px;align-items:baseline}
.tool b{color:var(--foreground);font-weight:500}
.tool .ok{color:var(--t-green)}.tool .ko{color:var(--t-red)}
.req{margin-top:auto;border:1px solid #f8717166;background:#2a1212;border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.req.ask{border-color:#fbbf2466;background:#2a2008}
.req .rh{display:flex;align-items:center;gap:7px;font-weight:500}
.req code{font-family:var(--mono);font-size:11.5px;background:#00000055;border-radius:5px;padding:4px 7px;display:block;white-space:pre-wrap;word-break:break-all}
.req .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--input);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--primary);border-color:transparent}
.btn.pri:hover{background:var(--primary-hover)}
.btn .kbd{font-size:10px}
.composer{border-top:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;color:var(--muted-foreground);font-size:12px}
.composer .in{flex:1;height:28px;border:1px solid var(--border);border-radius:7px;display:flex;align-items:center;padding:0 9px}

/* Diff */
.files{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:11.5px}
.files div{display:flex;gap:8px;padding:2px 4px;border-radius:4px}
.files div.on{background:#ffffff10}
.files .a{color:var(--t-green)}.files .d{color:var(--t-red)}
.files .p{margin-left:auto;display:flex;gap:6px}
.code{font-family:var(--mono);font-size:11.5px;line-height:17px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.code div{padding:0 8px;white-space:pre}
.code .add{background:var(--diff-add)}.code .del{background:var(--diff-del)}
.code .hh{color:var(--muted-foreground);background:#ffffff08}

/* Terminal */
.term{background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:11.5px;line-height:17px;padding:8px 10px;flex:1;overflow:auto;white-space:pre}
.term .g{color:var(--t-green)}.term .y{color:var(--t-yellow)}.term .r{color:var(--t-red)}.term .b{color:var(--t-blue)}.term .d{color:var(--t-dim)}

/* Wall tiles */
.wall{display:grid;gap:8px;padding:10px;overflow:auto;align-content:start;background:var(--background)}
.tile{border:1px solid var(--border);border-radius:9px;background:var(--pane);display:flex;flex-direction:column;min-width:0;cursor:pointer;overflow:hidden}
.tile:hover{border-color:var(--input)}
.tile.perm{border-color:#f8717188}.tile.ask{border-color:#fbbf2488}
.tile .th{display:flex;align-items:center;gap:7px;padding:7px 9px 4px}
.tile .th b{font-weight:600}
.tile .th .role{font-size:11px;color:var(--muted-foreground)}
.tile .th .ctx{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted-foreground)}
.tile .last{padding:0 9px 8px;font-size:12px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .last.q{color:var(--st-ask)}
.tile .lines{padding:2px 9px 8px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden}
.tile .lines .tool{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tf{display:flex;gap:6px;padding:6px 9px;border-top:1px solid var(--border);align-items:center}
.tile .tf .sp{flex:1}
.tile .tf small{font-size:11px;color:var(--muted-foreground)}

/* Bottom panel */
.bpanel{display:flex;flex-direction:column;background:var(--pane);min-height:0}
.bp-tabs{display:flex;align-items:center;gap:2px;height:30px;padding:0 8px;border-bottom:1px solid var(--border);background:var(--shell)}
.bp-tabs button{padding:3px 9px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);border-radius:5px;display:flex;gap:6px;align-items:center}
.bp-tabs button.on{color:var(--foreground);background:var(--muted)}
.bp-tabs .sp{flex:1}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:8px 10px;overflow:auto}
.strip .tile .role,.strip .tile .tf small,.strip .tile .tf .alt{display:none}
.strip .tile .th b{white-space:nowrap}
.wall>div>.tile,.wall>div>.pane{flex:1;min-width:0}
.ph{flex-wrap:wrap}

/* Right panel */
.right{background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.r-sec{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
.r-sec h4{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:500;display:flex;align-items:center;gap:6px}
.r-sec h4 .sp{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv span:nth-child(odd){color:var(--muted-foreground)}
.kv span:nth-child(even){font-family:var(--mono);font-size:11.5px;text-align:right}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat .msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chat .bubble{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12.5px}
.chat .bubble.me{align-self:flex-end;background:var(--muted);border:0}
.ask-item{display:flex;gap:7px;align-items:flex-start;font-size:12px;padding:6px 7px;border-radius:7px;background:#ffffff08;cursor:pointer}
.ask-item div{min-width:0}
.ask-item small{display:block;color:var(--muted-foreground);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-item .dot{margin-top:5px}

/* Topology mini */
.topo{border:1px solid var(--border);border-radius:9px;background:var(--pane);padding:10px;display:flex;flex-direction:column;gap:8px}
.topo h5{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);font-weight:500}
.topo svg{width:100%;height:auto}
.topo svg text{fill:var(--foreground);font-family:var(--font);font-size:11px}
.topo svg .sub{fill:var(--muted-foreground);font-size:9.5px}

/* Status bar */
.status{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--shell);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.status .it{display:flex;align-items:center;gap:6px}
.status .sp{flex:1}
.status .alert{color:var(--foreground)}

/* Palette */
.palette{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:600px;background:var(--card);border:1px solid var(--input);border-radius:10px;box-shadow:0 20px 60px #000c;z-index:20;overflow:hidden}
.palette .pin{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
.palette .pin .caret{width:1px;height:16px;background:var(--foreground)}
.palette .grp{padding:6px 12px 2px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.palette .it{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12.5px}
.palette .it.sel{background:#ffffff12}
.palette .it .r{margin-left:auto;color:var(--muted-foreground);font-size:11px}
.palette .foot{display:flex;gap:14px;padding:7px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-foreground)}

.callout{position:absolute;z-index:15;background:#1e1b2e;border:1px solid var(--link1);color:var(--foreground);border-radius:8px;padding:6px 9px;font-size:11.5px;max-width:250px;box-shadow:0 6px 20px #0008;pointer-events:none}
.callout b{color:var(--link1);font-weight:600}
.notes-off .callout{display:none}
.logo{display:inline-grid;place-items:center;flex-shrink:0}
.sfoot{display:flex;flex-wrap:wrap;align-items:center;gap:5px 14px;padding:0 12px 8px;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.row .nm{flex-shrink:0}.row .meta{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sfoot .mdl{display:flex;align-items:center;gap:6px;color:var(--foreground);border:1px solid var(--border);border-radius:6px;padding:1px 7px}
.sfoot .mdl .car{color:var(--muted-foreground);font-size:9px}
.sfoot .m{display:flex;align-items:center;gap:6px}
.sfoot .m b{font-weight:500;color:var(--foreground);font-variant-numeric:tabular-nums}
.sfoot .m b.warn{color:var(--st-ask)}
.sfoot .sp{flex:1}
.meter i.warn{background:var(--st-ask)}
.lim{display:flex;flex-direction:column;gap:6px}
.lim .acct{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500}
.lim .acct small{margin-left:auto;font-weight:400;color:var(--muted-foreground);font-size:11px}
.lim .w{display:grid;grid-template-columns:92px 1fr 34px 70px;align-items:center;gap:8px;font-size:11.5px;color:var(--muted-foreground)}
.lim .w .meter{width:100%}
.lim .w b{font-weight:500;color:var(--foreground);text-align:right;font-variant-numeric:tabular-nums}
.lim .w b.warn{color:var(--st-ask)}
.lim .w span:last-child{font-size:11px;text-align:right}
.status .lmt{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--muted-foreground);font-size:11.5px;height:20px;padding:0 8px;border-radius:5px}
.status .lmt:hover,.status .lmt.open{background:var(--muted)}
.status .lmt .lsep{width:1px;height:12px;background:var(--border);margin:0 4px}
.limpop{position:absolute;right:150px;bottom:30px;width:380px;z-index:18;background:var(--card);border:1px solid var(--input);border-radius:10px;box-shadow:0 16px 50px #000c;padding:12px;display:flex;flex-direction:column;gap:10px}
.limpop .lp-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px}
.limpop .lp-h .mut{font-size:11px}
.status .lmt b{font-weight:500;color:var(--foreground)}
.status .lmt b.warn{color:var(--st-ask)}
/* Tool pages (OpenRig, Nouvelle session) */
.page{flex:1;overflow:auto;padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px;min-height:0}
.page h3{margin:0;font-size:15px;font-weight:600}
.page .sub{color:var(--muted-foreground);font-size:12px}
.machs{display:flex;gap:6px}
.machs button{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:14px;padding:2px 10px;font-size:12px;color:var(--muted-foreground)}
.machs button.on{border-color:var(--input);background:var(--muted);color:var(--foreground)}
.blk{border:1px solid var(--border);border-radius:9px;background:var(--pane)}
.blk-h{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border)}
.blk-h b{font-weight:600}
.blk-h .sp{flex:1}
.blk-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.chk{display:flex;align-items:center;gap:8px;color:var(--muted-foreground)}
.chk i{width:14px;height:14px;border:1px solid var(--input);border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--foreground)}

  document.querySelectorAll('.pb').forEach(el=>{ if (el.querySelector('.m-user')) el.scrollTop = el.scrollHeight; });
  document.getElementById('note').innerHTML = V.note;
  document.querySelectorAll('.mk-bar [data-v]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===state.v));
  document.getElementById('t-pal').setAttribute('aria-pressed', state.pal);
  document.getElementById('t-notes').setAttribute('aria-pressed', state.notes);
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-seat],[data-go],[data-follow]');
  if (!t) { if (state.pal && !e.target.closest('.palette')) { state.pal=false; render(); } return; }
  if (t.dataset.v){ state.v=t.dataset.v; try{history.replaceState(null,'','#'+state.v)}catch(_){} render(); return; }
  if (t.id==='t-pal' || t.id==='open-pal'){ state.pal=!state.pal; render(); return; }
  if (t.id==='t-lim'){ state.lim=!state.lim; render(); return; }
  if (t.id==='t-size'){ state.big=!state.big; render(); return; }
  if (t.id==='t-notes'){ state.notes=!state.notes; render(); return; }
  if (t.dataset.space){ state.space=t.dataset.space; render(); return; }
  if (t.dataset.act==='allow' || t.dataset.act==='deny'){ S.pim.req=null; S.pim.st='work'; render(); return; }
  if (t.dataset.follow){ if(state.v==='b'){state.space='focus';} state.follow=t.dataset.follow; render(); return; }
  if (t.dataset.seat && state.v==='c' && S[t.dataset.seat]){ state.loupe=[...state.loupe, t.dataset.seat].slice(-3); render(); return; }
});
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); state.pal=!state.pal; render(); }
  else if (e.key==='Escape' && state.pal){ state.pal=false; render(); }
  else if (state.v==='c' && e.key==='Escape' && state.loupe.length>1){ state.loupe=state.loupe.slice(1); render(); }
});
const h = (location.hash||'').slice(1); if (VIEWS[h]) state.v=h;
render();
</script>
