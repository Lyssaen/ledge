<style>
:root, :root[data-theme="light"] {

  --card: oklch(1 0 0); --popover: oklch(1 0 0);

  --secondary: oklch(0.967 0.001 286.375);
  --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0); --input: oklch(0.922 0 0);
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px; --radius-xl: 14px;
  --sidebar: oklch(0.985 0 0); --sidebar-primary: oklch(0.577 0.245 27.325); --sidebar-accent: oklch(0.97 0 0); --sidebar-border: oklch(0.922 0 0);

  --t-coral: #c2412d; --t-red: #b91c1c; --t-yellow: #9a6700; --t-green: #1a7f37; --t-blue: #0550ae; --t-violet: #6639ba; --t-key: #e2e0db;
}
:root[data-theme="dark"] {
  --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0); --popover: oklch(0.205 0 0);
  --primary: oklch(0.444 0.177 26.899); --primary-foreground: oklch(0.971 0.013 17.38);
  --secondary: oklch(0.274 0.006 286.033);
  --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);

  --destructive: oklch(0.704 0.191 22.216);
  --border: #ffffff1a; --input: #ffffff26;
  --sidebar: oklch(0.205 0 0); --sidebar-primary: oklch(0.637 0.237 25.331); --sidebar-accent: oklch(0.269 0 0); --sidebar-border: #ffffff1a;
  --success: #34d399; --warning: #fbbf24; --info: #60a5fa; --danger-text: oklch(0.704 0.191 22.216);
  --status-warning-soft: #422006; --status-danger-soft: #450a0a; --status-info-soft: #172554;
  --shadow-overlay: 0 20px 40px -12px rgba(0,0,0,0.7);
  --page: #0b0b0b; --chrome: #141414; --note: #161616;

  --t-bg: #0f0f10; --t-bar: #1b1b1d; --t-fg: #e8e8e8; --t-dim: #9a9a9a; --t-faint: #5f5f63; --t-line: #3a3a3d; --t-sel: #26262a;

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--foreground)}
body{font:13px/1.45 'Geist','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono,code,kbd{font-family:'Geist Mono','JetBrains Mono',ui-monospace,monospace}

/* ---------- mockup chrome ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;background:var(--chrome);border-bottom:1px solid var(--border)}
.brand{font-weight:700;font-size:15px;margin-right:4px}.brand span{color:var(--sidebar-primary)}
.brand small{font-weight:400;color:var(--muted-foreground);font-size:12px;margin-left:6px}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:12px;color:var(--muted-foreground)}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:var(--radius-md)}
.seg button{padding:3px 9px;border-radius:6px;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--foreground)}
.seg button:disabled{opacity:.35;cursor:default}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding:20px;align-items:start}
.cap{font-size:12px;color:var(--muted-foreground);margin:0 0 8px}.cap b{color:var(--sidebar-primary);font-weight:600;letter-spacing:.5px;margin-right:6px}
.stack{display:flex;flex-direction:column;gap:26px;min-width:0}
.notes{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
.note{background:var(--note);border:1px solid var(--border);border-radius:var(--radius-xl);padding:16px 18px;font-size:12.5px}
.note h3{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--sidebar-primary);margin-bottom:4px}
.note h4{font-size:14px;margin-bottom:8px}
.note ul,.note ol{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.note code,.note kbd{font-size:11px;padding:0 4px;border:1px solid var(--border);border-radius:4px;background:var(--muted)}
.note .rec{color:var(--muted-foreground)}

/* ---------- desktop window ---------- */
.win{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--background);box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;width:1120px;max-width:100%}
.titlebar{height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);font-size:13px}
.titlebar b{font-weight:700}.titlebar b i{font-style:normal;color:var(--sidebar-primary)}
.titlebar .fill{flex:1}.titlebar .dots{display:flex;gap:14px;color:var(--muted-foreground);font-size:12px}
.body{display:flex;height:var(--wh,660px);min-height:0}
.st{width:268px;flex:none;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:relative}
.st-top{padding:10px;display:flex;flex-direction:column;gap:8px}
.st-home{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--sidebar-border);border-radius:var(--radius-lg);background:var(--background)}
.st-home b{font-size:14px}.st-home small{display:block;color:var(--muted-foreground);font-size:11.5px}
.bot{width:20px;height:16px;border-radius:5px 5px 4px 4px;background:linear-gradient(#e8836f,#b8503d);position:relative;flex:none}
.bot::after{content:'';position:absolute;left:4px;right:4px;top:5px;height:4px;border-radius:2px;background:#1c2427}
.bot.b2{background:linear-gradient(#a8b4ff,#6c63d9)}.bot.b3{background:linear-gradient(#9de0c4,#3c9f7c)}.bot.b4{background:linear-gradient(#f3d38a,#c5973a)}
.st-nav{display:flex;justify-content:space-between;padding:6px 11px;font-size:12.5px;color:var(--muted-foreground)}
.st-label{display:flex;align-items:center;gap:6px;padding:8px 12px 4px;font-size:12px;color:var(--muted-foreground)}
.st-badge{min-width:18px;height:18px;border-radius:9px;background:var(--sidebar-primary);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.st-fill{flex:1}
.kbd{font:10.5px 'Geist Mono',monospace;padding:1px 5px;border:1px solid var(--border);border-radius:4px;color:var(--muted-foreground)}
.st-scroll{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.st-card{display:flex;gap:9px;margin:2px 8px;padding:7px 9px;border-radius:var(--radius-md)}
.st-card.sel{background:var(--sidebar-accent)}
.st-card-body{flex:1;min-width:0}
.st-l1,.st-l2{display:flex;align-items:center;gap:6px;min-width:0}
.st-l1 strong{font-weight:500;font-size:13px;white-space:nowrap}
.st-l1 .where{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-time{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--muted-foreground);white-space:nowrap}
.st-time.red{color:var(--danger-text)}.st-time.amber{color:var(--warning)}
.st-req{flex:1;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-qa{padding:1px 8px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;white-space:nowrap}
.st-qa.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.st-gico{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.st-gico.amber{color:var(--warning);background:var(--status-warning-soft)}
.st-gico.red{color:var(--danger-text);background:var(--status-danger-soft)}
.tree{padding:2px 0}
.tp{display:flex;align-items:center;gap:7px;padding:5px 12px;font-size:13px;font-weight:600}
.tp i{width:9px;height:9px;border-radius:3px;background:var(--info)}.tp i.g{background:var(--success)}
.tp small{margin-left:auto;font:11px 'Geist Mono',monospace;color:var(--muted-foreground);font-weight:400}
.tb{padding:3px 12px 3px 26px;font:12px 'Geist Mono',monospace;color:var(--muted-foreground)}
.ts{display:flex;gap:8px;padding:5px 12px 5px 30px;margin:0 6px;border-radius:var(--radius-md)}
.ts.sel{background:var(--sidebar-accent)}
.ts .tsb{flex:1;min-width:0}
.ts .r1{display:flex;align-items:center;gap:6px}
.ts .r1 b{font-weight:500;font-size:13px}
.ts .r2{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-sig{display:inline-flex;align-items:center;gap:3px;font:10.5px 'Geist Mono',monospace;color:var(--warning);padding:0 5px;border-radius:5px;background:var(--status-warning-soft)}
.ctx-sig.red{color:var(--danger-text);background:var(--status-danger-soft)}

/* the limits, above the foot */
.lims{border-top:1px solid var(--sidebar-border);padding:8px 10px 6px;display:flex;flex-direction:column;gap:6px;position:relative}
.lim{display:block;width:100%;text-align:left;padding:5px 6px 6px;border-radius:var(--radius-md)}
.lim:hover,.lim.open{background:var(--sidebar-accent)}
.lim-h{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:4px}
.lim-h .hn{font-weight:500}
.lim-h .hm{color:var(--muted-foreground)}
.lim-h .age{margin-left:auto;font:10.5px 'Geist Mono',monospace;color:var(--muted-foreground)}
.lim-h .age.warn{color:var(--warning)}
.lim-row{display:flex;flex-direction:column;gap:3px}
.g{display:grid;grid-template-columns:54px 1fr 34px 62px;align-items:center;gap:6px;font:10.5px 'Geist Mono',monospace;color:var(--muted-foreground);white-space:nowrap}
.g b{font-weight:500;color:var(--foreground);text-align:right}
.g .rs{overflow:hidden;text-overflow:ellipsis}
.g .gbar{margin:0}
.gbar{height:4px;border-radius:2px;background:var(--track);margin-top:3px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:2px;background:var(--gauge)}
.amber .gbar i,.gbar.amber i{background:var(--warning)}.g.amber b{color:var(--warning)}
.red .gbar i,.gbar.red i{background:var(--destructive)}.g.red b{color:var(--danger-text)}
.lim.dim .lim-row{opacity:.45}
.lim-msg{font-size:11.5px;color:var(--muted-foreground);line-height:1.35}
.lim-msg.warn{color:var(--warning)}
.skel{height:4px;border-radius:2px;margin-top:9px;background:linear-gradient(90deg,var(--track) 0%,color-mix(in srgb,var(--foreground) 20%,transparent) 50%,var(--track) 100%)}
.st-foot{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-top:1px solid var(--sidebar-border);font-size:11px;color:var(--muted-foreground)}
.st-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;margin-right:5px}
.st-foot small{margin-left:4px}
.ico{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted-foreground)}

/* popover */
.pop{position:absolute;left:276px;bottom:46px;z-index:5;width:400px;background:var(--popover);border:1px solid var(--input);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay);padding:12px 14px}
.pop h5{font-size:13px;font-weight:600;display:flex;align-items:baseline;gap:6px}
.pop h5 small{font-weight:400;font-size:11.5px;color:var(--muted-foreground)}
.pop .sub{font-size:11.5px;color:var(--muted-foreground);margin:2px 0 10px}
.prow{display:grid;grid-template-columns:190px 1fr 42px;align-items:center;gap:8px;padding:5px 0}
.prow .pl{font-size:12px}.prow .pl small{display:block;font-size:10.5px;color:var(--muted-foreground)}
.prow .pp{font:12px 'Geist Mono',monospace;text-align:right}
.prow.amber .pp{color:var(--warning)}.prow.red .pp{color:var(--danger-text)}
.prow .gbar{margin:0;height:5px}
.psep{border-top:1px solid var(--border);margin:6px 0 4px;padding-top:6px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted-foreground)}
.pfoot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--border);margin-top:8px;padding-top:8px;font-size:11.5px;color:var(--muted-foreground)}
.pfoot a{color:var(--foreground);text-decoration:underline;text-underline-offset:2px}

/* main pane */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);font-size:13.5px;white-space:nowrap}
.top .crumb{color:var(--muted-foreground)}.top b{font-weight:500}
.top .fill{flex:1}
.pill-red{padding:3px 9px;border-radius:7px;background:var(--status-danger-soft);color:var(--danger-text);font-size:12.5px}
.vrow{height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.vsw{display:flex;padding:3px;border:1px solid var(--border);border-radius:var(--radius-md);gap:2px;font-size:12.5px}
.vsw span{padding:3px 10px;border-radius:6px;color:var(--muted-foreground)}.vsw span.on{background:var(--accent);color:var(--foreground)}
.meta{display:flex;align-items:center;gap:7px;font:11.5px 'Geist Mono',monospace;color:var(--muted-foreground);min-width:0;overflow:hidden}
.meta .sep{opacity:.6}
.meta .mdl{color:var(--foreground)}
.meta .cg{display:inline-flex;align-items:center;gap:5px}
.meta .cg .gbar{width:34px;margin:0}
.meta .amber{color:var(--warning)}
.meta .tip-anchor{border-bottom:1px dotted var(--muted-foreground)}
.vrow .fill{flex:1}
.thread{flex:1;padding:18px 26px;display:flex;flex-direction:column;gap:14px;font-size:13px;overflow:hidden}
.tl{display:flex;gap:12px}
.tl .tt{flex:1}.tl .tt small{color:var(--muted-foreground);font-size:12px}
.tl time{font:11.5px 'Geist Mono',monospace;color:var(--muted-foreground)}
.tl .ic{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);flex:none}
.tip{position:absolute;z-index:6;background:var(--popover);border:1px solid var(--input);border-radius:var(--radius-md);box-shadow:var(--shadow-overlay);padding:9px 11px;font-size:12px;width:300px}
.tip dl{display:grid;grid-template-columns:84px 1fr;gap:3px 8px}
.tip dt{color:var(--muted-foreground)}
.reply{margin:0 22px 16px;border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;color:var(--muted-foreground);font-size:13px;height:72px}

/* header strips (cases) */
.cases{display:flex;flex-direction:column;gap:10px;width:1120px;max-width:100%}
.case{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--background);padding:0 0 0 14px;overflow:hidden}
.case .cl{font-size:12px;color:var(--muted-foreground)}
.case .cl b{display:block;color:var(--foreground);font-weight:500;font-size:12.5px}
.case .vrow{border:0;border-left:1px solid var(--border)}

/* settings */
.set{flex:1;padding:22px 30px;overflow:hidden}
.set h2{font-size:18px;font-weight:600;margin-bottom:4px}
.set .crumbs{font-size:12px;color:var(--muted-foreground);margin-bottom:18px}
.srow{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
.srow .sl{font-size:13px;font-weight:500}
.srow .sh{font-size:12px;color:var(--muted-foreground);margin-top:6px;max-width:470px}
.sel-box{display:inline-flex;align-items:center;gap:20px;padding:5px 10px;border:1px solid var(--input);border-radius:var(--radius-md);font-size:13px}
.srow.new{position:relative}
.srow.new::before{content:'';position:absolute;left:-14px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--sidebar-primary)}

/* ---------- TUI ---------- */
.term{background:var(--t-bg);color:var(--t-fg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow-overlay);display:inline-block;max-width:100%;overflow:hidden}
.term pre{font:12.5px/17px 'Geist Mono','JetBrains Mono',ui-monospace,monospace;white-space:pre;margin:0}
.term .fg{color:var(--t-fg)}.term .dim{color:var(--t-dim)}.term .faint{color:var(--t-faint)}.term .line{color:var(--t-line)}
.term .coral{color:var(--t-coral)}.term .red{color:var(--t-red)}.term .yellow{color:var(--t-yellow)}.term .green{color:var(--t-green)}
.term .blue{color:var(--t-blue)}.term .violet{color:var(--t-violet)}.term .b{font-weight:700}
.term .w1{display:inline-block;width:1ch;text-align:center;overflow:visible;vertical-align:top}
.term .barbg{background:var(--t-bar)}.term .selbg{background:var(--t-sel)}.term .key{background:var(--t-key)}

/* ---------- phone ---------- */
.phones{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.phone{width:330px;height:690px;border:9px solid #2a2a2a;border-radius:42px;background:var(--background);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-overlay)}
:root[data-theme="light"] .phone{border-color:#d6d6d3}
.ph-status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600}
.ph-head{padding:6px 18px 10px}
.ph-head h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
.ph-head p{font-size:12px;color:var(--muted-foreground)}
.ph-head .back{font-size:12px;color:var(--muted-foreground);margin-bottom:4px}
.ph-body{flex:1;overflow:hidden;padding:0 18px}
.ph-card{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:12px 14px;margin-bottom:12px}
.ph-card h3{font-size:15px;display:flex;align-items:baseline;gap:6px;margin-bottom:6px}.ph-card h3 small{font-weight:400;font-size:11.5px;color:var(--muted-foreground)}
.ph-sec{font-size:11.5px;color:var(--muted-foreground);margin:10px 0 6px;letter-spacing:.3px}
.ph-line{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.ph-line .muted{color:var(--muted-foreground);font-size:12px}
.ph-btn{padding:2px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px}
.ph-btn.pri{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.ph-lim{display:grid;grid-template-columns:58px 1fr 128px;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.ph-lim .pp{font:12px 'Geist Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-lim .pp small{color:var(--muted-foreground);font-size:11px;margin-left:6px}
.ph-lim .gbar{margin:0;height:5px}
.ph-lim.amber .pp b{color:var(--warning);font-weight:500}.ph-lim.red .pp b{color:var(--danger-text);font-weight:500}

/* ---------- the data each state shows ---------- */
function limits(st) {
  const claude = { id: 'claude', name: t.claude, short: t.cl, machine: t.local, status: 'ok', age: '40 s',
    w: [{ k: t.h5, pct: 62, rs: '14:30', in: '2 h 10' }, { k: t.week, pct: 34, rs: t.mon, rsShort: t.monShort, in: '4 j' }],
    m: [{ k: 'Opus', pct: 71, rs: t.mon }, { k: 'Fable', pct: 12, rs: t.mon }] };
  const list = [];
  if (st === 'none') return list;
  if (st === 'loading') { list.push({ ...claude, status: 'loading' }); return list; }
  if (st === 'stale') { list.push({ ...claude, status: 'stale' }); return list; }
  if (st === 'expired') { list.push({ ...claude, status: 'expired' }); return list; }
  if (st === 'unreachable') { list.push({ ...claude, status: 'unreachable' }); return list; }
  if (st === 'over') {
    list.push({ ...claude, w: [{ k: t.h5, pct: 84, rs: '14:30', in: '1 h 05' }, { k: t.week, pct: 58, rs: t.mon, rsShort: t.monShort, in: '4 j' }],
      m: [{ k: 'Opus', pct: 100, rs: t.mon }, { k: 'Fable', pct: 20, rs: t.mon }] });
    return list;
  }
  list.push(claude);
  if (st === 'codex') list.push({ id: 'codex', name: t.codex, short: t.codex, machine: t.local, status: 'ok', age: '2 min',
    w: [{ k: t.h5, pct: 18, rs: '15:10', in: '2 h 50' }, { k: t.week, pct: 41, rs: S.lang === 'fr' ? 'jeu. 11:00' : 'Thu 11:00', rsShort: S.lang === 'fr' ? 'jeu.' : 'Thu', in: '6 j' }], m: [] });
  if (st === 'machines') list.push({ ...claude, machine: t.devbox, age: '1 min',
    w: [{ k: t.h5, pct: 9, rs: '16:00', in: '3 h 40' }, { k: t.week, pct: 22, rs: S.lang === 'fr' ? 'mer. 18:00' : 'Wed 18:00', rsShort: S.lang === 'fr' ? 'mer.' : 'Wed', in: '5 j' }],
    m: [{ k: 'Opus', pct: 15, rs: S.lang === 'fr' ? 'mer. 18:00' : 'Wed 18:00' }] });
  return list;
}
const tone = p => (p >= 100 ? 'red' : p >= THRESHOLD ? 'amber' : '');
const multi = () => S.st === 'machines';

/* ---------- toolbar ---------- */
function bar() {
  const seg = (key, opts, on) => `<div class="seg">${opts.map(([v, l, off]) => `<button ${off ? 'disabled' : ''} class="${on === v ? 'on' : ''}" onclick="go('${key}','${v}')">${l}</button>`).join('')}</div>`;
  const noStates = S.v === 'session';
  document.getElementById('bar').innerHTML = `
    <div class="brand">Ledge<span>.</span><small>${t.title} · ${t.sub}</small></div>
    <div class="grp"><label>${t.screen}</label>${seg('v', Object.entries(t.views), S.v)}</div>
    <div class="grp"><label>${t.state}</label>${seg('st', Object.entries(t.states).map(([k, l]) => [k, l, noStates]), S.st)}</div>
    <div class="grp"><label>${t.theme}</label>${seg('theme', [['dark', t.dark], ['light', t.light]], S.theme)}</div>
    <div class="grp"><label>${t.lang}</label>${seg('lang', [['fr', 'FR'], ['en', 'EN']], S.lang)}</div>`;
}
function go(k, v) { S[k] = v; const q = new URLSearchParams(S); history.replaceState(null, '', '?' + q); render(); }

/* ---------- desktop pieces ---------- */
const ICON = {
  gauge: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></svg>',

  clock: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
const gauge = (w) => `<div class="g ${tone(w.pct)}"><span>${w.k}</span><div class="gbar"><i style="width:${Math.min(100, w.pct)}%"></i></div><b>${w.pct} %</b><span class="rs">↺ ${w.pct >= 100 ? (w.rsShort || w.rs) : (w.rsShort || w.rs)}</span></div>`;

function limBlock(h, open) {
  const head = (age, warn) => `<div class="lim-h"><span class="hn">${h.name}</span>${multi() ? `<span class="hm">· ${h.machine}</span>` : ''}${age ? `<span class="age ${warn ? 'warn' : ''}">${age}</span>` : ''}</div>`;
  if (h.status === 'loading') return `<div class="lim">${head(t.reading)}<div class="lim-row"><div class="g"><span>${t.h5}</span><div class="skel" style="margin:0"></div><b></b><span></span></div><div class="g"><span>${t.week}</span><div class="skel" style="margin:0"></div><b></b><span></span></div></div></div>`;
  if (h.status === 'expired') return `<button class="lim">${head('')}<div class="lim-msg warn">${t.expired}</div></button>`;
  const age = h.status === 'stale' ? `${t.ago === 'ago' ? '' : 'il y a '}${t.staleAge}${t.ago === 'ago' ? ' ago' : ''}` : h.status === 'unreachable' ? t.unreach : '';
  const dim = h.status === 'stale' || h.status === 'unreachable';
  // A per-model window past the threshold surfaces under the two gauges; the rest stays in the detail.
  const hot = h.m.filter(m => m.pct >= THRESHOLD);
  return `<button class="lim ${dim ? 'dim' : ''} ${open ? 'open' : ''}">${head(age, dim)}<div class="lim-row">${h.w.map(gauge).join('')}</div>${hot.length ? `<div class="lim-row" style="margin-top:3px">${hot.map(m => gauge({ ...m, k: m.k, rsShort: t.monShort })).join('')}</div>` : ''}</button>`;
}
function limits_(open) {
  const L = limits(S.st);
  if (!L.length) return '';
  return `<div class="lims">${L.map((h, i) => limBlock(h, open && i === 0)).join('')}</div>`;
}
function popover() {
  const L = limits(S.st);
  const h = L[0];
  if (!h || h.status === 'loading' || h.status === 'expired') return '';
  const row = (label, small, w) => `<div class="prow ${tone(w.pct)}"><div class="pl">${label}${small ? `<small>${small}</small>` : ''}</div><div class="gbar ${tone(w.pct)}"><i style="width:${Math.min(100, w.pct)}%"></i></div><div class="pp">${w.pct} %</div></div>`;
  const sub = h.status === 'stale' ? t.popSubStale(h.machine) : h.status === 'unreachable' ? t.popSubUnreach(h.machine) : t.popSub(h.machine);
  return `<div class="pop">
    <h5>${t.popTitle} · ${h.name}</h5><div class="sub">${sub}</div>
    ${row(t.session5, h.w[0].pct >= 100 ? t.resumes(h.w[0].rs) : t.resetIn(h.w[0].rs, h.w[0].in), h.w[0])}

const len = s => [...s].length;
function padSegs(segs, w) {
  const out = []; let n = 0;
  for (const [txt, c] of segs) {
    if (n >= w) break;
    let s = txt;
    if (n + len(s) > w) s = [...s].slice(0, Math.max(0, w - n - 1)).join('') + '…';
    out.push([s, c]); n += len(s);
  }
  if (n < w) out.push([' '.repeat(w - n), '']);
  return out;
}
function box(title, rows, w, color = 'line', tcolor = 'dim') {
  const inner = w - 4;
  const top = [['╭─ ', color], [title, tcolor], [' ' + '─'.repeat(Math.max(0, w - 5 - len(title))) + '╮', color]];
  return [top, ...rows.map(r => [['│ ', color], ...padSegs(r, inner), [' │', color]]), [['╰' + '─'.repeat(w - 2) + '╯', color]]];
}
function hcat(a, b) {
  const n = Math.max(a.length, b.length), wa = a.length ? lenSegs(a[0]) : 0;
  return Array.from({ length: n }, (_, i) => [...(a[i] || [[' '.repeat(wa), '']]), ...(b[i] || [])]);
}
const lenSegs = segs => segs.reduce((x, [s]) => x + len(s), 0);
function bars(p, n = 10) { const f = Math.round(Math.min(100, p) / 100 * n); return '█'.repeat(f) + '░'.repeat(n - f); }
const tcol = p => (p >= 100 ? 'red' : p >= THRESHOLD ? 'yellow' : 'dim');
function renderTerm(lines, w) {

}
const esc = s => [...s].map(ch => ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch.codePointAt(0) > 0x2000 ? `<span class="w1">${ch}</span>` : ch).join('');

function tuiStatus(w) {
  const right = multi() ? `${t.local} ●  ${t.devbox} ●` : `${t.local} ●`;
  const left = [[' ◖ ledge', 'coral'], [`  ${t.tuiSessions} · ${t.tuiMachines(multi() ? 2 : 1)}`, 'dim'], [` · ${t.tuiWait}`, 'red']];
  const gap = w - lenSegs(left) - len(right) - 1;
  return [...left, [' '.repeat(Math.max(1, gap)), ''], [right + ' ', 'dim']].map(([s, c]) => [s, (c ? c + ' ' : '') + 'barbg']);
}
function tuiLimitRows(w, compact) {
  const L = limits(S.st), rows = [];
  if (!L.length) return rows;
  for (const h of L) {
    const name = `${h.short}${multi() ? ' · ' + h.machine : ''}`;
    if (h.status === 'loading') { rows.push([[name.padEnd(compact ? 12 : 14), 'fg'], [t.reading, 'faint']]); continue; }
    if (h.status === 'expired') { rows.push([[name.padEnd(compact ? 12 : 14), 'fg'], [t.expiredShort, 'yellow']]); continue; }
    const dim = h.status === 'stale' || h.status === 'unreachable';
    const age = h.status === 'stale' ? (S.lang === 'fr' ? `lu il y a ${t.staleAge}` : `read ${t.staleAge} ago`) : h.status === 'unreachable' ? `${t.unreach} · ${t.unreachAge}` : t.read(h.age);
    if (compact) {
      // 80 columns: one line per harness, the two windows.
      const seg = wd => [[`${wd.k} `, 'faint'], [bars(wd.pct, 5), dim ? 'faint' : tcol(wd.pct)], [` ${String(wd.pct).padStart(3)} %`, dim ? 'faint' : (tcol(wd.pct) === 'dim' ? 'fg' : tcol(wd.pct))], [` ↺${wd.rsShort || wd.rs}  `, 'faint']];
      rows.push([[name.padEnd(12), 'fg'], ...seg(h.w[0]), ...seg(h.w[1]), ...(dim ? [[h.status === 'unreachable' ? t.unreach : t.staleAge, 'yellow']] : [])]);

    rows.push(line(t.h5, h.w[0].pct, h.w[0].rs), line(t.week, h.w[1].pct, h.w[1].rs), ...h.m.map(m => line(m.k, m.pct, m.rs)));

}

/* ---------- render ---------- */
function render() {
  bar();
  const c = document.getElementById('canvas');
  const cap = (s) => `<div class="cap"><b>${t.aim}</b>${s}</div>`;
  let html = '';
  if (S.v === 'side') {
    html = cap(`${t.views.side} · ${t.states[S.st]}`) + win(sidebar({ open: true }), sessionMain(false));
  } else if (S.v === 'session') {
    html = cap(t.views.session) + win(sidebar({ rowSignal: true }), sessionMain(true), 700)
      + `<div>${cap(S.lang === 'fr' ? 'La ligne d’en-tête selon la session' : 'The header line by session')}<div class="cases">${['ledge', 'outside', 'codex', 'near', 'omp'].map((k, i) => `<div class="case"><div class="cl"><b>${t.cases[i][0]}</b>${t.cases[i][1]}</div>${vrow(k)}</div>`).join('')}</div></div>`;
  } else if (S.v === 'alert') {
    html = cap(t.views.alert) + win(sidebar({ yours: 'alert' }), settingsMain());
  } else if (S.v === 'tui') {
    html = `<div>${cap(t.capOverview(120) + ' · ' + t.states[S.st])}${tuiOverview(120)}</div>`
      + `<div>${cap(t.capOverview(80) + ' · ' + t.states[S.st])}${tuiOverview(80)}</div>`
      + `<div>${cap(t.capSession(120))}${tuiSession(120)}</div>`
      + `<div>${cap(t.capSession(80))}${tuiSession(80)}</div>`
      + `<div>${cap(t.capSettings)}${tuiSettings(80)}</div>`;
  } else {
    html = cap(`${t.views.phone} · ${t.states[S.st]}`) + `<div class="phones">${[phone1(), phone2(), phone3()].map((p, i) => `<div>${p}<div class="ph-cap">${t.phCaps[i]}</div></div>`).join('')}</div>`;
  }
  c.innerHTML = html;
  const N = NOTES[S.lang] || NOTES.fr;
  document.getElementById('notes').innerHTML = N[S.v] + N.q;
}
render();
