/* ---------- mockup chrome ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;background:var(--chrome);border-bottom:1px solid var(--border)}

.body{display:flex;height:var(--wh,660px);min-height:0}

.st-foot{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-top:1px solid var(--sidebar-border);font-size:11px;color:var(--muted-foreground)}

.logos{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:6px}
.logos span{display:inline-flex;align-items:center;gap:6px;font-size:12px}

/* ---------- v3 · Cursor Agent ---------- */
.istat{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--sidebar);border-top:1px solid var(--sidebar-border);font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden}
.istat .fl{display:flex;align-items:center;gap:14px}
.istat .fl span{display:flex;align-items:center;gap:6px}
.istat .fl i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.istat .wait{height:20px;padding:0 8px;border-radius:5px;color:var(--foreground);display:flex;align-items:center}
.istat .sp{flex:1}
.hg .nr{color:var(--muted-foreground);font-family:'Geist',system-ui,sans-serif;border-bottom:1px dotted var(--muted-foreground)}
.cgrid{display:flex;flex-direction:column;gap:8px;width:1120px;max-width:100%}
.crow{display:grid;grid-template-columns:220px minmax(0,.75fr) minmax(0,1.25fr);align-items:stretch;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--background)}
.crow .cl{padding:7px 14px;font-size:12px;color:var(--muted-foreground)}
.crow .cl b{display:block;color:var(--foreground);font-weight:500;font-size:12.5px}
.crow .istat{height:auto;border-top:0;border-left:1px solid var(--border);justify-content:flex-end}
.crow.head{border:0;background:none}.crow.head .cl{padding:0 14px;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.pops{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.pops .pop{position:static}
.pop .pmsg{font-size:12px;line-height:1.45;padding:4px 0 2px;color:var(--muted-foreground)}
.pop .pmsg.warn{color:var(--warning)}
.yours-box{width:300px;background:var(--sidebar);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px 0}
.row2{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}

/* ---------- TUI ---------- */
.term{background:var(--t-bg);color:var(--t-fg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow-overlay);display:inline-block;max-width:100%;overflow:hidden}
.term pre{font:12.5px/17px 'Geist Mono','JetBrains Mono',ui-monospace,monospace;white-space:pre;margin:0}
.term .fg{color:var(--t-fg)}.term .dim{color:var(--t-dim)}.term .faint{color:var(--t-faint)}.term .line{color:var(--t-line)}
.term .coral{color:var(--t-coral)}.term .red{color:var(--t-red)}.term .yellow{color:var(--t-yellow)}.term .green{color:var(--t-green)}
.term .blue{color:var(--t-blue)}.term .violet{color:var(--t-violet)}.term .b{font-weight:700}
.term .w1{display:inline-block;width:1ch;text-align:center;overflow:visible;vertical-align:top}
.term .barbg{background:var(--t-bar)}.term .selbg{background:var(--t-sel)}.term .key{background:var(--t-key)}

/* ---------- phone ---------- */
.phones{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.phone{width:330px;height:690px;border:9px solid #2a2a2a;border-radius:42px;background:var(--background);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-overlay)}
:root[data-theme="light"] .phone{border-color:#d6d6d3}
.ph-status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600}
.ph-head{padding:6px 18px 10px}
.ph-head h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
.ph-head p{font-size:12px;color:var(--muted-foreground)}
.ph-head .back{font-size:12px;color:var(--muted-foreground);margin-bottom:4px}
.ph-body{flex:1;overflow:hidden;padding:0 18px}
.ph-card{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:12px 14px;margin-bottom:12px}
.ph-card h3{font-size:15px;display:flex;align-items:baseline;gap:6px;margin-bottom:6px}.ph-card h3 small{font-weight:400;font-size:11.5px;color:var(--muted-foreground)}
.ph-sec{font-size:11.5px;color:var(--muted-foreground);margin:10px 0 6px;letter-spacing:.3px}
.ph-line{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.ph-line .muted{color:var(--muted-foreground);font-size:12px}
.ph-btn{padding:2px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px}
.ph-btn.pri{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.ph-lim{display:grid;grid-template-columns:58px 1fr 128px;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.ph-lim .pp{font:12px 'Geist Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-lim .pp small{color:var(--muted-foreground);font-size:11px;margin-left:6px}
.ph-lim .gbar{margin:0;height:5px}
.ph-lim.amber .pp b{color:var(--warning);font-weight:500}.ph-lim.red .pp b{color:var(--danger-text);font-weight:500}
.ph-lim .pp b{font-weight:500}
.ph-hn{font-size:12.5px;font-weight:600;margin:6px 0 2px;display:flex;gap:6px;align-items:baseline}
.ph-hn small{font-weight:400;color:var(--muted-foreground);font-size:11px}
.ph-row{display:flex;gap:12px;border-bottom:1px solid var(--border);padding:13px 0}
.ph-row h4{font-size:14px;font-weight:600}
.ph-row .m{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.ph-row .m2{font-size:12px;color:var(--muted-foreground);margin-top:5px}
.ph-row .m2 .amber{color:var(--warning)}
.tag{display:inline-block;margin-top:7px;padding:1px 8px;border-radius:6px;font-size:11.5px;background:var(--status-info-soft);color:var(--info)}
.tag.red{background:var(--status-danger-soft);color:var(--danger-text)}
.ph-tabs{height:62px;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--muted-foreground)}
.ph-tabs .on{color:var(--foreground);font-weight:600}
.ph-chip{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border:1px solid var(--border);border-radius:999px;font-size:11.5px;color:var(--muted-foreground)}
.ph-cap{font-size:11px;color:var(--muted-foreground);margin-top:8px;width:330px}
.ph-msg{font-size:12.5px;color:var(--muted-foreground);padding:4px 0}
.ph-msg.warn{color:var(--warning)}
</style>

/* ---------- the data each state shows ---------- */
function limits(st) {
  const claude = { id: 'claude', name: t.claude, short: t.cl, machine: t.local, status: 'ok', age: '40 s',
    w: [{ k: t.h5, pct: 62, rs: '14:30', in: '2 h 10' }, { k: t.week, pct: 34, rs: t.mon, rsShort: t.monShort, in: '4 j' }],
    m: [{ k: 'Opus', pct: 71, rs: t.mon }, { k: 'Fable', pct: 12, rs: t.mon }] };
  const list = [];
  if (st === 'none') return list;
  if (st === 'loading') { list.push({ ...claude, status: 'loading' }); return list; }
  if (st === 'stale') { list.push({ ...claude, status: 'stale' }); return list; }
  if (st === 'expired') { list.push({ ...claude, status: 'expired' }); return list; }
  if (st === 'unreachable') { list.push({ ...claude, status: 'unreachable' }); return list; }
  if (st === 'over') {
    list.push({ ...claude, w: [{ k: t.h5, pct: 84, rs: '14:30', in: '1 h 05' }, { k: t.week, pct: 58, rs: t.mon, rsShort: t.monShort, in: '4 j' }],
      m: [{ k: 'Opus', pct: 100, rs: t.mon }, { k: 'Fable', pct: 20, rs: t.mon }] });
    return list;
  }
  list.push(claude);
  if (st === 'codex') list.push({ id: 'codex', name: t.codex, short: t.codex, machine: t.local, status: 'ok', age: '2 min',
    w: [{ k: t.h5, pct: 18, rs: '15:10', in: '2 h 50' }, { k: t.week, pct: 41, rs: S.lang === 'fr' ? 'jeu. 11:00' : 'Thu 11:00', rsShort: S.lang === 'fr' ? 'jeu.' : 'Thu', in: '6 j' }], m: [] });
  if (st === 'machines') list.push({ ...claude, machine: t.devbox, age: '1 min',
    w: [{ k: t.h5, pct: 9, rs: '16:00', in: '3 h 40' }, { k: t.week, pct: 22, rs: S.lang === 'fr' ? 'mer. 18:00' : 'Wed 18:00', rsShort: S.lang === 'fr' ? 'mer.' : 'Wed', in: '5 j' }],
    m: [{ k: 'Opus', pct: 15, rs: S.lang === 'fr' ? 'mer. 18:00' : 'Wed 18:00' }] });
  return list;
}

const len = s => [...s].length;

function cursorH(cs) {
  const pools = [{ k: ct.poolCursor, short: ct.poolCursorS, hint: ct.poolCursorH, pct: 8 }, { k: ct.poolOther, short: ct.poolOtherS, hint: ct.poolOtherH, pct: 56 }];
  const h = { id: 'cursor', status: 'ok', plan: 'month', total: 12, pools, rs: ct.rs, rsLong: ct.rsLong, in: ct.inM };
  if (cs === 'week') return { ...h, plan: 'week', total: 30, pools: [], rs: ct.wrs, rsLong: ct.wrsLong, in: ct.inW };
  if (cs === 'over') return { ...h, total: 81, pools: [{ ...pools[0], pct: 41 }, { ...pools[1], pct: 100 }] };
  if (cs === 'unread') return { ...h, unread: true };

}

  const lb = h.plan === 'week' ? ct.week : ct.month;

  if (h.status === 'expired') return `<span class="hg" title="${ct.name}">${who}<span class="msg">${narrow ? ct.expiredNarrow : ct.expiredFoot}</span></span>`;
  if (h.unread) return `<span class="hg ${open ? 'open' : ''}" title="${ct.name}">${who}<span class="nr">${ct.unread}</span></span>`;
  const dim = h.status === 'stale' || h.status === 'unreachable';
  const age = h.status === 'stale' ? ct.staleFoot : h.status === 'unreachable' ? t.unreachFoot : '';

  return `<span class="hg ${dim ? 'dim' : ''} ${open ? 'open' : ''} ${two ? 'two' : ''}" title="${ct.name}">${who}${cmini(lb, h.total, two || narrow ? '' : h.rs)}${hot.map(p => cmini(p.short, p.pct, '')).join('')}${age ? `<span class="age">${age}</span>` : ''}</span>`;

function cursorTuiSegs(h, wide) {

  if (h.status === 'loading') return [...segs, [t.reading, 'faint']];

  const dim = h.status === 'stale' || h.status === 'unreachable';

  one(wide ? lb : lb.toLowerCase().slice(0, 4), h.total, wide ? h.rs : '');
  h.pools.filter(p => p.pct >= THRESHOLD).forEach(p => one(p.short, p.pct, ''));

NOTES.fr.cursor = `<div class="note"><h3>v3 · Cursor Agent</h3><h4>La même puce que Claude Code, avec le mois et ses réserves</h4><ul>

  <li><b>Puce</b> : <b>vrai logo</b> de Cursor (le cube, à la couleur du texte ; Claude garde son étincelle orange, Codex le logo OpenAI), le même que dans les onglets de l’IDE (<code>ProviderLogo</code>), puis <b>Mois</b> (ou <b>Semaine</b> sur les nouvelles offres) : le <b>total inclus</b>, % et ↺ date de remise (« 1 déc. » : au-delà d’une semaine, une date et non un jour). Une réserve (« Cursor », « Autres ») ne s’ajoute qu’au-delà du seuil, comme un modèle chez Claude.</li>
  <li>À côté d’un autre harnais, la date tombe (comme la semaine de Claude aujourd’hui) : le détail la donne.</li>
  <li><b>Détail au clic</b> : « Total inclus · mois », remise le 1 déc. 13:43 · dans 24 j ; puis « Par réserve » : Modèles Cursor (Composer, Grok, Auto) et Autres modèles (au prix de l’API). Les pourcentages sont ceux de Cursor, jamais recalculés depuis des montants ; ni dollars, ni offre, ni dépassement payant.</li>
  <li><b>Limite non lue</b> : Cursor répond sans le détail attendu (Enterprise, offre inconnue) : la puce dit « limite non lue » et le détail renvoie à cursor.com/dashboard.</li>
  <li><b>États</b> : Lecture · Anciennes (plus de <b>15 min</b> sans lecture : Cursor est lu toutes les 5 min au plus) · Injoignable (api2.cursor.sh) · Session expirée (« reconnectez-vous dans Cursor Agent »).</li>

  } else if (S.v === 'session') {
    html = cap(t.views.session) + win(sidebar({ rowSignal: true }), sessionMain(true, footerB()), 700)
      + `<div>${cap(S.lang === 'fr' ? 'La ligne d’en-tête selon la session' : 'The header line by session')}<div class="cases">${['ledge', 'outside', 'codex', 'near', 'omp'].map((k, i) => `<div class="case"><div class="cl"><b>${t.cases[i][0]}</b>${t.cases[i][1]}</div>${vrow(k)}</div>`).join('')}</div></div>`;
  } else if (S.v === 'alert') {
    html = cap(t.views.alert) + win(sidebar({ yours: 'alert' }), settingsMain());
  } else if (S.v === 'tui') {
    html = `<div>${cap(t.capOverview(120) + ' · ' + t.states[S.st])}${tuiOverview(120)}</div>`
      + `<div>${cap(t.capOverview(80) + ' · ' + t.states[S.st])}${tuiOverview(80)}</div>`

      + `<div>${cap(t.capSession(80))}${tuiSession(80)}</div>`
      + `<div>${cap(t.capSettings)}${tuiSettings(80)}</div>`;
  } else {
    html = cap(`${t.views.phone} · ${t.states[S.st]}`) + `<div class="phones">${[phone1(), phone2(), phone3()].map((p, i) => `<div>${p}<div class="ph-cap">${t.phCaps[i]}</div></div>`).join('')}</div>`;
  }
  c.innerHTML = html;
